<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>推し活手帳</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="vendor/leaflet/leaflet-1.9.4.css">
<meta name="theme-color" content="#FBF8F3">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="推し活手帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211C17;
    --ink-soft:#6B6259;
    --paper:#FBF8F3;
    --paper-alt:#F2ECE1;
    --line:rgba(33,28,23,0.16);
    --line-strong:rgba(33,28,23,0.30);

    --bg:#FBF8F3;
    --card:#F2ECE1;
    --heading:#211C17;
    --text:#211C17;
    --accent:#C9457A;
    --accent-soft:rgba(201,69,122,0.14);
    --stub-cut:#FBF8F3;
    --on-accent:#FBF8F3;

    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:var(--safe-t);}
  body{
    margin:0;
    background-color:var(--bg);
    background-image:radial-gradient(var(--line) 1px, transparent 1.4px);
    background-size:15px 15px;
    color:var(--text);
    font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:var(--safe-t);
    padding-bottom:var(--safe-b);
    transition:background-color .35s ease, color .35s ease;
    overflow-x:hidden;
  }
  button,.oshi-pill,.btn,.fab,.ticket .editbtn,nav.tabs button{transition:transform .12s ease;}
  button:active,.oshi-pill:active,.btn:active,.fab:active{transform:scale(.96);}
  h1,h2,h3,.mincho{font-family:"Shippori Mincho",serif;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ---------- layout shell ---------- */
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}

  .topbar{
    position:sticky;top:var(--safe-t);z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    height:72px;padding:0 18px;box-sizing:border-box;
    display:flex;align-items:center;justify-content:space-between;
    transition:background .35s ease,border-color .35s ease;
  }
  .brand{display:flex;flex-direction:column;line-height:1;}
  .brand .word{font-size:19px;font-weight:600;letter-spacing:.04em;color:var(--heading);}
  .brand .sub{font-size:10.5px;color:var(--ink-soft);margin-top:4px;letter-spacing:.08em;}
  .header-logo-slot{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;margin:0 10px;align-self:stretch;}
  .header-logo-btn{
    background:none;border:none;padding:0;cursor:pointer;
    height:100%;max-height:64px;max-width:100%;display:flex;align-items:center;justify-content:center;
  }
  .header-logo-btn img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block;}
  .header-logo-placeholder{
    height:100%;aspect-ratio:1.6;border:1.5px dashed var(--line-strong);border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);opacity:.55;
  }
  .header-logo-placeholder svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .oshi-chip{
    display:flex;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--line);
    padding:6px 12px 6px 8px;border-radius:999px;
    cursor:pointer;max-width:160px;
  }
  .oshi-chip .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--line-strong);}
  .oshi-chip .name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .oshi-chip .chev{font-size:9px;color:var(--ink-soft);}

  main{flex:1;padding:16px 18px calc(96px + var(--safe-b));}

  /* ---------- bottom nav ---------- */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    max-width:560px;margin:0 auto;
    background:var(--bg);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom:var(--safe-b);
    transition:background .35s ease,border-color .35s ease;
  }
  nav.tabs button{
    flex:1;background:none;border:none;padding:8px 2px 8px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-soft);cursor:pointer;
  }
  nav.tabs button .ic{width:34px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  nav.tabs button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;}
  nav.tabs button span{font-size:9.5px;letter-spacing:.02em;font-weight:500;white-space:nowrap;}
  nav.tabs button.active{color:var(--accent);}
  nav.tabs button.active .ic{background:var(--accent-soft);}
  nav.tabs button.active svg{stroke:var(--accent);}
  nav.tabs button.active span{font-weight:700;}

  /* ---------- headers / sections ---------- */
  .page-head{margin-bottom:16px;}
  .page-head h1{font-size:22px;margin:0 0 4px;color:var(--heading);font-weight:700;}
  .page-head p{margin:0;font-size:12.5px;color:var(--ink-soft);}

  .section-label{
    font-size:12px;color:var(--ink-soft);margin:22px 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  .section-label::after{content:"";flex:1;height:1px;background:var(--line);}

  /* ---------- hero / dashboard oshi card ---------- */
  .hero{
    background:var(--accent);color:var(--on-accent);
    border-radius:6px;padding:22px 20px 20px;position:relative;overflow:hidden;
    box-shadow:0 8px 20px -8px rgba(33,28,23,.35);
    transition:background .35s ease,color .35s ease;
  }
  .hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:repeating-linear-gradient(-32deg, rgba(255,255,255,.07) 0 2px, transparent 2px 16px);
  }
  .hero .eyebrow{display:flex;align-items:center;gap:6px;font-size:11px;opacity:.85;letter-spacing:.06em;position:relative;z-index:1;}
  .hero .eyebrow svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;}
  .hero .headline{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;position:relative;z-index:1;margin-top:6px;}
  .hero .who{display:flex;align-items:center;min-width:0;}
  .hero .name{font-size:27px;font-weight:800;margin:0;letter-spacing:-.01em;line-height:1.25;}
  .hero .stampring{
    flex:none;width:60px;height:60px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55);
    display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);
  }
  .hero .stampring b{font-family:"Shippori Mincho",serif;font-size:19px;font-weight:800;line-height:1;}
  .hero .stampring span{font-size:8px;letter-spacing:.05em;opacity:.85;margin-top:1px;}
  .hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:19px;position:relative;z-index:1;}
  .hero .colorname-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;opacity:.9;margin-top:6px;position:relative;z-index:1;}
  .hero .colorname-tag .d{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.5);}
  .sns-links{display:flex;gap:8px;margin-top:10px;position:relative;z-index:1;}
  .sns-links a,.sns-links .unregistered{
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--line);color:var(--accent);flex:none;
  }
  .sns-links a svg,.sns-links .unregistered svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;}
  .sns-links.on-accent a{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.32);color:var(--on-accent);}
  .sns-links .unregistered{
    background:none;border:1px dashed var(--line);color:var(--ink-soft);opacity:.4;cursor:default;
  }
  .sns-links.on-accent .unregistered{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.6);opacity:.55;}
  .sns-block{display:flex;flex-direction:column;gap:8px;margin-top:10px;position:relative;z-index:1;}
  .sns-scope-row{display:flex;align-items:center;gap:9px;}
  .sns-scope-row .sns-links{margin-top:0;}
  .sns-caption{
    font-size:9.5px;font-weight:700;color:var(--ink-soft);flex:1 1 auto;min-width:0;
    letter-spacing:.02em;white-space:nowrap;
    display:inline-flex;align-items:center;gap:4px;justify-content:flex-start;
  }
  .sns-caption-text{min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .sns-scope-row .sns-links{flex:none;}
  .sns-block.on-accent .sns-caption{color:rgba(255,255,255,.78);}
  .group-color-dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.15);}
  .avatar{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(255,255,255,.55);color:#fff;}
  .avatar-initial{font-family:"Shippori Mincho",serif;font-weight:800;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.25);}
  .hero .headline .avatar{margin-right:12px;box-shadow:0 0 0 2px rgba(255,255,255,.65),0 3px 8px rgba(33,28,23,.25);}
  .photo-picker{position:relative;display:inline-block;}
  .photo-preview{
    width:72px;height:72px;border-radius:50%;flex:none;background:var(--paper);
    border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;
    overflow:hidden;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line-strong);
    padding:0;cursor:pointer;position:relative;
  }
  .photo-preview img{width:100%;height:100%;object-fit:cover;}
  .photo-preview svg{width:26px;height:26px;stroke:var(--ink-soft);fill:none;stroke-width:1.4;}
  .photo-edit-badge{
    position:absolute;bottom:-1px;right:-1px;width:24px;height:24px;border-radius:50%;
    background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px var(--bg);
  }
  .photo-edit-badge svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;}
  .photo-menu{
    position:fixed;z-index:55;min-width:160px;
    background:var(--bg);border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;
    box-shadow:0 8px 20px -6px rgba(33,28,23,.28);
  }
  .photo-menu-item{
    display:block;width:100%;text-align:left;padding:12px 15px;font-size:13px;font-weight:600;
    background:none;border:none;color:var(--text);cursor:pointer;
  }
  .top-chip-menu{min-width:200px;max-width:260px;}
  .top-chip-menu-list{max-height:280px;overflow-y:auto;}
  .top-chip-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;
    background:none;border:none;color:var(--text);cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit;
  }
  .top-chip-item + .top-chip-item{border-top:1px dashed var(--line);}
  .top-chip-item.active{background:var(--accent-soft);color:var(--accent);}
  .top-chip-item .avatar-mini{width:26px;height:26px;border-radius:50%;flex:none;background-size:cover;background-position:center;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--line-strong);}
  .top-chip-item .tcm-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .top-chip-item .tcm-check{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;flex:none;}
  .top-chip-manage{
    display:block;width:100%;text-align:center;padding:11px 14px;font-size:12px;font-weight:700;
    background:var(--paper);border:none;border-top:1px solid var(--line-strong);color:var(--ink-soft);cursor:pointer;font-family:inherit;
  }
  .photo-menu-item + .photo-menu-item{border-top:1px solid var(--line);}
  .photo-menu-item.danger{color:#B23A3A;}
  .identity-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .identity-duo{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;}
  .identity-duo-col{flex:none;}
  .identity-duo-col label{
    display:block;font-size:11px;color:var(--ink-soft);margin-bottom:9px;
    font-weight:600;white-space:nowrap;
  }
  .group-card-list{display:flex;flex-direction:column;gap:10px;}
  .sns-icon-btn{
    width:44px;height:44px;border-radius:50%;flex:none;background:var(--paper);
    border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);cursor:pointer;margin-top:14px;
  }
  .sns-icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;}
  .sns-icon-btn.filled{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .sns-popover{padding:11px;width:230px;}
  .sns-popover input{
    width:100%;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);
    padding:9px 10px;font-size:16px;margin-bottom:8px;color:var(--text);font-family:inherit;
  }
  .sns-popover-actions{display:flex;gap:6px;}
  .sns-popover-actions .btn{flex:1;padding:7px 6px;font-size:11.5px;}
  .cheki-photo-preview{
    width:88px;height:112px;border-radius:8px;flex:none;background:var(--paper);
    border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;
    overflow:hidden;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line-strong);
    padding:0;cursor:pointer;position:relative;
  }
  .cheki-photo-preview img{width:100%;height:100%;object-fit:cover;}
  .cheki-photo-preview svg{width:26px;height:26px;stroke:var(--ink-soft);fill:none;stroke-width:1.4;}
  .hero .bday-badge{
    position:absolute;top:14px;right:16px;z-index:2;
    background:var(--bg);color:var(--accent);font-size:10.5px;font-weight:700;
    padding:4px 10px;border-radius:3px 10px 3px 10px;transform:rotate(4deg);
    box-shadow:0 2px 6px rgba(33,28,23,.2);
  }
  .hero .stat{border-top:1px solid rgba(255,255,255,.28);padding-top:8px;}
  .hero .stat b{display:block;font-size:19px;font-weight:800;font-family:"Shippori Mincho",serif;}
  .hero .stat span{display:block;font-size:10.5px;opacity:.82;margin-top:2px;}
  .hero .ring{position:absolute;right:-38px;top:-46px;width:130px;height:130px;border-radius:50%;border:1px solid rgba(255,255,255,.22);}
  .hero .ring2{position:absolute;right:14px;top:64px;width:34px;height:34px;border-radius:50%;border:1px dashed rgba(255,255,255,.3);}
  .hero.empty{background:var(--card);color:var(--text);border:1.5px dashed var(--line-strong);box-shadow:none;}
  .hero.empty::before{display:none;}
  .hero.empty .name{font-size:17px;font-weight:700;}
  .hero.empty p{font-size:12.5px;color:var(--ink-soft);margin:6px 0 14px;line-height:1.7;}

  .oshi-pills{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;margin:0 -2px;-webkit-overflow-scrolling:touch;}
  .oshi-pills::-webkit-scrollbar{display:none;}
  .oshi-pill{
    flex:none;display:flex;align-items:center;gap:7px;
    padding:5px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);font-size:12px;font-weight:600;cursor:pointer;color:var(--text);
  }
  .oshi-pill .d{width:24px;height:24px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px var(--card),0 0 0 2.5px var(--line-strong);}
  .oshi-pill.on{border-color:var(--accent);background:var(--accent-soft);color:var(--heading);}
  .oshi-pill.add{color:var(--ink-soft);border-style:dashed;}

  /* ---------- mini bar chart ---------- */
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 16px 8px;margin-top:12px;}
  .chart-card h3{margin:0 0 2px;font-size:13.5px;color:var(--heading);font-weight:700;}
  .chart-card .unit{font-size:10.5px;color:var(--ink-soft);margin-bottom:10px;display:block;}
  .bars{display:flex;align-items:flex-end;gap:8px;height:84px;}
  .bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bars .fill{width:100%;max-width:26px;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;}
  .bars .mo{font-size:9.5px;color:var(--ink-soft);margin-top:6px;}

  /* ---------- ticket cards ---------- */
  .ticket{
    position:relative;display:flex;background:var(--card);
    border:1px solid var(--line);border-radius:3px;margin-bottom:18px;overflow:visible;
    box-shadow:0 3px 8px -3px rgba(33,28,23,.16);
  }
  .ticket:nth-child(odd){transform:rotate(-.5deg);}
  .ticket:nth-child(even){transform:rotate(.5deg);}
  .ticket .tape{
    position:absolute;top:-9px;left:22px;width:46px;height:18px;
    background:linear-gradient(120deg, var(--accent), var(--accent) 60%, transparent 60%),
               repeating-linear-gradient(-45deg, rgba(255,255,255,.35) 0 4px, transparent 4px 8px);
    opacity:.85;transform:rotate(-4deg);border-radius:1px;
    box-shadow:0 1px 2px rgba(33,28,23,.18);
  }
  .ticket .main{flex:1;min-width:0;padding:16px 14px 12px;overflow:hidden;border-radius:3px 0 0 3px;}
  .ticket .kind{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
  .ticket .kind .stream-link-wrap{margin-left:auto;}
  .ticket.is-hidden{opacity:.55;}
  .fav-badge{
    position:absolute;top:-8px;left:18px;z-index:2;width:26px;height:26px;border-radius:50%;
    background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 5px rgba(33,28,23,.25);transform:rotate(-8deg);
  }
  .fav-badge svg{width:13px;height:13px;stroke:none;fill:currentColor;}
  .tag-chip{
    font-size:9.5px;font-weight:700;color:var(--ink-soft);background:var(--paper);
    border:1px solid var(--line);border-radius:99px;padding:2px 8px;
  }
  .stamp{
    display:inline-flex;align-items:center;gap:4px;
    border:1.3px solid var(--accent);color:var(--accent);
    border-radius:3px 10px 3px 10px;padding:2px 8px 2px 6px;
    font-size:10px;font-weight:700;letter-spacing:.04em;transform:rotate(-3deg);
  }
  .stamp svg{width:11px;height:11px;stroke:var(--accent);fill:none;stroke-width:2;}
  .ticket .title{font-size:14.5px;font-weight:700;color:var(--heading);margin:0 0 3px;line-height:1.4;word-break:break-word;}
  .ticket .stream-link{color:var(--accent);font-weight:700;text-decoration:underline;font-size:11.5px;white-space:nowrap;}
  .ticket .meta{font-size:11.5px;color:var(--ink-soft);line-height:1.7;}
  .ticket .memo{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.6;border-top:1px dashed var(--line);padding-top:6px;}
  .ticket .photo{
    flex:none;width:52px;height:52px;margin:16px 0 0 14px;
    background:var(--paper);border:1px solid var(--line-strong);border-radius:2px;
    display:flex;align-items:center;justify-content:center;transform:rotate(-3deg);
    box-shadow:0 2px 5px rgba(33,28,23,.14);overflow:hidden;
  }
  .ticket .photo svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.5;opacity:.7;}
  .ticket .photo img{width:100%;height:100%;object-fit:cover;}
  .ticket .stub{
    width:78px;flex:none;border-left:1px dashed var(--line-strong);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:10px 6px;text-align:center;position:relative;gap:2px;
  }
  .ticket .stub .day{font-family:"Shippori Mincho",serif;font-size:18px;font-weight:800;color:var(--heading);}
  .ticket .stub .ym{font-size:9.5px;color:var(--ink-soft);}
  .ticket .stub .amt{font-size:11.5px;font-weight:700;color:var(--accent);margin-top:4px;}
  .ticket .stub.has-photo{background-size:cover;background-position:center;}
  .ticket .stub.has-photo .day,.ticket .stub.has-photo .ym,.ticket .stub.has-photo .amt{
    color:#FBF8F3;text-shadow:0 1px 4px rgba(0,0,0,.55);
  }
  .ticket .stub::before,.ticket .stub::after{
    content:"";position:absolute;left:-7px;width:14px;height:14px;border-radius:50%;background:var(--bg);
    box-shadow:0 0 0 1px var(--line) inset;
  }
  .ticket .stub::before{top:-7px;}
  .ticket .stub::after{bottom:-7px;}
  .ticket button.editbtn{
    position:absolute;top:6px;right:6px;border:none;background:var(--bg);color:var(--ink-soft);
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;
    box-shadow:0 1px 3px rgba(33,28,23,.18);
  }
  .ticket button.editbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .ticket button.zoombtn{
    position:absolute;bottom:6px;right:6px;border:none;background:rgba(20,17,13,.55);color:#FBF8F3;
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;
  }
  .ticket button.zoombtn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;}

  /* ---------- photo viewer (写真を画面いっぱいに表示) ---------- */
  .photo-viewer{
    position:fixed;inset:0;z-index:90;background:rgba(10,8,6,.92);
    display:flex;align-items:center;justify-content:center;
    padding:calc(12px + var(--safe-t)) 12px calc(12px + var(--safe-b));
  }
  .photo-viewer[hidden]{display:none;}
  .photo-viewer img{width:100%;height:100%;object-fit:contain;}
  .photo-viewer-close{
    position:absolute;top:calc(12px + var(--safe-t));right:12px;width:40px;height:40px;border-radius:50%;
    border:none;background:rgba(255,255,255,.14);color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .photo-viewer-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}

  .empty-state{
    border:1.5px dashed var(--line-strong);border-radius:6px;padding:26px 18px 22px;text-align:center;color:var(--ink-soft);
    background-image:radial-gradient(var(--line) 1px, transparent 1.4px);background-size:12px 12px;
  }
  .empty-state .cluster,.auth-gate-hero .cluster{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;}
  .empty-state .cluster span,.auth-gate-hero .cluster span{
    width:38px;height:38px;border-radius:8px;background:var(--bg);border:1px solid var(--line-strong);
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(33,28,23,.12);
  }
  .empty-state .cluster span:nth-child(1),.auth-gate-hero .cluster span:nth-child(1){transform:rotate(-9deg);}
  .empty-state .cluster span:nth-child(2),.auth-gate-hero .cluster span:nth-child(2){transform:rotate(4deg) translateY(-4px);width:44px;height:44px;}
  .empty-state .cluster span:nth-child(3),.auth-gate-hero .cluster span:nth-child(3){transform:rotate(10deg);}
  .empty-state .cluster svg,.auth-gate-hero .cluster svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.5;}
  .empty-state > svg{width:30px;height:30px;stroke:var(--ink-soft);fill:none;stroke-width:1.3;margin-bottom:10px;}
  .empty-state p{margin:0 0 14px;font-size:12.5px;line-height:1.7;}

  /* ---------- fab ---------- */
  .fab{
    position:fixed;right:18px;bottom:calc(78px + var(--safe-b));z-index:25;
    width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);
    border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.18);
  }
  .fab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;}
  /* FAB stays visible even with no active oshi; tapping it guides the user
     to register one first (see openRecordSheet). */

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border-radius:3px;border:1px solid var(--line-strong);background:transparent;color:var(--text);
    font-size:13px;font-weight:600;padding:10px 16px;cursor:pointer;
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .btn.block{width:100%;}
  .btn.ghost{border-color:transparent;color:var(--ink-soft);}
  .btn.danger{border-color:#B23A3A;color:#B23A3A;}

  /* ---------- forms / sheet ---------- */
  .sheet-bg{
    position:fixed;inset:0;background:rgba(33,28,23,.42);z-index:50;
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet-bg.show{display:flex;}
  .sheet{
    width:100%;max-width:560px;background:var(--bg);border-radius:16px 16px 0 0;
    max-height:88vh;overflow-y:auto;padding:6px 20px calc(24px + var(--safe-b));
    animation:up .22s ease;
  }
  @keyframes up{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{width:36px;height:4px;background:var(--line-strong);border-radius:99px;margin:10px auto 14px;}
  .sheet h2{font-size:17px;margin:0 0 14px;color:var(--heading);}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field input[type=url],.field input[type=email],.field input[type=password],.field input[type=time],.field select,.field textarea{
    width:100%;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);
    padding:10px 11px;font-size:16px;color:var(--text);font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:56px;line-height:1.6;}
  .field .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .venue-field{position:relative;}
  .venue-suggest{
    position:absolute;left:0;right:0;z-index:5;margin-top:4px;background:var(--paper);
    border:1px solid var(--line-strong);border-radius:4px;box-shadow:0 8px 20px -8px rgba(33,28,23,.35);overflow:hidden;
  }
  .venue-suggest-item{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 12px;cursor:pointer;font-family:inherit;color:var(--text);}
  .venue-suggest-item + .venue-suggest-item{border-top:1px solid var(--line);}
  .venue-suggest-item:hover{background:var(--card);}
  .venue-suggest-item .main{display:block;font-size:13.5px;font-weight:600;}
  .venue-suggest-item .sub{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .venue-place{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--ink-soft);margin-top:5px;}
  .venue-place:empty{display:none;}
  .venue-place a{color:var(--accent);}
  .venue-link{color:inherit;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:2px;}
  /* 推し欄：人物名・グループ名（LIVEはさらにチェキ・✕）を列幅をそろえて並べる */
  .rec-oshi-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:8px;}
  .rec-oshi-row.with-actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px 34px;}
  .rec-oshi-row + .rec-oshi-row{margin-top:8px;}
  .field .rec-oshi-row select{min-width:0;width:100%;}
  .rec-cell-empty{display:block;}
  .rec-oshi-icon{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);
    background:var(--paper);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .rec-oshi-icon.rec-cell-empty{border:none;background:none;cursor:default;}
  .rec-oshi-cheki{color:var(--accent);}
  .rec-oshi-cheki svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .rec-oshi-remove{
    flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);
    background:var(--paper);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .rec-oshi-remove svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
  .stream-url-row{display:grid;grid-template-columns:minmax(0,1fr) 34px;align-items:center;gap:8px;}
  .stream-url-row + .stream-url-row{margin-top:8px;}
  .field .stream-url-row input{min-width:0;width:100%;}
  .ticket .stream-link-wrap .stream-link + .stream-link{margin-left:10px;}
  .ticket .stream-link-btn{background:none;border:none;padding:0;cursor:pointer;font-family:inherit;}
  .stream-menu a.photo-menu-item{text-decoration:none;}
  .stream-menu .host{display:block;font-size:10.5px;font-weight:500;color:var(--ink-soft);margin-top:2px;}
  .add-rec-oshi-btn{
    display:block;width:100%;margin-top:8px;padding:9px 12px;border:1px dashed var(--line-strong);border-radius:3px;
    background:transparent;color:var(--ink-soft);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .field .row3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px;}
  .field .row3 select,.field .row3 input{padding-left:6px;padding-right:4px;font-size:16px;}
  .field-hint{font-size:10.5px;color:var(--ink-soft);margin-top:5px;line-height:1.6;}
  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .sheet-actions .btn{flex:1;}

  /* ---------- login gate (未ログイン時はログイン画面のみ) ---------- */
  #app.booting nav.tabs,#app.booting .fab,#app.booting .header-logo-btn,
  #app.auth-gate nav.tabs,#app.auth-gate .fab,#app.auth-gate .header-logo-btn,#app.auth-gate .oshi-chip{display:none !important;}
  .auth-gate-page{max-width:420px;margin:8px auto 0;}
  .auth-gate-hero{text-align:center;margin:10px 0 18px;}
  .auth-gate-hero .cluster{justify-content:center;margin-bottom:12px;}
  .auth-gate-hero h1{font-size:21px;margin:0 0 8px;color:var(--heading);}
  .auth-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 16px 14px;}
  .auth-card h2{font-size:16px;margin:0 0 14px;color:var(--heading);}
  .auth-submit{margin-top:14px;}
  .legal-links{text-align:center;font-size:11px;line-height:1.9;color:var(--ink-soft);margin:24px 0 8px;}
  .legal-links a{color:var(--accent);font-size:12px;}

  /* ---------- account / cloud sync ---------- */
  .account-note{margin:0 0 12px;font-size:12.5px;line-height:1.7;color:var(--ink-soft);}
  .account-list{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .account-row{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px;}
  .account-row + .account-row{border-top:1px solid var(--line);}
  .account-row-label{flex:none;width:7.5em;font-size:12px;color:var(--ink-soft);font-weight:600;}
  .account-row-value{flex:1;min-width:0;font-size:13.5px;overflow-wrap:anywhere;}
  .account-row-value.muted{color:var(--ink-soft);}
  .account-row-btn{
    flex:none;border:1px solid var(--line-strong);background:var(--paper);color:var(--text);
    border-radius:3px;font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer;font-family:inherit;
  }
  .btn.account-logout{margin-top:12px;border-color:var(--line);color:#B23A3A;background:transparent;}
  .btn.google-btn{background:#FFFFFF;color:#1F1F1F;border-color:var(--line-strong);gap:10px;padding:11px 16px;}
  .btn.google-btn .google-icon{width:18px;height:18px;flex:none;stroke:none;}
  .btn:disabled{opacity:.55;cursor:default;}
  .auth-or{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-soft);margin:16px 0 14px;}
  .auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line);}
  .auth-msg{font-size:12px;line-height:1.7;margin:2px 0 0;color:var(--ink-soft);}
  .auth-msg:empty{display:none;}
  .auth-msg.error{color:#B23A3A;}
  .auth-msg.ok{color:#2F7A55;}
  .auth-links{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:16px;}
  .link-btn{background:none;border:none;color:var(--accent);font-size:12.5px;cursor:pointer;padding:4px;text-decoration:underline;font-family:inherit;}

  .group-card{
    border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--card);
    transition:opacity .12s ease, transform .12s ease;
  }
  .group-card.dragging{opacity:.4;}
  .group-card.drag-over{box-shadow:0 0 0 2px var(--accent);}
  .group-card-row{
    display:flex;align-items:center;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:1px;
  }
  .group-card-row::-webkit-scrollbar{display:none;}
  .group-drag-handle{
    flex:none;width:12px;height:20px;display:flex;align-items:center;justify-content:center;
    color:var(--line-strong);cursor:grab;touch-action:none;
  }
  .group-drag-handle svg{width:10px;height:13px;fill:currentColor;}
  .group-color-btn{
    width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong);
    padding:0;cursor:pointer;flex:none;
  }
  .group-color-pop{padding:11px;width:auto;}
  .group-color-swatches{display:flex;flex-wrap:wrap;gap:7px;max-width:168px;}
  .gcs-swatch{width:24px;height:24px;border-radius:50%;border:2px solid rgba(0,0,0,.14);cursor:pointer;padding:0;flex:none;}
  .gcs-custom-btn{
    width:24px;height:24px;
    background:conic-gradient(from 0deg,#E04B4B,#E0A23C,#E0D23C,#6CBF5E,#3C9AE0,#6C5CE0,#C25CE0,#E04B4B)!important;
    border:2px solid rgba(0,0,0,.1)!important;color:#fff!important;
  }
  .gcs-custom-btn svg{filter:drop-shadow(0 0 1.5px rgba(0,0,0,.65));}
  .gcs-custom-btn svg{width:11px;height:11px;}
  .group-name-input{
    flex:none!important;width:78px!important;font-size:13.5px!important;font-weight:700;color:var(--text)!important;
    border:none!important;background:none!important;box-shadow:none!important;
    padding:2px 0!important;font-family:inherit;border-bottom:1px solid var(--line)!important;
    border-radius:0!important;
  }
  .group-name-input:focus{outline:none;border-bottom-color:var(--accent)!important;}
  .group-name-input::placeholder{color:var(--ink-soft);opacity:.7;font-weight:600;}
  .group-sns-inline{display:flex;align-items:center;gap:4px;flex:none;margin-left:auto;}
  .group-sns-inline .sns-icon-btn{width:28px;height:28px;margin-top:0;}
  .group-sns-inline .sns-icon-btn svg{width:12px;height:12px;}
  .group-order-btns{display:flex;gap:2px;flex:none;}
  .group-order-btn{
    width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
    color:var(--ink-soft);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;flex:none;
  }
  .group-order-btn svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2.6;}
  .group-order-btn:disabled{opacity:.25;cursor:default;}
  .group-remove-btn{
    flex:none;width:18px;height:18px;border-radius:50%;border:none;background:none;
    color:var(--ink-soft);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;
  }
  .group-remove-btn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;}

  /* ---------- oshi manage list ---------- */
  .oshi-row{
    display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:12px;row-gap:0;padding:13px 4px;border-bottom:1px dashed var(--line);
  }
  .oshi-row.dragging{opacity:.4;}
  .oshi-row.is-hidden .sw,.oshi-row.is-hidden .info,.oshi-row.is-hidden .sns-block{opacity:.55;}
  .hidden-oshi-toggle{
    display:flex;align-items:center;gap:6px;width:100%;margin-top:14px;padding:10px 4px;border:none;background:none;
    color:var(--ink-soft);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left;
  }
  .hidden-oshi-toggle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .15s ease;}
  .hidden-oshi-toggle svg.open{transform:rotate(90deg);}
  .hidden-oshi-note{font-size:12px;color:var(--ink-soft);margin:6px 0;}
  .oshi-row.drag-over{box-shadow:0 0 0 2px var(--accent);border-radius:8px;}
  .oshi-row .sw{width:38px;height:38px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line-strong);}
  .oshi-row .info{flex:1;min-width:0;}
  .oshi-row .sw-col{flex:none;width:38px;position:relative;}
  /* お気に入りの印は写真の下に重ねて置き、行の高さには影響させない */
  .oshi-row .sw-col .oshi-fav-stamp{
    position:absolute;top:46px;left:50%;margin-left:-26px;width:52px;justify-content:center;
    font-size:8px;padding:1px 0;white-space:nowrap;color:var(--accent);letter-spacing:0;
  }
  .oshi-row .info .name-line{line-height:1.35;overflow-wrap:anywhere;}
  .oshi-row .info .oshi-meta-line{margin-top:2px;line-height:1.4;}
  .oshi-row > .oshi-affil{
    flex:0 0 100%;box-sizing:border-box;padding-left:74px;margin-top:3px;
    font-size:11px;color:var(--ink-soft);line-height:1.5;overflow-wrap:anywhere;
  }
  .oshi-row .info b{font-size:14.5px;color:var(--heading);}
  .oshi-row .info .oshi-bday{font-size:11px;font-weight:600;color:var(--ink-soft);}
  .oshi-row .info span{font-size:11px;color:var(--ink-soft);}
  .oshi-row .side-actions{display:flex;align-items:center;gap:2px;flex:none;}
  .oshi-row .star{background:none;border:none;color:var(--ink-soft);cursor:pointer;width:26px;height:26px;flex:none;}
  .oshi-row .star svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .oshi-row .star.active svg{fill:var(--accent);stroke:var(--accent);}
  .oshi-row .del{background:none;border:none;color:var(--ink-soft);cursor:pointer;width:26px;height:26px;flex:none;}
  .oshi-row .del svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;}
  /* SNSは推しの行の下に全幅で並べ、右端（操作ボタンの下）まで使う。
     左端は名前の位置（つまみ12px＋余白12px＋写真38px＋余白12px）にそろえる */
  .oshi-row .sns-block{flex:0 0 100%;box-sizing:border-box;padding-left:74px;margin-top:6px;gap:4px;}
  /* 推し一覧では右端まで寄せず、名前の欄を最大140pxにしてその右に並べる（狭い画面では縮む） */
  .oshi-row .sns-caption{flex:0 1 140px;}
  .oshi-row .sns-caption{font-size:8.5px;}
  .oshi-row .sns-links a,.oshi-row .sns-links .unregistered{width:22px;height:22px;}
  .oshi-row .sns-links a svg,.oshi-row .sns-links .unregistered svg{width:11px;height:11px;}

  /* ---------- stats page ---------- */
  .stat-row{
    display:flex;align-items:center;gap:12px;padding:12px 10px;
    background:var(--card);border:1px solid var(--line);border-radius:4px;margin-bottom:8px;
  }
  .stat-row .sw{width:32px;height:32px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--line-strong);}
  .stat-row .info{flex:1;min-width:0;}
  .stat-row .info b{display:block;font-size:13.5px;color:var(--heading);}
  .stat-row .info span{font-size:11px;color:var(--ink-soft);}
  .stat-row .stat-amt{font-size:13px;font-weight:800;color:var(--accent);flex:none;font-family:"Shippori Mincho",serif;}

  .cal-head{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 12px;}
  .cal-head span{font-size:15px;font-weight:700;color:var(--heading);}
  .cal-nav{background:var(--card);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;}
  .cal-nav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;}
  .cal-dow{margin-bottom:8px;}
  .cal-dow div{text-align:center;font-size:10.5px;color:var(--ink-soft);font-weight:700;}
  .cal-cell{
    aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    cursor:pointer;color:var(--text);position:relative;
  }
  .cal-cell.empty{border:none;background:none;cursor:default;}
  .cal-daynum{font-size:12px;font-weight:600;}
  .cal-cell.has-rec{border-color:var(--line-strong);}
  .cal-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
  .cal-cell.selected{background:var(--accent);border-color:var(--accent);}
  .cal-cell.selected .cal-daynum{color:var(--on-accent);}
  .cal-cell.selected .cal-dot{background:var(--on-accent);}

  .toast{
    position:fixed;left:50%;bottom:calc(94px + var(--safe-b));transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:var(--paper);font-size:12.5px;padding:9px 16px;border-radius:99px;
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .filter-note{font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;}
  .filter-note b{color:var(--accent);font-weight:700;}

  .cal-setting label{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:5px;}
  .cal-setting .cal-label-2{margin-top:16px;}
  .cal-setting textarea{
    width:100%;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);
    padding:9px 11px;font-size:13.5px;color:var(--text);font-family:inherit;box-sizing:border-box;resize:vertical;line-height:1.6;
  }
  .cal-setting input{
    width:100%;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);
    padding:9px 11px;font-size:13.5px;color:var(--text);font-family:inherit;box-sizing:border-box;
  }
  .cal-token-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .cal-token{
    border:1px solid var(--accent);color:var(--accent);background:var(--paper);border-radius:99px;
    font-size:11.5px;font-weight:700;padding:4px 10px;cursor:pointer;font-family:inherit;
  }
  .cal-setting-actions{display:flex;justify-content:flex-end;margin-top:10px;}
  .cal-setting-actions .btn{padding:8px 22px;}
  /* ---------- 遠征マップ ---------- */
  .trip-map-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px 14px;
    box-shadow:0 10px 24px -18px rgba(33,28,23,.45);margin-top:12px;
  }
  .trip-map-card + .chart-card{margin-top:16px;}
  .trip-map-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 2px 12px;}
  .trip-map-eyebrow{display:block;font-size:9.5px;letter-spacing:.22em;color:var(--accent);font-weight:700;}
  .trip-map-title h3{margin:2px 0 0;font-size:19px;color:var(--heading);letter-spacing:.04em;}
  .trip-map-stats{display:flex;gap:14px;}
  .trip-stat{text-align:right;line-height:1.1;}
  .trip-stat b{display:block;font-family:"Shippori Mincho",serif;font-size:24px;font-weight:800;color:var(--heading);}
  .trip-stat span{font-size:9.5px;color:var(--ink-soft);letter-spacing:.08em;}
  .trip-map-frame{border-radius:12px;padding:4px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);}
  .trip-map{height:300px;border-radius:9px;overflow:hidden;position:relative;z-index:0;isolation:isolate;background:#F1EDE6;}
  .trip-map .leaflet-tile-pane{filter:sepia(.18) saturate(.9) brightness(1.02);}
  .trip-map .leaflet-control-zoom{border:none;box-shadow:0 4px 12px -4px rgba(33,28,23,.35);border-radius:10px;overflow:hidden;}
  .trip-map .leaflet-control-zoom a{
    width:30px;height:30px;line-height:28px;background:var(--paper);color:var(--heading);border-bottom:1px solid var(--line);font-weight:400;
  }
  .trip-map .leaflet-control-zoom a:last-child{border-bottom:none;}
  .trip-map .leaflet-control-attribution{background:rgba(251,248,243,.78);font-size:8.5px;border-radius:6px 0 0 0;color:var(--ink-soft);}
  .trip-map .leaflet-control-attribution a{color:var(--ink-soft);}
  /* しずく型のピン（中に回数） */
  .trip-pin{background:none;border:none;}

  .trip-pin .pin b{transform:rotate(45deg);color:#FFFFFF;font-size:12px;font-weight:800;font-family:"Zen Kaku Gothic New",sans-serif;}
  .trip-pin.big .pin{width:36px;height:36px;}
  .trip-pin.big .pin b{font-size:13.5px;}
  /* 吹き出し */
  .trip-map .leaflet-popup-content-wrapper{border-radius:12px;padding:0;overflow:hidden;box-shadow:0 12px 28px -12px rgba(33,28,23,.55);}
  .trip-map .leaflet-popup-content{margin:0;width:220px !important;}
  .trip-map .leaflet-popup-tip{box-shadow:none;}
  .trip-pop-head{background:var(--accent);color:#FFFFFF;padding:10px 32px 9px 12px;}
  .trip-pop-head b{display:block;font-size:13.5px;line-height:1.35;}
  .trip-pop-head span{font-size:10.5px;opacity:.85;letter-spacing:.06em;}
  .trip-pop-list{list-style:none;margin:0;padding:6px 12px 10px;max-height:150px;overflow-y:auto;}
  .trip-pop-list li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed rgba(33,28,23,.14);font-size:11.5px;line-height:1.45;color:#211C17;}
  .trip-pop-list li:last-child{border-bottom:none;}
  .trip-pop-list .d{flex:none;font-family:"Shippori Mincho",serif;font-weight:700;color:var(--accent);}
  .trip-map .leaflet-popup-close-button{color:#FFFFFF !important;top:6px !important;right:6px !important;}
  /* 会場チップ */
  .trip-venues{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none;}
  .trip-venues::-webkit-scrollbar{display:none;}
  .trip-venue{
    flex:none;display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:99px;
    background:var(--paper);border:1px solid var(--line);font-size:12px;color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  .trip-venue .n{
    min-width:22px;height:22px;border-radius:50%;background:var(--accent);color:#FFFFFF;

  .trip-radius{display:flex;gap:6px;margin:0 2px 10px;}

  /* ---------- photo editor overlay ---------- */
  .editor-bg{

  .editor-hint{font-size:11.5px;color:var(--ink-soft);margin:0 0 10px;line-height:1.6;}
  .editor-canvas-wrap{
    position:relative;width:100%;background:#111;border-radius:8px;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  .editor-canvas-wrap canvas{display:block;width:100%;height:auto;}
  .editor-quad-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .editor-quad-svg polygon{fill:rgba(201,69,122,.12);stroke:var(--accent);stroke-width:2;}
  .editor-handle{
    position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
    background:var(--accent);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);
    cursor:grab;touch-action:none;
  }
  .editor-controls{margin-top:16px;}
  .editor-slider-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .editor-slider-row label{width:52px;flex:none;font-size:12px;color:var(--ink-soft);font-weight:600;}

  .editor-quick-actions{display:flex;gap:10px;margin-top:8px;}

  /* ---------- avatar cropper（プロフィール写真の位置合わせ） ---------- */
  .avatar-crop-stage{
    position:relative;width:100%;max-width:300px;aspect-ratio:1/1;margin:0 auto;background:#111;border-radius:8px;
    overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;

  .avatar-crop-stage img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;pointer-events:none;}
  .avatar-crop-mask{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.85);pointer-events:none;}

  /* ---------- desktop / mouse presentation ---------- */

    .btn:hover{filter:brightness(0.96);}
