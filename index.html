<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>推し活手帳</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="vendor/leaflet/leaflet-1.9.4.css">
<meta name="theme-color" content="#FBF8F3">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="推し活手帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211C17;
    --ink-soft:#6B6259;
    --paper:#FBF8F3;
    --paper-alt:#F2ECE1;
    --line:rgba(33,28,23,0.16);
    --line-strong:rgba(33,28,23,0.30);

    --bg:#FBF8F3;
    --card:#F2ECE1;
    --heading:#211C17;
    --text:#211C17;
    --accent:#C9457A;
    --accent-soft:rgba(201,69,122,0.14);
    --stub-cut:#FBF8F3;
    --on-accent:#FBF8F3;

    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:var(--safe-t);}
  body{
    margin:0;
    background-color:var(--bg);
    background-image:radial-gradient(var(--line) 1px, transparent 1.4px);
    background-size:15px 15px;
    color:var(--text);
    font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:var(--safe-t);
    padding-bottom:var(--safe-b);
    transition:background-color .35s ease, color .35s ease;
    overflow-x:hidden;
  }
  button,.oshi-pill,.btn,.fab,.ticket .editbtn,nav.tabs button{transition:transform .12s ease;}
  button:active,.oshi-pill:active,.btn:active,.fab:active{transform:scale(.96);}
  h1,h2,h3,.mincho{font-family:"Shippori Mincho",serif;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ---------- layout shell ---------- */
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}

  .topbar{
    position:sticky;top:var(--safe-t);z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    height:72px;padding:0 18px;box-sizing:border-box;
    display:flex;align-items:center;justify-content:space-between;
    transition:background .35s ease,border-color .35s ease;
  }
  .brand{display:flex;flex-direction:column;line-height:1;}
  .brand .word{font-size:19px;font-weight:600;letter-spacing:.04em;color:var(--heading);}
  .brand .sub{font-size:10.5px;color:var(--ink-soft);margin-top:4px;letter-spacing:.08em;}
  .header-logo-slot{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;margin:0 10px;align-self:stretch;}
  .header-logo-btn{
    background:none;border:none;padding:0;cursor:pointer;
    height:100%;max-height:64px;max-width:100%;display:flex;align-items:center;justify-content:center;
  }
  .header-logo-btn img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block;}
  .header-logo-placeholder{
    height:100%;aspect-ratio:1.6;border:1.5px dashed var(--line-strong);border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);opacity:.55;
  }
  .header-logo-placeholder svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .oshi-chip{
    display:flex;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--line);
    padding:6px 12px 6px 8px;border-radius:999px;
    cursor:pointer;max-width:160px;
  }
  .oshi-chip .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--line-strong);}
  .oshi-chip .name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .oshi-chip .chev{font-size:9px;color:var(--ink-soft);}

  main{flex:1;padding:16px 18px calc(150px + var(--safe-b));}

  /* ---------- bottom nav ---------- */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    max-width:560px;margin:0 auto;
    background:var(--bg);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom:var(--safe-b);
    transition:background .35s ease,border-color .35s ease;
  }
  nav.tabs button{
    flex:1;background:none;border:none;padding:8px 2px 8px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-soft);cursor:pointer;
  }
  nav.tabs button .ic{width:34px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  nav.tabs button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;}
  nav.tabs button span{font-size:9.5px;letter-spacing:.02em;font-weight:500;white-space:nowrap;}
  nav.tabs button.active{color:var(--accent);}
  nav.tabs button.active .ic{background:var(--accent-soft);}
  nav.tabs button.active svg{stroke:var(--accent);}
  nav.tabs button.active span{font-weight:700;}

  /* ---------- headers / sections ---------- */
  .page-head{margin-bottom:16px;}
  .page-head h1{font-size:22px;margin:0 0 4px;color:var(--heading);font-weight:700;}
  .page-head p{margin:0;font-size:12.5px;color:var(--ink-soft);}

  .section-label{
    font-size:12px;color:var(--ink-soft);margin:22px 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  .section-label::after{content:"";flex:1;height:1px;background:var(--line);}

  /* ---------- hero / dashboard oshi card ---------- */
  .hero{
    background:var(--accent);color:var(--on-accent);
    border-radius:6px;padding:22px 20px 20px;position:relative;overflow:hidden;
    box-shadow:0 8px 20px -8px rgba(33,28,23,.35);
    transition:background .35s ease,color .35s ease;
  }
  .hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:repeating-linear-gradient(-32deg, rgba(255,255,255,.07) 0 2px, transparent 2px 16px);
  }
  .hero .eyebrow{display:flex;align-items:center;gap:6px;font-size:11px;opacity:.85;letter-spacing:.06em;position:relative;z-index:1;}
  .hero .eyebrow svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;}
  .hero .headline{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;position:relative;z-index:1;margin-top:6px;}
  .hero .who{display:flex;align-items:center;min-width:0;}
  .hero .name{font-size:27px;font-weight:800;margin:0;letter-spacing:-.01em;line-height:1.25;}
  .hero .stampring{
    flex:none;width:60px;height:60px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55);
    display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);
  }
  .hero .stampring b{font-family:"Shippori Mincho",serif;font-size:19px;font-weight:800;line-height:1;}
  .hero .stampring span{font-size:8px;letter-spacing:.05em;opacity:.85;margin-top:1px;}
  .hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:19px;position:relative;z-index:1;}
  .hero .colorname-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;opacity:.9;margin-top:6px;position:relative;z-index:1;}
  .hero .colorname-tag .d{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.5);}
  .sns-links{display:flex;gap:8px;margin-top:10px;position:relative;z-index:1;}
  .sns-links a,.sns-links .unregistered{
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--line);color:var(--accent);flex:none;
  }
  .sns-links a svg,.sns-links .unregistered svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;}
  .sns-links.on-accent a{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.32);color:var(--on-accent);}
  .sns-links .unregistered{
    background:none;border:1px dashed var(--line);color:var(--ink-soft);opacity:.4;cursor:default;
  }
  .sns-links.on-accent .unregistered{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.6);opacity:.55;}
  .sns-block{display:flex;flex-direction:column;gap:8px;margin-top:10px;position:relative;z-index:1;}
  .sns-scope-row{display:flex;align-items:center;gap:9px;}
  .sns-scope-row .sns-links{margin-top:0;}
  .sns-caption{
    font-size:9.5px;font-weight:700;color:var(--ink-soft);flex:1 1 auto;min-width:0;
    letter-spacing:.02em;white-space:nowrap;
    display:inline-flex;align-items:center;gap:4px;justify-content:flex-start;
  }
  .sns-caption-text{min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .sns-scope-row .sns-links{flex:none;}
  .sns-block.on-accent .sns-caption{color:rgba(255,255,255,.78);}
  .group-color-dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.15);}
  .avatar{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(255,255,255,.55);color:#fff;}
  .avatar-initial{font-family:"Shippori Mincho",serif;font-weight:800;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.25);}
  .hero .headline .avatar{margin-right:12px;box-shadow:0 0 0 2px rgba(255,255,255,.65),0 3px 8px rgba(33,28,23,.25);}
  .photo-picker{position:relative;display:inline-block;}
  .photo-preview{
    width:72px;height:72px;border-radius:50%;flex:none;background:var(--paper);
    border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;
    overflow:hidden;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line-strong);
    padding:0;cursor:pointer;position:relative;
  }
  .photo-preview img{width:100%;height:100%;object-fit:cover;}
  .photo-preview svg{width:26px;height:26px;stroke:var(--ink-soft);fill:none;stroke-width:1.4;}
  .photo-edit-badge{
    position:absolute;bottom:-1px;right:-1px;width:24px;height:24px;border-radius:50%;
    background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px var(--bg);
  }
  .photo-edit-badge svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;}
  .photo-menu{
    position:fixed;z-index:55;min-width:160px;
    background:var(--bg);border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;
    box-shadow:0 8px 20px -6px rgba(33,28,23,.28);
  }
  .photo-menu-item{
    display:block;width:100%;text-align:left;padding:12px 15px;font-size:13px;font-weight:600;
    background:none;border:none;color:var(--text);cursor:pointer;
  }
  .top-chip-menu{min-width:200px;max-width:260px;}
  .top-chip-menu-list{max-height:280px;overflow-y:auto;}
  .top-chip-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;
    background:none;border:none;color:var(--text);cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit;
  }
  .top-chip-item + .top-chip-item{border-top:1px dashed var(--line);}
  .top-chip-item.active{background:var(--accent-soft);color:var(--accent);}
  .top-chip-item .avatar-mini{width:26px;height:26px;border-radius:50%;flex:none;background-size:cover;background-position:center;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--line-strong);}
  .top-chip-item .tcm-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .top-chip-item .tcm-check{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;flex:none;}
  .top-chip-manage{
    display:block;width:100%;text-align:center;padding:11px 14px;font-size:12px;font-weight:700;
    background:var(--paper);border:none;border-top:1px solid var(--line-strong);color:var(--ink-soft);cursor:pointer;font-family:inherit;
  }
  .photo-menu-item + .photo-menu-item{border-top:1px solid var(--line);}
  .photo-menu-item.danger{color:#B23A3A;}
  .identity-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .identity-duo{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;}
  .identity-duo-col{flex:none;}
  .identity-duo-col label{
    display:block;font-size:11px;color:var(--ink-soft);margin-bottom:9px;
    font-weight:600;white-space:nowrap;
  }
  .group-card-list{display:flex;flex-direction:column;gap:10px;}
  .sns-icon-btn{
    width:44px;height:44px;border-radius:50%;flex:none;background:var(--paper);
    border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);cursor:pointer;margin-top:14px;
  }
  .sns-icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;}
  .sns-icon-btn.filled{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .sns-popover{padding:11px;width:230px;}
  .sns-popover input{
    width:100%;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);
    padding:9px 10px;font-size:16px;margin-bottom:8px;color:var(--text);font-family:inherit;
  }
  .sns-popover-actions{display:flex;gap:6px;}
  .sns-popover-actions .btn{flex:1;padding:7px 6px;font-size:11.5px;}
  .cheki-photo-preview{
    width:88px;height:112px;border-radius:8px;flex:none;background:var(--paper);
    border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;
    overflow:hidden;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line-strong);
    padding:0;cursor:pointer;position:relative;
  }
  .cheki-photo-preview img{width:100%;height:100%;object-fit:cover;}
  .cheki-photo-preview svg{width:26px;height:26px;stroke:var(--ink-soft);fill:none;stroke-width:1.4;}
  .hero .bday-badge{
    position:absolute;top:14px;right:16px;z-index:2;
    background:var(--bg);color:var(--accent);font-size:10.5px;font-weight:700;
    padding:4px 10px;border-radius:3px 10px 3px 10px;transform:rotate(4deg);
    box-shadow:0 2px 6px rgba(33,28,23,.2);
  }
  .hero .stat{border-top:1px solid rgba(255,255,255,.28);padding-top:8px;}
  .hero .stat b{display:block;font-size:19px;font-weight:800;font-family:"Shippori Mincho",serif;}
  .hero .stat span{display:block;font-size:10.5px;opacity:.82;margin-top:2px;}
  .hero .ring{position:absolute;right:-38px;top:-46px;width:130px;height:130px;border-radius:50%;border:1px solid rgba(255,255,255,.22);}
  .hero .ring2{position:absolute;right:14px;top:64px;width:34px;height:34px;border-radius:50%;border:1px dashed rgba(255,255,255,.3);}
  .hero.empty{background:var(--card);color:var(--text);border:1.5px dashed var(--line-strong);box-shadow:none;}
  .hero.empty::before{display:none;}
  .hero.empty .name{font-size:17px;font-weight:700;}
  .hero.empty p{font-size:12.5px;color:var(--ink-soft);margin:6px 0 14px;line-height:1.7;}

  .oshi-pills{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;margin:0 -2px;-webkit-overflow-scrolling:touch;}
  .oshi-pills::-webkit-scrollbar{display:none;}
  .oshi-pill{
    flex:none;display:flex;align-items:center;gap:7px;
    padding:5px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);font-size:12px;font-weight:600;cursor:pointer;color:var(--text);
  }
  .oshi-pill .d{width:24px;height:24px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px var(--card),0 0 0 2.5px var(--line-strong);}
  .oshi-pill.on{border-color:var(--accent);background:var(--accent-soft);color:var(--heading);}
  .oshi-pill.add{color:var(--ink-soft);border-style:dashed;}

  /* ---------- mini bar chart ---------- */
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 16px 8px;margin-top:12px;}
  .chart-card h3{margin:0 0 2px;font-size:13.5px;color:var(--heading);font-weight:700;}
  .chart-card .unit{font-size:10.5px;color:var(--ink-soft);margin-bottom:10px;display:block;}
  .bars{display:flex;align-items:flex-end;gap:8px;height:84px;}
  .bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bars .fill{width:100%;max-width:26px;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;}
  .bars .mo{font-size:9.5px;color:var(--ink-soft);margin-top:6px;}

  /* ---------- ticket cards ---------- */
  .ticket{
    position:relative;display:flex;background:var(--card);
    border:1px solid var(--line);border-radius:3px;margin-bottom:18px;overflow:visible;
    box-shadow:0 3px 8px -3px rgba(33,28,23,.16);
  }
  .ticket:nth-child(odd){transform:rotate(-.5deg);}
  .ticket:nth-child(even){transform:rotate(.5deg);}
  .ticket .tape{
    position:absolute;top:-9px;left:22px;width:46px;height:18px;
    background:linear-gradient(120deg, var(--accent), var(--accent) 60%, transparent 60%),
               repeating-linear-gradient(-45deg, rgba(255,255,255,.35) 0 4px, transparent 4px 8px);
    opacity:.85;transform:rotate(-4deg);border-radius:1px;
    box-shadow:0 1px 2px rgba(33,28,23,.18);
  }
  .ticket .main{flex:1;min-width:0;padding:16px 14px 12px;overflow:hidden;border-radius:3px 0 0 3px;}
  .ticket .kind{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
  .ticket .kind .stream-link-wrap{margin-left:auto;}
  /* LIVEのチケット右上の「…」（チケット・配信・カレンダーのメニュー） */
  .ticket .kind .live-more{margin-left:auto;flex:none;width:34px;height:24px;border-radius:99px;border:1px solid var(--accent);background:var(--paper);color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;}
  .ticket .kind .live-more svg{width:16px;height:16px;fill:currentColor;stroke:none;}
  .ticket.is-hidden{opacity:.55;}
  .fav-badge{
    position:absolute;top:-8px;left:18px;z-index:2;width:26px;height:26px;border-radius:50%;
    background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 5px rgba(33,28,23,.25);transform:rotate(-8deg);
  }
  .fav-badge svg{width:13px;height:13px;stroke:none;fill:currentColor;}
  .tag-chip{
    font-size:9.5px;font-weight:700;color:var(--ink-soft);background:var(--paper);
    border:1px solid var(--line);border-radius:99px;padding:2px 8px;
  }
  .stamp{
    display:inline-flex;align-items:center;gap:4px;
    border:1.3px solid var(--accent);color:var(--accent);
    border-radius:3px 10px 3px 10px;padding:2px 8px 2px 6px;
    font-size:10px;font-weight:700;letter-spacing:.04em;transform:rotate(-3deg);
  }
  .stamp svg{width:11px;height:11px;stroke:var(--accent);fill:none;stroke-width:2;}
  .ticket .title{font-size:14.5px;font-weight:700;color:var(--heading);margin:0 0 3px;line-height:1.4;word-break:break-word;}
  .ticket .stream-link{color:var(--accent);font-weight:700;text-decoration:underline;font-size:11.5px;white-space:nowrap;}
  .ticket .meta{font-size:11.5px;color:var(--ink-soft);line-height:1.7;}
  .ticket .memo{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.6;border-top:1px dashed var(--line);padding-top:6px;}
  .ticket .photo{
    flex:none;width:52px;height:52px;margin:16px 0 0 14px;
    background:var(--paper);border:1px solid var(--line-strong);border-radius:2px;
    display:flex;align-items:center;justify-content:center;transform:rotate(-3deg);
    box-shadow:0 2px 5px rgba(33,28,23,.14);overflow:hidden;
  }
  .ticket .photo svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.5;opacity:.7;}
  .ticket .photo img{width:100%;height:100%;object-fit:cover;}
  .ticket .stub{
    width:78px;flex:none;border-left:1px dashed var(--line-strong);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:10px 6px;text-align:center;position:relative;gap:2px;
  }
  .ticket .stub .day{font-family:"Shippori Mincho",serif;font-size:18px;font-weight:800;color:var(--heading);}
  .ticket .stub .ym{font-size:9.5px;color:var(--ink-soft);}
  .ticket .stub .amt{font-size:11.5px;font-weight:700;color:var(--accent);margin-top:4px;}
  .ticket .stub.has-photo{background-size:cover;background-position:center;}
  .ticket .stub.has-photo .day,.ticket .stub.has-photo .ym,.ticket .stub.has-photo .amt{
    color:#FBF8F3;text-shadow:0 1px 4px rgba(0,0,0,.55);
  }
  .ticket .stub::before,.ticket .stub::after{
    content:"";position:absolute;left:-7px;width:14px;height:14px;border-radius:50%;background:var(--bg);
    box-shadow:0 0 0 1px var(--line) inset;
  }
  .ticket .stub::before{top:-7px;}
  .ticket .stub::after{bottom:-7px;}
  .ticket button.editbtn{
    position:absolute;top:6px;right:6px;border:none;background:var(--bg);color:var(--ink-soft);
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;
    box-shadow:0 1px 3px rgba(33,28,23,.18);
  }
  .ticket button.editbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .ticket .photo.zoomable{cursor:zoom-in;}
  .ticket button.zoombtn{
    position:absolute;bottom:6px;right:6px;border:none;background:rgba(20,17,13,.55);color:#FBF8F3;
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;
  }
  .ticket button.zoombtn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;}

  /* ---------- photo viewer (写真を画面いっぱいに表示) ---------- */
  .photo-viewer{
    position:fixed;inset:0;z-index:90;background:rgba(10,8,6,.92);
    display:flex;align-items:center;justify-content:center;
    padding:calc(12px + var(--safe-t)) 12px calc(12px + var(--safe-b));
  }
  .photo-viewer[hidden]{display:none;}
  .photo-viewer img{width:100%;height:100%;object-fit:contain;}
  .photo-viewer-close{
    position:absolute;top:calc(12px + var(--safe-t));right:12px;width:40px;height:40px;border-radius:50%;
    border:none;background:rgba(255,255,255,.14);color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .photo-viewer-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}

  .empty-state{
    border:1.5px dashed var(--line-strong);border-radius:6px;padding:26px 18px 22px;text-align:center;color:var(--ink-soft);
    background-image:radial-gradient(var(--line) 1px, transparent 1.4px);background-size:12px 12px;
  }
  .empty-state .cluster,.auth-gate-hero .cluster{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;}
  .empty-state .cluster span,.auth-gate-hero .cluster span{
    width:38px;height:38px;border-radius:8px;background:var(--bg);border:1px solid var(--line-strong);
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(33,28,23,.12);
  }
  .empty-state .cluster span:nth-child(1),.auth-gate-hero .cluster span:nth-child(1){transform:rotate(-9deg);}
  .empty-state .cluster span:nth-child(2),.auth-gate-hero .cluster span:nth-child(2){transform:rotate(4deg) translateY(-4px);width:44px;height:44px;}
  .empty-state .cluster span:nth-child(3),.auth-gate-hero .cluster span:nth-child(3){transform:rotate(10deg);}
  .empty-state .cluster svg,.auth-gate-hero .cluster svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.5;}
  .empty-state > svg{width:30px;height:30px;stroke:var(--ink-soft);fill:none;stroke-width:1.3;margin-bottom:10px;}
  .empty-state p{margin:0 0 14px;font-size:12.5px;line-height:1.7;}

  /* ---------- fab ---------- */
  .fab{
    position:fixed;right:18px;bottom:calc(78px + var(--safe-b));z-index:25;
    width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);
    border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.18);
  }
  .fab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;}
  /* ＋ボタンは押したまま動かすと好きな位置に置ける（位置は端末に保存） */
  .fab{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .fab.moved{right:auto !important;bottom:auto !important;}
  .fab.dragging{transform:scale(1.08);box-shadow:0 12px 26px rgba(0,0,0,.28);transition:none;cursor:grabbing;}
  /* FAB stays visible even with no active oshi; tapping it guides the user
     to register one first (see openRecordSheet). */

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border-radius:3px;border:1px solid var(--line-strong);background:transparent;color:var(--text);
    font-size:13px;font-weight:600;padding:10px 16px;cursor:pointer;
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .btn.block{width:100%;}
  .btn.ghost{border-color:transparent;color:var(--ink-soft);}
  .btn.danger{border-color:#B23A3A;color:#B23A3A;}

  /* ---------- forms / sheet ---------- */
  .sheet-bg{
    position:fixed;inset:0;background:rgba(33,28,23,.42);z-index:50;
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet-bg.show{display:flex;}
  .sheet{
    width:100%;max-width:560px;background:var(--bg);border-radius:16px 16px 0 0;
    max-height:88vh;overflow-y:auto;padding:6px 20px calc(24px + var(--safe-b));
    animation:up .22s ease;
  }
  @keyframes up{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet.sheet-tall{height:88vh;}
  .sheet-handle{width:36px;height:4px;background:var(--line-strong);border-radius:99px;margin:10px auto 14px;}
  .sheet h2{font-size:17px;margin:0 0 14px;color:var(--heading);}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field input[type=url],.field input[type=email],.field input[type=password],.field input[type=time],.field select,.field textarea{
    width:100%;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);
    padding:10px 11px;font-size:16px;color:var(--text);font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:56px;line-height:1.6;}
  .field .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .venue-field{position:relative;}
  .venue-row{display:flex;gap:8px;}
  .venue-row input{flex:1;min-width:0;}
  .venue-search-btn{
    flex:none;display:inline-flex;align-items:center;gap:5px;padding:0 14px;border-radius:4px;
    border:1px solid var(--line-strong);background:var(--paper);color:var(--text);font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .venue-search-btn[hidden]{display:none;}
  .venue-search-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
  .venue-search-btn.busy{opacity:.55;}
  .venue-suggest{
    position:relative;margin-top:6px;background:var(--paper);
    border:1px solid var(--line-strong);border-radius:4px;box-shadow:0 8px 20px -8px rgba(33,28,23,.35);overflow:hidden;
  }
  .venue-suggest-item{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 12px;cursor:pointer;font-family:inherit;color:var(--text);}
  .venue-suggest-item + .venue-suggest-item{border-top:1px solid var(--line);}
  .venue-suggest-item:hover{background:var(--card);}
  .venue-suggest-item .main{display:block;font-size:13.5px;font-weight:600;}
  .venue-suggest-item .sub{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .venue-place{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--ink-soft);margin-top:5px;}
  .venue-place:empty{display:none;}
  .venue-place a{color:var(--accent);}
  .venue-link{color:inherit;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:2px;}
  /* 推し欄：人物名・グループ名（LIVEはさらにチェキ・✕、物販はチェキ）を列幅をそろえて並べる */
  .rec-oshi-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:8px;}
  .rec-oshi-row.with-actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto 34px;}
  .rec-oshi-row.with-cheki{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;}
  .rec-oshi-row + .rec-oshi-row{margin-top:8px;}
  .field .rec-oshi-row select{min-width:0;width:100%;}
  .rec-cell-empty{display:block;}
  .rec-oshi-icon{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);
    background:var(--paper);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .rec-oshi-icon.rec-cell-empty{border:none;background:none;cursor:default;}
  /* チェキボタンはアイコンの右に「チェキ」と書いた丸いボタン */
  .rec-oshi-icon.rec-oshi-cheki{
    width:auto;border-radius:99px;padding:0 10px 0 8px;gap:4px;color:var(--accent);border-color:var(--accent);
    font-size:12px;font-weight:700;font-family:inherit;white-space:nowrap;
  }
  .rec-oshi-cheki svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .rec-oshi-remove{
    flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);
    background:var(--paper);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .rec-oshi-remove svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
  .stream-url-row{display:grid;grid-template-columns:minmax(0,1fr) 34px;align-items:center;gap:8px;}
  .stream-url-row + .stream-url-row{margin-top:8px;}
  .field .stream-url-row input{min-width:0;width:100%;}
  .ticket .stream-link-wrap .stream-link + .stream-link{margin-left:10px;}
  .ticket .stream-link-btn{background:none;border:none;padding:0;cursor:pointer;font-family:inherit;}
  .stream-menu a.photo-menu-item{text-decoration:none;}
  .stream-menu .host{display:block;font-size:10.5px;font-weight:500;color:var(--ink-soft);margin-top:2px;}
  .add-rec-oshi-btn{
    display:block;width:100%;margin-top:8px;padding:9px 12px;border:1px dashed var(--line-strong);border-radius:3px;
    background:transparent;color:var(--ink-soft);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .field .row3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px;}
  .field .row3 select,.field .row3 input{padding-left:6px;padding-right:4px;font-size:16px;}
  .field-hint{font-size:10.5px;color:var(--ink-soft);margin-top:5px;line-height:1.6;}
  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .sheet-actions .btn{flex:1;}

  /* ---------- login gate (未ログイン時はログイン画面のみ) ---------- */
  #app.booting nav.tabs,#app.booting .fab,#app.booting .header-logo-btn,
  #app.auth-gate nav.tabs,#app.auth-gate .fab,#app.auth-gate .header-logo-btn,#app.auth-gate .oshi-chip{display:none !important;}
  .auth-gate-page{max-width:420px;margin:8px auto 0;}
  .auth-gate-hero{text-align:center;margin:10px 0 18px;}
  .auth-gate-hero .cluster{justify-content:center;margin-bottom:12px;}
  .auth-gate-hero h1{font-size:21px;margin:0 0 8px;color:var(--heading);}
  .auth-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 16px 14px;}
  .auth-card h2{font-size:16px;margin:0 0 14px;color:var(--heading);}
  .auth-submit{margin-top:14px;}
  .legal-links{text-align:center;font-size:11px;line-height:1.9;color:var(--ink-soft);margin:24px 0 8px;}
  .legal-links a{color:var(--accent);font-size:12px;}

  /* ---------- account / cloud sync ---------- */
  .account-note{margin:0 0 12px;font-size:12.5px;line-height:1.7;color:var(--ink-soft);}
  .account-list{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .account-row{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px;}
  .account-row + .account-row{border-top:1px solid var(--line);}
  .account-row-label{flex:none;width:8.9em;font-size:12px;color:var(--ink-soft);font-weight:600;white-space:nowrap;}
  .account-row-value{flex:1;min-width:0;font-size:13.5px;overflow-wrap:anywhere;}
  .account-row-value.muted{color:var(--ink-soft);}
  .account-row-sub{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:1px;white-space:nowrap;}
  .account-row-btns{display:flex;gap:6px;flex:none;}
  .account-row-btn:disabled{opacity:.45;cursor:default;}
  .account-row-btn{
    flex:none;border:1px solid var(--line-strong);background:var(--paper);color:var(--text);
    border-radius:3px;font-size:12px;font-weight:600;padding:6px 4px;cursor:pointer;font-family:inherit;
    width:60px;text-align:center;white-space:nowrap;   /* 変更・連携する・接続・保存などの横幅をそろえる */
  }
  .btn.account-logout{margin-top:22px;border-color:var(--line);color:#B23A3A;background:transparent;}
  .btn.google-btn{background:#FFFFFF;color:#1F1F1F;border-color:var(--line-strong);gap:10px;padding:11px 16px;}
  .btn.google-btn .google-icon{width:18px;height:18px;flex:none;stroke:none;}
  .btn:disabled{opacity:.55;cursor:default;}
  .auth-or{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-soft);margin:16px 0 14px;}
  .auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line);}
  .auth-msg{font-size:12px;line-height:1.7;margin:2px 0 0;color:var(--ink-soft);}
  .auth-msg:empty{display:none;}
  .auth-msg.error{color:#B23A3A;}
  .auth-msg.ok{color:#2F7A55;}
  .auth-links{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:16px;}
  .link-btn{background:none;border:none;color:var(--accent);font-size:12.5px;cursor:pointer;padding:4px;text-decoration:underline;font-family:inherit;}

  .group-card{
    border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--card);
    transition:opacity .12s ease, transform .12s ease;
  }
  .group-card.dragging{opacity:.4;}
  .group-card.drag-over{box-shadow:0 0 0 2px var(--accent);}
  .group-card-row{
    display:flex;align-items:center;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:1px;
  }
  .group-card-row::-webkit-scrollbar{display:none;}
  .group-drag-handle{
    flex:none;width:12px;height:20px;display:flex;align-items:center;justify-content:center;
    color:var(--line-strong);cursor:grab;touch-action:none;
  }
  .group-drag-handle svg{width:10px;height:13px;fill:currentColor;}
  .group-color-btn{
    width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong);
    padding:0;cursor:pointer;flex:none;
  }
  .group-color-pop{padding:11px;width:auto;}
  .group-color-swatches{display:flex;flex-wrap:wrap;gap:7px;max-width:168px;}
  .gcs-swatch{width:24px;height:24px;border-radius:50%;border:2px solid rgba(0,0,0,.14);cursor:pointer;padding:0;flex:none;}
  .gcs-custom-btn{
    width:24px;height:24px;
    background:conic-gradient(from 0deg,#E04B4B,#E0A23C,#E0D23C,#6CBF5E,#3C9AE0,#6C5CE0,#C25CE0,#E04B4B)!important;
    border:2px solid rgba(0,0,0,.1)!important;color:#fff!important;
  }
  .gcs-custom-btn svg{filter:drop-shadow(0 0 1.5px rgba(0,0,0,.65));}
  .gcs-custom-btn svg{width:11px;height:11px;}
  .group-name-input{
    flex:none!important;width:78px!important;font-size:13.5px!important;font-weight:700;color:var(--text)!important;
    border:none!important;background:none!important;box-shadow:none!important;
    padding:2px 0!important;font-family:inherit;border-bottom:1px solid var(--line)!important;
    border-radius:0!important;
  }
  .group-name-input:focus{outline:none;border-bottom-color:var(--accent)!important;}
  .group-name-input::placeholder{color:var(--ink-soft);opacity:.7;font-weight:600;}
  .group-sns-inline{display:flex;align-items:center;gap:4px;flex:none;margin-left:auto;}
  .group-sns-inline .sns-icon-btn{width:28px;height:28px;margin-top:0;}
  .group-sns-inline .sns-icon-btn svg{width:12px;height:12px;}
  .group-order-btns{display:flex;gap:2px;flex:none;}
  .group-order-btn{
    width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
    color:var(--ink-soft);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;flex:none;
  }
  .group-order-btn svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2.6;}
  .group-order-btn:disabled{opacity:.25;cursor:default;}
  .group-remove-btn{
    flex:none;width:18px;height:18px;border-radius:50%;border:none;background:none;
    color:var(--ink-soft);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;
  }
  .group-remove-btn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;}

  /* ---------- oshi manage list ---------- */
  .oshi-row{
    display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:12px;row-gap:0;padding:13px 4px;border-bottom:1px dashed var(--line);
  }
  /* 推しの管理：1人ずつカードで表示（上のつまみで並べ替え） */
  .oshi-row.oshi-card{
    position:relative;border:1px solid var(--line);border-radius:14px;background:var(--card);
    padding:18px 14px 14px;margin-top:18px;box-shadow:0 10px 24px -18px rgba(33,28,23,.45);
  }
  .oshi-row.oshi-card.dragging{z-index:30;opacity:.92;box-shadow:0 18px 36px -14px rgba(33,28,23,.55);}
  .oshi-row.oshi-card .sns-block,.oshi-row.oshi-card > .oshi-affil{padding-left:50px;}
  .oshi-row.is-hidden .sw,.oshi-row.is-hidden .info,.oshi-row.is-hidden .sns-block{opacity:.55;}
  .hidden-oshi-toggle{
    display:flex;align-items:center;gap:6px;width:100%;margin-top:14px;padding:10px 4px;border:none;background:none;
    color:var(--ink-soft);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left;
  }
  .hidden-oshi-toggle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .15s ease;}
  .hidden-oshi-toggle svg.open{transform:rotate(90deg);}
  .hidden-oshi-note{font-size:12px;color:var(--ink-soft);margin:6px 0;}
  .oshi-row.drag-over{box-shadow:0 0 0 2px var(--accent);border-radius:8px;}
  .oshi-row .sw{width:38px;height:38px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line-strong);}
  .oshi-row .info{flex:1;min-width:0;}
  .oshi-row .sw-col{flex:none;width:38px;position:relative;}
  /* お気に入りの印は写真の下に重ねて置き、行の高さには影響させない */
  .oshi-row .sw-col .oshi-fav-stamp{
    position:absolute;top:46px;left:50%;margin-left:-26px;width:52px;justify-content:center;
    font-size:8px;padding:1px 0;white-space:nowrap;color:var(--accent);letter-spacing:0;
  }
  .oshi-row .info .name-line{line-height:1.35;overflow-wrap:anywhere;}
  .oshi-row .info .oshi-meta-line{margin-top:2px;line-height:1.4;}
  .oshi-row > .oshi-affil{
    flex:0 0 100%;box-sizing:border-box;padding-left:74px;margin-top:3px;
    font-size:11px;color:var(--ink-soft);line-height:1.5;overflow-wrap:anywhere;
  }
  .oshi-row .info b{font-size:14.5px;color:var(--heading);}
  .oshi-row .info .oshi-bday{font-size:11px;font-weight:600;color:var(--ink-soft);}
  .oshi-row .info span{font-size:11px;color:var(--ink-soft);}
  .oshi-row .side-actions{display:flex;align-items:center;gap:2px;flex:none;}
  .oshi-row .star{background:none;border:none;color:var(--ink-soft);cursor:pointer;width:26px;height:26px;flex:none;}
  .oshi-row .star svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .oshi-row .star.active svg{fill:var(--accent);stroke:var(--accent);}
  .oshi-row .del{background:none;border:none;color:var(--ink-soft);cursor:pointer;width:26px;height:26px;flex:none;}
  .oshi-row .del svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;}
  /* SNSは推しの行の下に全幅で並べ、右端（操作ボタンの下）まで使う。
     左端は名前の位置（つまみ12px＋余白12px＋写真38px＋余白12px）にそろえる */
  .oshi-row .sns-block{flex:0 0 100%;box-sizing:border-box;padding-left:74px;margin-top:6px;gap:4px;}
  /* 推し一覧では右端まで寄せず、名前の欄を最大140pxにしてその右に並べる（狭い画面では縮む） */
  .oshi-row .sns-caption{flex:0 1 140px;}
  .oshi-row .sns-caption{font-size:8.5px;}
  .oshi-row .sns-links a,.oshi-row .sns-links .unregistered{width:22px;height:22px;}
  .oshi-row .sns-links a svg,.oshi-row .sns-links .unregistered svg{width:11px;height:11px;}

  /* ---------- stats page ---------- */
  .stat-row{
    display:flex;align-items:center;gap:12px;padding:12px 10px;
    background:var(--card);border:1px solid var(--line);border-radius:4px;margin-bottom:8px;
  }
  .stat-row .sw{width:32px;height:32px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--line-strong);}
  .stat-row .info{flex:1;min-width:0;}
  .stat-row .info b{display:block;font-size:13.5px;color:var(--heading);}
  .stat-row .info span{font-size:11px;color:var(--ink-soft);}
  .stat-row .stat-amt{font-size:13px;font-weight:800;color:var(--accent);flex:none;font-family:"Shippori Mincho",serif;}

  .cal-head{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 12px;}
  .cal-head span{font-size:15px;font-weight:700;color:var(--heading);}
  .cal-nav{background:var(--card);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;}
  .cal-nav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;}
  .cal-dow{margin-bottom:8px;}
  .cal-dow div{text-align:center;font-size:10.5px;color:var(--ink-soft);font-weight:700;}
  .cal-cell{
    aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    cursor:pointer;color:var(--text);position:relative;
  }
  .cal-cell.empty{border:none;background:none;cursor:default;}
  .cal-daynum{font-size:12px;font-weight:600;}
  .cal-cell.has-rec{border-color:var(--line-strong);}
  .cal-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
  .cal-cell.selected{background:var(--accent);border-color:var(--accent);}
  .cal-cell.selected .cal-daynum{color:var(--on-accent);}
  .cal-cell.selected .cal-dot{background:var(--on-accent);}

  .toast{
    position:fixed;left:50%;bottom:calc(94px + var(--safe-b));transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:var(--paper);font-size:12.5px;padding:9px 16px;border-radius:99px;
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .filter-note{font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;}
  .filter-note b{color:var(--accent);font-weight:700;}
  .toggle-row{display:flex;gap:8px;}
  .toggle-chip{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 6px;border:1px solid var(--line-strong);border-radius:3px;
    background:transparent;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;
  }
  .toggle-chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none;}
  .toggle-chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .toggle-chip.on svg{fill:currentColor;}
  .viewing-toggle .toggle-chip.on svg{fill:none;}
  /* 未定はアイコンをグレーにする（選んでいるときも） */
  .viewing-toggle .toggle-chip[data-viewing="tbd"] svg{color:#9A958F;stroke:#9A958F;}
  .viewing-toggle .toggle-chip[data-viewing="tbd"].on{color:#6B6560;border-color:#9A958F;background:rgba(33,28,23,.06);}
  .cal-setting{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;}
  .cal-setting label{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:5px;}
  .cal-setting .cal-label-2{margin-top:16px;}
  .cal-setting textarea{
    width:100%;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);
    padding:9px 11px;font-size:13.5px;color:var(--text);font-family:inherit;box-sizing:border-box;resize:vertical;line-height:1.6;
  }
  .cal-setting input{
    width:100%;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);
    padding:9px 11px;font-size:13.5px;color:var(--text);font-family:inherit;box-sizing:border-box;
  }
  .cal-token-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .cal-token{
    border:1px solid var(--accent);color:var(--accent);background:var(--paper);border-radius:99px;
    font-size:11.5px;font-weight:700;padding:4px 10px;cursor:pointer;font-family:inherit;
  }
  .cal-setting-actions{display:flex;justify-content:flex-end;margin-top:10px;}
  .cal-setting-actions .btn{padding:8px 22px;}
  /* ---------- チェキ記録（ギャラリー・アルバム・バインダー・カレンダー・スワイプ） ---------- */
  .ck-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 16px;}
  /* 数字は左、「総枚数」「今月」は同じ行の右寄せ */
  .ck-sum div{display:flex;align-items:baseline;justify-content:space-between;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0;}
  .ck-sum b{font-family:"Shippori Mincho",serif;font-size:20px;font-weight:800;color:var(--heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .ck-sum span{flex:none;font-size:10.5px;color:var(--ink-soft);white-space:nowrap;}
  .oshi-pill.fav-pill{padding:5px 12px;align-self:stretch;}
  .oshi-pill.fav-pill svg{width:18px;height:18px;fill:none;stroke:var(--ink-soft);stroke-width:1.6;}
  .oshi-pill.fav-pill.on svg{fill:#E8B04A;stroke:#E8B04A;}
  .ck-ph{display:block;width:100%;aspect-ratio:54/74;background:var(--paper-alt);overflow:hidden;cursor:zoom-in;border-radius:1px;}
  .ck-ph img{width:100%;height:100%;object-fit:cover;display:block;}
  .ck-ph.empty{display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .ck-ph.empty svg{width:34%;stroke:var(--accent);fill:none;stroke-width:1.4;opacity:.6;}
  .ck-ph-wrap{position:relative;}
  .gd-more{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;margin-top:10px;}
  .gd-link{background:none;border:none;padding:4px 0;font-size:12px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:inherit;}
  /* バックアップと復元 */
  .rs-note{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;line-height:1.7;}
  .rs-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .rs-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rs-item .btn{flex:none;padding:6px 14px;font-size:12px;}
  /* 写真の保存先（Googleドライブ） */
  .gd-bar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));z-index:40;
    display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;border:none;
    background:var(--heading);color:#FFFFFF;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;
    box-shadow:0 8px 20px -8px rgba(0,0,0,.5);white-space:nowrap;
  }
  .gd-bar[hidden]{display:none;}
  .gd-bar svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;}
  img.gd-missing{background:var(--paper-alt);}
  /* チェキの写真欄（複数） */
  .ck-photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
  .ck-thumb{position:relative;aspect-ratio:54/74;border-radius:4px;border:1px solid var(--line-strong);background:var(--paper);padding:0;overflow:hidden;cursor:pointer;}
  .ck-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .ck-thumb .n{position:absolute;left:4px;top:4px;background:rgba(33,28,23,.6);color:#FFFFFF;font-size:10px;font-weight:700;border-radius:99px;padding:0 6px;line-height:1.6;}
  .ck-thumb[data-ck-i]{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .ck-thumb.first{border:2px solid var(--accent);}
  .ck-thumb .top{position:absolute;left:0;right:0;bottom:0;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;text-align:center;line-height:1.7;}
  .ck-thumb.dragging{z-index:5;opacity:.9;box-shadow:0 10px 22px -8px rgba(33,28,23,.55);transition:none;cursor:grabbing;}
  .ck-thumb.drop-to{outline:2px dashed var(--accent);outline-offset:2px;}
  /* マイページのタイトルの右：マスター用のプラン切り替え */
  .page-head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .plan-preview{display:flex;border:1px solid var(--accent);border-radius:99px;overflow:hidden;flex:none;}
  .plan-preview button{border:none;background:var(--paper);color:var(--accent);font-size:11.5px;font-weight:700;padding:6px 10px;cursor:pointer;font-family:inherit;}
  .plan-preview button + button{border-left:1px solid var(--accent);}
  .plan-preview button.on{background:var(--accent);color:var(--on-accent);}
  .preview-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + var(--safe-t));z-index:60;display:flex;align-items:center;gap:10px;background:#211C17;color:#FFFFFF;font-size:12px;font-weight:700;padding:7px 8px 7px 14px;border-radius:99px;box-shadow:0 6px 16px -6px rgba(0,0,0,.5);white-space:nowrap;}
  .preview-bar[hidden]{display:none;}
  .preview-bar button{border:none;background:#FFFFFF;color:#211C17;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;cursor:pointer;font-family:inherit;}
  /* アプリ課金 */
  .plan-badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line-strong);}
  .plan-badge.plan-master{background:#211C17;color:#FFFFFF;border-color:#211C17;}
  .plan-badge.plan-paid{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
  .billing-actions{gap:8px;}
  .billing-actions .btn{flex:1;padding:9px 10px;font-size:13px;}
  .btn.danger-text{color:#B23A3A;}
  .billing-note{font-size:11px;color:var(--ink-soft);line-height:1.7;margin:8px 2px 0;}
  .billing-note a{color:var(--accent);}
  /* NEWS */
  .news-list{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .news-item + .news-item{border-top:1px solid var(--line);}
  .news-head{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:none;padding:11px 14px;cursor:pointer;font-family:inherit;color:var(--text);}
  .news-date{flex:none;font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .news-new{flex:none;font-size:9.5px;font-weight:800;color:var(--on-accent);background:var(--accent);border-radius:3px;padding:1px 5px;letter-spacing:.05em;}
  .news-title{flex:1;min-width:0;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .news-item.open .news-title{white-space:normal;}
  .news-body{padding:0 14px 12px;font-size:13px;line-height:1.8;color:var(--text);}
  .news-admin{display:flex;gap:14px;margin-top:6px;}
  .news-empty{margin:0;padding:12px 14px;font-size:12.5px;color:var(--ink-soft);}
  nav.tabs button.has-news .ic{position:relative;}
  nav.tabs button.has-news .ic::after{content:"";position:absolute;top:2px;right:6px;width:8px;height:8px;border-radius:50%;background:#D64545;box-shadow:0 0 0 2px var(--bg);}
  /* セットリスト */
  .setlist-edit{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px;}
  .setlist-row{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 6px;position:relative;}
  .setlist-row.dragging{z-index:5;box-shadow:0 8px 18px -8px rgba(33,28,23,.5);transition:none;}
  .setlist-grip{flex:none;width:26px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:grab;touch-action:none;}
  .setlist-grip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
  .setlist-no{flex:none;min-width:18px;text-align:right;font-size:12px;font-weight:700;color:var(--accent);}
  .setlist-row input{flex:1;min-width:0;border:none;background:transparent;font-size:14px;padding:6px 4px;font-family:inherit;color:var(--text);}
  .setlist-row input:focus{outline:none;}
  .setlist-del{flex:none;width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--ink-soft);font-size:16px;cursor:pointer;}
  .setlist-meta{font-size:13px;font-weight:700;color:var(--heading);margin:0 0 10px;}
  .setlist-meta span{margin-left:8px;font-weight:400;color:var(--ink-soft);font-size:12px;}
  .setlist-blocks{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
  .setlist-block{border:1px solid var(--line);border-radius:10px;padding:8px;background:rgba(255,255,255,.35);}
  .setlist-block-head{display:flex;align-items:center;gap:4px;margin-bottom:6px;}
  .setlist-artist{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700;background:var(--paper);font-family:inherit;color:var(--heading);}
  .setlist-mini{flex:none;width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);font-size:10px;cursor:pointer;padding:0;}
  .setlist-mini:disabled{opacity:.35;cursor:default;}
  .setlist-song{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .setlist-row .setlist-song input{padding:4px 4px;}
  .setlist-row .setlist-song .setlist-song-artist{font-size:12px;color:var(--ink-soft);}
  .setlist-slash{display:none;}
  .setlist-find{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--line-strong);background:var(--paper);color:var(--accent);padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .setlist-find svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}
  .setlist-view .st{flex:1;min-width:0;}
  .setlist-view .sa{font-size:12px;color:var(--ink-soft);margin-left:2px;}
  .song-picker-bg{position:fixed;inset:0;z-index:80;background:rgba(20,17,13,.45);display:flex;align-items:flex-end;justify-content:center;}
  .song-picker{width:100%;max-width:480px;max-height:82vh;background:var(--bg);border-radius:16px 16px 0 0;padding:14px 16px calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:10px;}
  .song-picker-head{display:flex;align-items:center;justify-content:space-between;}
  .song-picker-head b{font-size:15px;color:var(--heading);}
  .song-picker-close{border:none;background:none;font-size:20px;color:var(--ink-soft);cursor:pointer;}
  .song-picker-q,.song-picker-title,.song-picker-artist{border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;font-size:14px;background:var(--paper);font-family:inherit;color:var(--text);}
  .song-picker-list{overflow-y:auto;min-height:60px;max-height:34vh;border:1px solid var(--line);border-radius:8px;background:var(--card);}
  .song-picker-item{display:flex;align-items:baseline;gap:4px;width:100%;text-align:left;background:none;border:none;padding:10px 12px;cursor:pointer;font-family:inherit;color:var(--text);}
  .song-picker-item + .song-picker-item{border-top:1px solid var(--line);}
  .song-picker-item .t{font-size:14px;font-weight:700;}
  .song-picker-item .a{font-size:12px;color:var(--ink-soft);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .song-picker-item .c{flex:none;font-size:10.5px;color:var(--ink-soft);}
  .song-picker-empty{margin:0;padding:14px 12px;font-size:12.5px;color:var(--ink-soft);}
  .song-picker-new{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line-strong);padding-top:10px;}
  .song-picker-cap{margin:0;font-size:11.5px;color:var(--ink-soft);font-weight:700;}
  .setlist-row.compact{cursor:pointer;min-height:40px;}
  .setlist-label{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 2px;}
  .setlist-label b{font-weight:600;}
  .setlist-label small{font-size:11.5px;color:var(--ink-soft);margin-left:2px;}
  .setlist-label.ex{color:var(--ink-soft);font-size:12.5px;}
  .setlist-row.editing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
  .setlist-done{flex:none;width:30px;height:30px;border-radius:8px;border:none;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:700;cursor:pointer;padding:0;}
  .setlist-sa-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .setlist-sa-cap{font-size:11px;color:var(--ink-soft);font-weight:700;}
  .setlist-sa{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line-strong);background:var(--paper);border-radius:99px;padding:4px 8px 4px 11px;font-size:12.5px;font-weight:700;color:var(--heading);cursor:pointer;font-family:inherit;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .setlist-sa svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;flex:none;}
  .setlist-sa.other{border-color:var(--accent);background:var(--accent);color:var(--on-accent);}
  .setlist-sa-reset{border:none;background:none;color:var(--accent);font-size:11.5px;font-weight:700;cursor:pointer;padding:2px;font-family:inherit;text-decoration:underline;}
  .song-picker-item.new .t{color:var(--accent);}
  .setlist-quick-row{display:flex;gap:6px;align-items:center;margin-top:4px;}
  .setlist-quick{flex:1;min-width:0;border:1.5px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:15px;background:var(--paper);font-family:inherit;color:var(--text);}
  .setlist-quick-add{flex:none;border:none;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:13px;padding:0 14px;height:40px;cursor:pointer;font-family:inherit;}
  .setlist-quick-row .setlist-find{width:40px;height:40px;border-radius:10px;}
  .setlist-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .setlist-chip{border:1px solid var(--accent);background:var(--paper);color:var(--accent);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .setlist-chip small{font-weight:400;color:var(--ink-soft);margin-left:2px;}
  .setlist-chip-note{font-size:11.5px;color:var(--ink-soft);padding:4px 2px;}
  .setlist-bulk textarea{width:100%;border:1.5px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--paper);font-family:inherit;color:var(--text);line-height:1.6;}
  .setlist-bulk-actions{display:flex;gap:8px;margin-top:6px;}
  .setlist-bulk-actions .btn{flex:1;padding:9px;}
  .setlist-row.mc,.setlist-row.se{background:rgba(33,28,23,.04);border-style:dashed;}
  .setlist-row.mc .setlist-no,.setlist-row.se .setlist-no{color:var(--ink-soft);font-size:10.5px;}
  .setlist-add-row{display:flex;gap:6px;}
  .setlist-add{flex:1;border:1px dashed var(--line-strong);background:transparent;border-radius:8px;padding:7px;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;font-family:inherit;}
  .setlist-add[data-sl-add="mc"],.setlist-add[data-sl-add="se"]{color:var(--ink-soft);}
  .setlist-view-block + .setlist-view-block{margin-top:12px;}
  .setlist-view-artist{font-size:14px;margin:0 0 4px;color:var(--heading);border-left:3px solid var(--accent);padding-left:8px;}
  .setlist-view{list-style:none;margin:0 0 16px;padding:0;font-size:14px;line-height:2;}
  .setlist-view li{display:flex;gap:10px;}
  .setlist-view .n{flex:none;min-width:22px;text-align:right;color:var(--accent);font-weight:700;}
  .setlist-view li.mc,.setlist-view li.se{color:var(--ink-soft);font-size:12.5px;}
  .setlist-view li.mc .n,.setlist-view li.se .n{color:var(--ink-soft);font-size:11px;}
  .setlist-actions{display:flex;gap:8px;}
  .setlist-actions .btn{flex:1;}
  /* ---- セトリ入力のデザイン（sl2）：線を減らして、1枚のカードの中に一覧と入力バーをまとめる ---- */
  .sl2{gap:14px;}
  .sl2 .setlist-block{border:none;border-radius:14px;padding:12px 12px 10px;background:var(--card);box-shadow:0 1px 0 var(--line), 0 8px 20px -16px rgba(33,28,23,.45);}
  .sl2 .setlist-block-head{gap:6px;margin-bottom:6px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .sl2-order{flex:none;width:22px;height:22px;border-radius:50%;background:var(--heading);color:var(--bg);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .field .sl2 .setlist-artist,.sl2 .setlist-artist{width:auto;border:none;border-radius:0;background:transparent;padding:4px 2px;font-size:16px;font-family:"Shippori Mincho",serif;font-weight:800;color:var(--heading);}
  .sl2 .setlist-artist:focus{outline:none;box-shadow:inset 0 -2px 0 var(--accent);}
  .sl2 .setlist-mini{border:none;background:transparent;width:30px;height:30px;border-radius:50%;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;}
  .sl2 .setlist-mini svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
  .sl2 .setlist-mini:not(:disabled):active{background:var(--line);}
  .sl2 .setlist-edit{gap:0;margin:0 0 10px;}
  .sl2 .setlist-row{border:none;border-radius:0;background:transparent;padding:2px 0;gap:8px;}
  .sl2 .setlist-row + .setlist-row{border-top:1px solid var(--line);}
  .sl2 .setlist-row.compact{min-height:44px;}
  .sl2 .setlist-grip{width:34px;height:40px;margin-left:-6px;color:var(--ink-soft);}
  .sl2 .setlist-row.compact{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .sl2 .setlist-edit.sorting .setlist-row{transition:transform .16s ease;}
  .sl2 .setlist-edit.sorting .setlist-row.dragging{transition:none;position:relative;z-index:5;background:var(--paper);border-radius:12px;box-shadow:0 12px 24px -10px rgba(33,28,23,.45);border-top-color:transparent;}
  .sl2 .setlist-edit.sorting .setlist-row.dragging + .setlist-row{border-top-color:transparent;}
  .sl2 .setlist-edit.sorting .setlist-row.dragging .setlist-grip{color:var(--accent);cursor:grabbing;}
  .sl2 .setlist-no{min-width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;}
  .sl2 .setlist-row.mc,.sl2 .setlist-row.se{background:transparent;}
  .sl2 .setlist-row.mc .setlist-no,.sl2 .setlist-row.se .setlist-no{background:transparent;border:1px solid var(--line-strong);color:var(--ink-soft);font-size:9.5px;border-radius:6px;min-width:28px;height:20px;}
  .sl2 .setlist-label{font-size:14.5px;}
  .sl2 .setlist-label b{font-weight:700;color:var(--heading);}
  .sl2 .setlist-label.ex{font-style:normal;}
  .sl2 .setlist-del{color:var(--line-strong);font-size:15px;}
  .sl2 .setlist-row.editing{box-shadow:none;background:var(--paper);border-radius:10px;padding:6px 4px;border:1px solid var(--accent);}
  .field .sl2 .setlist-row.editing input,.sl2 .setlist-row.editing input{border:none;background:transparent;}
  .sl2 .setlist-row.editing .setlist-song-title{font-weight:700;}
  .sl2 .setlist-done{border-radius:50%;}
  .sl2 .setlist-quick-row{gap:0;margin-top:0;background:var(--paper);border:1.5px solid var(--line-strong);border-radius:99px;padding:3px;align-items:center;transition:border-color .15s ease;}
  .sl2 .setlist-quick-row:focus-within{border-color:var(--accent);}
  .sl2 .setlist-quick-row.other{border-color:var(--accent);}
  .sl2 .setlist-sa{flex:none;max-width:38%;border:none;background:var(--line);color:var(--heading);border-radius:99px;padding:7px 8px 7px 12px;font-size:12px;}
  .sl2 .setlist-sa.other{background:var(--accent);color:var(--on-accent);}
  .field .sl2 .setlist-quick,.sl2 .setlist-quick{width:auto;flex:1;min-width:0;border:none;background:transparent;border-radius:0;padding:8px 10px;font-size:15px;}
  .sl2 .setlist-quick:focus{outline:none;}
  .sl2 .setlist-quick-row .setlist-find{flex:none;width:34px;height:34px;border:none;background:transparent;color:var(--ink-soft);border-radius:50%;}
  .sl2 .setlist-quick-add{flex:none;width:36px;height:36px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .sl2 .setlist-quick-add svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;}
  .sl2 .setlist-sa-reset{display:block;margin:6px 0 0 12px;text-decoration:none;font-size:11.5px;}
  .sl2 .setlist-chips{margin:10px 0 8px;gap:6px;}
  .sl2 .setlist-chip{border:none;background:var(--accent-soft);color:var(--heading);font-weight:600;padding:6px 12px;}
  .sl2 .setlist-chip::before{content:"＋";color:var(--accent);font-weight:800;margin-right:4px;}
  .sl2 .setlist-chip-note{padding:2px 4px;}
  .sl2 .setlist-add-row{gap:6px;justify-content:flex-start;}
  .sl2 .setlist-add{flex:none;border:1px solid var(--line-strong);border-radius:99px;padding:5px 12px;font-size:11.5px;background:transparent;color:var(--ink-soft);}
  .sl2 .setlist-add.bulk{margin-left:auto;border-color:transparent;color:var(--accent);text-decoration:underline;padding:5px 4px;}
  .sl2 .setlist-bulk textarea{border-radius:12px;border-width:1px;}
  .sl2-add-artist{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:12px;border:1px dashed var(--line-strong);background:transparent;border-radius:14px;padding:12px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
  .sl2-add-artist svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;}
  .sl2-hint{font-size:11px;color:var(--ink-soft);line-height:1.7;margin:8px 2px 0;}
  /* LIVE記録を編集／セトリ記録を編集 の切り替え */
  .rec-pane-tabs{display:flex;gap:0;margin:0 0 16px;border-bottom:1px solid var(--line-strong);}
  .rec-pane-tab{flex:1;border:none;background:none;padding:10px 4px 9px;font-family:"Shippori Mincho",serif;font-size:15.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;}
  .rec-pane-tab.on{color:var(--heading);border-bottom-color:var(--accent);}
  .rec-pane[hidden]{display:none;}
  /* アーティスト・曲の登録一覧 */
  .catalog-entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;font-family:inherit;color:var(--text);}
  .catalog-entry-ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;}
  .catalog-entry-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .catalog-entry-t{flex:1;min-width:0;}
  .catalog-entry-t b{display:block;font-size:14px;}
  .catalog-entry-t small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .catalog-entry-go,.catalog-row svg{flex:none;width:16px;height:16px;stroke:var(--ink-soft);fill:none;stroke-width:2;}
  .catalog-search input{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:11px 14px;font-size:15px;background:var(--paper);font-family:inherit;color:var(--text);}
  .catalog-add{margin-top:8px;border-style:dashed;color:var(--accent);font-weight:700;}
  .catalog-add[hidden]{display:none;}
  .catalog-list{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .catalog-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;padding:12px 14px;font-family:inherit;color:var(--text);cursor:pointer;}
  /* 音楽アプリで聴く */
  .listen-btn{flex:none;width:34px;height:34px;border:none;background:transparent;border-radius:50%;color:var(--accent);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .listen-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .listen-btn svg path{fill:currentColor;stroke:none;}
  .listen-btn:active{background:var(--accent-soft);}
  .setlist-view li{align-items:center;}
  .setlist-view li .st{flex:1;min-width:0;}
  .setlist-view li .listen-btn{width:30px;height:30px;margin:-2px 0;}
  .cat-r-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:0;border:none;background:none;text-align:left;cursor:pointer;font-family:inherit;color:var(--text);}
  .cat-r .listen-btn{margin-left:2px;margin-right:-6px;}
  .music-ic{flex:none;width:30px;height:30px;border-radius:9px;color:#fff;font-weight:900;font-size:14px;display:inline-flex;align-items:center;justify-content:center;font-family:"Zen Kaku Gothic New",sans-serif;}
  .music-ic svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;}
  .music-ic svg .f{fill:#fff;stroke:none;}
  .listen-q{font-size:14px;font-weight:700;color:var(--heading);margin:2px 2px 10px;overflow-wrap:anywhere;}
  .listen-q span{font-weight:500;color:var(--ink-soft);font-size:12.5px;}
  .listen-apps{display:flex;flex-direction:column;background:var(--paper);border-radius:14px;overflow:hidden;border:1px solid var(--line);}
  .listen-app{display:flex;align-items:center;gap:12px;padding:12px 14px;color:var(--text);text-decoration:none;font-weight:700;font-size:14.5px;}
  .listen-app + .listen-app{border-top:1px solid var(--line);}
  .listen-app span:not(.music-ic){flex:1;}
  .listen-app svg{width:16px;height:16px;stroke:var(--ink-soft);fill:none;stroke-width:2;}
  .listen-app:active{background:var(--accent-soft);}
  .listen-note{font-size:11px;color:var(--ink-soft);margin:8px 2px 0;}
  .music-app-list{display:flex;flex-direction:column;background:var(--paper);border-radius:14px;border:1px solid var(--line);overflow:hidden;}
  .music-app-row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;position:relative;}
  .music-app-row + .music-app-row{border-top:1px solid var(--line);}
  .music-app-name{flex:1;font-weight:700;font-size:14.5px;}
  .music-app-row input{position:absolute;opacity:0;pointer-events:none;}
  .music-app-check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center;}
  .music-app-row input:checked + .music-app-check{background:var(--accent);border-color:var(--accent);}
  .music-app-row input:checked + .music-app-check::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px);}
  .music-app-row input:focus-visible + .music-app-check{outline:2px solid var(--accent);outline-offset:2px;}
  /* アーティスト一覧：タイル */
  .cat-list-head{margin:4px 0 14px;}
  .cat-list-head small{font-size:10px;letter-spacing:.3em;color:var(--accent);font-weight:700;}
  .cat-list-head h1{font-size:26px;margin:4px 0 8px;color:var(--heading);}
  .cat-list-stats{display:flex;gap:16px;font-size:11.5px;color:var(--ink-soft);}
  .cat-list-stats b{font-size:18px;font-weight:900;color:var(--heading);margin-right:2px;}
  .cat-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .cat-tiles .catalog-empty{grid-column:1/-1;background:var(--paper);border-radius:14px;}
  .cat-tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;aspect-ratio:3/2;padding:10px 12px;border:none;border-radius:18px;text-align:left;cursor:pointer;font-family:inherit;color:#fff;
    background:linear-gradient(135deg, rgba(0,0,0,.30), rgba(0,0,0,.04) 55%, rgba(255,255,255,.32)), var(--tile, var(--accent));background-size:cover;background-position:center;box-shadow:0 12px 22px -16px rgba(33,28,23,.7);transition:transform .12s ease;}
  .cat-tile:active{transform:scale(.97);}
  .cat-tile[hidden]{display:none;}
  .cat-tile.has-img{background-color:var(--tile, var(--accent));}
  .cat-tile.empty{background:var(--paper);color:var(--heading);box-shadow:0 1px 0 var(--line);border:1px solid var(--line);}
  .cat-tile-mark{position:absolute;right:-6px;top:-18px;font-family:"Shippori Mincho",serif;font-size:86px;font-weight:800;line-height:1;color:rgba(255,255,255,.2);pointer-events:none;}
  .cat-tile.empty .cat-tile-mark{color:var(--tile, var(--accent));opacity:.16;}
  .cat-tile-name{position:relative;max-width:100%;font-size:16px;font-weight:900;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .cat-tile:not(.empty) .cat-tile-name,.cat-tile:not(.empty) .cat-tile-sub{text-shadow:0 1px 6px rgba(0,0,0,.35);}
  .cat-tile-sub{position:relative;font-size:11px;margin-top:3px;opacity:.9;}
  .cat-tile.empty .cat-tile-sub{color:var(--ink-soft);}
  /* アーティストの画面：上はアルバムジャケット風、下はランキング */
  .cat-hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px 18px;color:#fff;background:linear-gradient(135deg, rgba(0,0,0,.30), rgba(0,0,0,.05) 55%, rgba(255,255,255,.38)), var(--accent);box-shadow:0 18px 30px -18px rgba(33,28,23,.65);}
  .cat-hero::after{content:"";position:absolute;right:-44px;top:-44px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.13);pointer-events:none;}
  .cat-hero small{position:relative;font-size:10.5px;letter-spacing:.22em;opacity:.85;}
  .cat-hero h1{position:relative;font-size:30px;font-weight:800;line-height:1.2;margin:6px 0 14px;color:#fff;overflow-wrap:anywhere;padding-right:70px;}
  .cat-hero-stats{position:relative;display:flex;gap:20px;}
  .cat-hero-stats div{font-size:10.5px;opacity:.9;}
  .cat-hero-stats b{display:block;font-size:21px;font-weight:900;line-height:1.1;}
  .cat-hero-edit{position:absolute;right:14px;bottom:14px;z-index:1;display:inline-flex;align-items:center;gap:5px;border:none;border-radius:99px;padding:7px 13px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .cat-hero-edit svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;}
  .cat-hero.has-img{background-color:var(--accent);background-size:cover;background-position:center;}
  .cat-hero.has-img::after{display:none;}
  .cat-hero.has-img h1,.cat-hero.has-img .cat-hero-stats,.cat-hero.has-img small{text-shadow:0 1px 8px rgba(0,0,0,.5);}
  .cat-hero-img{position:absolute;right:12px;top:12px;z-index:1;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
  .cat-hero-img svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .cat-img-links{display:flex;flex-wrap:wrap;gap:4px 16px;margin:4px 0 0;}
  .cat-pos-hero{position:relative;height:150px;border-radius:18px;overflow:hidden;background-color:var(--accent);background-size:cover;padding:14px 16px;color:#fff;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;justify-content:flex-start;}
  .cat-pos-hero.dragging{cursor:grabbing;}
  .cat-pos-hero small{font-size:10px;letter-spacing:.22em;opacity:.85;}
  .cat-pos-hero b{font-size:24px;font-weight:800;margin-top:4px;text-shadow:0 1px 8px rgba(0,0,0,.45);}
  .cat-pos-hand{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;}
  .cat-pos-hand svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.6;}
  .cat-pos-row{display:flex;align-items:center;gap:12px;margin-top:12px;}
  .cat-pos-tile{flex:none;width:144px;aspect-ratio:3/2;border-radius:14px;background-color:var(--tile, var(--accent));background-size:cover;display:flex;align-items:flex-end;padding:8px 10px;color:#fff;font-weight:900;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.4);}
  .cat-pos-tile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-pos-row .catalog-sheet-note{margin:0;}
  .cat-search{display:flex;align-items:center;gap:8px;margin-top:16px;background:var(--paper);border-radius:14px;padding:0 14px;box-shadow:0 1px 0 var(--line);border:1px solid transparent;}
  .cat-search:focus-within{border-color:var(--accent);}
  .cat-search svg{flex:none;width:16px;height:16px;stroke:var(--ink-soft);fill:none;stroke-width:2;}
  .cat-search input{flex:1;min-width:0;border:none;background:transparent;padding:13px 0;font-size:15px;font-family:inherit;color:var(--text);}
  .cat-search input:focus{outline:none;}
  .cat-seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:16px 0 12px;}
  .cat-seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
  .cat-seg button.on{background:var(--paper);color:var(--heading);box-shadow:0 1px 3px rgba(33,28,23,.12);}
  .cat-rank{background:var(--paper);border-radius:16px;padding:4px 14px;box-shadow:0 1px 0 var(--line);}
  .cat-rank .catalog-empty{padding:14px 0;}
  .cat-r{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border:none;background:none;text-align:left;cursor:pointer;font-family:inherit;color:var(--text);}
  .cat-r + .cat-r{border-top:1px solid var(--line);}
  .cat-r[hidden]{display:none;}
  .cat-r-n{flex:none;width:26px;height:26px;border-radius:8px;background:var(--card);font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;color:var(--heading);}
  .cat-r.g1 .cat-r-n{background:#D9B24C;color:#fff;}
  .cat-r.g2 .cat-r-n{background:#A8AFB5;color:#fff;}
  .cat-r.g3 .cat-r-n{background:#B98559;color:#fff;}
  .cat-r-b{flex:1;min-width:0;}
  .cat-r-b b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--heading);}
  .cat-bar{display:block;height:5px;border-radius:9px;background:var(--card);margin-top:6px;overflow:hidden;}
  .cat-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg, var(--accent), var(--accent-soft));}
  .cat-r-c{flex:none;min-width:22px;text-align:right;font-size:14px;font-weight:900;color:var(--accent);}
  .cat-r-c.z{font-size:11px;font-weight:700;color:var(--ink-soft);}
  .cat-artist-pick{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);padding:10px 11px;font-size:16px;color:var(--text);font-family:inherit;cursor:pointer;}
  .cat-artist-pick span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-artist-pick svg{flex:none;width:18px;height:18px;stroke:var(--ink-soft);fill:none;stroke-width:2;}
  .song-picker-item.cur .t{color:var(--accent);}
  .song-picker-item.cur .a{color:var(--accent);font-weight:700;}
  .catalog-sheet-note{font-size:12px;color:var(--ink-soft);line-height:1.7;margin:-4px 0 0;}
  .catalog-row + .catalog-row{border-top:1px solid var(--line);}
  .catalog-row[hidden]{display:none;}
  .catalog-row-name{flex:1;min-width:0;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .catalog-row-sub{flex:none;font-size:11.5px;color:var(--ink-soft);}
  .catalog-empty{margin:0;padding:14px;font-size:12.5px;color:var(--ink-soft);}
  .catalog-back{display:inline-flex;align-items:center;gap:4px;border:none;background:none;color:var(--accent);font-size:13px;font-weight:700;padding:0;margin-bottom:10px;cursor:pointer;font-family:inherit;}
  .catalog-back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
  /* ユーザー管理 */
  .btn.admin-entry{margin-top:22px;display:flex;align-items:center;justify-content:center;gap:8px;border-color:var(--accent);color:var(--accent);background:var(--card);font-weight:700;}
  .btn.admin-entry svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .plan-table{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .plan-row{display:grid;grid-template-columns:1fr 64px 64px;align-items:center;gap:6px;padding:9px 12px;}
  .plan-row + .plan-row{border-top:1px solid var(--line);}
  .plan-row > span:not(.plan-f), .plan-row > button{justify-self:center;}
  .plan-head{font-size:11px;font-weight:700;color:var(--ink-soft);padding:8px 12px;}
  .plan-f b{display:block;font-size:13px;}
  .plan-f small{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:1px;}
  .plan-switch{position:relative;width:44px;height:26px;border-radius:99px;border:1px solid var(--line-strong);background:var(--paper-alt);padding:0;cursor:pointer;}
  .plan-switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(33,28,23,.3);transition:left .15s ease;}
