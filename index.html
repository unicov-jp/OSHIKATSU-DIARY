      var upNext = 0, upStamp = Date.now();
      async function upWorker(){
        while(upNext < upIdx.length){
          var k = upIdx[upNext++];
          ckPhotos[k] = await DrivePhotos.uploadNow(ckPhotos[k], type+"_"+rec.id+"_"+upStamp+"_"+(k+1)+".jpg");
        }
      }
      var ups = [];
      for(var uw=0; uw<Math.min(3, upIdx.length); uw++) ups.push(upWorker());
      await Promise.all(ups);
      if(submitBtn) submitBtn.disabled = false;
    }
    if(type==="live" || type==="goods"){

      rec.photos = ckPhotos.slice();
      delete rec.photo;

      // 1枚ごとのお気に入り：「お気に入り」を切り替えたときは全部そろえる。変えていなければ今の状態を枚数に合わせて残す
      if(existingRec && favOn===!!existingRec.favorite && Array.isArray(existingRec.favs)){

    await persistRecord(type,rec);
    if(type==="live") await applyVenueToSameName(existingRec, rec);
    closeSheet();
    toast(existingRec ? "記録を更新しました" : "記録を追加しました");
    render();

}

/* 会場を Google マップで選び直して名前が変わったとき、元の会場名のままの
   ほかの LIVE 記録（位置が分からないもの）もまとめて同じ会場にする */
async function applyVenueToSameName(oldRec, rec){
  var place = rec.venuePlace;
  if(!oldRec || !place || typeof place.lat!=="number") return;
  var oldKey = (oldRec.venue||"").trim().toLowerCase();
  if(!oldKey || oldKey===(rec.venue||"").trim().toLowerCase()) return;
  var others = state.live.filter(function(r){
    if(r.id===rec.id || (r.venue||"").trim().toLowerCase()!==oldKey) return false;
    return !(r.venuePlace && typeof r.venuePlace.lat==="number");
  });
  if(!others.length) return;
  if(!confirm("同じ会場名「"+oldRec.venue.trim()+"」の記録があと"+others.length+"件あります。まとめて「"+rec.venue+"」に変更しますか？")) return;
  for(var i=0;i<others.length;i++){
    var r = Object.assign({}, others[i], {venue:rec.venue, venuePlace:Object.assign({}, place)});
    await persistRecord("live", r);
  }
}

/* ============ avatar cropper ============
   プロフィール写真を丸枠に合わせて切り抜く。open(元画像dataURL, 完了時コールバック) で開き、
   ドラッグで位置、スライダー（PCはホイールも）で拡大率を変える。
   適用すると 480x480 の正方形JPEGを返す（キャンセル時は null）。 */
var AvatarCropper = (function(){
  var bg, stage, imgEl, zoomEl, img = null, onDone = null;
  var S = 0, base = 1, zoom = 1, ox = 0, oy = 0, drag = null;

  function scale(){ return base*zoom; }
  function clamp(){
    var dw = img.naturalWidth*scale(), dh = img.naturalHeight*scale();
    ox = Math.min(0, Math.max(S-dw, ox));
    oy = Math.min(0, Math.max(S-dh, oy));
  }
  function draw(){
    clamp();
    imgEl.style.transform = "translate("+ox+"px,"+oy+"px) scale("+scale()+")";
  }
  // 画面上の中心を保ったまま拡大率を変える
  function setZoom(z){
    z = Math.max(1, Math.min(4, z));
    var cx = (S/2 - ox)/scale(), cy = (S/2 - oy)/scale();
    zoom = z;
    ox = S/2 - cx*scale(); oy = S/2 - cy*scale();
    zoomEl.value = Math.round(zoom*100);
    draw();
  }
  function layout(){
    S = stage.clientWidth;
    base = S / Math.min(img.naturalWidth, img.naturalHeight);
  }
  function close(result){
    bg.classList.remove("show");
    var cb = onDone; onDone = null; img = null; imgEl.src = "";
    if(cb) cb(result);
  }
  function apply(){
    var out = 480, sc = scale();
    var c = document.createElement("canvas");
    c.width = out; c.height = out;
    c.getContext("2d").drawImage(img, -ox/sc, -oy/sc, S/sc, S/sc, 0, 0, out, out);
    var url = null;
    try{ url = c.toDataURL("image/jpeg", 0.88); }catch(e){ toast("画像の書き出しに失敗しました"); }
    close(url);
  }
  function init(){
    bg = document.getElementById("avatarCropBg");
    stage = document.getElementById("avatarCropStage");
    imgEl = document.getElementById("avatarCropImg");
    zoomEl = document.getElementById("avatarCropZoom");
    zoomEl.addEventListener("input", function(){ if(img) setZoom(Number(zoomEl.value)/100); });
    stage.addEventListener("pointerdown", function(e){
      if(!img) return;
      drag = {id:e.pointerId, x:e.clientX, y:e.clientY, ox:ox, oy:oy};
      stage.setPointerCapture(e.pointerId);
      stage.classList.add("dragging");
    });
    stage.addEventListener("pointermove", function(e){
      if(!drag || e.pointerId!==drag.id) return;
      ox = drag.ox + (e.clientX-drag.x);
      oy = drag.oy + (e.clientY-drag.y);
      draw();
    });
    function endDrag(e){ if(drag && e.pointerId===drag.id){ drag = null; stage.classList.remove("dragging"); } }
    stage.addEventListener("pointerup", endDrag);
    stage.addEventListener("pointercancel", endDrag);
    stage.addEventListener("wheel", function(e){
      if(!img) return;
      e.preventDefault();
      setZoom(zoom * (e.deltaY<0 ? 1.08 : 1/1.08));
    }, {passive:false});
    document.getElementById("avatarCropApply").addEventListener("click", apply);
    document.getElementById("avatarCropCancel").addEventListener("click", function(){ close(null); });
    document.getElementById("avatarCropClose").addEventListener("click", function(){ close(null); });
  }
  function open(src, cb){
    onDone = cb;
    var im = new Image();
    im.onload = function(){
      img = im;
      imgEl.src = src;
      bg.classList.add("show");
      layout();
      zoom = 1;
      zoomEl.value = 100;
      ox = (S - img.naturalWidth*scale())/2;
      oy = (S - img.naturalHeight*scale())/2;
      draw();
    };
    im.onerror = function(){ toast("画像の読み込みに失敗しました"); close(null); };
    im.src = src;
  }
  return { init:init, open:open };
})();

/* ============ ホームのカードの並べ替え ============
   ギャラリー・遠征マップ・月別費用を、各カードの上のつまみを押したまま上下に動かして並べ替える
   （指でもマウスでも動くよう Pointer Events を使う）。並び順は設定 homeOrder として同期する。 */
var HOME_SECTIONS = ["gallery","map","chart"];
function homeOrder(){
  var o = Array.isArray(state.homeOrder) ? state.homeOrder.filter(function(k){ return HOME_SECTIONS.indexOf(k)>=0; }) : [];
  HOME_SECTIONS.forEach(function(k){ if(o.indexOf(k)<0) o.push(k); });
  return o;
}
/* つまみ（.home-grip）を押したまま上下に動かして、同じ並びのカード（itemSel）の順番を入れ替える。
   ホームのカードと推しの管理ページで共通。離したら onDrop(並び順のカードの配列) を呼ぶ */
var DRAG_GRIP_HTML = '<button type="button" class="home-grip" aria-label="並べ替え（上下にドラッグ）" title="上下にドラッグして並べ替え">'
  + '<svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="1.6"/><circle cx="12" cy="9" r="1.6"/><circle cx="16" cy="9" r="1.6"/><circle cx="8" cy="15" r="1.6"/><circle cx="12" cy="15" r="1.6"/><circle cx="16" cy="15" r="1.6"/></svg>'
  + '</button>';
function bindDragReorder(root, itemSel, onDrop){
  root.querySelectorAll(itemSel+" > .home-grip").forEach(function(grip){
    grip.addEventListener("pointerdown", function(e){
      if(e.button!==undefined && e.button!==0) return;
      e.preventDefault();
      var sec = grip.closest(itemSel);
      var startY = e.clientY;
      try{ grip.setPointerCapture(e.pointerId); }catch(err){}
      sec.classList.add("dragging");
      function isItem(el){ return el && el.matches && el.matches(itemSel); }
      function onMove(ev){
        var dy = ev.clientY - startY;
        // となりのカードの真ん中を越えたら入れ替える（指の下にカードが残るよう基準をずらす）
        var prev = sec.previousElementSibling, next = sec.nextElementSibling;
        var before = sec.offsetTop;
        if(dy>0 && isItem(next) && ev.clientY > next.getBoundingClientRect().top + next.offsetHeight/2){
          sec.parentNode.insertBefore(next, sec);
          startY += sec.offsetTop - before;
        } else if(dy<0 && isItem(prev) && ev.clientY < prev.getBoundingClientRect().top + prev.offsetHeight/2){
          // 動かしているカード自体は付け替えない（指の追跡が切れないよう、となりを後ろへ回す）
          sec.parentNode.insertBefore(prev, sec.nextSibling);
          startY += sec.offsetTop - before;
        }
        sec.style.transform = "translateY("+(ev.clientY - startY)+"px)";
      }
      function onUp(){
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        document.removeEventListener("pointercancel", onUp);
        sec.classList.remove("dragging");
        sec.style.transform = "";
        onDrop(Array.prototype.filter.call(sec.parentNode.children, isItem));
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    });
  });
}
function bindHomeReorder(){
  bindDragReorder(document.getElementById("main"), ".home-sec", function(items){
    var order = items.map(function(el){ return el.getAttribute("data-home-sec"); });
    if(order.join(",")!==homeOrder().join(",")){
      state.homeOrder = order;
      saveLocal();
    }
  });
}

/* ============ ホームのギャラリー（推しごとの写真） ============
   推しの gallery（写真の配列。新しい順）をシャッフルして横にスワイプで見る。写真を押すと拡大。
   Googleドライブに接続していれば、追加した写真はすぐドライブへ保存し、記録には置き場所だけを入れる。 */
// 写真の並びはアプリを開くたびにシャッフルする。開いている間は並びを保ち、追加した写真は先頭に出す。
var galShuffleKey = {};
function galleryOrder(g){
  return g.map(function(ref, i){
    if(!(ref in galShuffleKey)) galShuffleKey[ref] = Math.random();
    return {ref:ref, i:i, k:galShuffleKey[ref]};
  }).sort(function(a, b){ return a.k - b.k; });
}
function galleryPutFirst(refs){
  var min = 0;
  Object.keys(galShuffleKey).forEach(function(r){ if(galShuffleKey[r] < min) min = galShuffleKey[r]; });
  refs.forEach(function(ref, n){ galShuffleKey[ref] = min - refs.length + n; });
}
var GAL_CAMERA = '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.4"/><path d="M8 6l1-2h6l1 2"/></svg>';
function galleryHtml(oshi){
  var g = Array.isArray(oshi.gallery) ? oshi.gallery : [];
  var pend = galleryPending[oshi.id] || [];
  var html = '<div class="trip-map-card gallery-card">'
    + '<div class="trip-map-head">'
    +   '<div class="trip-map-title"><span class="trip-map-eyebrow">GALLERY</span><h3 class="mincho">ギャラリー</h3></div>'
    +   '<div class="gal-actions">'
    +     ((g.length+pend.length) ? '<span class="gal-no"><b id="galNo">1</b> / '+(g.length+pend.length)+'</span>' : '')
    +     '<button type="button" class="gal-add" data-action="gallery-add">＋ 追加</button>'
    +   '</div>'
    + '</div>';
  if(g.length || pend.length){
    html += '<div class="gal-swipe'+((g.length+pend.length)===1?' single':'')+'" id="galSwipe">'
      // 保存中の写真（端末の画像をそのまま出す）
      + pend.map(function(p){
          return '<div class="gal-slide gal-pending"><div class="gal-ph"><img class="gal-bg" src="'+p.url+'" alt="" aria-hidden="true"><img src="'+p.url+'" alt=""></div><span class="gal-saving">保存中…</span></div>';
        }).join("")
      + galleryOrder(g).map(function(it){
          var ref = it.ref, i = it.i;
          return '<div class="gal-slide">'
            + '<div class="gal-ph" data-action="gallery-view" data-i="'+i+'" role="button" tabindex="0" aria-label="写真を拡大"><img class="gal-bg" '+DrivePhotos.imgAttrs(ref)+' alt="" aria-hidden="true" loading="lazy"><img '+DrivePhotos.imgAttrs(ref)+' alt="" loading="lazy"></div>'
            + '<button type="button" class="gal-del" data-action="gallery-del" data-i="'+i+'" title="この写真を外す" aria-label="この写真を外す"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>'
            + '</div>';
        }).join("")
      + '</div>';
  } else {
    html += '<button type="button" class="gal-empty" data-action="gallery-add">'+GAL_CAMERA+'<span>推しの写真を追加</span></button>';
  }
  html += '<div class="photo-menu" id="galAddMenu" style="display:none;">'
    +   '<label class="photo-menu-item" style="cursor:pointer;">写真を撮る<input type="file" id="galCamera" accept="image/*" capture="environment" style="display:none;"></label>'
    +   '<label class="photo-menu-item" style="cursor:pointer;">写真を選ぶ<input type="file" id="galInput" accept="image/*" multiple style="display:none;"></label>'
    + '</div>'
    + '</div>';
  return html;
}
var galleryDocBound = false;
function bindGallery(oshi){
  var menu = document.getElementById("galAddMenu");
  if(!menu) return;
  // 写真を撮る・選ぶ前に、Googleドライブへ接続しておく（未保存の写真を作らないため）
  menu.querySelectorAll("label").forEach(function(l){
    l.addEventListener("click", function(e){ if(!DrivePhotos.requireConnection(e)) menu.style.display = "none"; }, true);
  });
  ["galInput","galCamera"].forEach(function(id){
    var input = document.getElementById(id);
    input.addEventListener("change", function(){
      var files = Array.prototype.slice.call(input.files || []);
      input.value = "";
      if(files.length) addGalleryFiles(oshi.id, files);
    });
  });
  var sw = document.getElementById("galSwipe"), no = document.getElementById("galNo");
  if(sw && no){
    sw.addEventListener("scroll", function(){
      var slides = sw.children;
      if(!slides.length) return;
      var w = slides[0].getBoundingClientRect().width + 12;
      no.textContent = String(clamp(Math.round(sw.scrollLeft / w), 0, slides.length-1) + 1);
    }, {passive:true});
  }
  if(!galleryDocBound){
    galleryDocBound = true;
    document.addEventListener("click", function(e){
      var m = document.getElementById("galAddMenu");
      if(m && !e.target.closest("#galAddMenu") && !e.target.closest('[data-action="gallery-add"]')) m.style.display = "none";
    });
  }
}
/* 選んだ写真は、すぐにギャラリーの先頭に「保存中」として出し、裏で3枚ずつ同時にドライブへ送る。
   1枚送れるごとに記録へ入れて同期を始める（全部終わるのを待たない）。 */
var galleryPending = {};   // 推しID → [{key, url}]（保存中の写真。端末の中だけ）
async function addGalleryFiles(oshiId, files){
  files = files.filter(function(f){ return f.type.indexOf("image/")===0; });
  if(!files.length){ toast("画像ファイルを選択してください"); return; }
  var stamp = Date.now();
  var jobs = files.map(function(f, i){
    return {file:f, i:i, key:"p"+stamp+"_"+i, url:URL.createObjectURL(f)};
  });
  var pend = galleryPending[oshiId] = (galleryPending[oshiId] || []).concat(jobs.map(function(j){ return {key:j.key, url:j.url}; }));
  render();
  var ok = 0, failed = 0, next = 0;
  async function one(job){
    try{
      var blob = await resizeImageToBlob(job.file, 1080, 0.85);
      var ref = await DrivePhotos.uploadBlob(blob, "gallery_"+oshiId+"_"+stamp+"_"+job.i+".jpg");
      var o = getOshi(oshiId);
      if(o){
        var gal = Array.isArray(o.gallery) ? o.gallery.slice() : [];
        galleryPutFirst([ref]);
        await persistOshi(Object.assign({}, o, {gallery: [ref].concat(gal)}));   // 新しい順
      }
      ok++;
    }catch(e){ failed++; }
    finally{
      galleryPending[oshiId] = (galleryPending[oshiId] || []).filter(function(p){ return p.key!==job.key; });
      setTimeout(function(){ URL.revokeObjectURL(job.url); }, 60000);
      if(state.view==="home") render();
    }
  }
  async function worker(){ while(next < jobs.length){ await one(jobs[next++]); } }
  var workers = [];
  for(var w=0; w<Math.min(3, jobs.length); w++) workers.push(worker());
  await Promise.all(workers);
  if(!galleryPending[oshiId].length) delete galleryPending[oshiId];
  DrivePhotos.migrateSoon();
  if(ok) toast(ok+"枚の写真を追加しました"+(failed ? "（"+failed+"枚は読み込めませんでした）" : ""));
  else toast("画像の読み込みに失敗しました");
}
async function removeGalleryPhoto(oshiId, idx){
  var o = getOshi(oshiId);
  if(!o || !Array.isArray(o.gallery) || !o.gallery[idx]) return;
  if(!confirm("この写真をギャラリーから外しますか？")) return;
  var gal = o.gallery.slice();
  gal.splice(idx, 1);
  await persistOshi(Object.assign({}, o, {gallery: gal}));
  render();
}

/* ============ trip map (遠征マップ) ============
   ホームに、お気に入りの推しの「現地」LIVEの会場をピンで表示する。地図は Leaflet + 国土地理院の淡色地図。
   位置は会場を候補から選んだときの venuePlace.lat/lng を使い、無いときは会場名から
   OpenStreetMap（Nominatim）で調べて端末に保存する（1秒に1件まで・見つからなければ7日間は再検索しない）。
   現在地はこの画面の中だけで使い、保存も送信もしない。 */
var TripMap = (function(){
  var GEO_KEY = "oshikatsu_geo_v1";
  var RADII = [0, 3, 10, 30];   // km（0 = すべて）
  var map = null, layer = null, meLayer = null, queue = [], busy = false, currentOshiId = null, markers = {}, popupTimer = null;
  var userPos = null, radiusKm = 0, locating = null, viewTouched = false, lastShown = [], resizeObs = null;
  function geoCache(){ return readStored(GEO_KEY) || {}; }
  function saveGeo(c){ try{ localStorage.setItem(GEO_KEY, JSON.stringify(c)); }catch(e){} }
  function venueKey(name){ return (name||"").trim().toLowerCase(); }

  // 2点間の距離（km）
  function distanceKm(a, b){
    var R = 6371, rad = Math.PI/180;
    var dLat = (b.lat-a.lat)*rad, dLng = (b.lng-a.lng)*rad;
    var h = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return 2*R*Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function fmtKm(km){ return km<10 ? km.toFixed(1)+"km" : Math.round(km)+"km"; }

  // 会場ごとにまとめる：{key, name, lat, lng, visits:[record]}
  function collect(oshi){
    var groups = {};
    // 会場を候補から選んだ記録の位置は、ほかの推しの記録にも使う（同じ会場名なら同じ場所）
    var known = {};
    state.live.forEach(function(r){
      var vp = r.venuePlace;
      if(!vp || typeof vp.lat!=="number" || typeof vp.lng!=="number") return;
      [vp.name, r.venue].forEach(function(n){
        var k = venueKey(n);
        if(k && !known[k]) known[k] = {lat:vp.lat, lng:vp.lng};
      });
    });
    state.live.forEach(function(r){
      if(r.hidden || !oshi || !recHasOshi(r, oshi.id)) return;
      if(recViewing(r)!=="venue") return;   // 配信・未定は地図に出さない
      if(isFutureRec(r)) return;   // これからのLIVEは、行ってから地図に出す
      var name = (r.venuePlace && r.venuePlace.name) || (r.venue||"").trim();
      if(!name) return;
      var key = venueKey(name);
      var g = groups[key] || (groups[key] = {key:key, name:name, lat:null, lng:null, visits:[]});
      g.visits.push(r);
      if(g.lat==null && r.venuePlace && typeof r.venuePlace.lat==="number" && typeof r.venuePlace.lng==="number"){
        g.lat = r.venuePlace.lat; g.lng = r.venuePlace.lng;
      }
    });
    var cache = geoCache();
    return Object.keys(groups).map(function(k){
      var g = groups[k];
      if(g.lat==null && known[k]){ g.lat = known[k].lat; g.lng = known[k].lng; }
      if(g.lat==null && cache[k] && cache[k].lat!=null){ g.lat = cache[k].lat; g.lng = cache[k].lng; }
      g.visits.sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
      return g;
    }).sort(function(a,b){ return b.visits.length-a.visits.length || a.name.localeCompare(b.name,"ja"); });
  }
  // 半径で絞る（現在地が分かっているときだけ）
  function applyRadius(groups){
    groups.forEach(function(g){ g.dist = (userPos && g.lat!=null) ? distanceKm(userPos, g) : null; });
    if(!radiusKm || !userPos) return groups;
    return groups.filter(function(g){ return g.dist!=null && g.dist<=radiusKm; })
      .sort(function(a,b){ return a.dist-b.dist; });
  }
  function popupHtml(g){
    return '<div class="trip-pop-head"><b>'+escapeHtml(g.name)+'</b><span>'+g.visits.length+' VISIT'+(g.visits.length>1?'S':'')
      + (g.dist!=null ? '・現在地から '+fmtKm(g.dist) : '')+'</span></div>'
      + '<ul class="trip-pop-list">'+g.visits.map(function(r){
          var d = (r.date||"").split("-");
          return '<li><span class="d">'+(d.length===3 ? d[0].slice(2)+"."+d[1]+"."+d[2] : "")+'</span><span>'+escapeHtml(r.title||"")+'</span></li>';
        }).join("")+'</ul>';
  }
  function pinIcon(g){
    var big = g.visits.length>=3;
    return L.divIcon({
      className:"trip-pin"+(big?" big":""),
      html:'<div class="pin"><b>'+g.visits.length+'</b></div>',
      iconSize: big ? [36,36] : [30,30],
      iconAnchor: big ? [18,38] : [15,32],
      popupAnchor:[0, big ? -36 : -30]
    });
  }
  function focusVenue(key){
    var m = markers[key];
    if(!m || !map) return;
    viewTouched = true;
    var target = map;
    map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 13), {duration:.6});
    clearTimeout(popupTimer);
    popupTimer = setTimeout(function(){ if(map===target) m.openPopup(); }, 650);
  }

  // 表示範囲をピン（と半径の円）に合わせる。アニメーションなし（途中で作り直してもエラーにならないように）
  function fitView(){
    if(!map) return;
    var pts = lastShown.filter(function(g){ return g.lat!=null; }).map(function(g){ return [g.lat, g.lng]; });
    if(radiusKm && userPos){
      var b = L.latLng(userPos.lat, userPos.lng).toBounds(radiusKm*2000);
      pts.forEach(function(p){ b.extend(p); });
      map.fitBounds(b, {padding:[20,20], maxZoom:15, animate:false});
    } else if(pts.length===1) map.setView(pts[0], 13, {animate:false});
    else if(pts.length>1) map.fitBounds(pts, {padding:[36,36], maxZoom:13, animate:false});
    else if(userPos) map.setView([userPos.lat, userPos.lng], 12, {animate:false});
    else map.setView([36.2, 138.25], 4.6, {animate:false});   // 日本全体
  }
  // 現在地の青い点と、半径の円
  function drawMe(){
    if(!map || !meLayer) return;
    meLayer.clearLayers();
    if(!userPos) return;
    if(radiusKm){
      L.circle([userPos.lat, userPos.lng], {radius:radiusKm*1000, className:"trip-radius-circle", interactive:false}).addTo(meLayer);
    }
    L.marker([userPos.lat, userPos.lng], {
      icon:L.divIcon({className:"trip-me", html:'<span></span>', iconSize:[18,18], iconAnchor:[9,9]}),
      interactive:false, keyboard:false, zIndexOffset:-100
    }).addTo(meLayer);
  }
  function renderRadius(){
    var el = document.getElementById("tripRadius");
    if(!el) return;
    el.innerHTML = RADII.map(function(km){
      return '<button type="button" class="trip-radius-chip'+(km===radiusKm?' on':'')+'" data-trip-radius="'+km+'">'
        + (km ? km+'km' : 'すべて')+'</button>';
    }).join("");
    el.querySelectorAll("[data-trip-radius]").forEach(function(b){
      b.addEventListener("click", function(){ setRadius(Number(b.getAttribute("data-trip-radius"))); });
    });
  }
  function setRadius(km){
    if(km && !userPos){
      locate().then(function(){ radiusKm = km; viewTouched = false; renderRadius(); refresh(); }, function(){});
      return;
    }
    radiusKm = km;
    viewTouched = false;
    renderRadius();
    refresh();
  }
  // 現在地を取得する（端末の中だけで使い、保存しない）
  function locate(){
    if(locating) return locating;
    if(!navigator.geolocation){
      toast("この端末では位置情報を使えません");
      return Promise.reject(new Error("no geolocation"));
    }
    setLocating(true);
    locating = new Promise(function(resolve, reject){
      navigator.geolocation.getCurrentPosition(function(pos){
        userPos = {lat:pos.coords.latitude, lng:pos.coords.longitude};
        resolve(userPos);
      }, function(err){
        toast(err && err.code===1 ? "位置情報の利用が許可されていません" : "現在地を取得できませんでした");
        reject(err);
      }, {enableHighAccuracy:false, timeout:10000, maximumAge:0});
    });
    locating.then(done, done);
    function done(){ locating = null; setLocating(false); }
    return locating;
  }
  function setLocating(on){
    var b = map && map.getContainer().querySelector('[data-trip-ctl="locate"]');
    if(b) b.classList.toggle("busy", !!on);
  }
  function goToMe(){
    locate().then(function(){
      if(!map) return;
      viewTouched = true;
      drawMe();
      refresh();
      if(radiusKm) fitView();
      else map.setView([userPos.lat, userPos.lng], Math.max(map.getZoom(), 13), {animate:false});
    }, function(){});
  }
  var ICONS = {
    center:'<svg viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-10a6 6 0 0112 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>',
    locate:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22"/></svg>'
  };
  // 地図の右上の操作ボタン（ピンを中央に・現在地）
  function addControls(){
    var Ctl = L.Control.extend({
      options:{position:"topright"},
      onAdd:function(){
        var box = L.DomUtil.create("div", "trip-ctl");
        box.innerHTML =
            '<button type="button" data-trip-ctl="center" title="ピンを中央に" aria-label="ピンを中央に">'+ICONS.center+'</button>'
          + '<button type="button" data-trip-ctl="locate" title="現在地" aria-label="現在地">'+ICONS.locate+'</button>';
        L.DomEvent.disableClickPropagation(box);
        L.DomEvent.disableScrollPropagation(box);
        box.addEventListener("click", function(e){
          var b = e.target.closest("[data-trip-ctl]");
          if(!b) return;
          var act = b.getAttribute("data-trip-ctl");
          if(act==="center"){ viewTouched = false; map.closePopup(); fitView(); }
          else if(act==="locate") goToMe();
        });
        return box;
      }
    });
    new Ctl().addTo(map);
  }

  function draw(groups){
    if(!map) return;
    var shown = applyRadius(groups);
    lastShown = shown;
    layer.clearLayers();
    markers = {};
    shown.forEach(function(g){
      if(g.lat==null) return;
      var m = L.marker([g.lat, g.lng], {icon:pinIcon(g), riseOnHover:true, title:g.name})
        .bindPopup(popupHtml(g), {closeButton:true, maxWidth:240, minWidth:220, autoPanPadding:[24,24]})
        .addTo(layer);
      markers[g.key] = m;
    });
    drawMe();
    if(!viewTouched) fitView();

    var visits = shown.reduce(function(s,g){ return s+g.visits.length; }, 0);
    var stats = document.getElementById("tripMapStats");
    if(stats){
      stats.innerHTML = '<div class="trip-stat"><b>'+shown.length+'</b><span>VENUES</span></div>'
        + '<div class="trip-stat"><b>'+visits+'</b><span>現地参戦</span></div>';
    }
    var venuesEl = document.getElementById("tripVenues");
    if(venuesEl){
      var cache = geoCache();
      venuesEl.innerHTML = shown.map(function(g){
        var missing = g.lat==null && cache[g.key] && cache[g.key].v===2;
        return '<button type="button" class="trip-venue'+(missing?' missing':'')+'" data-trip-venue="'+escapeHtml(g.key)+'"'
          + (missing?' title="位置が分かりませんでした。押すと会場を選び直せます"':'')+'>'
          + '<span class="n">'+g.visits.length+'</span>'+escapeHtml(g.name)
          + (g.dist!=null ? '<span class="km">'+fmtKm(g.dist)+'</span>' : '')+'</button>';
      }).join("");
      venuesEl.querySelectorAll("[data-trip-venue]").forEach(function(b){
        b.addEventListener("click", function(){
          var key = b.getAttribute("data-trip-venue");
          // 位置が分からない会場（灰色）は、いちばん新しいLIVEの編集画面を開いて会場を選び直せるようにする
          if(b.classList.contains("missing")){
            var g = shown.filter(function(x){ return x.key===key; })[0];
            if(g && g.visits[0]) openRecordSheet("live", g.visits[0]);
            return;
          }
          focusVenue(key);
        });
      });
    }
    setNote(groups, shown);
  }
  function setNote(groups, shown){
    var note = document.getElementById("tripMapNote");
    if(!note) return;
    var cache = geoCache();
    var pending = groups.filter(function(g){ return g.lat==null && !(cache[g.key] && cache[g.key].v===2); });
    var lines = [];
    if(radiusKm && userPos && groups.length && !shown.length) lines.push("半径"+radiusKm+"km以内の会場はありません");
    var unknown = groups.filter(function(g){ return g.lat==null && cache[g.key] && cache[g.key].v===2; }).length;
    if(radiusKm && userPos && unknown) lines.push("位置が分からない会場が"+unknown+"件あります（「すべて」で確認できます）");
    if(pending.length){
      lines.push(UsageLimit.canUse("geocode")
        ? "会場の位置を調べています…（"+pending.length+"件）"
        : UsageLimit.message("geocode"));
    }
    note.textContent = lines.join("\n");
  }
  // 会場名から位置を調べる（Nominatim は1秒に1件まで・1日の上限あり）
  // 見つからないときは「(TOKYO)」のような括弧書きを外した名前でもう一度調べる
  function geoQueries(name){
    var list = [name];
    var plain = name.replace(/[（(［\[][^）)］\]]*[）)］\]]/g, " ").replace(/\s+/g, " ").trim();
    if(plain && plain!==name) list.push(plain);
    return list;
  }
  function nominatim(q){
    var url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp&accept-language=ja&q="+encodeURIComponent(q);
    return fetch(url, {headers:{"Accept":"application/json"}})
      .then(function(res){ return res.ok ? res.json() : []; })
      .catch(function(){ return null; });
  }
  function geocodeNext(){
    if(busy || !queue.length) return;
    if(!UsageLimit.take("geocode")){
      queue = [];
      if(currentOshiId && map){ var groups = collect(getOshi(currentOshiId)); setNote(groups, applyRadius(groups)); }
      return;
    }
    busy = true;
    var g = queue.shift();
    var qs = geoQueries(g.name);
    function tryAt(i){
      nominatim(qs[i]).then(function(list){
        if(list===null){ busy = false; return; }   // 通信できないときは次回に回す
        var hit = list && list[0];
        if(!hit && i+1<qs.length){ setTimeout(function(){ tryAt(i+1); }, 1100); return; }
        var c = geoCache();
        c[g.key] = hit ? {lat:Number(hit.lat), lng:Number(hit.lon), at:Date.now()} : {lat:null, lng:null, at:Date.now(), v:2};
        saveGeo(c);
        setTimeout(function(){
          busy = false;
          if(currentOshiId && map) refresh();
          geocodeNext();
        }, 1100);
      });
    }
    tryAt(0);
  }
  function refresh(){
    var groups = collect(getOshi(currentOshiId));
    draw(groups);
    var cache = geoCache(), week = 7*24*3600*1000;
    groups.forEach(function(g){
      if(g.lat!=null) return;
      var c = cache[g.key];
      // 見つからなかった会場は7日間は調べ直さない（括弧を外す再検索を入れる前の結果は、すぐ調べ直す）
      if(c && (c.lat!=null || (c.v===2 && Date.now()-c.at < week))) return;
      if(!queue.some(function(q){ return q.key===g.key; })) queue.push(g);
    });
    geocodeNext();
  }
  function render(oshi){
    var el = document.getElementById("tripMap");
    clearTimeout(popupTimer);
    // 移動アニメーション中に作り直すとエラーになるため、止めてから破棄する
    if(resizeObs){ resizeObs.disconnect(); resizeObs = null; }
    if(map){ map.stop(); map.off(); map.remove(); map = null; }
    viewTouched = false;
    if(!el || !window.L){ return; }
    currentOshiId = oshi ? oshi.id : null;
    // 1日の地図の読み込み上限に達したら、地図を作らずに案内だけ出す
    if(!UsageLimit.take("mapLoad")){
      el.classList.add("off");
      el.innerHTML = '<div class="trip-map-off">'+escapeHtml(UsageLimit.message("mapLoad"))+'</div>';
      var radiusEl = document.getElementById("tripRadius");
      if(radiusEl) radiusEl.innerHTML = "";
      return;
    }
    map = L.map(el, {zoomControl:true, attributionControl:true, scrollWheelZoom:false});
    map.attributionControl.setPrefix(false);
    // ズームアニメーションの終了処理が、地図を破棄した後に走っても落ちないようにする
    var endZoom = map._onZoomTransitionEnd;
    map._onZoomTransitionEnd = function(){ if(this._mapPane && this._container) return endZoom.apply(this, arguments); };
    // 落ち着いた色合いの地図（国土地理院 淡色地図。APIキー不要）
    var tiles = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
      minZoom:2, maxZoom:18, keepBuffer:4,
      attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>'
    }).addTo(map);
    // 地図の画像が読み込めなかったマスは、少し待って2回まで取り直す（通信が不安定なときに一部が欠けないように）
    tiles.on("tileerror", function(e){
      var t = e.tile, n = t._retry || 0;
      if(n>=2 || !t._src0 && !t.src) return;
      t._src0 = t._src0 || t.src;
      t._retry = n+1;
      setTimeout(function(){
        if(!t.parentNode) return;
        t.src = t._src0 + (t._src0.indexOf("?")<0 ? "?" : "&") + "r=" + (n+1);
      }, 1200*(n+1));
    });
    // 画面の向きや文字の読み込みで枠の大きさが変わったら、地図の大きさを合わせ直す
    if(window.ResizeObserver){
      var target = map;
      resizeObs = new ResizeObserver(function(){ if(map===target) map.invalidateSize({animate:false}); });
      resizeObs.observe(el);
    }
    meLayer = L.layerGroup().addTo(map);
    layer = L.layerGroup().addTo(map);
    addControls();
    // 利用者が動かした後は、会場の位置が分かっても表示範囲を勝手に戻さない
    map.on("dragstart", function(){ viewTouched = true; });
    renderRadius();
    refresh();
  }
  return { render:render };
})();

/* ============ photo viewer ============ */
function openPhotoViewer(src){
  if(!src) return;
  if(DrivePhotos.isRef(src)){ DrivePhotos.openViewer(src); return; }
  var v = document.getElementById("photoViewer");
  document.getElementById("photoViewerImg").src = src;
  v.hidden = false;
}
function closePhotoViewer(){
  var v = document.getElementById("photoViewer");
  v.hidden = true;
  document.getElementById("photoViewerImg").src = "";
}

/* ============ events ============ */
function onAppClick(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");

  if(action==="add-oshi"){ openOshiSheet(null); return; }
  if(action==="preview-plan"){
    if(!realMaster()) return;
    var pp = el.getAttribute("data-plan");
    setPreviewPlan(pp==="master" ? null : pp);
    render();
    toast(pp==="master" ? "マスターの表示に戻しました" : "「"+PLAN_LABEL[pp]+"」の表示に切り替えました（確認用）");
    return;
  }
  if(action==="billing-upgrade" || action==="billing-manage" || action==="billing-cancel" || action==="billing-legal"){
    e.preventDefault();
    toast("お支払いの機能は準備中です（"+BILLING_TBD+"）");
    return;
  }
  if(action==="news-toggle"){ var nid = el.getAttribute("data-id"); news.open[nid] = !news.open[nid]; render(); return; }
  if(action==="news-all"){ news.all = !news.all; render(); return; }
  if(action==="news-edit"){
    if(!realMaster()) return;
    var nitem = el.getAttribute("data-id") ? news.items.find(function(n){ return n.id===el.getAttribute("data-id"); }) : null;
    openNewsEditor(nitem);
    return;
  }
  if(action==="news-delete"){ deleteNews(el.getAttribute("data-id")); return; }
  if(action==="catalog-open"){ catalogView.artist = null; state.view = "catalog"; render(); window.scrollTo(0,0); return; }
  if(action==="catalog-artist"){ catalogView.artist = el.getAttribute("data-name"); render(); window.scrollTo(0,0); return; }
  if(action==="catalog-back"){ catalogView.artist = null; render(); window.scrollTo(0,0); return; }
  if(action==="listen"){ openListen(el.getAttribute("data-lt")||"", el.getAttribute("data-la")||""); return; }
  if(action==="music-apps"){ openMusicAppsSheet(); return; }
  if(action==="catalog-sort"){ catalogView.sort = el.getAttribute("data-sort") || "sung"; render(); return; }
  if(action==="catalog-edit-artist"){ if(catalogView.artist) openCatalogArtistSheet(catalogView.artist); return; }
  if(action==="catalog-edit-song"){ if(catalogView.artist) openCatalogSongSheet(el.getAttribute("data-t")||"", catalogView.artist); return; }
  if(action==="goto-admin"){ if(isMaster()){ adminUsers = null; state.view = "admin"; render(); window.scrollTo(0,0); } return; }
  if(action==="goto-mypage"){ state.view = "oshi"; render(); window.scrollTo(0,0); return; }
  if(action==="toggle-feature"){ if(isMaster()) toggleFeature(el.getAttribute("data-plan"), el.getAttribute("data-feature")); return; }
  if(action==="change-password"){ openNewPasswordSheet(userHasPassword() ? "change" : "set"); return; }
  if(action==="link-google"){ linkGoogle(); return; }
  if(action==="unlink-google"){ unlinkGoogle(); return; }
  if(action==="logout"){ logout(); return; }
  if(action==="edit-oshi"){ openOshiSheet(getOshi(el.getAttribute("data-id"))); return; }
  if(action==="set-active"){ setActiveOshi(el.getAttribute("data-id")).then(render); return; }
  if(action==="toggle-oshi-hidden"){ toggleOshiHidden(el.getAttribute("data-id")); return; }
  if(action==="toggle-hidden-oshis"){ state.showHiddenOshis = !state.showHiddenOshis; render(); return; }
  if(action==="filter-oshi"){ state.filterOshiId = el.getAttribute("data-id"); render(); return; }
  if(action==="toggle-hidden"){ state.showHidden = !state.showHidden; render(); return; }
  if(action==="toggle-cheki-fav"){
    var fr = state.cheki.find(function(r){ return r.id===el.getAttribute("data-id"); });
    if(fr){
      // 1枚ごとに ON/OFF（記録の favorite は、どれか1枚でもお気に入りなら ON）
      var fidx = Number(el.getAttribute("data-idx")||0);
      var favs = [];
      for(var k=0; k<chekiUnits(fr); k++) favs.push(chekiUnitFav(fr, k));
      favs[fidx] = !favs[fidx];
      persistRecord("cheki", Object.assign({}, fr, {favs:favs, favorite:favs.some(Boolean)}));
      render();
    }
    return;
  }
  if(action==="cheki-fav"){ state.chekiFav = !state.chekiFav; state.chekiBinderPage = 0; render(); return; }
  if(action==="cheki-page"){ state.chekiBinderPage = (state.chekiBinderPage||0) + Number(el.getAttribute("data-d")); render(); return; }
  if(action==="cheki-cal-month"){
    var cm = (state.chekiCalMonth || "").split("-");
    var cd = new Date(Number(cm[0]), Number(cm[1])-1+Number(el.getAttribute("data-d")), 1);
    state.chekiCalMonth = cd.getFullYear()+"-"+String(cd.getMonth()+1).padStart(2,"0");
    state.chekiCalDate = null;
    render(); return;
  }
  if(action==="live-cal-month"){
    var lm = (state.liveCalMonth || "").split("-");
    var lmd = new Date(Number(lm[0]), Number(lm[1])-1+Number(el.getAttribute("data-d")), 1);
    state.liveCalMonth = lmd.getFullYear()+"-"+String(lmd.getMonth()+1).padStart(2,"0");
    state.liveCalDate = null;
    render(); return;
  }
  if(action==="live-cal-day"){
    var lday = el.getAttribute("data-date");
    state.liveCalDate = state.liveCalDate===lday ? null : lday;
    render(); return;
  }
  if(action==="live-cal-clear"){ state.liveCalDate = null; render(); return; }
  if(action==="cheki-cal-day"){
    var cday = el.getAttribute("data-date");
    state.chekiCalDate = state.chekiCalDate===cday ? null : cday;
    render(); return;
  }
  if(action==="cheki-cal-clear"){ state.chekiCalDate = null; render(); return; }
  if(action==="add-cheki"){ openRecordSheet("cheki", null); return; }
  if(action==="gallery-add"){
    var gm = document.getElementById("galAddMenu");
    if(gm){ if(gm.style.display==="block") gm.style.display = "none"; else openPopoverNear(el, gm); }
    return;
  }
  if(action==="gallery-view"){
    var go = activeOshi();
    var gref = go && go.gallery ? go.gallery[Number(el.getAttribute("data-i"))] : null;
    if(gref) openPhotoViewer(gref);
    return;
  }
  if(action==="gallery-del"){
    var gd = activeOshi();
    if(gd) removeGalleryPhoto(gd.id, Number(el.getAttribute("data-i")));
    return;
  }
  if(action==="calendar-setting"){ openSheet(calendarSettingHtml()); bindCalendarSetting(); return; }
  if(action==="backup-export"){ exportBackup(); return; }
  if(action==="backup-drive-save"){ saveBackupToDrive(); return; }
  if(action==="backup-drive-restore"){ openDriveBackups(); return; }
  if(action==="restore-deleted"){ openRestoreDeleted(); return; }
  if(action==="gdrive-organize"){ organizeDrive(); return; }
  if(action==="gdrive-connect"){
    if(DrivePhotos.connected()){ DrivePhotos.migrate(); return; }
    DrivePhotos.connect().then(function(){
      toast("Googleドライブに接続しました");
      render();
      DrivePhotos.migrate();
    }).catch(function(){ toast("Googleドライブに接続できませんでした"); });
    return;
  }
  if(action==="week-start-menu"){
    var wm = document.getElementById("weekStartMenu");
    if(wm){ if(wm.style.display==="block") wm.style.display = "none"; else openPopoverNear(el, wm); }
    return;
  }
  if(action==="set-week-start"){
    var nw = normWeekStart(el.getAttribute("data-w"));
    var wmn = document.getElementById("weekStartMenu");
    if(wmn) wmn.style.display = "none";
    if(nw===normWeekStart(state.weekStart)) return;
    state.weekStart = nw;
    saveLocal();
    render();
    toast("週の始まりを"+WEEK_DAYS[nw]+"曜日にしました");
    return;
  }
  if(action==="set-cheki-view"){
    var nv = el.getAttribute("data-v");
    if(nv===chekiView()) return;
    state.chekiView = nv;
    state.chekiBinderPage = 0;
    saveLocal();
    render();
    var vl = CHEKI_VIEWS.filter(function(x){ return x.id===nv; })[0];
    toast("チェキの表示を「"+(vl ? vl.label : nv)+"」にしました");
    return;
  }
  if(action==="stats-tab"){
    state.statsSubView = el.getAttribute("data-tab");
    state.calendarSelectedDate = null;
    renderStatsPage();
    return;
  }
  if(action==="share-summary"){ shareSummaryImage(); return; }
  if(action==="live-menu"){
    var lr = state.live.find(function(r){ return r.id===el.getAttribute("data-id"); });
    var lmenu = document.getElementById("streamMenu");
    var lwasOpen = lmenu.style.display==="block" && lmenu.getAttribute("data-for")==="live:"+el.getAttribute("data-id");
    lmenu.style.display = "none";
    if(!lr || lwasOpen) return;
    var items = [];
    var tu = safeWebUrl(lr.ticketUrl);
    if(tu) items.push('<a class="photo-menu-item" href="'+escapeHtml(tu)+'" target="_blank" rel="noopener noreferrer">チケットを見る</a>');
    var su = recStreamUrls(lr);
    su.forEach(function(u, i){
      var host = u; try{ host = new URL(u).hostname.replace(/^www\./, ""); }catch(err){}
      items.push('<a class="photo-menu-item" href="'+escapeHtml(u)+'" target="_blank" rel="noopener noreferrer">配信を見る'+(su.length>1 ? '（'+(i+1)+'）' : '')+'<span class="host">'+escapeHtml(host)+'</span></a>');
    });
    // セットリストはいつも出す（未登録なら「セットリストを登録」で編集画面のセットリストの欄を開く）
    if(canUse("setlist")){
      var slN = setlistSongCount(lr), slA = recSetlists(lr).length;
      items.push('<button type="button" class="photo-menu-item" data-action="view-setlist" data-id="'+lr.id+'">'+(slA ? 'セットリスト（'+(slA>1 ? slA+'組・' : '')+slN+'曲）' : 'セットリストを登録')+'</button>');
    }
    if(canUse("calendarExport")) items.push('<a class="photo-menu-item" href="'+escapeHtml(googleCalendarUrl(lr))+'" target="_blank" rel="noopener noreferrer">Googleカレンダーに追加</a>');
    if(!items.length){ toast("チケット・配信のURLは登録されていません"); return; }
    lmenu.innerHTML = items.join("");
    lmenu.setAttribute("data-for", "live:"+el.getAttribute("data-id"));
    openPopoverNear(el, lmenu);
    return;
  }
  if(action==="view-setlist"){
    document.getElementById("streamMenu").style.display = "none";
    var slr = state.live.find(function(r){ return r.id===el.getAttribute("data-id"); });
    if(!slr) return;
    if(recSetlists(slr).length) openSetlistSheet(slr);
    else openSetlistEditor(slr);
    return;
  }
  if(action==="stream-menu"){
    var sr = state.live.find(function(r){ return r.id===el.getAttribute("data-id"); });
    var menu = document.getElementById("streamMenu");
    var wasOpen = menu.style.display==="block" && menu.getAttribute("data-for")===el.getAttribute("data-id");
    menu.style.display = "none";
    if(!sr || wasOpen) return;
    menu.innerHTML = recStreamUrls(sr).map(function(u, i){
      var host = u; try{ host = new URL(u).hostname.replace(/^www\./, ""); }catch(err){}
      return '<a class="photo-menu-item" href="'+escapeHtml(u)+'" target="_blank" rel="noopener noreferrer">配信'+(i+1)+'<span class="host">'+escapeHtml(host)+'</span></a>';
    }).join("");
    menu.setAttribute("data-for", el.getAttribute("data-id"));
    openPopoverNear(el, menu);
    return;
  }
  if(action==="view-photo"){
    var pr = (state[el.getAttribute("data-type")]||[]).find(function(r){ return r.id===el.getAttribute("data-id"); });
    if(pr){
      var pidx = Number(el.getAttribute("data-idx")||0);
      openPhotoViewer(el.getAttribute("data-type")==="cheki" ? (recPhotos(pr)[pidx] || pr.photo) : pr.photo);
    }
    return;
  }
  if(action==="edit-record"){
    var type = el.getAttribute("data-type"), id = el.getAttribute("data-id");
    var rec = state[type].find(function(r){return r.id===id;});
    openRecordSheet(type,rec);
    return;
  }
}

document.addEventListener("DOMContentLoaded", function(){
  sheetBg = document.getElementById("sheetBg");
  sheetEl = document.getElementById("sheet");
  sheetEl.addEventListener("scroll", closePopoversOnSheetScroll);

  document.getElementById("app").addEventListener("click", onAppClick);

  var headerLogoBtn = document.getElementById("headerLogoBtn");
  var headerLogoMenu = document.getElementById("headerLogoMenu");
  var headerLogoInput = document.getElementById("headerLogoInput");
  var clearHeaderLogoBtn = document.getElementById("clearHeaderLogoBtn");
  headerLogoBtn.addEventListener("click", function(e){
    e.stopPropagation();
    var wasOpen = headerLogoMenu.style.display === "block";
    headerLogoMenu.style.display = "none";
    if(!wasOpen){ openPopoverNear(headerLogoBtn, headerLogoMenu); }
  });
  headerLogoMenu.querySelectorAll("label").forEach(function(l){
    l.addEventListener("click", function(e){ if(DrivePhotos.requireConnection(e)) headerLogoMenu.style.display = "none"; }, true);
  });
  headerLogoInput.addEventListener("change", function(){
    var file = headerLogoInput.files && headerLogoInput.files[0];
    headerLogoMenu.style.display = "none";
    if(!file) return;
    if(file.type.indexOf("image/")!==0){ toast("画像ファイルを選択してください"); return; }
    /* No fixed output size: keep the image reasonably light for storage
       without forcing a crop, so any logo's natural aspect ratio survives.
       PNG output (not JPEG) so a transparent background stays transparent. */
    resizeImageFilePreserveAlpha(file, 480).then(function(dataUrl){
      headerLogoInput.value = "";
      // 画像は Google ドライブへ保存し、設定には置き場所だけを入れる
      return DrivePhotos.uploadNow(dataUrl, "header_logo_"+Date.now()+".png");
    }).then(function(ref){
      if(!ref) return;
      state.headerLogo = ref;
      saveLocal();
      refreshHeaderLogo();
    }).catch(function(){
      toast("画像の読み込みに失敗しました");
    });
  });
  clearHeaderLogoBtn.addEventListener("click", function(){
    state.headerLogo = null;
    saveLocal();
    refreshHeaderLogo();
    headerLogoMenu.style.display = "none";
  });
  document.addEventListener("click", function(e){
    if(!e.target.closest("#headerLogoBtn") && !e.target.closest("#headerLogoMenu")){
      headerLogoMenu.style.display = "none";
    }
  });

  var topChip = document.getElementById("topChip");
  var topChipMenu = document.getElementById("topChipMenu");
  topChip.addEventListener("click", function(e){
    e.stopPropagation();
    var wasOpen = topChipMenu.style.display === "block";
    topChipMenu.style.display = "none";
    if(!wasOpen && topChipMenu.innerHTML){ openPopoverNear(topChip, topChipMenu); }
  });
  topChipMenu.addEventListener("click", function(e){
    var item = e.target.closest("[data-set-active-oshi]");
    if(item){
      topChipMenu.style.display = "none";
      setActiveOshi(item.getAttribute("data-set-active-oshi")).then(render);
      return;
    }
    if(e.target.closest('[data-action="goto-oshi-page"]')){
      topChipMenu.style.display = "none";
      state.view = "oshis";
      render();
      return;
    }
    if(e.target.closest('[data-action="add-oshi"]')){
      topChipMenu.style.display = "none";
    }
  });
  document.addEventListener("click", function(e){
    if(!e.target.closest("#topChip") && !e.target.closest("#topChipMenu")){
      topChipMenu.style.display = "none";
    }
  });

  document.querySelectorAll("nav.tabs button").forEach(function(b){
    b.addEventListener("click", function(){
      state.view = b.getAttribute("data-view");
      state.filterOshiId = "all";
      render();
    });
  });

  bindFabDrag(document.getElementById("fabBtn"));
  document.getElementById("fabBtn").addEventListener("click", function(){
    if(fabJustDragged){ fabJustDragged = false; return; }
    var v = state.view;
    if(v==="oshis"){ openOshiSheet(null); return; }   // 推しの管理ページでは推しを登録
    var type = (v==="live"||v==="cheki"||v==="goods") ? v : "live";
    openRecordSheet(type,null);
  });

  sheetBg.addEventListener("click", function(e){ if(e.target===sheetBg) closeSheet(); });

  var streamMenu = document.getElementById("streamMenu");
  streamMenu.addEventListener("click", onAppClick);   // メニューは #app の外にあるので、ここでもボタンの操作を受ける
  document.addEventListener("click", function(e){
    if(!e.target.closest("#streamMenu") && !e.target.closest('[data-action="stream-menu"]') && !e.target.closest('[data-action="live-menu"]')) streamMenu.style.display = "none";
    else if(e.target.closest("#streamMenu a")) streamMenu.style.display = "none";
    var wsm = document.getElementById("weekStartMenu");
    if(wsm && !e.target.closest("#weekStartMenu") && !e.target.closest('[data-action="week-start-menu"]')) wsm.style.display = "none";
  });
  window.addEventListener("scroll", function(){ streamMenu.style.display = "none"; }, {passive:true});

  var photoViewer = document.getElementById("photoViewer");
  photoViewer.addEventListener("click", function(e){
    if(e.target===photoViewer || e.target.closest("#photoViewerClose")) closePhotoViewer();
  });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape" && !photoViewer.hidden) closePhotoViewer();
  });

  PhotoEditor.init();
  AvatarCropper.init();

  // アプリとしてインストールできるよう Service Worker を登録する（https と開発用の localhost のみ）
  if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("/sw.js").catch(function(e){ console.warn("SW registration failed", e); });
    });
  }
  initStorage();
});
})();
</script>
