/* アーティストの画面の見出しの背景画像（アーティストの登録に image として持つ。画像は Google ドライブへ） */
var CAT_HERO_GRAD = "linear-gradient(180deg, rgba(0,0,0,.42), rgba(0,0,0,.12) 38%, rgba(0,0,0,.15) 55%, rgba(0,0,0,.68))";
var CAT_IMG_POS = "50% 30%";   // 位置を決めていない画像は、少し上寄り（集合写真の顔が切れにくい）
function catalogArtistImagePos(name){ var e = catalogArtistEntry(name); return (e && /^\d{1,3}(\.\d+)?% \d{1,3}(\.\d+)?%$/.test(e.imagePos||"")) ? e.imagePos : CAT_IMG_POS; }
function catalogArtistEntry(name){
  var k = nameKey(name);
  return (state.artists||[]).find(function(x){ return nameKey(x.name)===k; }) || null;
}
function catalogArtistImage(name){ var e = catalogArtistEntry(name); return e && e.image || ""; }
// 一覧のタイルの色：推しのグループの色（無ければ推しの色）、それ以外はアプリの色
var CAT_TILE_GRAD = "linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.02) 35%, rgba(0,0,0,.70))";
function catalogArtistColor(name){
  var k = nameKey(name), c = "";
  state.oshis.forEach(function(o){
    if(c) return;
    var gs = oshiGroupsList(o);
    if(gs.length){ var g = gs.find(function(x){ return nameKey(x.name)===k; }); if(g) c = g.color || o.color; }
    else if(nameKey(o.name)===k) c = o.color;
  });
  return /^#[0-9a-fA-F]{3,8}$/.test(c||"") ? c : "var(--accent)";
}
// 背景画像の表示位置を決める：見出しの形の枠の中で画像をドラッグする。一覧のタイルの見え方も一緒に出す
async function openCatalogImagePos(name){
  var e = catalogArtistEntry(name);
  if(!e || !e.image) return;
  var url = DrivePhotos.cachedUrl(e.image);
  if(!url){ try{ url = await DrivePhotos.localUrl(e.image); }catch(err){ toast("画像を読み込めませんでした"); return; } }
  var pos = catalogArtistImagePos(name).split(" ").map(parseFloat);
  var color = catalogArtistColor(name);
  openSheet('<h2 class="mincho">背景画像の表示位置</h2>'
    + '<p class="catalog-sheet-note" style="margin:0 0 10px;">画像をドラッグして、見せたい部分を枠に合わせてください。</p>'
    + '<div class="cat-pos-hero" id="catPosHero"><small>ARTIST</small><b class="mincho">'+escapeHtml(name)+'</b><span class="cat-pos-hand"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></span></div>'
    + '<div class="cat-pos-row"><div class="cat-pos-tile" id="catPosTile" style="--tile:'+escapeHtml(color)+'"><span>'+escapeHtml(name)+'</span></div>'
    +   '<p class="catalog-sheet-note">一覧のタイルでは、このように表示されます。</p></div>'
    + '<div class="sheet-actions">'
    +   '<button type="button" class="btn ghost" id="catPosReset">中央に戻す</button>'
    +   '<button type="button" class="btn primary" id="catPosSave">決定</button>'
    + '</div>');
  var hero = document.getElementById("catPosHero"), tile = document.getElementById("catPosTile");
  var nat = {w:0, h:0};
  var img = new Image();
  img.onload = function(){ nat.w = img.naturalWidth; nat.h = img.naturalHeight; };
  img.src = url;
  function apply(){
    var v = pos[0].toFixed(1)+"% "+pos[1].toFixed(1)+"%";
    hero.style.backgroundImage = CAT_HERO_GRAD+", url("+url+")";
    hero.style.backgroundPosition = v;
    tile.style.backgroundImage = CAT_TILE_GRAD+", url("+url+")";
    tile.style.backgroundPosition = v;
  }
  apply();
  // はみ出している長さ（cover で表示したとき）。動かせる向きだけ動く
  function overflow(){
    var fw = hero.clientWidth, fh = hero.clientHeight;
    if(!nat.w || !nat.h) return {x:0, y:0};
    var sc = Math.max(fw/nat.w, fh/nat.h);
    return {x:nat.w*sc - fw, y:nat.h*sc - fh};
  }
  var drag = null;
  hero.addEventListener("pointerdown", function(ev){
    drag = {x:ev.clientX, y:ev.clientY, px:pos[0], py:pos[1], of:overflow()};
    hero.setPointerCapture(ev.pointerId);
    hero.classList.add("dragging");
  });
  hero.addEventListener("pointermove", function(ev){
    if(!drag) return;
    if(drag.of.x > 1) pos[0] = clamp(drag.px - (ev.clientX-drag.x)/drag.of.x*100, 0, 100);
    if(drag.of.y > 1) pos[1] = clamp(drag.py - (ev.clientY-drag.y)/drag.of.y*100, 0, 100);
    apply();
  });
  function end(){ drag = null; hero.classList.remove("dragging"); }
  hero.addEventListener("pointerup", end);
  hero.addEventListener("pointercancel", end);
  document.getElementById("catPosReset").addEventListener("click", function(){ pos = [50, 50]; apply(); });
  document.getElementById("catPosSave").addEventListener("click", function(){
    var cur = catalogArtistEntry(name);
    if(cur){ cur.imagePos = Math.round(pos[0])+"% "+Math.round(pos[1])+"%"; saveLocal(); }
    closeSheet();
    toast("背景画像を設定しました");
    render();
  });
}
function bindCatalogHero(name){
  var input = document.getElementById("catalogHeroInput");
  if(!name || !input) return;
  var label = input.closest("label");
  // 画像を選ぶ前に、Googleドライブへ接続しておく
  label.addEventListener("click", function(e){ if(e.target===input) return; DrivePhotos.requireConnection(e); }, true);
  input.addEventListener("change", async function(){
    var f = input.files && input.files[0];
    input.value = "";

    if(f.type.indexOf("image/")!==0){ toast("画像ファイルを選択してください"); return; }
    toast("背景画像を保存しています…");
    try{
      var blob = await resizeImageToBlob(f, 1280, 0.85);

      if(!DrivePhotos.isRef(ref)){ toast("Googleドライブに接続してから選んでください"); return; }

/* ---- アーティスト・曲の変更と削除（登録一覧から）。LIVE記録のセトリにも反映する ---- */
function nameKey(v){ return (v||"").trim().toLowerCase(); }
// 推しのグループ名（またはグループのない推しの人物名）としてのアーティストか
function oshiArtistKind(name){
  var k = nameKey(name), kind = "";
  state.oshis.forEach(function(o){
    var gs = oshiGroupsList(o);
    if(gs.length){ if(gs.some(function(g){ return nameKey(g.name)===k; })) kind = kind || "group"; }
    else if(nameKey(o.name)===k) kind = "person";
  });
  return kind;
}
// LIVE記録のセトリを1件ずつ直す。fn が true を返した記録だけ setlists に書き戻す
function eachSetlistRec(fn){
  var n = 0;
  state.live.forEach(function(r){
    var bl = recSetlists(r);
    if(!bl.length) return;
    var copy = bl.map(function(b){ return {artist:b.artist||"", items:b.items.map(function(it){ return Object.assign({}, it); })}; });
    if(fn(copy, r)){
      r.setlists = copy.filter(function(b){ return b.items.length || (b.artist||"").trim(); });
      delete r.setlist;
      n++;
    }
  });
  return n;
}
function songMatches(it, b, title, artist){
  return it.t==="song" && nameKey(it.title)===nameKey(title) && nameKey(songArtist(it, b))===nameKey(artist);
}
function countArtistUse(name){
  var k = nameKey(name), n = 0;
  state.live.forEach(function(r){
    if(recSetlists(r).some(function(b){ return nameKey(b.artist)===k || b.items.some(function(it){ return it.t==="song" && nameKey(songArtist(it, b))===k; }); })) n++;
  });
  return n;
}
function countSongUse(title, artist){
  var n = 0;
  state.live.forEach(function(r){
    if(recSetlists(r).some(function(b){ return b.items.some(function(it){ return songMatches(it, b, title, artist); }); })) n++;
  });
  return n;
}
function dedupeCatalog(){
  var seenA = {}, seenS = {};
  state.artists = (state.artists||[]).filter(function(a){
    var k = nameKey(a.name);
    if(!k) return false;
    if(seenA[k]){ if(a.image && !seenA[k].image) seenA[k].image = a.image; return false; }   // 背景画像は残す
    seenA[k] = a; return true;
  });
  state.songs = (state.songs||[]).filter(function(x){ var k = nameKey(x.title)+"\u0000"+nameKey(x.artist); if(!nameKey(x.title) || seenS[k]) return false; seenS[k] = true; return true; });
}
function renameCatalogArtist(from, to){
  var fk = nameKey(from);
  to = (to||"").trim();
  if(!to || fk===nameKey(to) && from.trim()===to) return;
  var hit = false;
  (state.artists||[]).forEach(function(a){ if(nameKey(a.name)===fk){ a.name = to; hit = true; } });
  if(!hit) state.artists.push({id:uuid(), name:to, createdAt:Date.now()});
  (state.songs||[]).forEach(function(x){ if(nameKey(x.artist)===fk) x.artist = to; });
  eachSetlistRec(function(bl){
    var ch = false;
    bl.forEach(function(b){
      if(nameKey(b.artist)===fk){ b.artist = to; ch = true; }
      b.items.forEach(function(it){ if(it.t==="song" && it.artist && nameKey(it.artist)===fk){ it.artist = to; ch = true; } });
    });
    return ch;
  });
  // 推しのグループ名も同じ名前なら合わせて変える（同じアーティストのため）
  state.oshis.forEach(function(o){
    if(o.groups && o.groups.length) o.groups.forEach(function(g){ if(nameKey(g.name)===fk) g.name = to; });
    else if(o.group && nameKey(o.group)===fk) o.group = to;
  });
  dedupeCatalog();
}
function deleteCatalogArtist(name){
  var k = nameKey(name);
  state.artists = (state.artists||[]).filter(function(a){ return nameKey(a.name)!==k; });
  state.songs = (state.songs||[]).filter(function(x){ return nameKey(x.artist)!==k; });
  eachSetlistRec(function(bl){
    var ch = false;
    for(var i=bl.length-1;i>=0;i--){
      var b = bl[i];
      if(nameKey(b.artist)===k){ bl.splice(i, 1); ch = true; continue; }
      var before = b.items.length;
      b.items = b.items.filter(function(it){ return !(it.t==="song" && nameKey(songArtist(it, b))===k); });
      if(b.items.length!==before) ch = true;
    }
    return ch;
  });
}
function editCatalogSong(title, artist, nt, na){
  nt = (nt||"").trim(); na = (na||"").trim();
  if(!nt) return;
  var hit = false;
  (state.songs||[]).forEach(function(x){
    if(nameKey(x.title)===nameKey(title) && nameKey(x.artist)===nameKey(artist)){ x.title = nt; x.artist = na; hit = true; }
  });
  if(!hit) state.songs.push({id:uuid(), title:nt, artist:na, createdAt:Date.now()});
  if(na) registerArtist(na, true);
  eachSetlistRec(function(bl){
    var ch = false;
    bl.forEach(function(b){
      b.items.forEach(function(it){
        if(!songMatches(it, b, title, artist)) return;
        it.title = nt;
        if(nameKey(na)===nameKey(b.artist)) delete it.artist; else it.artist = na;
        ch = true;
      });
    });
    return ch;
  });
  dedupeCatalog();
}
function deleteCatalogSong(title, artist){
  state.songs = (state.songs||[]).filter(function(x){ return !(nameKey(x.title)===nameKey(title) && nameKey(x.artist)===nameKey(artist)); });
  eachSetlistRec(function(bl){
    var ch = false;
    bl.forEach(function(b){
      var before = b.items.length;
      b.items = b.items.filter(function(it){ return !songMatches(it, b, title, artist); });
      if(b.items.length!==before) ch = true;
    });
    return ch;
  });
}

/* 推しを非表示／表示に切り替える。お気に入りの推しを隠したときは、
   表示中のほかの推しをお気に入りにする。 */
async function toggleOshiHidden(id){
  var o = getOshi(id);
  if(!o) return;
  var updated = Object.assign({}, o, {hidden: !o.hidden});
  await persistOshi(updated);
  if(updated.hidden && state.activeOshiId===id){
    var next = visibleOshis()[0];
    await setActiveOshi(next ? next.id : null);
  } else if(!updated.hidden && !getOshi(state.activeOshiId)){
    await setActiveOshi(id);
  }
  toast(updated.hidden ? "「"+o.name+"」を非表示にしました" : "「"+o.name+"」を表示に戻しました");
  render();
}

  if(state.headerLogo){

    else if(img.getAttribute("data-gd")!==state.headerLogo){ img.setAttribute("data-gd", state.headerLogo); DrivePhotos.hydrate(img.parentNode); }
    img.style.display = "block";

var ACCESS_KEY = "oshikatsu_access_v1:";
var access = {plan:null, features:{paid:{}, free:{}}, loaded:false};
var PREVIEW_KEY = "oshikatsu_plan_preview_v1";
function accessKey(){ return ACCESS_KEY + (cloud.user ? cloud.user.id : ""); }
// マスターだけ：表示を確認するためのプランの切り替え（この画面を開いている間だけ。データや権限は変えない）
function previewPlan(){
  if(access.plan!=="master") return null;
  try{ var v = sessionStorage.getItem(PREVIEW_KEY); return (v==="paid" || v==="free") ? v : null; }catch(e){ return null; }
}
function setPreviewPlan(plan){
  try{
    if(plan==="paid" || plan==="free") sessionStorage.setItem(PREVIEW_KEY, plan);
    else sessionStorage.removeItem(PREVIEW_KEY);
  }catch(e){}
}
// 画面で使うプラン（マスターが切り替え中なら、そのプラン）
function effectivePlan(){ return previewPlan() || access.plan; }
// 本当にマスターか（切り替え中でも true。ユーザー管理の書き込みや切り替えボタンに使う）
function realMaster(){ return access.plan==="master"; }
function restoreAccess(){
  var a = readStored(accessKey());
  access = (a && a.features) ? {plan:a.plan||null, features:a.features, loaded:false} : {plan:null, features:{paid:{}, free:{}}, loaded:false};
}
function isMaster(){ return effectivePlan()==="master"; }
// その機能を使えるか（マスター・種類が分からないときは使える）
function canUse(feature){
  var plan = effectivePlan();
  if(!plan || plan==="master") return true;
  var f = access.features[plan] || {};
  return f[feature]!==false;
}
function featureBlocked(){ toast("この機能は、今のプランでは使えません"); }
async function loadAccess(){
  if(!sb || !cloud.user) return;
  var uid = cloud.user.id;
  try{
    var pr = await sb.from("oshikatsu_profiles").select("plan").eq("user_id", uid).limit(1);
    if(pr.error) throw pr.error;
    var fr = await sb.from("oshikatsu_plan_features").select("plan,feature,enabled");
    if(fr.error) throw fr.error;
    if(!cloud.user || cloud.user.id!==uid) return;
    var feats = {paid:{}, free:{}};
    (fr.data||[]).forEach(function(r){ if(feats[r.plan]) feats[r.plan][r.feature] = !!r.enabled; });
    var before = JSON.stringify([access.plan, access.features]);
    access = {plan:(pr.data && pr.data[0] && pr.data[0].plan) || "free", features:feats, loaded:true};
    try{ localStorage.setItem(accessKey(), JSON.stringify({plan:access.plan, features:access.features})); }catch(e){}
    if(JSON.stringify([access.plan, access.features])!==before) render();
  }catch(e){
    console.warn("plan load failed", e);   // 表がまだ無いときなど：全部使える
  }
}
// 使えない機能のタブは隠し、そのタブを開いていたらホームへ
function applyFeatureGates(){
  var tabFeature = {cheki:"cheki", goods:"goods", stats:"stats"};
  document.querySelectorAll("nav.tabs button").forEach(function(b){
    var f = tabFeature[b.getAttribute("data-view")];
    b.style.display = (f && !canUse(f)) ? "none" : "";
  });
  if(tabFeature[state.view] && !canUse(tabFeature[state.view])) state.view = "home";
  if(state.view==="admin" && !isMaster()) state.view = "oshi";
  if(state.view==="catalog" && !canUse("setlist")) state.view = "oshi";
  // 切り替え中は、画面の上に「○○の表示を確認中」を出す
  var pv = previewPlan(), bar = document.getElementById("previewBar");
  if(pv){
    if(!bar){
      bar = document.createElement("div");
      bar.id = "previewBar";
      bar.className = "preview-bar";
      bar.addEventListener("click", onAppClick);   // 画面の外（body）に置くので、ここでも押した操作を受ける
      document.body.appendChild(bar);
    }
    bar.innerHTML = '<span>「'+PLAN_LABEL[pv]+'」の表示を確認中</span><button type="button" data-action="preview-plan" data-plan="master">マスターに戻す</button>';
    bar.hidden = false;
  } else if(bar){ bar.hidden = true; }
}

/* ユーザー管理（マスターだけ）：種類ごとの機能のON/OFFと、ユーザーの種類の変更 */
var adminUsers = null, adminLoading = false;
function renderAdminPage(){
  var html = '<div class="page-head"><h1 class="mincho">ユーザー管理</h1><p>アカウントの種類ごとに使える機能を決め、ユーザーの種類を変更します。マスターはすべての機能を使えます。</p></div>';
  html += '<div class="section-label">機能の設定</div>'
    + '<div class="plan-table">'
    +   '<div class="plan-row plan-head"><span class="plan-f">機能</span><span>有料</span><span>無料</span></div>'
    +   PLAN_FEATURES.map(function(f){
          function sw(plan){
            var on = (access.features[plan]||{})[f.id]!==false;
            return '<button type="button" class="plan-switch'+(on?' on':'')+'" data-action="toggle-feature" data-plan="'+plan+'" data-feature="'+f.id+'" role="switch" aria-checked="'+(on?'true':'false')+'" aria-label="'+escapeHtml(PLAN_LABEL[plan]+"："+f.label)+'"><i></i></button>';
          }
          return '<div class="plan-row"><span class="plan-f"><b>'+escapeHtml(f.label)+'</b>'+(f.note?'<small>'+escapeHtml(f.note)+'</small>':'')+'</span>'+sw("paid")+sw("free")+'</div>';
        }).join("")
    + '</div>';
  html += '<div class="section-label">ユーザー</div>';
  if(!adminUsers){
    html += '<p class="rs-note">ユーザーを読み込んでいます…</p>';
    loadAdminUsers();
  } else {
    html += '<div class="account-list">' + adminUsers.map(function(u){
      var me = cloud.user && u.user_id===cloud.user.id;
      return '<div class="account-row"><span class="account-row-value admin-email">'+escapeHtml(u.email||u.user_id)+(me?'<small class="account-row-sub">あなた</small>':'')+'</span>'
        + '<select class="admin-plan" data-user="'+escapeHtml(u.user_id)+'" aria-label="アカウントの種類">'
        + ["master","paid","free"].map(function(p){ return '<option value="'+p+'"'+(u.plan===p?' selected':'')+'>'+PLAN_LABEL[p]+'</option>'; }).join("")
        + '</select></div>';
    }).join("") + '</div>';
  }
  html += '<button type="button" class="btn ghost block" data-action="goto-mypage" style="margin-top:18px;">マイページへ戻る</button>';
  document.getElementById("main").innerHTML = html;
  document.querySelectorAll(".admin-plan").forEach(function(sel){
    sel.addEventListener("change", function(){ setUserPlan(sel.getAttribute("data-user"), sel.value, sel); });
  });
}
async function loadAdminUsers(){
  if(adminLoading || !sb) return;
  adminLoading = true;
  try{
    var r = await sb.from("oshikatsu_profiles").select("user_id,email,plan,created_at").order("created_at", {ascending:true});
    if(r.error) throw r.error;
    adminUsers = r.data || [];
  }catch(e){
    console.warn("admin users load failed", e);
    adminUsers = [];
    toast("ユーザーを読み込めませんでした");
  }finally{
    adminLoading = false;
  }
  if(state.view==="admin") render();
}
async function setUserPlan(userId, plan, sel){
  var u = (adminUsers||[]).find(function(x){ return x.user_id===userId; });
  if(!u || u.plan===plan) return;
  var me = cloud.user && userId===cloud.user.id;
  if(!realMaster()) return;
  if(me && plan!=="master"){
    var masters = adminUsers.filter(function(x){ return x.plan==="master"; }).length;
    if(masters<=1){ toast("マスターが1人もいなくなるため変更できません"); sel.value = u.plan; return; }
    if(!confirm("自分をマスターから外すと、ユーザー管理を使えなくなります。変更しますか？")){ sel.value = u.plan; return; }
  }
  try{
    var r = await sb.from("oshikatsu_profiles").update({plan:plan, updated_at:new Date().toISOString()}).eq("user_id", userId);
    if(r.error) throw r.error;
    u.plan = plan;
    toast((u.email||"ユーザー")+" を「"+PLAN_LABEL[plan]+"」にしました");
    if(me){ await loadAccess(); render(); }
  }catch(e){
    console.warn("plan update failed", e);
    sel.value = u.plan;
    toast("変更できませんでした");
  }
}
async function toggleFeature(plan, feature){
  if(!realMaster()) return;
  var cur = (access.features[plan]||{})[feature]!==false;
  var next = !cur;
  access.features[plan] = access.features[plan] || {};
  access.features[plan][feature] = next;
  render();
  try{
    var r = await sb.from("oshikatsu_plan_features").upsert({plan:plan, feature:feature, enabled:next, updated_at:new Date().toISOString()}, {onConflict:"plan,feature"});
    if(r.error) throw r.error;
    try{ localStorage.setItem(accessKey(), JSON.stringify({plan:access.plan, features:access.features})); }catch(e){}
  }catch(e){
    console.warn("feature update failed", e);
    access.features[plan][feature] = cur;
    render();
    toast("変更できませんでした");
  }
}

function render(){
  var app = document.getElementById("app");
  app.classList.remove("booting");
  var gated = !cloud.user;
  app.classList.toggle("auth-gate", gated);
  if(gated){
    applyTheme(null);
    app.classList.add("no-oshi");
    document.getElementById("topChip").style.display = "none";
    closeSheet();
    renderAuthGate();
    return;
  }
  var oshi = activeOshi();
  applyTheme(oshi);
  app.classList.toggle("no-oshi", !oshi);

  var chip = document.getElementById("topChip");
  if(oshi){
    chip.style.display="flex";
    var topDot = document.getElementById("topDot");
    applyOshiSwatch(topDot, oshi);
    document.getElementById("topName").textContent = oshi.name;
  } else {
    chip.style.display="none";
  }
  renderTopChipMenu();
  refreshHeaderLogo();

  applyFeatureGates();
  updateNewsDot();
  document.querySelectorAll("nav.tabs button").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-view")===state.view || ((state.view==="admin" || state.view==="catalog") && b.getAttribute("data-view")==="oshi"));
  });

  if(state.view==="home") renderHome();
  else if(state.view==="admin") renderAdminPage();
  else if(state.view==="catalog") renderCatalogPage();
  else if(state.view==="oshi") renderOshiPage();
  else if(state.view==="oshis") renderOshisPage();
  else if(state.view==="stats") renderStatsPage();
  else renderListPage(state.view);
  DrivePhotos.afterRender();   // Googleドライブの写真を入れる
}

/* .photo-menu popovers are position:fixed (viewport-relative) so that any
   scrollable or clipping ancestor can never clip or misplace them. Since
   "fixed" ignores document flow entirely, JS has to place them itself, next
   to whichever icon/button opened them, clamped so they never run off the
   right edge of the screen. */
/* ＋ボタン（FAB）の移動：押したまま8px以上動かすとドラッグになり、離した位置に置く。
   位置は画面の幅・高さに対する割合で端末に保存し（oshikatsu_fab_pos）、画面の大きさが変わっても画面内に収める。
   動かさずに離したときは、これまでどおり記録の追加を開く。 */
var FAB_POS_KEY = "oshikatsu_fab_pos";
var fabJustDragged = false;
function fabBounds(fab){
  var m = 8, w = fab.offsetWidth || 52, h = fab.offsetHeight || 52;
  var app = document.getElementById("app"), r = app ? app.getBoundingClientRect() : null;
  var left = m, right = window.innerWidth - w - m;
  if(r && r.width < window.innerWidth - 1){ left = Math.max(m, r.left + m); right = Math.min(right, r.right - w - m); }
  // 下のタブの上まで（起動中でタブがまだ出ていないときは、タブの高さを見込む）
  var nav = document.querySelector("nav.tabs"), navTop = nav ? nav.getBoundingClientRect().top : 0;
  if(!(navTop > h)) navTop = window.innerHeight - 72;
  var bottom = navTop - h - m;
  return {minX:left, maxX:Math.max(left, right), minY:m, maxY:Math.max(m, bottom)};
}
function placeFab(fab, x, y){
  var b = fabBounds(fab);
  x = clamp(x, b.minX, b.maxX); y = clamp(y, b.minY, b.maxY);
  fab.classList.add("moved");
  fab.style.left = x + "px";
  fab.style.top = y + "px";
  return {x:x, y:y};
}
function applySavedFabPos(fab){
  var p = readStored(FAB_POS_KEY);
  if(!p || typeof p.rx!=="number" || typeof p.ry!=="number"){ fab.classList.remove("moved"); fab.style.left = fab.style.top = ""; return; }
  placeFab(fab, p.rx * window.innerWidth, p.ry * window.innerHeight);
}
function bindFabDrag(fab){
  if(!fab) return;
  var start = null, dragging = false, offX = 0, offY = 0;
  fab.addEventListener("pointerdown", function(e){
    if(e.button!==undefined && e.button!==0) return;
    var r = fab.getBoundingClientRect();
    start = {x:e.clientX, y:e.clientY, id:e.pointerId};
    offX = e.clientX - r.left; offY = e.clientY - r.top;
    dragging = false;
    // 指がボタンの外へ出ても動きを受け取れるようにする
    try{ fab.setPointerCapture(e.pointerId); }catch(err){}
  });
  fab.addEventListener("pointermove", function(e){
    if(!start || e.pointerId!==start.id) return;
    if(!dragging){
      if(Math.abs(e.clientX-start.x) + Math.abs(e.clientY-start.y) < 8) return;
      dragging = true;
      fab.classList.add("dragging");
    }
    e.preventDefault();
    placeFab(fab, e.clientX - offX, e.clientY - offY);
  });
  function end(e){
    if(!start || (e && e.pointerId!==start.id)) return;
    start = null;
    if(!dragging) return;
    dragging = false;
    fab.classList.remove("dragging");
    fabJustDragged = true;
    setTimeout(function(){ fabJustDragged = false; }, 400);
    var r = fab.getBoundingClientRect();
    try{ localStorage.setItem(FAB_POS_KEY, JSON.stringify({rx:r.left/window.innerWidth, ry:r.top/window.innerHeight})); }catch(err){}
  }
  fab.addEventListener("pointerup", end);
  fab.addEventListener("pointercancel", end);
  fab.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  window.addEventListener("resize", function(){ applySavedFabPos(fab); });
  applySavedFabPos(fab);
}
function openPopoverNear(anchorEl, popEl){
  popEl.style.display = "block";
  var rect = anchorEl.getBoundingClientRect();
  var popWidth = popEl.offsetWidth || 200;
  var left = Math.min(rect.left, window.innerWidth - popWidth - 12);
  left = Math.max(12, left);
  var top = rect.bottom + 8;
  var popHeight = popEl.offsetHeight || 0;
  if(top + popHeight > window.innerHeight - 12){ top = Math.max(12, rect.top - popHeight - 8); }
  popEl.style.left = left + "px";
  popEl.style.top = top + "px";
}
/* Popovers are fixed to the viewport, so if the sheet scrolls underneath
   one while it's open, it would stay floating in place, detached from the
   icon that opened it. Closing on scroll avoids that. */
function closePopoversOnSheetScroll(){
  if(!sheetEl) return;
  sheetEl.querySelectorAll(".photo-menu").forEach(function(m){ m.style.display = "none"; });
}

/* セットリスト（LIVE）：対バンを考えて、アーティストごとに分ける。
   記録には setlists = [{artist:"出演アーティスト", items:[{t:"song", title:"曲名", artist:"曲のアーティスト"} | {t:"mc", note:"メモ"} | {t:"se", note:"メモ"}]}] として持つ。
   MC・SE（登場曲・転換などの音源）は番号を付けず、曲数にも数えない。
   曲は「曲名／アーティスト名」で登録する（ほかのアーティストの曲を歌うこともあるため。空なら出演アーティストの曲）。
   以前の setlist（曲名の配列）は、そのLIVEのグループを1組目として読み替える（recSetlists）。
   アーティスト名・曲名は、自分が登録した値（推しのグループ・ほかのLIVEのセットリスト）を入力候補に出す（同じアカウントのどの端末でも同じ） */
function recSetlists(r){
  if(r && Array.isArray(r.setlists)) return r.setlists.filter(function(b){ return b && Array.isArray(b.items); });
  if(r && Array.isArray(r.setlist) && r.setlist.length){
    var names = liveArtistNames(r);
    return [{artist:names[0] || "", items:r.setlist.map(function(t){ return {t:"song", title:t}; })}];
  }
  return [];
}
function setlistSongCount(r){
  return recSetlists(r).reduce(function(n, b){ return n + b.items.filter(function(it){ return it.t==="song"; }).length; }, 0);
}
// そのLIVEの出演グループ名（グループのない推しは人物名）
function liveArtistNames(r){
  var seen = {}, out = [];
  recOshiEntries(r).forEach(function(e){
    var o = getOshi(e.oshiId);
    if(!o) return;
    var gs = oshiGroupsList(o);
    var g = gs.find(function(x){ return x.id===e.groupId; }) || gs[0];
    var name = (g && g.name) || o.name;
    if(name && !seen[name]){ seen[name] = true; out.push(name); }
  });
  return out;
}
// 入力候補：アーティスト名（推しのグループ・人物名と、登録済みのセットリスト）
function setlistArtistOptions(){
  var seen = {}, out = [];
  function add(v){ v = (v||"").trim(); if(v && !seen[v]){ seen[v] = true; out.push(v); } }
  state.oshis.forEach(function(o){ oshiGroupsList(o).forEach(function(g){ add(g.name); }); if(!oshiGroupsList(o).length) add(o.name); });
  state.live.forEach(function(r){ recSetlists(r).forEach(function(b){ add(b.artist); b.items.forEach(function(it){ if(it.t==="song") add(it.artist); }); }); });
  (state.artists||[]).forEach(function(a){ add(a.name); });
  (state.songs||[]).forEach(function(x){ add(x.artist); });
  return out.sort(function(a,b){ return a.localeCompare(b, "ja"); });
}
// 曲のアーティスト（未入力なら出演アーティスト）
function songArtist(it, block){ return ((it && it.artist) || (block && block.artist) || "").trim(); }
function songLabel(it, block){ var a = songArtist(it, block); return (it.title||"") + (a ? "／"+a : ""); }
// 登録済みの曲の一覧（曲名＋アーティスト名。歌った回数の多い順）
function setlistSongCatalog(){
  var map = {};
  state.live.forEach(function(r){
    recSetlists(r).forEach(function(b){
      b.items.forEach(function(it){
        var t = (it.title||"").trim();
        if(it.t!=="song" || !t) return;
        var a = songArtist(it, b), k = t.toLowerCase()+"\u0000"+a.toLowerCase();
        if(!map[k]) map[k] = {title:t, artist:a, n:0};
        map[k].n++;
      });
    });
  });
  // マイページで登録した曲（まだ歌っていない曲は 0回）
  (state.songs||[]).forEach(function(x){
    var t = (x.title||"").trim(), a = (x.artist||"").trim();
    if(!t) return;
    var k = t.toLowerCase()+"\u0000"+a.toLowerCase();
    if(!map[k]) map[k] = {title:t, artist:a, n:0};
    map[k].id = x.id;
  });
  return Object.keys(map).map(function(k){ return map[k]; })
    .sort(function(x, y){ return y.n - x.n || x.title.localeCompare(y.title, "ja"); });
}
// 曲・アーティストを登録する（同じものがあれば何もしない）。入力候補と「曲を探す」に出る
function registerSong(title, artist){
  title = (title||"").trim(); artist = (artist||"").trim();
  if(!title) return false;
  var dup = (state.songs||[]).some(function(x){ return (x.title||"").trim().toLowerCase()===title.toLowerCase() && (x.artist||"").trim().toLowerCase()===artist.toLowerCase(); });
  if(dup) return false;
  state.songs.push({id:uuid(), title:title, artist:artist, createdAt:Date.now()});
  if(artist) registerArtist(artist, true);
  saveLocal();
  return true;
}
function registerArtist(name, quiet){
  name = (name||"").trim();
  if(!name) return false;
  var dup = (state.artists||[]).some(function(a){ return (a.name||"").trim().toLowerCase()===name.toLowerCase(); });
  if(dup) return false;
  state.artists.push({id:uuid(), name:name, createdAt:Date.now()});
  if(!quiet) saveLocal();
  return true;
}
// 入力候補：曲名（そのアーティストの曲を先に。アーティストが空ならすべての曲）
function setlistSongOptions(artist){
  artist = (artist||"").trim().toLowerCase();
  var seen = {}, first = [], rest = [];
  setlistSongCatalog().forEach(function(s){
    if(seen[s.title]) return;
    seen[s.title] = true;
    (artist && s.artist.toLowerCase()===artist ? first : rest).push(s.title);
  });
  return artist ? first.concat(rest) : first.concat(rest);
}
/* 曲を探す（会場の「探す」と同じように）：登録済みの曲から選ぶか、無ければ新しく登録する */

  function draw(){

    list.innerHTML = hits.length

      : '<p class="song-picker-empty">'+(catalog.length ? '登録済みの曲に見つかりません' : 'まだ登録した曲がありません')+'</p>';
    nt.value = q.value.trim() ? q.value.trim() : nt.value;
  }
  draw();

  wrap.querySelector(".song-picker-add").addEventListener("click", function(){

    close();
    registerSong(t, na.value.trim());
    opts.onPick(t, na.value.trim());
    toast("「"+t+(na.value.trim() ? "／"+na.value.trim() : "")+"」を登録しました");
  });
  wrap.querySelector(".song-picker-close").addEventListener("click", close);
  wrap.addEventListener("click", function(e){ if(e.target===wrap) close(); });
  setTimeout(function(){ q.focus(); }, 50);

function setlistFieldHtml(){

    + '<p class="sl2-hint">曲名を入れてEnterで追加。ほかのアーティストの曲は、左のアーティスト名を押して選びます。曲は押すと直せ、左端のつまみをドラッグするか、曲を長押ししてから動かすと並べ替えられます。</p>'
    + '</div>';
}
/* セットリストの入力：アーティストの枠ごとに、下の入力欄で曲名を打ってEnter／候補を押すと追加する。
   追加した曲はコンパクトな1行で並び、押すとその行だけ入力欄になって直せる。MC・SEはボタンで追加。
   「まとめて入力」で複数行を貼り付け・入力して取り込める。 */
function parseSetlistLine(l, blockArtist){
  l = (l||"").trim();
  if(!l) return null;
  if(/^MC\s*[\d:：.．]*\s*$/i.test(l) || /^MC[\s:：]/i.test(l)) return {t:"mc", title:"", artist:"", note:l.replace(/^MC\s*[\d:：.．]*\s*/i, "")};
  if(/^SE\s*[\d:：.．]*\s*$/i.test(l) || /^SE[\s:：]/i.test(l)) return {t:"se", title:"", artist:"", note:l.replace(/^SE\s*[\d:：.．]*\s*/i, "")};
  var body = l.replace(/^\s*(?:\d+[.)．、:：]?|M\d+[.:：]?|EN\d*[.:：]?)\s*/i, "").trim();
  var m = body.match(/^(.+?)\s*(?:／|\s\/\s)\s*(.+)$/);
  var title = m ? m[1].trim() : body, artist = m ? m[2].trim() : "";
  if(artist && artist.toLowerCase()===(blockArtist||"").trim().toLowerCase()) artist = "";
  return title ? {t:"song", title:title, artist:artist, note:""} : null;
}
/* 曲のアーティストを選ぶ（検索して選ぶ・新しく入れる）。選ぶと、そのアーティストの曲が候補に出る */
function openArtistPicker(opts){
  var old = document.getElementById("songPicker");
  if(old) old.remove();
  var list = catalogArtistList();
  var wrap = document.createElement("div");
  wrap.id = "songPicker";
  wrap.className = "song-picker-bg";
  wrap.innerHTML = '<div class="song-picker" role="dialog" aria-label="'+escapeHtml(opts.title || "曲のアーティストを選ぶ")+'">'
    + '<div class="song-picker-head"><b>'+escapeHtml(opts.title || "曲のアーティストを選ぶ")+'</b><button type="button" class="song-picker-close" aria-label="閉じる">×</button></div>'
    + '<input type="search" class="song-picker-q" placeholder="アーティスト名で検索" autocomplete="off">'
    + '<div class="song-picker-list"></div>'
    + '</div>';
  document.body.appendChild(wrap);
  var q = wrap.querySelector(".song-picker-q"), box = wrap.querySelector(".song-picker-list");
  function close(){ wrap.remove(); }
  function norm(v){ return (v||"").toLowerCase().replace(/\s+/g, ""); }
  function draw(){
    var k = norm(q.value), v = q.value.trim();
    var hits = list.filter(function(a){ return !k || norm(a.name).indexOf(k)>=0; }).slice(0, 60);
    var exact = list.some(function(a){ return norm(a.name)===k; });
    var html = '';
    if(opts.self) html += '<button type="button" class="song-picker-item" data-name=""><span class="t">'+escapeHtml(opts.self)+'</span><span class="a">（出演アーティスト）</span></button>';
    html += hits.filter(function(a){ return a.name!==opts.self; }).map(function(a){
      var cur = opts.current && norm(opts.current)===norm(a.name);
      return '<button type="button" class="song-picker-item'+(cur ? ' cur' : '')+'" data-name="'+escapeHtml(a.name)+'"><span class="t">'+escapeHtml(a.name)+'</span><span class="a">'+(cur ? '選択中' : '')+'</span><span class="c">'+a.songs+'曲</span></button>';
    }).join("");
    if(v && !exact) html += '<button type="button" class="song-picker-item new" data-name="'+escapeHtml(v)+'"><span class="t">＋ 「'+escapeHtml(v)+'」を使う</span><span class="a">新しいアーティスト</span></button>';
    box.innerHTML = html || '<p class="song-picker-empty">アーティスト名を入れてください</p>';
  }
  draw();
  q.addEventListener("input", draw);
  q.addEventListener("keydown", function(e){
    if(e.key!=="Enter" || e.isComposing || e.keyCode===229) return;
    e.preventDefault();
    // 当てはまるアーティストがあれば先頭を、無ければ「新しく使う」を選ぶ
    var items = Array.prototype.slice.call(box.querySelectorAll(".song-picker-item"));
    var hit = items.filter(function(x){ return !x.classList.contains("new") && x.getAttribute("data-name"); })[0];
    var pick = hit || box.querySelector(".song-picker-item.new") || items[0];
    if(pick) pick.click();
  });
  box.addEventListener("click", function(e){
    var b = e.target.closest(".song-picker-item");
    if(!b) return;
    var name = b.getAttribute("data-name");
    if(b.classList.contains("new")) registerArtist(name);
    close();
    opts.onPick(name);
  });
  wrap.querySelector(".song-picker-close").addEventListener("click", close);
  wrap.addEventListener("click", function(e){ if(e.target===wrap) close(); });
  setTimeout(function(){ q.focus(); }, 50);
}
function bindSetlistField(form, rec, defaultArtists){
  var box = form.querySelector("#setlistEdit");
  if(!box) return null;
  var blocks = recSetlists(rec).map(function(b){ return {artist:b.artist||"", q:"", sa:"", bulk:false, items:b.items.map(function(it){ return {t:(it.t==="mc" || it.t==="se") ? it.t : "song", title:it.title||"", artist:it.artist||"", note:it.note||""}; })}; });
  var artistList = setlistArtistOptions();
  var editing = null;   // {b, i}：入力欄にしている行
  function kindLabel(t){ return t==="se" ? "SE" : "MC"; }
  // 画面の入力内容を blocks に読み戻す
  function readInputs(){
    Array.prototype.forEach.call(box.querySelectorAll(".setlist-block"), function(bl, bi){
      var b = blocks[bi];
      if(!b) return;
      b.artist = bl.querySelector(".setlist-artist").value;
      var q = bl.querySelector(".setlist-quick"); if(q) b.q = q.value;
      var bt = bl.querySelector(".setlist-bulk-text"); if(bt) b.bulkText = bt.value;
      var er = bl.querySelector(".setlist-row.editing");
      if(er && editing && editing.b===bi){
        var it = b.items[editing.i];
        if(it){
          if(it.t==="song"){ it.title = er.querySelector(".setlist-song-title").value; it.artist = er.querySelector(".setlist-song-artist").value; }
          else it.note = er.querySelector("input").value;
        }
      }
    });
  }
  // 候補：何も打っていなければ、このアーティストの曲でまだ入れていないもの。打っていれば曲名・アーティスト名で探す
  // 候補は「曲のアーティスト」（選んでいなければ出演アーティスト）の曲。打つとその中で曲名を探す
  function suggestions(b){
    var k = (b.q||"").trim().toLowerCase().replace(/\s+/g, "");
    var a = (b.sa || b.artist || "").trim().toLowerCase();
    var used = {};
    b.items.forEach(function(it){ if(it.t==="song") used[(it.title||"").trim().toLowerCase()+"\u0000"+songArtist(it, b).toLowerCase()] = true; });
    return setlistSongCatalog().filter(function(x){
      if(used[x.title.toLowerCase()+"\u0000"+x.artist.toLowerCase()]) return false;
      if(a && x.artist.toLowerCase()!==a) return false;
      return !k || x.title.toLowerCase().replace(/\s+/g, "").indexOf(k)>=0;
    }).slice(0, 12);
  }
  function chipsHtml(b, bi){
    var list = suggestions(b);
    var sa = (b.sa||"").trim();
    if(!list.length) return (b.q||"").trim() ? '<span class="setlist-chip-note">Enterで「'+escapeHtml(b.q.trim())+(sa ? '／'+escapeHtml(sa) : '')+'」を追加</span>' : (sa ? '<span class="setlist-chip-note">'+escapeHtml(sa)+'の曲の候補はありません。曲名を入れてEnterで追加</span>' : '');
    return list.map(function(x){
      var same = x.artist.toLowerCase()===(b.artist||"").trim().toLowerCase();
      return '<button type="button" class="setlist-chip" data-sl-chip="'+bi+'" data-title="'+escapeHtml(x.title)+'" data-artist="'+escapeHtml(same ? "" : x.artist)+'">'+escapeHtml(x.title)+(same ? '' : '<small>／'+escapeHtml(x.artist)+'</small>')+'</button>';
    }).join("");
  }
  function rowHtml(b, bi, it, ii, no){
    var isEx = it.t!=="song";

    if(focus){

        : focus.what==="artist" ? bl.querySelector(".setlist-artist")

  function addItems(bi, items){
    // 「曲のアーティスト」を選んでいれば、アーティスト名を書いていない曲はそのアーティストの曲にする

  function addBlock(){
    readInputs();
    var used = {};
    blocks.forEach(function(b){ used[(b.artist||"").trim()] = true; });
    var name = (defaultArtists() || []).filter(function(n){ return !used[n]; })[0] || "";
    blocks.push({artist:name, q:"", sa:"", bulk:false, items:[]});
    editing = null;
    draw({b:blocks.length-1, what:name ? "quick" : "artist"});
  }

      readInputs();

        fit.title = title;
        fit.artist = (artist && artist!==(b.artist||"").trim()) ? artist : "";
        if(artist && artistList.indexOf(artist)<0) artistList.push(artist);
        editing = null;
        draw();
      }});
    } else if(t.closest("[data-sl-add]")){
      readInputs();

    } else if(t.closest("[data-sl-bulk]")){
      readInputs(); b.bulk = true; draw({b:bi, what:"bulk"});

    } else if(t.closest("[data-sl-bulk-add]")){
      readInputs();
      var lines = (b.bulkText||"").split(/\r?\n/).map(function(l){ return parseSetlistLine(l, b.artist); }).filter(Boolean);
      b.bulk = false; b.bulkText = "";
      addItems(bi, lines);
      if(lines.length) toast(lines.length+"行を取り込みました");
    } else if(t.closest("[data-sl-done]")){
      readInputs(); editing = null; draw({b:bi, what:"quick"});
    } else if(t.closest("[data-sl-del]")){
      readInputs();

    } else if(t.closest("[data-sl-del-block]")){
      readInputs();
      var filled = b.items.length;
      if(filled && !confirm("「"+(b.artist||"このアーティスト")+"」のセットリストを削除しますか？")) return;

      readInputs();
      var to = bi + Number(t.closest("[data-sl-move]").getAttribute("data-dir"));

      var mv = blocks.splice(bi, 1)[0]; blocks.splice(to, 0, mv);

      draw({b:bi, what:"edit"});

  // 打つたびに候補を更新する（入力欄はそのまま）

  /* 並べ替え（同じアーティストの中）：左のつまみを押したまま、または行を長押ししてから上下に動かす。
     動かしている間はほかの行がよけて入る位置を見せ、画面の端に近づくと自動でスクロールする */
  function scrollParentOf(el){
    for(var n = el.parentElement; n && n!==document.body; n = n.parentElement){
      var oy = getComputedStyle(n).overflowY;
      if((oy==="auto" || oy==="scroll") && n.scrollHeight > n.clientHeight) return n;
    }
    return document.scrollingElement || document.documentElement;
  }
  function beginDrag(row, pointerId, clientY){
    readInputs();
    var list = row.closest(".setlist-edit"), bi = Number(row.closest(".setlist-block").getAttribute("data-b"));
    var rows = Array.prototype.slice.call(list.querySelectorAll(".setlist-row"));
    var from = rows.indexOf(row), to = from;
    if(from<0) return;
    var sc = scrollParentOf(list), isDoc = sc===document.scrollingElement || sc===document.documentElement;
    var scTop0 = sc.scrollTop, py0 = clientY + scTop0, lastY = clientY;
    var centers = rows.map(function(r){ var b = r.getBoundingClientRect(); return b.top + b.height/2 + scTop0; });
    var rh = row.getBoundingClientRect().height;
    var raf = 0, speed = 0;
    list.classList.add("sorting");
    row.classList.add("dragging");
    suppressClick = true;
    if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(err){} }
    function update(){
      var dy = lastY + sc.scrollTop - py0;
      row.style.transform = "translateY("+dy+"px)";
      var c = centers[from] + dy;
      to = from;
      for(var k=0;k<rows.length;k++){
        if(k>from && centers[k] < c) to = k;
        if(k<from && centers[k] > c && to===from) to = k;
      }
      rows.forEach(function(r, k){
        if(r===row) return;
        var shift = (from<to && k>from && k<=to) ? -rh : (to<from && k>=to && k<from) ? rh : 0;
        r.style.transform = shift ? "translateY("+shift+"px)" : "";
      });
    }
    function tick(){
      if(!speed){ raf = 0; return; }
      sc.scrollTop += speed;
      update();
      raf = requestAnimationFrame(tick);
    }
    function onMove(ev){
      if(ev.pointerId!==pointerId) return;
      ev.preventDefault();
      lastY = ev.clientY;
      var top = isDoc ? 0 : sc.getBoundingClientRect().top, bottom = isDoc ? window.innerHeight : sc.getBoundingClientRect().bottom, edge = 70;
      // 端に向かって動かしたときだけスクロールする（端の近くの行をつかんだだけでは動かさない）
      speed = (lastY < top+edge && lastY < clientY-12) ? -Math.ceil((top+edge-lastY)/6)
        : (lastY > bottom-edge && lastY > clientY+12) ? Math.ceil((lastY-bottom+edge)/6) : 0;
      if(speed && !raf) raf = requestAnimationFrame(tick);
      update();
    }
    function onTouchMove(ev){ ev.preventDefault(); }   // 動かしている間は画面をスクロールさせない
    function onUp(ev){
      if(ev.pointerId!==pointerId) return;
      if(ev.type==="pointerup"){ lastY = ev.clientY; update(); }   // 指を離した位置で入る場所を決める
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
      document.removeEventListener("touchmove", onTouchMove);
      if(raf) cancelAnimationFrame(raf);
      speed = 0;
      list.classList.remove("sorting");
      row.classList.remove("dragging");
      rows.forEach(function(r){ r.style.transform = ""; });
      var items = blocks[bi].items;
      if(to!==from){ var v = items.splice(from, 1)[0]; items.splice(to, 0, v); editing = null; }
      draw();
      setTimeout(function(){ suppressClick = false; }, 300);
    }
    window.addEventListener("pointermove", onMove, {passive:false});
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    document.addEventListener("touchmove", onTouchMove, {passive:false});
  }
  box.addEventListener("pointerdown", function(e){
    if(e.button!==undefined && e.button!==0) return;
    var row = e.target.closest(".setlist-row");
    if(!row || row.classList.contains("editing") || row.closest(".setlist-edit").classList.contains("sorting")) return;
    // つまみ：すぐに動かせる
    if(e.target.closest(".setlist-grip")){
      e.preventDefault();
      beginDrag(row, e.pointerId, e.clientY);
      return;
    }
    // 行の長押し（タッチ）：0.35秒そのまま押すと動かせる。先に指が動いたら画面のスクロール
    if(e.pointerType==="mouse" || e.target.closest("button, input")) return;
    var pid = e.pointerId, sx = e.clientX, sy = e.clientY, lastY = e.clientY;
    var timer = setTimeout(function(){ cancel(); beginDrag(row, pid, lastY); }, 350);
    function onMove(ev){ if(ev.pointerId!==pid) return; lastY = ev.clientY; if(Math.abs(ev.clientX-sx)>8 || Math.abs(ev.clientY-sy)>8) cancel(); }
    function cancel(){
      clearTimeout(timer);
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", cancel);
      window.removeEventListener("pointercancel", cancel);
    }
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", cancel);
    window.addEventListener("pointercancel", cancel);
  });
  // 長押しで出る文字選択・メニューを出さない
  box.addEventListener("contextmenu", function(e){ if(e.target.closest(".setlist-row.compact")) e.preventDefault(); });
  return {
    values:function(){
      readInputs();
      return blocks.map(function(b){
        // 曲名の欄に打ったまま追加していない曲も入れる
        var items = b.items.slice();
        var pending = parseSetlistLine(b.q, b.artist);
        if(pending){ if(pending.t==="song" && !pending.artist && b.sa) pending.artist = b.sa; items.push(pending); }
        return {artist:(b.artist||"").trim(), items:items.map(function(it){
          if(it.t==="mc" || it.t==="se") return {t:it.t, note:(it.note||"").trim()};
          var a = (it.artist||"").trim();
          var song = {t:"song", title:(it.title||"").trim()};
          if(a && a!==(b.artist||"").trim()) song.artist = a;
          return song;
        }).filter(function(it){ return it.t==="mc" || it.t==="se" || it.title; })};
      }).filter(function(b){ return b.items.length; });
    },
    ensureStarted:function(){ if(!blocks.length) addBlock(); else draw({b:0, what:"quick"}); }
  };
}

  {id:"ytmusic", label:"YouTube Music", icon:"<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"7.5\"/><path class=\"f\" d=\"M10.2 9l5 3-5 3z\"/></svg>", color:"#FF0033", url:function(q){ return "https://music.youtube.com/search?q="+encodeURIComponent(q); }},

function normMusicApps(v){
  if(!Array.isArray(v)) return null;
  return MUSIC_APPS.map(function(a){ return a.id; }).filter(function(id){ return v.indexOf(id)>=0; });
}
function enabledMusicApps(){
  var ids = state.musicApps;
  return MUSIC_APPS.filter(function(a){ return !ids || ids.indexOf(a.id)>=0; });
}
var LISTEN_ICON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5.5 3.5-5.5 3.5z"/></svg>';
function listenBtnHtml(title, artist){
  if(!enabledMusicApps().length) return '';
  return '<button type="button" class="listen-btn" data-action="listen" data-lt="'+escapeHtml(title)+'" data-la="'+escapeHtml(artist||"")+'" title="音楽アプリで聴く" aria-label="「'+escapeHtml(title)+'」を音楽アプリで聴く">'+LISTEN_ICON+'</button>';
}
function musicAppIcon(a){ return '<span class="music-ic" style="background:'+a.color+'">'+(a.icon || escapeHtml(a.short))+'</span>'; }
// 聴くアプリを選ぶ（1つだけ選んでいるときはすぐ開く）
function openListen(title, artist){
  var apps = enabledMusicApps();
  if(!apps.length){ toast("マイページで音楽アプリを選んでください"); return; }
  var q = (title + (artist ? " " + artist : "")).trim();
  if(apps.length===1){ window.open(apps[0].url(q), "_blank", "noopener"); return; }
  var old = document.getElementById("listenPicker");
  if(old) old.remove();
  var wrap = document.createElement("div");
  wrap.id = "listenPicker";
  wrap.className = "song-picker-bg";
  wrap.innerHTML = '<div class="song-picker listen-picker" role="dialog" aria-label="音楽アプリで聴く">'
    + '<div class="song-picker-head"><b>音楽アプリで聴く</b><button type="button" class="song-picker-close" aria-label="閉じる">×</button></div>'
    + '<p class="listen-q">'+escapeHtml(title)+(artist ? '<span>／'+escapeHtml(artist)+'</span>' : '')+'</p>'
    + '<div class="listen-apps">'+apps.map(function(a){
        return '<a class="listen-app" href="'+escapeHtml(a.url(q))+'" target="_blank" rel="noopener">'+musicAppIcon(a)+'<span>'+escapeHtml(a.label)+'</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a>';
      }).join("")+'</div>'
    + '<p class="listen-note">アプリの検索結果が開きます。</p>'
    + '</div>';
  document.body.appendChild(wrap);
  function close(){ wrap.remove(); }
  wrap.querySelector(".song-picker-close").addEventListener("click", close);
  wrap.addEventListener("click", function(e){ if(e.target===wrap || e.target.closest(".listen-app")) setTimeout(close, 0); });
}
// マイページ：「聴く」ボタンに出す音楽アプリを選ぶ
function openMusicAppsSheet(){
  var cur = enabledMusicApps().map(function(a){ return a.id; });
  openSheet('<h2 class="mincho">音楽アプリ</h2>'
    + '<p class="catalog-sheet-note" style="margin:0 0 12px;">セトリやアーティストの画面の曲にある「聴く」ボタンから開くアプリを選びます（いくつでも）。</p>'
    + '<div class="music-app-list">'+MUSIC_APPS.map(function(a){
        var on = cur.indexOf(a.id)>=0;
        return '<label class="music-app-row">'+musicAppIcon(a)+'<span class="music-app-name">'+escapeHtml(a.label)+'</span>'
          + '<input type="checkbox" value="'+a.id+'"'+(on ? ' checked' : '')+'><span class="music-app-check" aria-hidden="true"></span></label>';
      }).join("")+'</div>'
    + '<div class="sheet-actions"><button type="button" class="btn ghost" data-close-sheet>キャンセル</button><button type="button" class="btn primary" id="musicAppsSave">保存する</button></div>');
  var sheet = document.getElementById("sheet");
  sheet.querySelector("[data-close-sheet]").addEventListener("click", closeSheet);
  document.getElementById("musicAppsSave").addEventListener("click", function(){
    var ids = Array.prototype.map.call(sheet.querySelectorAll(".music-app-row input:checked"), function(i){ return i.value; });
    state.musicApps = normMusicApps(ids);
    saveLocal();
    closeSheet();
    render();
    toast(ids.length ? "音楽アプリを"+ids.length+"つ選びました" : "「聴く」ボタンを出さないようにしました");
  });
}
function musicAppsSummary(){
  var apps = enabledMusicApps();
  if(!apps.length) return "なし";
  if(apps.length===MUSIC_APPS.length) return "すべて";
  return apps.map(function(a){ return a.label; }).join("・");
}
function openSetlistSheet(r){
  var sls = recSetlists(r);
  var html = sls.map(function(b){
    var no = 0;
    return '<div class="setlist-view-block">'
      + (b.artist ? '<h3 class="setlist-view-artist">'+escapeHtml(b.artist)+'</h3>' : '')
      + '<ul class="setlist-view">'+b.items.map(function(it){
          if(it.t==="mc" || it.t==="se") return '<li class="'+it.t+'"><span class="n">'+(it.t==="se" ? "SE" : "MC")+'</span>'+escapeHtml(it.note||"")+'</li>';
          no++;
          var sa = songArtist(it, b);
          return '<li><span class="n">'+no+'</span><span class="st">'+escapeHtml(it.title)+(sa ? '<span class="sa">／'+escapeHtml(sa)+'</span>' : '')+'</span>'+listenBtnHtml(it.title, sa)+'</li>';
        }).join("")+'</ul></div>';
  }).join("");
  openSheet('<h2 class="mincho">セットリスト</h2>'
    + '<p class="setlist-meta">'+escapeHtml(r.title||"")+(r.date ? '<span>'+escapeHtml(r.date.replace(/-/g,"."))+'</span>' : '')+'</p>'
    + '<div id="setlistViewBody">'+html+'</div>'
    + '<div class="setlist-actions"><button type="button" class="btn ghost" id="setlistCopyBtn">コピー</button>'
    + '<button type="button" class="btn primary" id="setlistEditBtn">編集する</button></div>');
  document.getElementById("setlistViewBody").addEventListener("click", function(e){
    var lb = e.target.closest(".listen-btn");
    if(lb) openListen(lb.getAttribute("data-lt")||"", lb.getAttribute("data-la")||"");
  });
  document.getElementById("setlistCopyBtn").addEventListener("click", function(){
    var text = (r.title||"") + "\n" + sls.map(function(b){
      var no = 0;
      return (b.artist ? "【"+b.artist+"】\n" : "") + b.items.map(function(it){
        if(it.t==="mc" || it.t==="se") return (it.t==="se" ? "SE" : "MC") + (it.note ? " "+it.note : "");
        no++; return no+". "+songLabel(it, b);
      }).join("\n");
    }).join("\n\n");
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function(){ toast("セットリストをコピーしました"); }, function(){ toast("コピーできませんでした"); });
  });
  document.getElementById("setlistEditBtn").addEventListener("click", function(){ closeSheet(); openSetlistEditor(r); });
}
// LIVEの編集画面を開き、セットリストの欄までスクロールする（未登録ならアーティストの枠と1曲目を用意する）
function openSetlistEditor(r){   // LIVEの編集画面を「セトリ記録を編集」で開く
  openRecordSheet("live", r);
  setTimeout(function(){
    if(window.__showRecPane) window.__showRecPane("setlist");
    if(window.__setlistCtl) window.__setlistCtl.ensureStarted();
    var box = document.getElementById("setlistEdit");
    if(!box) return;
    var inp = box.querySelector(".setlist-quick") || box.querySelector(".setlist-artist");
    if(inp) setTimeout(function(){ inp.focus(); }, 350);
  }, 80);
}

function bindOshiForm(existingOshi){
  var form = document.getElementById("oshiForm");
  var preset = PALETTE[state.oshis.length % PALETTE.length];
  var chosenPhoto = existingOshi ? (existingOshi.photo || null) : null;
  // 位置を後から調整し直せるよう、切り抜く前の画像（縮小済み）も持っておく
  var chosenPhotoOriginal = existingOshi ? (existingOshi.photoOriginal || null) : null;
  var draftGroups = existingOshi ? oshiGroupsList(existingOshi) : [];

  var elName = form.querySelector('[name="name"]');
  var elAgency = form.querySelector('[name="agency"]');
  var elBirthMonth = form.querySelector('[name="birthMonth"]');
  var elBirthDay = form.querySelector('[name="birthDay"]');
  var elBirthYear = form.querySelector('[name="birthYear"]');
  var elPhotoInput = form.querySelector('[name="photo"]');
  var elPhotoImg = form.querySelector('#photoImg');
  var elPhotoPlaceholder = form.querySelector('#photoPlaceholder');
  var elClearPhotoBtn = form.querySelector('#clearPhotoBtn');
  var elPhotoPreviewBtn = form.querySelector('#photoPreviewBtn');
  var elPhotoMenu = form.querySelector('#photoMenu');
  // 推しの写真を撮る・選ぶ前に、Googleドライブへ接続しておく
  elPhotoMenu.querySelectorAll("label").forEach(function(l){
    l.addEventListener("click", function(e){ DrivePhotos.requireConnection(e); }, true);
  });
  var elAddGroupBtn = form.querySelector('#addGroupBtn');

  /* The app's one theme color always follows the top (main) group's own
     color picker; with no groups yet, it falls back to whatever color this
     oshi already had, or a fresh palette default for a brand-new oshi. */
  function effectiveColor(groupsArr){
    if(groupsArr && groupsArr[0] && groupsArr[0].color) return groupsArr[0].color;
    return (existingOshi && existingOshi.color) || preset.hex;
  }

  var snsCombos = [];
  PERSON_SNS_KEYS.forEach(function(k){ snsCombos.push("person_"+k); });
  draftGroups.forEach(function(g,i){ GROUP_SNS_KEYS.forEach(function(k){ snsCombos.push("grp"+i+"_"+k); }); });
  var chosenSns = {};
  PERSON_SNS_KEYS.forEach(function(k){
    chosenSns["person_"+k] = existingOshi ? getSnsValue(existingOshi, "person", k) : "";
  });
  draftGroups.forEach(function(g,i){
    GROUP_SNS_KEYS.forEach(function(k){ chosenSns["grp"+i+"_"+k] = g["sns_"+k] || ""; });
  });

  /* Accepts a bare ID ("hakane_kono"), an "@handle", or (in case someone
     pastes one out of habit) a full profile URL — percent-encoded or not —
     and returns just the plain ID, so the URL builder can safely encode it
     once when constructing the href (encoding an already-encoded string
     would otherwise turn "%" into "%25..." and break the link). */
  function normalizeId(v){
    v = (v||"").trim();
    if(!v) return "";
    if(snsIsLegacyUrl(v)){
      try{
        var parts = v.split("?")[0].split("#")[0].split("/").filter(Boolean);
        v = parts[parts.length-1] || v;
      }catch(e){}
    }
    v = v.replace(/^@+/, "");
    if(/%[0-9A-Fa-f]{2}/.test(v)){
      try{ v = decodeURIComponent(v); }catch(e){}
    }
    return v;
  }
  /* Snapshots every field currently typed into the form (including any
     unsaved person/group SNS entries) into a plain object shaped like an
     oshi, so adding or removing a group can re-render the whole sheet
     without losing anything the person already filled in. */
  function collectDraft(){
    var groups = Array.prototype.map.call(form.querySelectorAll(".group-name-input"), function(inp){
      var idx = inp.getAttribute("data-group-idx");
      var colorInput = form.querySelector('.group-color-input[data-group-color-idx="'+idx+'"]');
      var g = {
        id: (draftGroups[idx] && draftGroups[idx].id) || uuid(),
        name: inp.value,
        color: colorInput ? colorInput.value : ""
      };
      GROUP_SNS_KEYS.forEach(function(k){ g["sns_"+k] = chosenSns["grp"+idx+"_"+k] || ""; });
      return g;
    });
    var draft = {
      id: existingOshi ? existingOshi.id : undefined,
      agency: elAgency.value,
      name: elName.value,
      photo: chosenPhoto,
      photoOriginal: chosenPhotoOriginal,
      color: effectiveColor(groups),
      birthMonth: elBirthMonth.value,
      birthDay: elBirthDay.value,
      birthYear: elBirthYear.value,
      mode: "pale",
      order: existingOshi ? existingOshi.order : state.oshis.length,
      createdAt: existingOshi ? existingOshi.createdAt : Date.now(),
      groups: groups
    };
    PERSON_SNS_KEYS.forEach(function(k){ draft["sns_person_"+k] = chosenSns["person_"+k] || ""; });
    return draft;
  }

  function refreshPhotoPreview(){
    if(chosenPhoto){
      var pu = DrivePhotos.cachedUrl(chosenPhoto);
      elPhotoImg.removeAttribute("data-gd");
      if(pu) elPhotoImg.src = pu;
      else { elPhotoImg.setAttribute("data-gd", chosenPhoto); DrivePhotos.hydrate(elPhotoImg.parentNode); }
      elPhotoImg.style.display = "block";
      elPhotoPlaceholder.style.display = "none";
      elClearPhotoBtn.style.display = "block";
      elAdjustPhotoBtn.style.display = "block";
    } else {
      elPhotoImg.style.display = "none";
      elPhotoImg.src = "";
      elPhotoPlaceholder.style.display = "block";
      elClearPhotoBtn.style.display = "none";
      elAdjustPhotoBtn.style.display = "none";
    }
  }
  var elAdjustPhotoBtn = form.querySelector("#adjustPhotoBtn");
  refreshPhotoPreview();
  elAdjustPhotoBtn.addEventListener("click", function(){
    // ドライブの写真は、端末に取り込んでから切り抜きの画面を開く
    DrivePhotos.localUrl(chosenPhotoOriginal || chosenPhoto).then(function(src){
      AvatarCropper.open(src, function(cropped){
      if(!cropped) return;
      if(!chosenPhotoOriginal) chosenPhotoOriginal = chosenPhoto;
      chosenPhoto = cropped;
      refreshPhotoPreview();
      });
    }).catch(function(){ toast("写真を読み込めませんでした"); });
  });

  function closeAllPickers(){
    form.querySelectorAll(".photo-menu").forEach(function(m){ m.style.display = "none"; });
  }
  function togglePicker(anchorEl, el){
    var wasOpen = el.style.display === "block";
    closeAllPickers();
    if(!wasOpen){ openPopoverNear(anchorEl, el); }
  }
  form.querySelectorAll(".group-card-row").forEach(function(row){
    row.addEventListener("scroll", closeAllPickers);
  });

  elPhotoPreviewBtn.addEventListener("click", function(e){
    e.stopPropagation();
    togglePicker(elPhotoPreviewBtn, elPhotoMenu);
  });
  form.addEventListener("click", function(e){
    if(!e.target.closest(".photo-picker")){ closeAllPickers(); }
  });
  elPhotoMenu.querySelectorAll(".photo-menu-item").forEach(function(item){
    item.addEventListener("click", function(){ closeAllPickers(); });
  });

  if(elAddGroupBtn){
    elAddGroupBtn.addEventListener("click", function(e){
      e.stopPropagation();
      var draft = collectDraft();
      draft.groups.push({id:uuid(), name:"", color:"", sns_web:"", sns_instagram:"", sns_x:"", sns_tiktok:"", sns_youtube:""});
      openOshiSheet(draft);
    });
  }
  form.querySelectorAll(".group-remove-btn").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var idx = Number(btn.getAttribute("data-group-remove"));
      var draft = collectDraft();
      draft.groups.splice(idx, 1);
      openOshiSheet(draft);
    });
  });
  /* Group order determines main/sub (the top card is always "main"), so
     reordering is the only control needed: arrow buttons for a reliable
     single-step move on any device, plus native drag-and-drop on the
     handle for picking a card up and dropping it further away in one go. */
  function moveGroup(from, to){
    var draft = collectDraft();
    if(to<0 || to>=draft.groups.length || from===to) return;
    var moved = draft.groups.splice(from,1)[0];
    draft.groups.splice(to,0,moved);
    openOshiSheet(draft);
  }
  form.querySelectorAll(".group-order-btn").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      if(btn.disabled) return;
      var idx = Number(btn.getAttribute("data-group-move"));
      var dir = btn.getAttribute("data-dir");
      moveGroup(idx, dir==="up" ? idx-1 : idx+1);
    });
  });
  form.querySelectorAll(".group-color-btn").forEach(function(colorBtn){
    var idx = colorBtn.getAttribute("data-group-color-btn");
    var pop = form.querySelector('[data-group-color-pop="'+idx+'"]');
    var hiddenInput = form.querySelector('.group-color-input[data-group-color-idx="'+idx+'"]');
    colorBtn.addEventListener("click", function(e){
      e.stopPropagation();
      togglePicker(colorBtn, pop);
    });
    pop.querySelectorAll(".gcs-swatch").forEach(function(sw){
      sw.addEventListener("click", function(e){
        e.stopPropagation();
        var hex = sw.getAttribute("data-hex");
        hiddenInput.value = hex;
        colorBtn.style.background = hex;
        closeAllPickers();
      });
    });
    var customBtn = pop.querySelector(".gcs-custom-btn");
    customBtn.addEventListener("click", function(e){
      e.stopPropagation();
      closeAllPickers();
      hiddenInput.click();
    });
    hiddenInput.addEventListener("input", function(){
      colorBtn.style.background = hiddenInput.value;
    });
  });
  var dragFromIdx = null;
  form.querySelectorAll(".group-card").forEach(function(card){
    card.addEventListener("dragstart", function(e){
      dragFromIdx = Number(card.getAttribute("data-group-card"));
      card.classList.add("dragging");
      try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(dragFromIdx)); }catch(err){}
    });
    card.addEventListener("dragend", function(){
      card.classList.remove("dragging");
      form.querySelectorAll(".group-card.drag-over").forEach(function(c){ c.classList.remove("drag-over"); });
    });
    card.addEventListener("dragover", function(e){
      e.preventDefault();
      if(dragFromIdx===null) return;
      var targetIdx = Number(card.getAttribute("data-group-card"));
      if(targetIdx===dragFromIdx) return;
      card.classList.add("drag-over");
    });
    card.addEventListener("dragleave", function(){ card.classList.remove("drag-over"); });
    card.addEventListener("drop", function(e){
      e.preventDefault();
      var targetIdx = Number(card.getAttribute("data-group-card"));
      if(dragFromIdx!==null && targetIdx!==dragFromIdx){ moveGroup(dragFromIdx, targetIdx); }
      dragFromIdx = null;
    });
  });

  /* グループ名が、ほかの推しのグループ名と完全に一致したら、そのグループの
     SNS（公式HP含む）を空欄にだけ自動で入れる（同じグループの別メンバー登録用） */
  function findSameGroupSns(name){
    var found = {};
    state.oshis.forEach(function(o){
      if(existingOshi && o.id===existingOshi.id) return;
      oshiGroupsList(o).forEach(function(g){
        if((g.name||"").trim()!==name) return;
        GROUP_SNS_KEYS.forEach(function(k){
          if(!found[k] && g["sns_"+k]) found[k] = g["sns_"+k];
        });
      });
    });
    return found;
  }
  function setSnsValue(combo, value){
    chosenSns[combo] = value;
    var k = combo.slice(combo.lastIndexOf("_")+1);
    var input = form.querySelector('[data-sns-input="'+combo+'"]');
    if(input) input.value = SNS_META[k].isUrl ? value : snsIdForEdit(value);
    var btn = form.querySelector('[data-sns-btn="'+combo+'"]');
    if(btn) btn.classList.toggle("filled", !!value);
    var clearBtn = form.querySelector('[data-sns-clear="'+combo+'"]');
    if(clearBtn) clearBtn.style.display = value ? "block" : "none";
  }
  function onGroupNameCommitted(e){
    var inp = e.target.closest(".group-name-input");
    if(!inp) return;
    // 候補から選んだとき（insertReplacementText、または inputType なし）もその場で反映する
    if(e.type==="input" && e.inputType && e.inputType!=="insertReplacementText") return;
    var name = inp.value.trim();
    if(!name) return;
    var idx = inp.getAttribute("data-group-idx");
    var found = findSameGroupSns(name);
    var filled = 0;
    GROUP_SNS_KEYS.forEach(function(k){
      var combo = "grp"+idx+"_"+k;
      if(found[k] && !chosenSns[combo]){ setSnsValue(combo, found[k]); filled++; }
    });
    if(filled) toast("「"+name+"」のSNS情報を反映しました");
  }
  form.addEventListener("change", onGroupNameCommitted);
  form.addEventListener("input", onGroupNameCommitted);

  snsCombos.forEach(function(combo){
    var btn = form.querySelector('[data-sns-btn="'+combo+'"]');
    var pop = form.querySelector('[data-sns-pop="'+combo+'"]');
    var input = form.querySelector('[data-sns-input="'+combo+'"]');
    var saveBtn = form.querySelector('[data-sns-save="'+combo+'"]');
    var clearBtn = form.querySelector('[data-sns-clear="'+combo+'"]');

    function refreshIcon(){
      btn.classList.toggle("filled", !!chosenSns[combo]);
      clearBtn.style.display = chosenSns[combo] ? "block" : "none";
    }
    refreshIcon();

    btn.addEventListener("click", function(e){
      e.stopPropagation();
      togglePicker(btn, pop);
      if(pop.style.display === "block"){ input.focus(); }
    });
    var isUrlCombo = !!SNS_META[combo.slice(combo.lastIndexOf("_")+1)].isUrl;
    saveBtn.addEventListener("click", function(){
      if(isUrlCombo){
        var url = safeWebUrl(input.value);
        if(input.value.trim() && !url){ toast("URLを正しく入力してください"); input.focus(); return; }
        chosenSns[combo] = url;
        input.value = url;
        refreshIcon();
        closeAllPickers();
        return;
      }
      chosenSns[combo] = normalizeId(input.value);
      input.value = chosenSns[combo];
      refreshIcon();
      closeAllPickers();
    });
    clearBtn.addEventListener("click", function(){
      chosenSns[combo] = "";
      input.value = "";
      refreshIcon();
      closeAllPickers();
    });
  });

  elPhotoInput.addEventListener("change", function(){
    var file = elPhotoInput.files && elPhotoInput.files[0];
    if(!file) return;
    if(file.type.indexOf("image/")!==0){ toast("画像ファイルを選択してください"); return; }
    resizeImageFile(file, 1000, 0.85).then(function(original){
      elPhotoInput.value = "";
      AvatarCropper.open(original, function(cropped){
        if(!cropped) return;
        chosenPhotoOriginal = original;
        chosenPhoto = cropped;
        refreshPhotoPreview();
      });
    }).catch(function(){
      toast("画像の読み込みに失敗しました");
    });
  });
  elClearPhotoBtn.addEventListener("click", function(){
    chosenPhoto = null;
    chosenPhotoOriginal = null;
    elPhotoInput.value = "";
    refreshPhotoPreview();
  });

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var name = elName.value.trim();
    if(!name){ elName.focus(); toast("人物名を入力してください"); return; }
    var isEditingReal = !!(existingOshi && existingOshi.id);
    var groups = Array.prototype.map.call(form.querySelectorAll(".group-name-input"), function(inp){
      var idx = inp.getAttribute("data-group-idx");
      var colorInput = form.querySelector('.group-color-input[data-group-color-idx="'+idx+'"]');
      var g = {
        id: (draftGroups[idx] && draftGroups[idx].id) || uuid(),
        name: inp.value.trim(),
        color: colorInput ? colorInput.value : ""
      };
      GROUP_SNS_KEYS.forEach(function(k){ g["sns_"+k] = chosenSns["grp"+idx+"_"+k] || ""; });
      return g;
    }).filter(function(g){
      return g.name || g.sns_web || g.sns_instagram || g.sns_x || g.sns_tiktok || g.sns_youtube;
    });
    // 推しの写真（切り抜き後と元の写真）も Google ドライブへ保存し、記録には置き場所だけを入れる
    var oshiIdForSave = isEditingReal ? existingOshi.id : uuid();
    if(chosenPhoto){
      if(DrivePhotos.isData(chosenPhoto)) chosenPhoto = await DrivePhotos.uploadNow(chosenPhoto, "oshi_"+oshiIdForSave+"_photo_"+Date.now()+".jpg");
      if(DrivePhotos.isData(chosenPhotoOriginal)) chosenPhotoOriginal = await DrivePhotos.uploadNow(chosenPhotoOriginal, "oshi_"+oshiIdForSave+"_original_"+Date.now()+".jpg");
    }
    var oshi = {
      id: oshiIdForSave,
      agency: elAgency.value.trim(),
      groups: groups,
      name: name,
      photo: chosenPhoto,
      photoOriginal: chosenPhoto ? chosenPhotoOriginal : null,
      color: effectiveColor(groups),
      birthMonth: elBirthMonth.value ? Number(elBirthMonth.value) : null,
      birthDay: elBirthDay.value ? Number(elBirthDay.value) : null,
      birthYear: elBirthYear.value ? Number(elBirthYear.value) : null,
      mode: "pale",
      order: isEditingReal ? existingOshi.order : state.oshis.length,
      hidden: isEditingReal ? !!existingOshi.hidden : false,
      createdAt: isEditingReal ? existingOshi.createdAt : Date.now()
    };
    // ホームのギャラリーの写真は、この画面では変えずに引き継ぐ
    if(isEditingReal && Array.isArray(existingOshi.gallery)) oshi.gallery = existingOshi.gallery;
    PERSON_SNS_KEYS.forEach(function(k){ oshi["sns_person_"+k] = chosenSns["person_"+k] || ""; });
    await persistOshi(oshi);
    if(!state.activeOshiId){ await setActiveOshi(oshi.id); }
    closeSheet();
    toast(isEditingReal ? "推しを更新しました" : "推しを登録しました");
    render();
  });

  var delBtn = form.querySelector("[data-action=delete-oshi]");
  if(delBtn){
    delBtn.addEventListener("click", async function(){
      if(!confirm("この推しと担当カラーの設定を削除しますか？記録は残ります。")) return;
      var id = delBtn.getAttribute("data-id");
      await removeOshi(id);
      if(state.activeOshiId===id){
        var next = state.oshis.find(function(o){return o.id!==id;});
        await setActiveOshi(next?next.id:null);
      }
      closeSheet();
      toast("推しを削除しました");
      render();
    });
  }
}

function bindRecordForm(type,existingRec){
  var form = document.getElementById("recordForm");
  var favOn = existingRec ? !!existingRec.favorite : false;
  var hideOn = existingRec ? !!existingRec.hidden : false;
  var elFavToggle = form.querySelector("#favToggle");
  var elHideToggle = form.querySelector("#hideToggle");
  function refreshToggles(){
    elFavToggle.classList.toggle("on", favOn);
    elHideToggle.classList.toggle("on", hideOn);
  }
  refreshToggles();
  elFavToggle.addEventListener("click", function(){ favOn = !favOn; refreshToggles(); });
  elHideToggle.addEventListener("click", function(){ hideOn = !hideOn; refreshToggles(); });

  /* 推しとグループを横並びの1行で選ぶ。LIVEは「推しを追加」で対バンの
     推しを複数行にできる（1行目が oshiId/groupId、2行目以降が extraOshis）。
     グループの選択肢は推しを変えるたびに作り直し、既定はメイングループ。 */
  var elOshiRows = form.querySelector("#recOshiRows");
  var elAddOshiBtn = form.querySelector("#addRecOshiBtn");
  var oshiRows = existingRec ? recOshiEntries(existingRec) : [];
  if(type!=="live") oshiRows = oshiRows.slice(0,1);
  oshiRows = oshiRows.filter(function(e){ return getOshi(e.oshiId); });
  if(!oshiRows.length){
    var firstOshi = getOshi(state.activeOshiId) || visibleOshis()[0] || state.oshis[0];
    oshiRows = [{oshiId:firstOshi.id, groupId:""}];
  }
  function defaultGroupId(oshiId){
    var o = getOshi(oshiId);
    var gs = o ? oshiGroupsList(o) : [];
    return gs.length ? gs[0].id : "";
  }
  oshiRows.forEach(function(row){
    var o = getOshi(row.oshiId);
    var gs = o ? oshiGroupsList(o) : [];
    if(!gs.some(function(g){ return g.id===row.groupId; })) row.groupId = defaultGroupId(row.oshiId);
  });
  function renderOshiRows(){
    elOshiRows.innerHTML = oshiRows.map(function(row, i){
      var o = getOshi(row.oshiId);
      var gs = o ? oshiGroupsList(o) : [];
      var oshiOpts = state.oshis.map(function(x){
        var usedElsewhere = oshiRows.some(function(r2, j){ return j!==i && r2.oshiId===x.id; });
        if(usedElsewhere) return "";
        if(x.hidden && x.id!==row.oshiId) return "";   // 非表示の推しは、すでに選ばれている行以外では出さない
        return '<option value="'+x.id+'" '+(x.id===row.oshiId?"selected":"")+'>'+escapeHtml(x.name)+'</option>';
      }).join("");
      var groupSel = gs.length
        ? '<select class="rec-group-sel" data-row="'+i+'" aria-label="グループ">'+gs.map(function(g){
            return '<option value="'+g.id+'" '+(g.id===row.groupId?"selected":"")+'>'+escapeHtml(g.name||"（名称未設定）")+'</option>';
          }).join("")+'</select>'
        : '<span class="rec-cell-empty"></span>';
      // LIVEは「人物名・グループ名・チェキ・✕」の4列。1行目は✕の位置を空けて列をそろえる。物販は「人物名・グループ名・チェキ」の3列
      var chekiBtn = (type==="live" || type==="goods")
        ? '<button type="button" class="rec-oshi-icon rec-oshi-cheki" data-cheki-row="'+i+'" title="この推しのチェキを追加" aria-label="この推しのチェキを追加">'+kindIcon("cheki")+'<span>チェキ</span></button>'
        : '';
      var removeBtn = i>0
        ? '<button type="button" class="rec-oshi-icon rec-oshi-remove" data-remove-row="'+i+'" title="この推しを外す" aria-label="この推しを外す"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>'
        : (type==="live" ? '<span class="rec-oshi-icon rec-cell-empty"></span>' : '');
      return '<div class="rec-oshi-row'+(type==="live"?' with-actions':(type==="goods"?' with-cheki':''))+'">'
        + '<select class="rec-oshi-sel" data-row="'+i+'" aria-label="推し">'+oshiOpts+'</select>'
        + groupSel
        + chekiBtn
        + removeBtn
        + '</div>';
    }).join("");
    if(elAddOshiBtn){
      var canAdd = visibleOshis().some(function(o){ return !oshiRows.some(function(r){ return r.oshiId===o.id; }); });
      elAddOshiBtn.style.display = canAdd ? "" : "none";
    }
  }
  elOshiRows.addEventListener("change", function(e){
    var t = e.target;
    var i = Number(t.getAttribute("data-row"));
    if(t.classList.contains("rec-oshi-sel")){
      oshiRows[i].oshiId = t.value;
      oshiRows[i].groupId = defaultGroupId(t.value);
      renderOshiRows();
    } else if(t.classList.contains("rec-group-sel")){
      oshiRows[i].groupId = t.value;
    }
  });
  elOshiRows.addEventListener("click", function(e){
    var chekiBtn = e.target.closest("[data-cheki-row]");
    if(chekiBtn){ addChekiFromRecord(oshiRows[Number(chekiBtn.getAttribute("data-cheki-row"))]); return; }
    var btn = e.target.closest("[data-remove-row]");
    if(!btn) return;
    oshiRows.splice(Number(btn.getAttribute("data-remove-row")), 1);
    renderOshiRows();
  });
  /* チェキボタン：この行の推し・グループと、LIVEの日付・公演名（物販は日付・商品名、
     なければイベント名・購入先）でチェキの記録を追加する */
  async function addChekiFromRecord(row){
    if(!row) return;
    var title = (form.querySelector('[name="title"]').value||"").trim();
    if(type==="goods") title = (form.querySelector('[name="item"]').value||"").trim() || title;
    var date = form.querySelector('[name="date"]').value;
    if(!title){
      if(type==="goods"){ toast("先に商品名を入力してください"); form.querySelector('[name="item"]').focus(); }
      else { toast("先に公演・ツアー名を入力してください"); form.querySelector('[name="title"]').focus(); }
      return;
    }
    if(!date){ toast("先に日付を入力してください"); return; }
    var o = getOshi(row.oshiId);
    await persistRecord("cheki", {
      id: uuid(), oshiId: row.oshiId, groupId: row.groupId||"", date: date, title: title,
      count: 1, price: 0, content: "", memo: "", tag: "", photo: null,
      favorite: false, hidden: false, source: type, createdAt: Date.now()
    });
    toast("チェキを追加しました"+(o ? "（"+o.name+"）" : ""));
  }
  if(elAddOshiBtn){
    elAddOshiBtn.addEventListener("click", function(){
      var next = visibleOshis().find(function(o){ return !oshiRows.some(function(r){ return r.oshiId===o.id; }); });
      if(!next){ toast("追加できる推しがいません"); return; }
      oshiRows.push({oshiId:next.id, groupId:defaultGroupId(next.id)});
      renderOshiRows();
    });
  }
  renderOshiRows();

  var venueAc = type==="live" ? bindVenueAutocomplete(form, existingRec) : null;

  form.querySelectorAll("[data-viewing]").forEach(function(b){
    b.addEventListener("click", function(){
      form.querySelector('[name="viewing"]').value = b.getAttribute("data-viewing");
      form.querySelectorAll("[data-viewing]").forEach(function(x){ x.classList.toggle("on", x===b); });
    });
  });

  /* 配信URL：1行ずつ入力し、「＋ 配信URLを追加」で行を増やす（2行目以降は✕で外せる） */
  var elStreamRows = form.querySelector("#streamUrlRows");
  function streamRowHtml(v, i){
    return '<div class="stream-url-row">'
      + '<input type="text" class="stream-url-input" inputmode="url" autocomplete="off" aria-label="配信URL'+(i+1)+'" value="'+escapeHtml(v||"")+'">'
      + (i>0 ? '<button type="button" class="rec-oshi-icon rec-oshi-remove" data-remove-stream="'+i+'" title="このURLを外す" aria-label="このURLを外す"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>'
             : '<span class="rec-oshi-icon rec-cell-empty"></span>')   // 1行目も✕の位置を空けて幅をそろえる
      + '</div>';
  }
  function currentStreamValues(){
    return Array.prototype.map.call(elStreamRows.querySelectorAll(".stream-url-input"), function(inp){ return inp.value; });
  }
  function renderStreamRows(values){
    if(!values.length) values = [""];
    elStreamRows.innerHTML = values.map(streamRowHtml).join("");
  }
  if(elStreamRows){
    renderStreamRows(existingRec ? (Array.isArray(existingRec.streamUrls) ? existingRec.streamUrls.slice() : (existingRec.streamUrl ? [existingRec.streamUrl] : [])) : []);
    form.querySelector("#addStreamUrlBtn").addEventListener("click", function(){
      var vals = currentStreamValues();
      vals.push("");
      renderStreamRows(vals);
      var inputs = elStreamRows.querySelectorAll(".stream-url-input");
      inputs[inputs.length-1].focus();
    });
    elStreamRows.addEventListener("click", function(e){
      var b = e.target.closest("[data-remove-stream]");
      if(!b) return;
      var vals = currentStreamValues();
      vals.splice(Number(b.getAttribute("data-remove-stream")), 1);
      renderStreamRows(vals);
    });
  }

  /* 写真（複数。LIVE・チェキ・物販 共通）。photos は保存する写真、sources はこの画面で撮った・選んだ元の写真（編集用） */
  var ckPhotos = [], ckSources = [], ckFavs = [], ckActive = -1;
  {
    ckPhotos = existingRec ? recPhotos(existingRec).slice() : [];
    ckSources = ckPhotos.map(function(){ return null; });
    // チェキの1枚ごとのお気に入り（写真を消す・並べ替えるときに、写真と一緒に動かす）
    if(type==="cheki" && existingRec){ for(var fk=0; fk<chekiUnits(existingRec); fk++) ckFavs.push(chekiUnitFav(existingRec, fk)); }
    var elCk = form.querySelector("#ckPhotos");
    var elCkAdd = form.querySelector("#ckAddMenu");
    var elCkMenu = form.querySelector("#ckPhotoMenu");
    var elCkInput = form.querySelector("#ckPhotoInput");
    var elCkCamera = form.querySelector("#ckPhotoCamera");
    var elCount = form.querySelector('[name="count"]');   // チェキだけ
    var elHint = form.querySelector(".ck-photos-hint");
    function renderCkPhotos(){
      elCk.innerHTML = ckPhotos.map(function(src, i){
        return '<button type="button" class="ck-thumb'+(i===0?' first':'')+'" data-ck-i="'+i+'" aria-label="'+(i+1)+'枚目の写真"><img '+DrivePhotos.imgAttrs(src)+' alt="" draggable="false"><span class="n">'+(i+1)+'</span>'+(i===0 && ckPhotos.length>1 ? '<span class="top">表示</span>' : '')+'</button>';
      }).join("")
        + ((ckPhotos.length>=1 && !canUse("multiPhoto")) ? '' : '<button type="button" class="ck-thumb add" id="ckAddTile" aria-label="写真を追加">'
        +   '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.4"/><path d="M8 6l1-2h6l1 2"/></svg><span>追加</span></button>');
      // 写真の数より枚数が少なければ合わせる
      if(elCount && Number(elCount.value||0) < ckPhotos.length) elCount.value = ckPhotos.length;
      if(elHint) elHint.style.display = ckPhotos.length>1 ? "block" : "none";
      DrivePhotos.hydrate(elCk);
    }
    // 写真を from 番目から to 番目へ動かす（元の写真・お気に入りも一緒に）
    function moveCkPhoto(from, to){
      if(from===to || from<0 || to<0 || from>=ckPhotos.length || to>=ckPhotos.length) return;
      [ckPhotos, ckSources, ckFavs].forEach(function(arr){
        if(arr===ckFavs && type!=="cheki") return;
        while(arr.length < ckPhotos.length) arr.push(arr===ckFavs ? false : null);
        var v = arr.splice(from, 1)[0];
        arr.splice(to, 0, v);
      });
      renderCkPhotos();
    }
    // ドラッグで並べ替え：押したまま8px以上動かすと、指の下の写真の位置へ動かす
    var ckDrag = null, ckSuppressClick = false;
    elCk.addEventListener("pointerdown", function(e){
      var th = e.target.closest("[data-ck-i]");
      if(!th || (e.button!==undefined && e.button!==0)) return;
      ckDrag = {el:th, from:Number(th.getAttribute("data-ck-i")), x:e.clientX, y:e.clientY, id:e.pointerId, started:false, to:-1};
      try{ th.setPointerCapture(e.pointerId); }catch(err){}
    });
    elCk.addEventListener("pointermove", function(e){
      if(!ckDrag || e.pointerId!==ckDrag.id) return;
      var dx = e.clientX-ckDrag.x, dy = e.clientY-ckDrag.y;
      if(!ckDrag.started){
        if(Math.abs(dx)+Math.abs(dy) < 8) return;
        ckDrag.started = true;
        ckDrag.el.classList.add("dragging");
        hideCkMenus();
      }
      e.preventDefault();
      ckDrag.el.style.transform = "translate("+dx+"px,"+dy+"px) scale(1.06)";

      // 3枚ずつ同時に送る
