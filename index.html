var SNS_KEYS = ["instagram","x","tiktok","youtube"];
/* グループは末尾に「公式HP」（IDではなくURLを保存）を持つ。
   個人SNSと同じ並びのアイコンが縦にそろうよう、共通の4つを先に並べる。 */
var GROUP_SNS_KEYS = SNS_KEYS.concat(["web"]);
/* 公式HPのURLを http(s) のみに正規化する。スキーム省略時は https:// を補う。
   javascript: など http(s) 以外は空文字にしてリンクにしない。 */
function safeWebUrl(v){
  v = (v||"").trim();
  if(!v) return "";
  if(!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = "https://"+v.replace(/^\/+/, "");
  try{
    var u = new URL(v);
    if(u.protocol!=="http:" && u.protocol!=="https:") return "";
    if(!u.hostname || u.hostname.indexOf(".")<0) return "";
    return u.href;
  }catch(e){ return ""; }
}
/* SNS fields store a bare ID (e.g. "hakane_kono"), not a full URL. A value
   already starting with http(s):// is treated as a legacy full URL (saved
   before this change) and used as-is, so old data keeps working. */
function snsIsLegacyUrl(v){ return /^https?:\/\//i.test(v||""); }
function snsHref(key, storedVal){
  if(!storedVal) return "";
  if(SNS_META[key].isUrl) return safeWebUrl(storedVal);
  if(snsIsLegacyUrl(storedVal)) return storedVal;
  return SNS_META[key].url(storedVal);
}
/* For editing: show a bare ID in the input even if the stored value is a
   legacy full URL, by extracting the last path segment. */
function snsIdForEdit(storedVal){
  if(!storedVal) return "";
  if(!snsIsLegacyUrl(storedVal)) return storedVal;
  try{
    var parts = storedVal.split("?")[0].split("#")[0].split("/").filter(Boolean);
    return (parts[parts.length-1] || "").replace(/^@+/, "");
  }catch(e){ return storedVal; }
}
/* The person's own SNS lives directly on the oshi ("sns_person_<key>"),
   falling back to the pre-groups flat "sns_<key>" fields for old data. */
function getSnsValue(oshi, scope, key){
  var scoped = oshi["sns_"+scope+"_"+key];
  if(scoped) return scoped;
  if(scope==="person" && oshi["sns_"+key]) return oshi["sns_"+key];
  return "";
}
/* Renders one platform's icon: a clickable, full-color link when the value
   is registered, or a faded, non-clickable placeholder when it isn't — so
   every platform is always visible and registration status reads at a glance. */
function snsIconHtml(k, val){
  var meta = SNS_META[k];
  if(val && snsHref(k, val)){
    return '<a href="'+escapeHtml(snsHref(k, val))+'" target="_blank" rel="noopener noreferrer" title="'+meta.label+'" aria-label="'+meta.label+'">'
      + '<svg viewBox="0 0 24 24">'+meta.icon+'</svg></a>';
  }
  return '<span class="unregistered" title="'+meta.label+'（未登録）" aria-label="'+meta.label+'（未登録）">'
    + '<svg viewBox="0 0 24 24">'+meta.icon+'</svg></span>';
}
function snsIconsHtml(oshi, scope){
  var hasAny = SNS_KEYS.some(function(k){ return getSnsValue(oshi, scope, k); });
  if(!hasAny) return "";
  return SNS_KEYS.map(function(k){ return snsIconHtml(k, getSnsValue(oshi, scope, k)); }).join("");
}
/* Same as snsIconsHtml, but for one group object's own sns_<key> fields
   (a group isn't "scoped" off the oshi the way person/legacy data is —
   each group in oshi.groups carries its fields directly). */
function groupSnsIconsHtml(group){
  var hasAny = GROUP_SNS_KEYS.some(function(k){ return group["sns_"+k]; });
  if(!hasAny) return "";
  return GROUP_SNS_KEYS.map(function(k){ return snsIconHtml(k, group["sns_"+k]); }).join("");
}
/* Renders the person's SNS row, then one row per group the oshi belongs to
   (掛け持ち-friendly), each labeled with that group's own real name rather
   than a generic "グループ" caption. Rows with nothing registered are
   omitted entirely. */
function snsLinksHtml(oshi, variant){
  var onAccent = variant==="hero";
  var rows = "";
  var personIcons = snsIconsHtml(oshi, "person");
  if(personIcons){
    var mainColor = (oshiGroupsList(oshi)[0] && oshiGroupsList(oshi)[0].color) || "";
    rows += '<div class="sns-scope-row">'
      + '<span class="sns-caption">'
      +   (mainColor? '<span class="group-color-dot" style="background:'+mainColor+'"></span>' : '')
      +   '個人'
      + '</span>'
      + '<div class="sns-links'+(onAccent?' on-accent':'')+'">'+personIcons+'</div>'
      + '</div>';
  }
  oshiGroupsList(oshi).forEach(function(g){
    var icons = groupSnsIconsHtml(g);
    if(!icons) return;
    rows += '<div class="sns-scope-row">'
      + '<span class="sns-caption">'
      +   (g.color? '<span class="group-color-dot" style="background:'+g.color+'"></span>' : '')
      +   escapeHtml(g.name||"グループ")
      + '</span>'
      + '<div class="sns-links'+(onAccent?' on-accent':'')+'">'+icons+'</div>'
      + '</div>';
  });
  if(!rows) return "";
  return '<div class="sns-block'+(onAccent?' on-accent':'')+'">'+rows+'</div>';
}

function recAmount(type,r){
  if(type==="live") return Number(r.price)||0;
  if(type==="cheki") return Number(r.price)||0;

  return 0;
}
function allRecordsForOshi(oshiId){
  var out=[];
  state.live.forEach(function(r){ if(oshiId==="all"||r.oshiId===oshiId) out.push({type:"live",r:r}); });
  state.cheki.forEach(function(r){ if(oshiId==="all"||r.oshiId===oshiId) out.push({type:"cheki",r:r}); });
  state.goods.forEach(function(r){ if(oshiId==="all"||r.oshiId===oshiId) out.push({type:"goods",r:r}); });
  out.sort(function(a,b){ return (b.r.date||"").localeCompare(a.r.date||""); });
  return out;
}
function allRecordsFlat(){
  return allRecordsForOshi("all").filter(function(item){ return !item.r.hidden; });
}
function aggregateByOshi(){
  return state.oshis.map(function(o){
    var recs = allRecordsFlat().filter(function(item){ return item.r.oshiId===o.id; });
    var liveN = recs.filter(function(i){return i.type==="live";}).length;
    var chekiN = recs.filter(function(i){return i.type==="cheki";}).reduce(function(s,i){return s+(Number(i.r.count)||1);},0);
    var goodsN = recs.filter(function(i){return i.type==="goods";}).reduce(function(s,i){return s+(Number(i.r.qty)||1);},0);
    var total = recs.reduce(function(s,i){ return s+recAmount(i.type,i.r); },0);
    return {oshi:o, liveN:liveN, chekiN:chekiN, goodsN:goodsN, total:total, itemCount:recs.length};
  }).sort(function(a,b){ return b.total-a.total; });
}
function aggregateByEvent(){
  var map = {};
  allRecordsFlat().forEach(function(item){
    var name = (item.r.title || "").trim();
    if(!name) return;
    if(!map[name]) map[name] = {name:name, count:0, total:0};
    map[name].count += (item.type==="cheki") ? (Number(item.r.count)||1) : (item.type==="goods" ? (Number(item.r.qty)||1) : 1);
    map[name].total += recAmount(item.type,item.r);
  });
  return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return b.count-a.count; });
}
function aggregateByMonth(monthsBack){
  var now = new Date();
  var months = [];
  for(var i=monthsBack-1;i>=0;i--){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"), label:(d.getMonth()+1)+"月", total:0, count:0});
  }
  var byKey = {};
  months.forEach(function(m){ byKey[m.key]=m; });
  allRecordsFlat().forEach(function(item){
    var key = (item.r.date||"").slice(0,7);
    if(byKey[key]){
      byKey[key].total += recAmount(item.type,item.r);
      byKey[key].count += 1;
    }
  });
  return months;
}
function recordsForDate(dateStr){
  return allRecordsFlat().filter(function(item){ return item.r.date===dateStr; });
}
function calendarDatesWithRecords(monthKey){
  var set = {};
  allRecordsFlat().forEach(function(item){
    if((item.r.date||"").slice(0,7)===monthKey) set[item.r.date] = (set[item.r.date]||0)+1;
  });
  return set;
}
function shiftMonth(monthKey, delta){
  var parts = monthKey.split("-");
  var d = new Date(Number(parts[0]), Number(parts[1])-1+delta, 1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}

  html += '<div class="hero">'
    + '<div class="ring"></div><div class="ring2"></div>'
    + (isBirthdayToday(oshi)? '<div class="bday-badge">本日 誕生日</div>' : '')
    + '<div class="eyebrow"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 6 6.4.6-4.9 4.2 1.5 6.2L12 16.9 6.4 20l1.5-6.2-4.9-4.2 6.4-.6z"/></svg>'+escapeHtml(subLabel)+'</div>'
    + '<div class="headline">'
    +   '<div class="who">'+oshiAvatarHtml(oshi,56)+'<div class="name mincho">'+escapeHtml(oshi.name)+'</div></div>'
    +   '<div class="stampring"><b>'+liveN+'</b><span>参戦</span></div>'
    + '</div>'
    + (bdayBits.length? '<div class="colorname-tag">'+escapeHtml(bdayBits.join(" ・ "))+'</div>' : '')
    + snsLinksHtml(oshi,"hero")
    + '<div class="stats">'
    +   '<div class="stat"><b>'+liveN+'</b><span>参戦回数</span></div>'
    +   '<div class="stat"><b>'+chekiN+'</b><span>チェキ枚数</span></div>'
    +   '<div class="stat"><b>'+goodsN+'</b><span>物販点数</span></div>'
    + '</div>'
    + '</div>';

  html += '<div class="oshi-pills">';
  state.oshis.forEach(function(o){
    html += '<button class="oshi-pill '+(o.id===oshi.id?'on':'')+'" data-action="set-active" data-id="'+o.id+'">'
      + '<span class="d" style="'+oshiSwatchStyle(o)+'"></span>'+escapeHtml(o.name)+'</button>';
  });
  html += '<button class="oshi-pill add" data-action="add-oshi">＋ 推しを追加</button>';
  html += '</div>';

  // monthly chart, last 6 months
  var now = new Date();
  var months = [];
  for(var i=5;i>=0;i--){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"), label:(d.getMonth()+1)+"月"});
  }
  var sums = months.map(function(m){
    var s = 0;
    recs.forEach(function(item){
      if((item.r.date||"").slice(0,7)===m.key) s += recAmount(item.type,item.r);
    });
    return s;
  });
  var maxV = Math.max.apply(null, sums.concat([1]));
  html += '<div class="chart-card">'
    + '<h3>月別 推し活費用</h3><span class="unit">直近6ヶ月・合計 '+fmtYen(total)+'</span>'
    + '<div class="bars">';
  months.forEach(function(m,i){
    var h = Math.round((sums[i]/maxV)*72)+4;
    html += '<div class="col"><div class="fill" style="height:'+h+'px" title="'+fmtYen(sums[i])+'"></div><div class="mo">'+m.label+'</div></div>';
  });
  html += '</div></div>';

  html += '<div class="section-label">最近の記録</div>';
  var visibleRecs = recs.filter(function(item){ return !item.r.hidden; });
  if(visibleRecs.length===0){
    html += '<div class="empty-state">'
      + iconCluster()
      + '<p>まだ記録がありません。右下の＋ボタンからLIVE・チェキ・物販の記録を追加してみましょう。</p>'
      + '</div>';
  } else {
    visibleRecs.slice(0,8).forEach(function(item){
      html += ticketHtml(item.type,item.r);
    });
  }

  document.getElementById("main").innerHTML = html;
}

/* ============ rendering: record list pages (live/cheki/goods) ============ */
function labelForType(type){
  return type==="live" ? {title:"LIVE記録", sub:"参戦した公演を記録する", icon:'<path d="M3 11l9-7 9 7"/>'} :
         type==="cheki" ? {title:"チェキ記録", sub:"撮ったチェキを記録する"} :
         {title:"物販記録", sub:"購入したグッズを記録する"};
}
function renderListPage(type){
  var info = labelForType(type);
  var html = '<div class="page-head"><h1 class="mincho">'+info.title+'</h1><p>'+info.sub+'</p></div>';

  if(state.oshis.length===0){
    html += '<div class="hero empty">'
      + '<div class="name mincho">まず推しを登録してください</div>'
      + '<p>'+info.title+'をつけるには、記録の相手となる推し（所属・グループ・人物名・担当カラー）を先に登録する必要があります。</p>'
      + '<button class="btn primary block" data-action="add-oshi">推しを登録する</button>'
      + '</div>';
    document.getElementById("main").innerHTML = html;
    return;
  }

  if(state.oshis.length>1){
    html += '<div class="oshi-pills">';
    html += '<button class="oshi-pill '+(state.filterOshiId==="all"?"on":"")+'" data-action="filter-oshi" data-id="all">すべて</button>';
    state.oshis.forEach(function(o){
      html += '<button class="oshi-pill '+(state.filterOshiId===o.id?"on":"")+'" data-action="filter-oshi" data-id="'+o.id+'">'
        + '<span class="d" style="'+oshiSwatchStyle(o)+'"></span>'+escapeHtml(o.name)+'</button>';
    });
    html += '</div>';
  }

  var fullList = state[type].filter(function(r){
    return state.filterOshiId==="all" || r.oshiId===state.filterOshiId;
  });
  var hiddenCount = fullList.filter(function(r){ return r.hidden; }).length;
  if(hiddenCount>0){
    html += '<button class="btn ghost" data-action="toggle-hidden" style="margin-bottom:12px;font-size:12px;padding:8px 12px;">'
      + (state.showHidden ? "非表示のアイテムを隠す" : "非表示のアイテムを表示（"+hiddenCount+"件）")
      + '</button>';
  }

  var list = fullList.filter(function(r){ return state.showHidden || !r.hidden; })
    .slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });

  var total = list.reduce(function(s,r){ return s+recAmount(type,r); },0);
  if(list.length>0){
    html += '<div class="filter-note">'+list.length+'件・合計 <b>'+fmtYen(total)+'</b></div>';
  }

  if(list.length===0){
    html += '<div class="empty-state">'
      + '<svg viewBox="0 0 24 24">'+kindIconRaw(type)+'</svg>'
      + '<p>まだ'+info.title.replace("記録","")+'の記録がありません。右下の＋ボタンから追加できます。</p>'
      + '</div>';
  } else {
    list.forEach(function(r){ html += ticketHtml(type,r,true); });
  }

  document.getElementById("main").innerHTML = html;
}
function kindIconRaw(type){
  if(type==="live") return '<rect x="3" y="7" width="18" height="10" rx="1.5"/><path d="M8 7v10M16 7v10"/>';
  if(type==="cheki") return '<rect x="4" y="4" width="16" height="18" rx="1"/><rect x="6.5" y="6.5" width="11" height="9" rx=".5"/>';
  return '<path d="M6 8l1.5-4h9L18 8"/><path d="M4 8h16l-1.3 12.2a1 1 0 01-1 .8H6.3a1 1 0 01-1-.8L4 8z"/>';
}

function ticketHtml(type,r,withOshiTag){
  var oshi = getOshi(r.oshiId);
  var amt = recAmount(type,r);
  var day = (r.date||"").split("-")[2]||"--";
  var titleText = r.title || (type==="goods"?r.item:"") || "(無題)";
  var metaBits = [];
  if(type==="live"){
    if(r.venue) metaBits.push(escapeHtml(r.venue));
    if(r.ticketType) metaBits.push(escapeHtml(r.ticketType));
    if(r.seat) metaBits.push(escapeHtml(r.seat));
  } else if(type==="cheki"){
    metaBits.push((Number(r.count)||1)+"枚");
    if(r.content) metaBits.push(escapeHtml(r.content));
  } else {
    if(r.item) metaBits.push(escapeHtml(r.item));
    metaBits.push((Number(r.qty)||1)+"点");
  }
  if(withOshiTag && oshi && state.filterOshiId==="all"){
    metaBits.unshift('<span style="color:'+oshi.color+';font-weight:700;">'+escapeHtml(oshiFullLabel(oshi))+'</span>');
  }
  var streamLinkHtml = (type==="live" && r.streamUrl)
    ? '<a href="'+escapeHtml(r.streamUrl)+'" target="_blank" rel="noopener noreferrer" class="stream-link">配信を見る</a>'
    : "";
  var stubHasPhoto = (type==="live") && !!r.photo;
  var html = '<div class="ticket'+(r.hidden?' is-hidden':'')+'">'
    + '<div class="tape"></div>'
    + (r.favorite ? '<div class="fav-badge"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 6 6.4.6-4.9 4.2 1.5 6.2L12 16.9 6.4 20l1.5-6.2-4.9-4.2 6.4-.6z"/></svg></div>' : '')
    + (type==="cheki" ? ('<div class="photo">'+(r.photo? '<img src="'+r.photo+'" alt="">' : '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.4"/><path d="M8 6l1-2h6l1 2"/></svg>')+'</div>') : '')
    + '<div class="main">'
    +   '<div class="kind"><span class="stamp">'+kindIcon(type)+KIND_LABEL[type]+'</span>'+(r.tag?'<span class="tag-chip">'+escapeHtml(r.tag)+'</span>':'')+(streamLinkHtml? '<span class="stream-link-wrap">'+streamLinkHtml+'</span>' : '')+'</div>'
    +   '<div class="title">'+escapeHtml(titleText)+'</div>'
    +   (metaBits.length? '<div class="meta">'+metaBits.join(" ・ ")+'</div>' : '')
    +   (r.memo? '<div class="memo">'+escapeHtml(r.memo)+'</div>' : '')
    + '</div>'
    + '<div class="stub'+(stubHasPhoto?' has-photo':'')+'"'+(stubHasPhoto?' style="background-image:linear-gradient(175deg, rgba(20,17,13,.1), rgba(20,17,13,.62)), url('+r.photo+');"':'')+'>'
    +   '<div class="day">'+day+'</div>'
    +   '<div class="ym">'+fmtYm(r.date)+'</div>'
    +   (amt? '<div class="amt">'+fmtYen(amt)+'</div>' : '')
    + '</div>'
    + '<button class="editbtn" data-action="edit-record" data-type="'+type+'" data-id="'+r.id+'">'
    +   '<svg viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 000-3L18 6a2.1 2.1 0 00-3 0L4.5 16.5z"/></svg>'
    + '</button>'
    + '</div>';
  return html;
}

/* ============ rendering: STATS page ============ */
function renderStatsPage(){
  var html = '<div class="page-head"><h1 class="mincho">集計</h1><p>推し・イベント・期間別に記録をまとめて振り返ります。</p></div>';

  if(state.oshis.length===0){
    html += '<div class="hero empty">'
      + '<div class="name mincho">まだ集計できる記録がありません</div>'
      + '<p>推しを登録して記録をつけると、ここに集計が表示されます。</p>'
      + '<button class="btn primary block" data-action="add-oshi">推しを登録する</button>'
      + '</div>';
    document.getElementById("main").innerHTML = html;
    return;
  }

  var tabs = [["oshi","推し別"],["event","イベント別"],["period","期間別"],["calendar","カレンダー"]];
  html += '<div class="oshi-pills">';
  tabs.forEach(function(t){
    html += '<button class="oshi-pill '+(state.statsSubView===t[0]?"on":"")+'" data-action="stats-tab" data-tab="'+t[0]+'">'+t[1]+'</button>';
  });
  html += '</div>';

  if(state.statsSubView==="oshi") html += renderStatsByOshi();
  else if(state.statsSubView==="event") html += renderStatsByEvent();
  else if(state.statsSubView==="period") html += renderStatsByPeriod();
  else html += renderStatsCalendar();

  html += '<button class="btn ghost block" data-action="share-summary" style="margin-top:18px;">'
    + '<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;margin-right:6px;vertical-align:-3px;"><path d="M12 5v10M8 9l4-4 4 4"/><path d="M5 15v3a2 2 0 002 2h10a2 2 0 002-2v-3"/></svg>'
    + '集計結果を画像で保存</button>';

  document.getElementById("main").innerHTML = html;

  if(state.statsSubView==="calendar"){ bindCalendarEvents(); }
}

function renderStatsByOshi(){
  var rows = aggregateByOshi();
  if(rows.every(function(r){return r.itemCount===0;})){
    return emptyStatsBlock();
  }
  var html = "";
  rows.forEach(function(row){
    if(row.itemCount===0) return;
    html += '<div class="stat-row">'
      + '<div class="sw" style="'+oshiSwatchStyle(row.oshi)+'"></div>'
      + '<div class="info"><b>'+escapeHtml(row.oshi.name)+'</b>'
      +   '<span>LIVE '+row.liveN+' ・ チェキ '+row.chekiN+' ・ 物販 '+row.goodsN+'</span></div>'
      + '<div class="stat-amt">'+fmtYen(row.total)+'</div>'
      + '</div>';
  });
  return html;
}
function renderStatsByEvent(){
  var rows = aggregateByEvent();
  if(rows.length===0) return emptyStatsBlock();
  var html = "";
  rows.slice(0,30).forEach(function(row){
    html += '<div class="stat-row">'
      + '<div class="info"><b>'+escapeHtml(row.name)+'</b><span>'+row.count+'件</span></div>'
      + '<div class="stat-amt">'+fmtYen(row.total)+'</div>'
      + '</div>';
  });
  return html;
}
function renderStatsByPeriod(){
  var months = aggregateByMonth(12);
  var total = months.reduce(function(s,m){return s+m.total;},0);
  if(total===0 && months.every(function(m){return m.count===0;})) return emptyStatsBlock();
  var maxV = Math.max.apply(null, months.map(function(m){return m.total;}).concat([1]));
  var html = '<div class="chart-card" style="margin-top:2px;">'
    + '<h3>月別 推し活費用</h3><span class="unit">直近12ヶ月・合計 '+fmtYen(total)+'</span>'
    + '<div class="bars" style="overflow-x:auto;">';
  months.forEach(function(m){
    var h = Math.round((m.total/maxV)*72)+4;
    html += '<div class="col" style="min-width:24px;"><div class="fill" style="height:'+h+'px" title="'+fmtYen(m.total)+'"></div><div class="mo">'+m.label+'</div></div>';
  });
  html += '</div></div>';
  html += '<div class="section-label">内訳</div>';
  months.slice().reverse().forEach(function(m){
    if(m.count===0) return;
    html += '<div class="stat-row">'
      + '<div class="info"><b>'+m.label+'</b><span>'+m.count+'件</span></div>'
      + '<div class="stat-amt">'+fmtYen(m.total)+'</div>'
      + '</div>';
  });
  return html;
}
function renderStatsCalendar(){
  var parts = state.calendarMonth.split("-");
  var y = Number(parts[0]), m = Number(parts[1]);
  var first = new Date(y, m-1, 1);
  var startWeekday = first.getDay();
  var daysInMonth = new Date(y, m, 0).getDate();
  var dateMap = calendarDatesWithRecords(state.calendarMonth);

  var html = '<div class="cal-head">'
    + '<button type="button" class="cal-nav" data-action="cal-prev" aria-label="前月"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>'
    + '<span class="mincho">'+y+'年 '+m+'月</span>'
    + '<button type="button" class="cal-nav" data-action="cal-next" aria-label="翌月"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>'
    + '</div>';
  html += '<div class="cal-grid cal-dow">';
  ["日","月","火","水","木","金","土"].forEach(function(d){ html += '<div>'+d+'</div>'; });
  html += '</div>';
  html += '<div class="cal-grid">';
  for(var i=0;i<startWeekday;i++){ html += '<div class="cal-cell empty"></div>'; }
  for(var day=1; day<=daysInMonth; day++){
    var dateStr = state.calendarMonth+"-"+String(day).padStart(2,"0");
    var n = dateMap[dateStr]||0;
    var isSelected = state.calendarSelectedDate===dateStr;
    html += '<button type="button" class="cal-cell '+(n>0?"has-rec":"")+' '+(isSelected?"selected":"")+'" data-action="cal-day" data-date="'+dateStr+'">'
      + '<span class="cal-daynum">'+day+'</span>'
      + (n>0? '<span class="cal-dot"></span>' : '')
      + '</button>';
  }
  html += '</div>';

  if(state.calendarSelectedDate){
    var items = recordsForDate(state.calendarSelectedDate);
    html += '<div class="section-label">'+state.calendarSelectedDate+' の記録</div>';
    if(items.length===0){
      html += '<div class="empty-state"><p>この日の記録はありません。</p></div>';
    } else {
      items.forEach(function(item){ html += ticketHtml(item.type, item.r, true); });
    }
  }
  return html;
}
function emptyStatsBlock(){
  return '<div class="empty-state">'
    + iconCluster()
    + '<p>まだ集計できる記録がありません。LIVE・チェキ・物販タブから記録を追加してみましょう。</p>'
    + '</div>';
}
function bindCalendarEvents(){
  var main = document.getElementById("main");
  main.querySelectorAll("[data-action=cal-prev]").forEach(function(b){
    b.addEventListener("click", function(){
      state.calendarMonth = shiftMonth(state.calendarMonth,-1);
      state.calendarSelectedDate = null;
      renderStatsPage();
    });
  });
  main.querySelectorAll("[data-action=cal-next]").forEach(function(b){
    b.addEventListener("click", function(){
      state.calendarMonth = shiftMonth(state.calendarMonth,1);
      state.calendarSelectedDate = null;
      renderStatsPage();
    });
  });
  main.querySelectorAll("[data-action=cal-day]").forEach(function(b){
    b.addEventListener("click", function(){
      var d = b.getAttribute("data-date");
      state.calendarSelectedDate = (state.calendarSelectedDate===d) ? null : d;
      renderStatsPage();
    });
  });
}

function shareSummaryImage(){
  var rows = aggregateByOshi().filter(function(r){ return r.itemCount>0; }).slice(0,6);
  if(rows.length===0){ toast("まだ集計できる記録がありません"); return; }
  var totalAll = rows.reduce(function(s,r){return s+r.total;},0);
  var itemsAll = rows.reduce(function(s,r){return s+r.itemCount;},0);
  var accentColor = rows[0].oshi.color || "#C9457A";
  var now = new Date();

  var W = 900, H = 340 + rows.length*110 + 90;
  var canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext("2d");

  ctx.fillStyle = "#FBF8F3";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "rgba(33,28,23,0.06)";
  for(var yy=20; yy<H; yy+=26){
    for(var xx=20; xx<W; xx+=26){ ctx.beginPath(); ctx.arc(xx,yy,1.3,0,Math.PI*2); ctx.fill(); }
  }

  ctx.fillStyle = accentColor;
  ctx.fillRect(0,0,W,180);
  ctx.fillStyle = "#FBF8F3";
  ctx.font = "700 46px sans-serif";
  ctx.fillText("推し活記録", 50, 90);
  ctx.font = "400 22px sans-serif";
  ctx.fillText(now.getFullYear()+"年"+(now.getMonth()+1)+"月時点", 50, 135);

  ctx.fillStyle = "#211C17";
  ctx.font = "700 30px sans-serif";
  ctx.fillText("合計 "+itemsAll+"件 ・ "+fmtYenPlain(totalAll), 50, 250);

  var rowY = 320;
  rows.forEach(function(row){
    ctx.fillStyle = row.oshi.color || "#C9457A";
    ctx.beginPath(); ctx.arc(72, rowY, 24, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#211C17";
    ctx.font = "700 28px sans-serif";
    ctx.fillText(row.oshi.name, 116, rowY+8);
    ctx.font = "400 20px sans-serif";
    ctx.fillStyle = "#6B6259";
    ctx.fillText("LIVE "+row.liveN+" ・ チェキ "+row.chekiN+" ・ 物販 "+row.goodsN, 116, rowY+40);
    ctx.textAlign = "right";
    ctx.fillStyle = accentColor;
    ctx.font = "700 26px sans-serif";
    ctx.fillText(fmtYenPlain(row.total), W-50, rowY+8);
    ctx.textAlign = "left";
    rowY += 110;
  });

  ctx.fillStyle = "#ABA398";
  ctx.font = "400 20px sans-serif";
  ctx.fillText("#\u63a8\u3057\u6d3b\u624b\u5e33", 50, H-38);

  var dataUrl;
  try{ dataUrl = canvas.toDataURL("image/png"); }
  catch(e){ toast("画像の生成に失敗しました"); return; }

  var a = document.createElement("a");
  a.href = dataUrl;
  a.download = "oshikatsu_"+now.getFullYear()+String(now.getMonth()+1).padStart(2,"0")+".png";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast("画像を保存しました");
}

/* Lets the person drag an oshi-row onto another to swap their order, as an
   alternative to the up/down buttons rendered in each row. */
function bindOshiPageDragDrop(){
  var main = document.getElementById("main");
  var dragFromId = null;
  main.querySelectorAll("[data-oshi-row]").forEach(function(row){
    row.addEventListener("dragstart", function(e){
      dragFromId = row.getAttribute("data-oshi-row");
      row.classList.add("dragging");
      try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragFromId); }catch(err){}
    });
    row.addEventListener("dragend", function(){
      row.classList.remove("dragging");
      main.querySelectorAll(".oshi-row.drag-over").forEach(function(r){ r.classList.remove("drag-over"); });
    });
    row.addEventListener("dragover", function(e){
      e.preventDefault();
      if(dragFromId===null) return;
      var targetId = row.getAttribute("data-oshi-row");
      if(targetId===dragFromId) return;
      row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", function(){ row.classList.remove("drag-over"); });
    row.addEventListener("drop", function(e){
      e.preventDefault();
      var targetId = row.getAttribute("data-oshi-row");
      if(dragFromId!==null && targetId!==dragFromId){ reorderOshi(dragFromId, targetId); }
      dragFromId = null;
    });
  });
}
/* Moves fromId to the position currently held by toId (or, for the arrow
   buttons, one step up/down) and persists the new order. */
function reorderOshi(fromId, toId){
  var fromIdx = state.oshis.findIndex(function(o){ return o.id===fromId; });
  var toIdx = state.oshis.findIndex(function(o){ return o.id===toId; });
  if(fromIdx<0 || toIdx<0 || fromIdx===toIdx) return;
  var moved = state.oshis.splice(fromIdx,1)[0];
  state.oshis.splice(toIdx,0,moved);
  saveLocal();
  renderOshiPage();
}
function moveOshiStep(id, dir){
  var idx = state.oshis.findIndex(function(o){ return o.id===id; });
  if(idx<0) return;
  var target = dir==="up" ? idx-1 : idx+1;
  if(target<0 || target>=state.oshis.length) return;
  var moved = state.oshis.splice(idx,1)[0];
  state.oshis.splice(target,0,moved);
  saveLocal();
  renderOshiPage();
}

  if(state.headerLogo){

/* ============ router ============ */
function render(){
  var app = document.getElementById("app");
  app.classList.remove("booting");
  var gated = !cloud.user;
  app.classList.toggle("auth-gate", gated);
  if(gated){
    applyTheme(null);
    app.classList.add("no-oshi");
    document.getElementById("topChip").style.display = "none";
    closeSheet();
    renderAuthGate();
    return;
  }
  var oshi = activeOshi();
  applyTheme(oshi);
  app.classList.toggle("no-oshi", !oshi);

  var chip = document.getElementById("topChip");
  if(oshi){
    chip.style.display="flex";
    var topDot = document.getElementById("topDot");
    topDot.setAttribute("style", oshiSwatchStyle(oshi));
    document.getElementById("topName").textContent = oshi.name;
  } else {
    chip.style.display="none";
  }
  renderTopChipMenu();
  refreshHeaderLogo();

  document.querySelectorAll("nav.tabs button").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-view")===state.view);
  });

  if(state.view==="home") renderHome();
  else if(state.view==="oshi") renderOshiPage();
  else if(state.view==="stats") renderStatsPage();
  else renderListPage(state.view);
}

/* .photo-menu popovers are position:fixed (viewport-relative) so that any
   scrollable or clipping ancestor can never clip or misplace them. Since
   "fixed" ignores document flow entirely, JS has to place them itself, next
   to whichever icon/button opened them, clamped so they never run off the
   right edge of the screen. */
function openPopoverNear(anchorEl, popEl){
  popEl.style.display = "block";
  var rect = anchorEl.getBoundingClientRect();
  var popWidth = popEl.offsetWidth || 200;
  var left = Math.min(rect.left, window.innerWidth - popWidth - 12);
  left = Math.max(12, left);
  var top = rect.bottom + 8;
  var popHeight = popEl.offsetHeight || 0;
  if(top + popHeight > window.innerHeight - 12){ top = Math.max(12, rect.top - popHeight - 8); }
  popEl.style.left = left + "px";
  popEl.style.top = top + "px";
}
/* Popovers are fixed to the viewport, so if the sheet scrolls underneath
   one while it's open, it would stay floating in place, detached from the
   icon that opened it. Closing on scroll avoids that. */
function closePopoversOnSheetScroll(){
  if(!sheetEl) return;
  sheetEl.querySelectorAll(".photo-menu").forEach(function(m){ m.style.display = "none"; });
}

  fields += '<div class="field toggle-row">'
    + '<button type="button" class="toggle-chip" id="favToggle"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 6 6.4.6-4.9 4.2 1.5 6.2L12 16.9 6.4 20l1.5-6.2-4.9-4.2 6.4-.6z"/></svg>お気に入り</button>'
    + '<button type="button" class="toggle-chip" id="hideToggle"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="21" x2="21" y2="3"/></svg>非表示にする</button>'
    + '</div>';

  return ''
    + '<h2 class="mincho">'+info.title+(rec?"を編集":"を追加")+'</h2>'
    + '<form id="recordForm">'+fields
    +   '<div class="sheet-actions">'
    +     (rec? '<button type="button" class="btn danger" data-action="delete-record" data-type="'+type+'" data-id="'+rec.id+'">削除</button>' : '')
    +     '<button type="submit" class="btn primary">保存する</button>'
    +   '</div>'
    + '</form>';
}

function bindOshiForm(existingOshi){
  var form = document.getElementById("oshiForm");
  var preset = PALETTE[state.oshis.length % PALETTE.length];
  var chosenPhoto = existingOshi ? (existingOshi.photo || null) : null;
  var draftGroups = existingOshi ? oshiGroupsList(existingOshi) : [];

  var elName = form.querySelector('[name="name"]');
  var elAgency = form.querySelector('[name="agency"]');
  var elBirthMonth = form.querySelector('[name="birthMonth"]');
  var elBirthDay = form.querySelector('[name="birthDay"]');
  var elBirthYear = form.querySelector('[name="birthYear"]');
  var elPhotoInput = form.querySelector('[name="photo"]');
  var elPhotoImg = form.querySelector('#photoImg');
  var elPhotoPlaceholder = form.querySelector('#photoPlaceholder');
  var elClearPhotoBtn = form.querySelector('#clearPhotoBtn');
  var elPhotoPreviewBtn = form.querySelector('#photoPreviewBtn');
  var elPhotoMenu = form.querySelector('#photoMenu');
  var elAddGroupBtn = form.querySelector('#addGroupBtn');

  /* The app's one theme color always follows the top (main) group's own
     color picker; with no groups yet, it falls back to whatever color this
     oshi already had, or a fresh palette default for a brand-new oshi. */
  function effectiveColor(groupsArr){
    if(groupsArr && groupsArr[0] && groupsArr[0].color) return groupsArr[0].color;
    return (existingOshi && existingOshi.color) || preset.hex;
  }

  var snsCombos = [];
  SNS_KEYS.forEach(function(k){ snsCombos.push("person_"+k); });
  draftGroups.forEach(function(g,i){ GROUP_SNS_KEYS.forEach(function(k){ snsCombos.push("grp"+i+"_"+k); }); });
  var chosenSns = {};
  SNS_KEYS.forEach(function(k){
    chosenSns["person_"+k] = existingOshi ? getSnsValue(existingOshi, "person", k) : "";
  });
  draftGroups.forEach(function(g,i){
    GROUP_SNS_KEYS.forEach(function(k){ chosenSns["grp"+i+"_"+k] = g["sns_"+k] || ""; });
  });

  /* Accepts a bare ID ("hakane_kono"), an "@handle", or (in case someone
     pastes one out of habit) a full profile URL — percent-encoded or not —
     and returns just the plain ID, so the URL builder can safely encode it
     once when constructing the href (encoding an already-encoded string
     would otherwise turn "%" into "%25..." and break the link). */
  function normalizeId(v){
    v = (v||"").trim();
    if(!v) return "";
    if(snsIsLegacyUrl(v)){
      try{
        var parts = v.split("?")[0].split("#")[0].split("/").filter(Boolean);
        v = parts[parts.length-1] || v;
      }catch(e){}
    }
    v = v.replace(/^@+/, "");
    if(/%[0-9A-Fa-f]{2}/.test(v)){
      try{ v = decodeURIComponent(v); }catch(e){}
    }
    return v;
  }
  /* Snapshots every field currently typed into the form (including any
     unsaved person/group SNS entries) into a plain object shaped like an
     oshi, so adding or removing a group can re-render the whole sheet
     without losing anything the person already filled in. */
  function collectDraft(){
    var groups = Array.prototype.map.call(form.querySelectorAll(".group-name-input"), function(inp){
      var idx = inp.getAttribute("data-group-idx");
      var colorInput = form.querySelector('.group-color-input[data-group-color-idx="'+idx+'"]');
      var g = {
        id: (draftGroups[idx] && draftGroups[idx].id) || uuid(),
        name: inp.value,
        color: colorInput ? colorInput.value : ""
      };
      GROUP_SNS_KEYS.forEach(function(k){ g["sns_"+k] = chosenSns["grp"+idx+"_"+k] || ""; });
      return g;
    });
    var draft = {
      id: existingOshi ? existingOshi.id : undefined,
      agency: elAgency.value,
      name: elName.value,
      photo: chosenPhoto,
      color: effectiveColor(groups),
      birthMonth: elBirthMonth.value,
      birthDay: elBirthDay.value,
      birthYear: elBirthYear.value,
      mode: "pale",
      order: existingOshi ? existingOshi.order : state.oshis.length,
      createdAt: existingOshi ? existingOshi.createdAt : Date.now(),
      groups: groups
    };
    SNS_KEYS.forEach(function(k){ draft["sns_person_"+k] = chosenSns["person_"+k] || ""; });
    return draft;
  }

  function refreshPhotoPreview(){
    if(chosenPhoto){
      elPhotoImg.src = chosenPhoto;
      elPhotoImg.style.display = "block";
      elPhotoPlaceholder.style.display = "none";
      elClearPhotoBtn.style.display = "block";
    } else {
      elPhotoImg.style.display = "none";
      elPhotoImg.src = "";
      elPhotoPlaceholder.style.display = "block";
      elClearPhotoBtn.style.display = "none";
    }
  }
  refreshPhotoPreview();

  function closeAllPickers(){
    form.querySelectorAll(".photo-menu").forEach(function(m){ m.style.display = "none"; });
  }
  function togglePicker(anchorEl, el){
    var wasOpen = el.style.display === "block";
    closeAllPickers();
    if(!wasOpen){ openPopoverNear(anchorEl, el); }
  }
  form.querySelectorAll(".group-card-row").forEach(function(row){
    row.addEventListener("scroll", closeAllPickers);
  });

  elPhotoPreviewBtn.addEventListener("click", function(e){
    e.stopPropagation();
    togglePicker(elPhotoPreviewBtn, elPhotoMenu);
  });
  form.addEventListener("click", function(e){
    if(!e.target.closest(".photo-picker")){ closeAllPickers(); }
  });
  elPhotoMenu.querySelectorAll(".photo-menu-item").forEach(function(item){
    item.addEventListener("click", function(){ closeAllPickers(); });
  });

  if(elAddGroupBtn){
    elAddGroupBtn.addEventListener("click", function(e){
      e.stopPropagation();
      var draft = collectDraft();
      draft.groups.push({id:uuid(), name:"", color:"", sns_web:"", sns_instagram:"", sns_x:"", sns_tiktok:"", sns_youtube:""});
      openOshiSheet(draft);
    });
  }
  form.querySelectorAll(".group-remove-btn").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var idx = Number(btn.getAttribute("data-group-remove"));
      var draft = collectDraft();
      draft.groups.splice(idx, 1);
      openOshiSheet(draft);
    });
  });
  /* Group order determines main/sub (the top card is always "main"), so
     reordering is the only control needed: arrow buttons for a reliable
     single-step move on any device, plus native drag-and-drop on the
     handle for picking a card up and dropping it further away in one go. */
  function moveGroup(from, to){
    var draft = collectDraft();
    if(to<0 || to>=draft.groups.length || from===to) return;
    var moved = draft.groups.splice(from,1)[0];
    draft.groups.splice(to,0,moved);
    openOshiSheet(draft);
  }
  form.querySelectorAll(".group-order-btn").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      if(btn.disabled) return;
      var idx = Number(btn.getAttribute("data-group-move"));
      var dir = btn.getAttribute("data-dir");
      moveGroup(idx, dir==="up" ? idx-1 : idx+1);
    });
  });
  form.querySelectorAll(".group-color-btn").forEach(function(colorBtn){
    var idx = colorBtn.getAttribute("data-group-color-btn");
    var pop = form.querySelector('[data-group-color-pop="'+idx+'"]');
    var hiddenInput = form.querySelector('.group-color-input[data-group-color-idx="'+idx+'"]');
    colorBtn.addEventListener("click", function(e){
      e.stopPropagation();
      togglePicker(colorBtn, pop);
    });
    pop.querySelectorAll(".gcs-swatch").forEach(function(sw){
      sw.addEventListener("click", function(e){
        e.stopPropagation();
        var hex = sw.getAttribute("data-hex");
        hiddenInput.value = hex;
        colorBtn.style.background = hex;
        closeAllPickers();
      });
    });
    var customBtn = pop.querySelector(".gcs-custom-btn");
    customBtn.addEventListener("click", function(e){
      e.stopPropagation();
      closeAllPickers();
      hiddenInput.click();
    });
    hiddenInput.addEventListener("input", function(){
      colorBtn.style.background = hiddenInput.value;
    });
  });
  var dragFromIdx = null;
  form.querySelectorAll(".group-card").forEach(function(card){
    card.addEventListener("dragstart", function(e){
      dragFromIdx = Number(card.getAttribute("data-group-card"));
      card.classList.add("dragging");
      try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(dragFromIdx)); }catch(err){}
    });
    card.addEventListener("dragend", function(){
      card.classList.remove("dragging");
      form.querySelectorAll(".group-card.drag-over").forEach(function(c){ c.classList.remove("drag-over"); });
    });
    card.addEventListener("dragover", function(e){
      e.preventDefault();
      if(dragFromIdx===null) return;
      var targetIdx = Number(card.getAttribute("data-group-card"));
      if(targetIdx===dragFromIdx) return;
      card.classList.add("drag-over");
    });
    card.addEventListener("dragleave", function(){ card.classList.remove("drag-over"); });
    card.addEventListener("drop", function(e){
      e.preventDefault();
      var targetIdx = Number(card.getAttribute("data-group-card"));
      if(dragFromIdx!==null && targetIdx!==dragFromIdx){ moveGroup(dragFromIdx, targetIdx); }
      dragFromIdx = null;
    });
  });

  snsCombos.forEach(function(combo){
    var btn = form.querySelector('[data-sns-btn="'+combo+'"]');
    var pop = form.querySelector('[data-sns-pop="'+combo+'"]');
    var input = form.querySelector('[data-sns-input="'+combo+'"]');
    var saveBtn = form.querySelector('[data-sns-save="'+combo+'"]');
    var clearBtn = form.querySelector('[data-sns-clear="'+combo+'"]');

    function refreshIcon(){
      btn.classList.toggle("filled", !!chosenSns[combo]);
      clearBtn.style.display = chosenSns[combo] ? "block" : "none";
    }
    refreshIcon();

    btn.addEventListener("click", function(e){
      e.stopPropagation();
      togglePicker(btn, pop);
      if(pop.style.display === "block"){ input.focus(); }
    });
    var isUrlCombo = !!SNS_META[combo.slice(combo.lastIndexOf("_")+1)].isUrl;
    saveBtn.addEventListener("click", function(){
      if(isUrlCombo){
        var url = safeWebUrl(input.value);
        if(input.value.trim() && !url){ toast("URLを正しく入力してください"); input.focus(); return; }
        chosenSns[combo] = url;
        input.value = url;
        refreshIcon();
        closeAllPickers();
        return;
      }
      chosenSns[combo] = normalizeId(input.value);
      input.value = chosenSns[combo];
      refreshIcon();
      closeAllPickers();
    });
    clearBtn.addEventListener("click", function(){
      chosenSns[combo] = "";
      input.value = "";
      refreshIcon();
      closeAllPickers();
    });
  });

  elPhotoInput.addEventListener("change", function(){
    var file = elPhotoInput.files && elPhotoInput.files[0];
    if(!file) return;
    if(file.type.indexOf("image/")!==0){ toast("画像ファイルを選択してください"); return; }
    resizeImageFile(file, 480, 0.85).then(function(dataUrl){
      chosenPhoto = dataUrl;
      refreshPhotoPreview();
    }).catch(function(){
      toast("画像の読み込みに失敗しました");
    });
  });
  elClearPhotoBtn.addEventListener("click", function(){
    chosenPhoto = null;
    elPhotoInput.value = "";
    refreshPhotoPreview();
  });

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var name = elName.value.trim();
    if(!name){ elName.focus(); toast("人物名を入力してください"); return; }
    var isEditingReal = !!(existingOshi && existingOshi.id);
    var groups = Array.prototype.map.call(form.querySelectorAll(".group-name-input"), function(inp){
      var idx = inp.getAttribute("data-group-idx");
      var colorInput = form.querySelector('.group-color-input[data-group-color-idx="'+idx+'"]');
      var g = {
        id: (draftGroups[idx] && draftGroups[idx].id) || uuid(),
        name: inp.value.trim(),
        color: colorInput ? colorInput.value : ""
      };
      GROUP_SNS_KEYS.forEach(function(k){ g["sns_"+k] = chosenSns["grp"+idx+"_"+k] || ""; });
      return g;
    }).filter(function(g){
      return g.name || g.sns_web || g.sns_instagram || g.sns_x || g.sns_tiktok || g.sns_youtube;
    });
    var oshi = {
      id: isEditingReal ? existingOshi.id : uuid(),
      agency: elAgency.value.trim(),
      groups: groups,
      name: name,
      photo: chosenPhoto,
      color: effectiveColor(groups),
      birthMonth: elBirthMonth.value ? Number(elBirthMonth.value) : null,
      birthDay: elBirthDay.value ? Number(elBirthDay.value) : null,
      birthYear: elBirthYear.value ? Number(elBirthYear.value) : null,
      mode: "pale",
      order: isEditingReal ? existingOshi.order : state.oshis.length,
      createdAt: isEditingReal ? existingOshi.createdAt : Date.now()
    };
    SNS_KEYS.forEach(function(k){ oshi["sns_person_"+k] = chosenSns["person_"+k] || ""; });
    await persistOshi(oshi);
    if(!state.activeOshiId){ await setActiveOshi(oshi.id); }
    closeSheet();
    toast(isEditingReal ? "推しを更新しました" : "推しを登録しました");
    render();
  });

  var delBtn = form.querySelector("[data-action=delete-oshi]");
  if(delBtn){
    delBtn.addEventListener("click", async function(){
      if(!confirm("この推しと担当カラーの設定を削除しますか？記録は残ります。")) return;
      var id = delBtn.getAttribute("data-id");
      await removeOshi(id);
      if(state.activeOshiId===id){
        var next = state.oshis.find(function(o){return o.id!==id;});
        await setActiveOshi(next?next.id:null);
      }
      closeSheet();
      toast("推しを削除しました");
      render();
    });
  }
}

function bindRecordForm(type,existingRec){
  var form = document.getElementById("recordForm");
  var chosenPhoto = existingRec ? (existingRec.photo || null) : null;
  var favOn = existingRec ? !!existingRec.favorite : false;
  var hideOn = existingRec ? !!existingRec.hidden : false;
  var elFavToggle = form.querySelector("#favToggle");
  var elHideToggle = form.querySelector("#hideToggle");
  function refreshToggles(){
    elFavToggle.classList.toggle("on", favOn);
    elHideToggle.classList.toggle("on", hideOn);
  }
  refreshToggles();
  elFavToggle.addEventListener("click", function(){ favOn = !favOn; refreshToggles(); });
  elHideToggle.addEventListener("click", function(){ hideOn = !hideOn; refreshToggles(); });

  /* The group select always mirrors whichever oshi is currently picked: its
     options are rebuilt from scratch when the oshi changes, defaulting to
     that oshi's main (top) group unless editing a record that already has
     a specific group saved on it. */
  var elOshiSelect = form.querySelector("#recOshiSelect");
  var elGroupSelect = form.querySelector("#recGroupSelect");
  function refreshGroupOptions(){
    var oshi = getOshi(elOshiSelect.value);
    var groups = oshi ? oshiGroupsList(oshi) : [];
    if(!groups.length){
      elGroupSelect.innerHTML = "";
      elGroupSelect.style.display = "none";
      return;
    }
    var keepSelected = existingRec && oshi && existingRec.oshiId===oshi.id ? existingRec.groupId : null;
    elGroupSelect.innerHTML = groups.map(function(g,i){
      var isSel = keepSelected ? (g.id===keepSelected) : (i===0);
      return '<option value="'+g.id+'" '+(isSel?"selected":"")+'>'+escapeHtml(g.name||"（名称未設定）")+'</option>';
    }).join("");
    elGroupSelect.style.display = "block";
  }
  refreshGroupOptions();
  elOshiSelect.addEventListener("change", refreshGroupOptions);

  var hasPhotoField = (type==="cheki" || type==="live");
  if(hasPhotoField){
    var elBtn = form.querySelector("#recPhotoPreviewBtn");
    var elMenu = form.querySelector("#recPhotoMenu");
    var elImg = form.querySelector("#recPhotoImg");
    var elPlaceholder = form.querySelector("#recPhotoPlaceholder");
    var elClearBtn = form.querySelector("#clearRecPhotoBtn");
    var elInput = form.querySelector("#recPhotoInput");

    function refreshRecPhoto(){
      if(chosenPhoto){
        elImg.src = chosenPhoto;
        elImg.style.display = "block";
        elPlaceholder.style.display = "none";
        elClearBtn.style.display = "block";
      } else {
        elImg.style.display = "none";
        elImg.src = "";
        elPlaceholder.style.display = "block";
        elClearBtn.style.display = "none";
      }
    }
    refreshRecPhoto();

    elBtn.addEventListener("click", function(e){
      e.stopPropagation();
      var wasOpen = elMenu.style.display === "block";
      elMenu.style.display = "none";
      if(!wasOpen){ openPopoverNear(elBtn, elMenu); }
    });
    form.addEventListener("click", function(e){
      if(!e.target.closest(".photo-picker")){ elMenu.style.display = "none"; }
    });
    elMenu.querySelectorAll(".photo-menu-item").forEach(function(item){
      item.addEventListener("click", function(){ elMenu.style.display = "none"; });
    });
    elInput.addEventListener("change", function(){
      var file = elInput.files && elInput.files[0];
      if(!file) return;
      if(file.type.indexOf("image/")!==0){ toast("画像ファイルを選択してください"); return; }
      if(type==="cheki"){
        PhotoEditor.open(file, function(dataUrl){
          elInput.value = "";
          if(dataUrl){
            chosenPhoto = dataUrl;
            refreshRecPhoto();
          }
        });
      } else {
        resizeImageFile(file, 640, 0.85).then(function(dataUrl){
          elInput.value = "";
          chosenPhoto = dataUrl;
          refreshRecPhoto();
        }).catch(function(){
          toast("画像の読み込みに失敗しました");
        });
      }
    });
    elClearBtn.addEventListener("click", function(){
      chosenPhoto = null;
      elInput.value = "";
      refreshRecPhoto();
    });
  }

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var fd = new FormData(form);
    var rec = { id: existingRec ? existingRec.id : uuid() };
    fd.forEach(function(v,k){ rec[k]=v; });
    if(rec.price!==undefined) rec.price = rec.price===""?0:Number(rec.price);
    if(rec.count!==undefined) rec.count = rec.count===""?1:Number(rec.count);
    if(rec.qty!==undefined) rec.qty = rec.qty===""?1:Number(rec.qty);
    if(hasPhotoField){ rec.photo = chosenPhoto; }
    rec.favorite = favOn;
    rec.hidden = hideOn;
    rec.createdAt = existingRec ? existingRec.createdAt : Date.now();
    await persistRecord(type,rec);
    closeSheet();
    toast(existingRec ? "記録を更新しました" : "記録を追加しました");
    render();
  });
  var delBtn = form.querySelector("[data-action=delete-record]");
  if(delBtn){
    delBtn.addEventListener("click", async function(){
      if(!confirm("この記録を削除しますか？")) return;
      await removeRecord(type, delBtn.getAttribute("data-id"));
      closeSheet();
      toast("記録を削除しました");
      render();
    });
  }
}

function openOshiSheet(oshi){
  openSheet(oshiFormHtml(oshi));
  bindOshiForm(oshi);
}
function openRecordSheet(type,rec){
  if(state.oshis.length===0){
    toast("先に推しを登録してください");
    openOshiSheet(null);
    return;
  }
  openSheet(recordFormHtml(type,rec));
  bindRecordForm(type,rec);
}

/* ============ events ============ */
function onAppClick(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");

  if(action==="add-oshi"){ openOshiSheet(null); return; }
  if(action==="sync-now"){ syncNow(); return; }
  if(action==="logout"){ logout(); return; }
  if(action==="edit-oshi"){ openOshiSheet(getOshi(el.getAttribute("data-id"))); return; }
  if(action==="set-active"){ setActiveOshi(el.getAttribute("data-id")).then(render); return; }
  if(action==="move-oshi"){ moveOshiStep(el.getAttribute("data-id"), el.getAttribute("data-dir")); return; }
  if(action==="filter-oshi"){ state.filterOshiId = el.getAttribute("data-id"); render(); return; }
  if(action==="toggle-hidden"){ state.showHidden = !state.showHidden; render(); return; }
  if(action==="stats-tab"){
    state.statsSubView = el.getAttribute("data-tab");
    state.calendarSelectedDate = null;
    renderStatsPage();
    return;
  }
  if(action==="share-summary"){ shareSummaryImage(); return; }
  if(action==="edit-record"){
    var type = el.getAttribute("data-type"), id = el.getAttribute("data-id");
    var rec = state[type].find(function(r){return r.id===id;});
    openRecordSheet(type,rec);
    return;
  }
}

document.addEventListener("DOMContentLoaded", function(){
  sheetBg = document.getElementById("sheetBg");
  sheetEl = document.getElementById("sheet");
  sheetEl.addEventListener("scroll", closePopoversOnSheetScroll);

  document.getElementById("app").addEventListener("click", onAppClick);

  var headerLogoBtn = document.getElementById("headerLogoBtn");
  var headerLogoMenu = document.getElementById("headerLogoMenu");
  var headerLogoInput = document.getElementById("headerLogoInput");
  var clearHeaderLogoBtn = document.getElementById("clearHeaderLogoBtn");
  headerLogoBtn.addEventListener("click", function(e){
    e.stopPropagation();
    var wasOpen = headerLogoMenu.style.display === "block";
    headerLogoMenu.style.display = "none";
    if(!wasOpen){ openPopoverNear(headerLogoBtn, headerLogoMenu); }
  });
  headerLogoInput.addEventListener("change", function(){
    var file = headerLogoInput.files && headerLogoInput.files[0];
    headerLogoMenu.style.display = "none";
    if(!file) return;
    if(file.type.indexOf("image/")!==0){ toast("画像ファイルを選択してください"); return; }
    /* No fixed output size: keep the image reasonably light for storage
       without forcing a crop, so any logo's natural aspect ratio survives.
       PNG output (not JPEG) so a transparent background stays transparent. */
    resizeImageFilePreserveAlpha(file, 480).then(function(dataUrl){
      headerLogoInput.value = "";
      state.headerLogo = dataUrl;
      saveLocal();
      refreshHeaderLogo();
    }).catch(function(){
      toast("画像の読み込みに失敗しました");
    });
  });
  clearHeaderLogoBtn.addEventListener("click", function(){
    state.headerLogo = null;
    saveLocal();
    refreshHeaderLogo();
    headerLogoMenu.style.display = "none";
  });
  document.addEventListener("click", function(e){
    if(!e.target.closest("#headerLogoBtn") && !e.target.closest("#headerLogoMenu")){
      headerLogoMenu.style.display = "none";
    }
  });

  var topChip = document.getElementById("topChip");
  var topChipMenu = document.getElementById("topChipMenu");
  topChip.addEventListener("click", function(e){
    e.stopPropagation();
    var wasOpen = topChipMenu.style.display === "block";
    topChipMenu.style.display = "none";
    if(!wasOpen && topChipMenu.innerHTML){ openPopoverNear(topChip, topChipMenu); }
  });
  topChipMenu.addEventListener("click", function(e){
    var item = e.target.closest("[data-set-active-oshi]");
    if(item){
      topChipMenu.style.display = "none";
      setActiveOshi(item.getAttribute("data-set-active-oshi")).then(render);
      return;
    }
    if(e.target.closest('[data-action="goto-oshi-page"]')){
      topChipMenu.style.display = "none";
      state.view = "oshi";
      render();
      return;
    }
    if(e.target.closest('[data-action="add-oshi"]')){
      topChipMenu.style.display = "none";
    }
  });
  document.addEventListener("click", function(e){
    if(!e.target.closest("#topChip") && !e.target.closest("#topChipMenu")){
      topChipMenu.style.display = "none";
    }
  });

  document.querySelectorAll("nav.tabs button").forEach(function(b){
    b.addEventListener("click", function(){
      state.view = b.getAttribute("data-view");
      state.filterOshiId = "all";
      render();
    });
  });

  document.getElementById("fabBtn").addEventListener("click", function(){
    var v = state.view;
    var type = (v==="live"||v==="cheki"||v==="goods") ? v : "live";
    openRecordSheet(type,null);
  });

  sheetBg.addEventListener("click", function(e){ if(e.target===sheetBg) closeSheet(); });

  PhotoEditor.init();
  initStorage();
});
})();
</script>
</body>
</html>
