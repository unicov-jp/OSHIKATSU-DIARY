/* ============ 1日あたりの利用上限（費用の歯止め） ============
   外部の有料APIを呼ぶ回数を、端末ごとに1日あたりで数えて止める。
   Google Cloud 側の割り当て上限と二段構えにするための、アプリ側の上限。 */
var UsageLimit = (function(){
  var KEY = "oshikatsu_usage_v1";
  var LIMITS = {
    mapLoad:     {max:200, label:"地図の読み込み"},
    geocode:     {max:100, label:"座標の取得"},
    placeSearch: {max:50,  label:"会場の検索"}
  };
  var warned = {};
  function today(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function read(){
    var v = null;
    try{ v = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){}
    if(!v || v.day!==today() || typeof v.counts!=="object" || !v.counts) v = {day:today(), counts:{}};
    return v;
  }
  function used(kind){ return Number(read().counts[kind]) || 0; }
  function canUse(kind){ return used(kind) < LIMITS[kind].max; }
  // 1回分を使う。上限に達していれば false を返し、数えない
  function take(kind){
    var v = read();
    var n = Number(v.counts[kind]) || 0;
    if(n >= LIMITS[kind].max) return false;
    v.counts[kind] = n+1;
    try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){}
    return true;
  }
  function message(kind){
    return "本日の"+LIMITS[kind].label+"の上限（"+LIMITS[kind].max+"回）に達したため停止しています。明日また使えます。";
  }
  // 上限の案内をトーストで出す（同じ日に同じ種類は1回だけ）
  function warnOnce(kind){
    var k = kind+"@"+today();
    if(warned[k]) return;
    warned[k] = true;
    toast("本日の"+LIMITS[kind].label+"の上限に達しました");
  }
  return { take:take, canUse:canUse, used:used, message:message, warnOnce:warnOnce, limits:LIMITS };
})();

/* ============ Google Maps (会場の検索・位置情報) ============
   会場名の入力中に Places API (New) の候補を出し、選ばれた場所の
   Place ID・正式名称・住所・緯度経度を LIVE 記録の venuePlace に保存する
   （遠征マップ用）。APIキーは /api/config の googleMapsApiKey から受け取り、
   キーが無いときは会場を手入力するだけになる。 */
var MapsPlaces = (function(){
  var loading = null;
  var failed = false;
  function available(){ return !failed && !!(appConfig && appConfig.googleMapsApiKey); }
  function load(){
    if(!available()) return Promise.reject(new Error("Google Maps API key is not configured"));
    if(loading) return loading;
    loading = new Promise(function(resolve, reject){
      if(window.google && google.maps && google.maps.importLibrary){ resolve(); return; }
      window.__oshikatsuMapsReady = function(){ resolve(); };
      window.gm_authFailure = function(){ failed = true; console.warn("Google Maps API key was rejected"); };
      var s = document.createElement("script");
      s.src = "https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(appConfig.googleMapsApiKey)
        + "&v=weekly&loading=async&language=ja&region=JP&callback=__oshikatsuMapsReady";
      s.async = true;
      s.onerror = function(){ loading = null; reject(new Error("Google Maps failed to load")); };
      document.head.appendChild(s);
    }).then(function(){ return google.maps.importLibrary("places"); });
    loading.catch(function(){ loading = null; });
    return loading;
  }
  return { available:available, load:load };
})();

/* Googleマップで場所を開くURL（APIキー不要） */
function mapsUrlFor(venue, place){
  var q = place && place.name ? place.name+(place.address ? " "+place.address : "") : (venue||"");
  var url = "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
  if(place && place.placeId) url += "&query_place_id="+encodeURIComponent(place.placeId);
  return url;
}

/* LIVEフォームの会場欄に「探す」ボタンを付ける。押すと Google マップ（Places API (New) のテキスト検索）で
   会場名を探し、選んだ場所の正式名称・住所・緯度経度・Place ID を入れる。返り値の getPlace() で、
   入力中の会場名と一致する選択済みの場所（なければ null）を返す。 */
function bindVenueAutocomplete(form, existingRec){
  var input = form.querySelector('[name="venue"]');
  var btn = form.querySelector("#venueSearchBtn");
  var list = form.querySelector("#venueSuggest");
  var info = form.querySelector("#venuePlaceInfo");
  var place = existingRec && existingRec.venuePlace && existingRec.venuePlace.name===existingRec.venue ? existingRec.venuePlace : null;
  var seq = 0, items = [];

  function renderInfo(){
    var v = input.value.trim();
    if(place){
      info.innerHTML = (place.address ? '<span class="venue-address">'+escapeHtml(place.address)+'</span>' : '')
        + '<a href="'+escapeHtml(mapsUrlFor(v, place))+'" target="_blank" rel="noopener noreferrer">Googleマップで開く</a>';
    } else if(v){
      info.innerHTML = '<a href="'+escapeHtml(mapsUrlFor(v, null))+'" target="_blank" rel="noopener noreferrer">Googleマップで開く</a>';
    } else {
      info.innerHTML = "";
    }
  }
  function hideList(){ list.hidden = true; list.innerHTML = ""; items = []; }
  function showList(){
    if(!items.length){ hideList(); return; }
    list.innerHTML = items.map(function(it, i){
      return '<button type="button" class="venue-suggest-item" data-idx="'+i+'">'
        + '<span class="main">'+escapeHtml(it.name)+'</span>'
        + (it.address ? '<span class="sub">'+escapeHtml(it.address)+'</span>' : '')
        + '</button>';
    }).join("");
    list.hidden = false;
  }
  function setBusy(on){
    btn.disabled = !!on;
    btn.classList.toggle("busy", !!on);
  }
  // 住所の先頭の「日本、〒123-4567 」は省く
  function shortAddress(a){ return (a||"").replace(/^日本、\s*/, "").replace(/^〒\d{3}-?\d{4}\s*/, ""); }
  // Google マップの APIキーが無い（または使えない）ときは OpenStreetMap（Nominatim）で探す
  async function searchOsm(q){
    if(!UsageLimit.take("geocode")){ UsageLimit.warnOnce("geocode"); return []; }
    var url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=jp&accept-language=ja&namedetails=1&q="+encodeURIComponent(q);
    var res = await fetch(url, {headers:{"Accept":"application/json"}});
    var list = res.ok ? await res.json() : [];
    return (list||[]).map(function(p){
      // display_name は「名前, 町名, 区, 都道府県, 郵便番号, 日本」の順なので、日本の住所の順に並べ直す
      var parts = String(p.display_name||"").split(/,\s*/);
      var name = p.name || (p.namedetails && p.namedetails.name) || parts[0] || q;
      if(parts[0]===name) parts.shift();
      var seg = parts.filter(function(x){ return x!=="日本" && !/^\d{3}-?\d{4}$/.test(x); }).reverse();
      // 「高輪」「高輪4丁目」のように続く部分に含まれる地名は省く
      var addr = seg.filter(function(x, i){ return !(seg[i+1] && seg[i+1].indexOf(x)===0); }).join("");
      return {placeId:"", name:name, address:addr, lat:Number(p.lat), lng:Number(p.lon)};
    }).filter(function(it){ return isFinite(it.lat) && isFinite(it.lng); });
  }
  async function search(){
    var q = input.value.trim();
    if(!q){ toast("会場名を入力してください"); input.focus(); return; }
    var mySeq = ++seq;
    if(!MapsPlaces.available()){
      setBusy(true);
      try{
        var found = await searchOsm(q);
        if(mySeq!==seq) return;
        items = found;
        if(!items.length) toast("見つかりませんでした");
        showList();
      }catch(e){
        console.warn("venue search (osm) failed", e);
        toast("会場を検索できませんでした");
        hideList();
      }finally{
        if(mySeq===seq) setBusy(false);
      }
      return;
    }
    if(!UsageLimit.take("placeSearch")){ hideList(); UsageLimit.warnOnce("placeSearch"); return; }
    setBusy(true);
    try{
      var lib = await MapsPlaces.load();
      var res = await lib.Place.searchByText({
        textQuery:q,
        fields:["id","displayName","formattedAddress","location"],
        language:"ja", region:"jp", maxResultCount:5
      });
      if(mySeq!==seq) return;
      items = ((res && res.places) || []).filter(function(p){ return p && p.location; }).slice(0,5).map(function(p){
        return {
          placeId:p.id,
          name:p.displayName || q,
          address:shortAddress(p.formattedAddress),
          lat:typeof p.location.lat==="function" ? p.location.lat() : p.location.lat,
          lng:typeof p.location.lng==="function" ? p.location.lng() : p.location.lng
        };
      });
      if(!items.length) toast("見つかりませんでした");
      showList();
    }catch(e){
      console.warn("venue search failed", e);
      // Google マップが使えないときは OpenStreetMap で探し直す
      try{
        var alt = await searchOsm(q);
        if(mySeq!==seq) return;
        items = alt;
        if(!items.length) toast("見つかりませんでした");
        showList();
      }catch(e2){
        toast("会場を検索できませんでした");
        hideList();
      }
    }finally{
      if(mySeq===seq) setBusy(false);
    }
  }
  function choose(it){
    hideList();
    place = {placeId:it.placeId||"", name:it.name, address:it.address, lat:it.lat, lng:it.lng};
    input.value = place.name;
    renderInfo();
  }

  input.setAttribute("autocomplete", "off");
  btn.addEventListener("click", search);
  input.addEventListener("input", function(){
    if(place && input.value.trim()!==place.name) place = null;
    seq++;
    setBusy(false);
    hideList();
    renderInfo();
  });
  list.addEventListener("click", function(e){
    var b = e.target.closest("[data-idx]");
    if(!b) return;
    choose(items[Number(b.getAttribute("data-idx"))]);
  });
  input.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ hideList(); }
    if(e.key==="Enter"){
      e.preventDefault();
      if(!list.hidden && items.length) choose(items[0]);
      else search();
    }
  });
  renderInfo();
  return {
    getPlace:function(){ return place && input.value.trim()===place.name ? place : null; }
  };
}

function authErrorMessage(err){
  var m = (err && err.message) ? String(err.message) : "";
  if(/Invalid login credentials/i.test(m)) return "メールアドレスまたはパスワードが正しくありません。";
  if(/Email not confirmed/i.test(m)) return "メールアドレスの確認が済んでいません。届いたメールのリンクを開いてください。";
  if(/already registered|already been registered/i.test(m)) return "このメールアドレスはすでに登録されています。ログインしてください。";
  if(/Password should be/i.test(m)) return "パスワードは6文字以上で入力してください。";
  if(/rate limit|security purposes|too many/i.test(m)) return "短時間に操作が集中しました。しばらく待ってからもう一度お試しください。";
  if(/provider is not enabled|Unsupported provider/i.test(m)) return "Googleログインが有効になっていません。管理者にお問い合わせください。";
  if(/manual linking/i.test(m)) return "Google認証の連携が有効になっていません。管理者にお問い合わせください。";
  if(/already linked|identity_already_exists|Identity is already/i.test(m)) return "このGoogleアカウントは、別のアカウントですでに使われています。";
  if(/single identity|at least 2 identities|at least two/i.test(m)) return "ログイン方法がなくなるため解除できません。";
  if(/different from the old password/i.test(m)) return "今と同じパスワードは設定できません。";
  if(/reauthentication|reauthenticate/i.test(m)) return "安全のため、いったんログアウトしてログインし直してから変更してください。";
  if(/Failed to fetch|NetworkError|network/i.test(m)) return "通信に失敗しました。ネット接続を確認してください。";
  return "エラーが発生しました"+(m ? "（"+m+"）" : "")+"。";
}

function bindAuthForm(root, mode, switchMode){
  var form = root.querySelector("[data-auth-form]");
  var msg = root.querySelector("#authMsg");
  var submitBtn = root.querySelector("#authSubmit");
  function showMsg(text, kind){ msg.textContent = text; msg.className = "auth-msg "+(kind||""); }

  root.querySelectorAll("[data-auth-mode]").forEach(function(b){
    b.addEventListener("click", function(){ switchMode(b.getAttribute("data-auth-mode")); });
  });
  var googleBtn = root.querySelector('[data-auth="google"]');
  if(googleBtn){
    googleBtn.addEventListener("click", async function(){
      googleBtn.disabled = true;
      var res = await sb.auth.signInWithOAuth({provider:"google", options:{redirectTo:appUrl()}});
      if(res.error){ googleBtn.disabled = false; showMsg(authErrorMessage(res.error), "error"); }
    });
  }
  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var email = root.querySelector("#authEmail").value.trim();
    var pwEl = root.querySelector("#authPassword");
    var password = pwEl ? pwEl.value : "";
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showMsg("メールアドレスを正しく入力してください。", "error"); return; }
    if(mode!=="reset" && password.length<6){ showMsg("パスワードは6文字以上で入力してください。", "error"); return; }
    submitBtn.disabled = true;
    showMsg("送信中…", "");
    var res;
    try{
      if(mode==="login"){
        res = await sb.auth.signInWithPassword({email:email, password:password});
        if(res.error) throw res.error;
        toast("ログインしました");
        return;
      }
      if(mode==="signup"){
        res = await sb.auth.signUp({email:email, password:password, options:{emailRedirectTo:appUrl()}});
        if(res.error) throw res.error;
        if(res.data && res.data.session){
          toast("登録してログインしました");
          return;
        }
        showMsg("確認メールを送りました。メール内のリンクを開くと登録が完了し、ログインできます。", "ok");
        return;
      }
      res = await sb.auth.resetPasswordForEmail(email, {redirectTo:appUrl()});
      if(res.error) throw res.error;
      showMsg("再設定用のメールを送りました。メール内のリンクを開いて、新しいパスワードを設定してください。", "ok");
    }catch(err){
      showMsg(authErrorMessage(err), "error");
    }finally{
      if(submitBtn.isConnected) submitBtn.disabled = false;
    }
  });
}

function openNewPasswordSheet(mode){
  var title = mode==="change" ? "パスワードを変更" : (mode==="set" ? "パスワードを設定" : "新しいパスワードを設定");
  var html = '<h2 class="mincho">'+title+'</h2>'

    + '<div class="field"><label for="newPw1">新しいパスワード（6文字以上）</label><input type="password" id="newPw1" autocomplete="new-password" minlength="6" required></div>'

    + '<div class="sheet-actions">'
    +   '<button type="button" class="btn ghost" id="newPwCancel">'+(mode ? 'キャンセル' : 'あとで')+'</button>'
    +   '<button type="submit" class="btn primary" id="newPwSubmit">設定する</button>'
    + '</div></form>';
  openSheet(html);
  var msg = document.getElementById("newPwMsg");
  document.getElementById("newPwCancel").addEventListener("click", closeSheet);
  document.getElementById("newPwForm").addEventListener("submit", async function(e){
    e.preventDefault();
    var p1 = document.getElementById("newPw1").value, p2 = document.getElementById("newPw2").value;
    if(p1.length<6){ msg.textContent = "パスワードは6文字以上で入力してください。"; msg.className = "auth-msg error"; return; }
    if(p1!==p2){ msg.textContent = "2つのパスワードが一致しません。"; msg.className = "auth-msg error"; return; }
    var btn = document.getElementById("newPwSubmit");
    btn.disabled = true;
    var res = await sb.auth.updateUser({password:p1, data:{has_password:true}});
    // 「前と同じパスワード」で断られた＝すでにパスワードがあるので、目印だけ付けて成功扱いにする
    if(res.error && /different from the old password/i.test(res.error.message||"")){
      res = await sb.auth.updateUser({data:{has_password:true}});
    }
    btn.disabled = false;
    if(res.error){ msg.textContent = authErrorMessage(res.error); msg.className = "auth-msg error"; return; }
    if(cloud.user) cloud.user.passwordSet = true;
    closeSheet();
    toast(mode==="set" ? "パスワードを設定しました" : "パスワードを変更しました");
    if(state.view==="oshi") render();
    refreshAuthInfo();
  });
}

async function persistOshi(oshi){
  var idx = state.oshis.findIndex(function(o){return o.id===oshi.id;});
  if(idx>=0) state.oshis[idx]=oshi; else state.oshis.push(oshi);

}
/* 削除した記録の中身は、クラウドへ「削除済み」を送るときに一緒に送る（あとで戻せるように） */
function rememberDeleted(kind, rec){
  if(!cloud.user || !rec || !rec.id) return;
  cloud.tomb[kind+":"+rec.id] = rec;
}
async function removeOshi(id){
  rememberDeleted("oshi", state.oshis.find(function(o){ return o.id===id; }));
  state.oshis = state.oshis.filter(function(o){return o.id!==id;});
  saveLocal();
}

}
async function persistRecord(type,rec){

function getOshi(id){

/* An oshi can belong to more than one group at once (兼任). oshi.groups is
   the canonical list: [{id,name,sns_instagram,sns_x,sns_tiktok,sns_youtube}].
   Oshi saved before this existed only had a single "group" string plus flat
   "sns_group_*" fields; those are read as a one-item list here so old data
   keeps showing and editing correctly without a separate migration step. */
function oshiGroupsList(oshi){
  if(oshi.groups && oshi.groups.length) return oshi.groups;
  if(oshi.group){
    return [{
      id:"legacy",
      name: oshi.group,
      color:"",
      sns_web:"",
      sns_instagram: oshi.sns_group_instagram||"",
      sns_x: oshi.sns_group_x||"",
      sns_tiktok: oshi.sns_group_tiktok||"",
      sns_youtube: oshi.sns_group_youtube||""
    }];
  }
  return [];
}
/* The first group in the list is always treated as the "main" affiliation;
   order alone determines main/sub, so no separate sort is needed here. */
function oshiGroupNames(oshi){
  return oshiGroupsList(oshi).map(function(g){ return g.name; }).filter(Boolean);
}
function oshiFullLabel(o){
  var parts = oshiGroupNames(o).slice();
  parts.push(o.name);
  return parts.join(" ・ ");
}
function oshiSubLabel(o){
  var parts=[];
  if(o.agency) parts.push(o.agency);
  var names = oshiGroupNames(o);
  if(names.length) parts.push(names[0]);
  return parts.join(" ／ ");
}
function oshiBirthdayLabel(o){
  if(o.birthMonth && o.birthDay) return o.birthMonth+"/"+o.birthDay;
  return null;
}
function oshiAge(o){
  if(!o.birthYear) return null;
  var now = new Date();
  var age = now.getFullYear() - o.birthYear;
  if(o.birthMonth && o.birthDay){
    var passed = (now.getMonth()+1 > o.birthMonth) || (now.getMonth()+1===o.birthMonth && now.getDate() >= o.birthDay);
    if(!passed) age--;
  }
  return age>=0 ? age : null;
}
function isBirthdayToday(o){
  if(!o.birthMonth || !o.birthDay) return false;
  var now = new Date();
  return Number(o.birthMonth)===now.getMonth()+1 && Number(o.birthDay)===now.getDate();
}
// 推しの写真（丸いアイコン）。ドライブの写真で端末に無いときは、担当カラーで表示してから後で写真を入れる

    return "background-color:"+o.color+";background-size:cover;background-position:center;"+DrivePhotos.bgStyle(o.photo, AVATAR_GRAD);

}
// JS で style を入れる要素（上部の推しの丸など）用
function applyOshiSwatch(el, o){

}

var SNS_META = {
  web:{label:"公式HP", isUrl:true, icon:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.2-3.5-8.5s1.2-6.1 3.5-8.5z"/>', url:function(v){ return safeWebUrl(v); }},
  instagram:{label:"Instagram", icon:'<rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".9" fill="currentColor" stroke="none"/>', url:function(id){ return "https://instagram.com/"+encodeURIComponent(id.replace(/^@+/,"")); }},
  x:{label:"X", icon:'<line x1="4.5" y1="4.5" x2="19.5" y2="19.5"/><line x1="19.5" y1="4.5" x2="4.5" y2="19.5"/>', url:function(id){ return "https://x.com/"+encodeURIComponent(id.replace(/^@+/,"")); }},
  tiktok:{label:"TikTok", icon:'<path d="M13.5 3.5v11.2a3.3 3.3 0 11-2.8-3.26"/><path d="M13.5 3.5c.4 2.6 2.1 4.3 4.8 4.6v2.6c-1.8-.1-3.4-.7-4.8-1.7"/>', url:function(id){ return "https://www.tiktok.com/@"+encodeURIComponent(id.replace(/^@+/,"")); }},
  youtube:{label:"YouTube", icon:'<rect x="2.5" y="5.5" width="19" height="13" rx="3.5"/><path d="M10 9.3l5 2.7-5 2.7z" fill="currentColor" stroke="none"/>', url:function(id){
    /* A YouTube "channel ID" (UCxxxxxxxxxxxxxxxxxxxxxx, 24 chars) only
       resolves under /channel/, never under /@ — unlike a handle, which
       needs the @ prefix. Route each to the URL it actually works with. */
    if(/^UC[0-9A-Za-z_-]{22}$/.test(id)) return "https://www.youtube.com/channel/"+encodeURIComponent(id);
    return "https://www.youtube.com/@"+encodeURIComponent(id.replace(/^@+/,""));
  }}
};
var SNS_KEYS = ["instagram","x","tiktok","youtube"];
/* グループは末尾に「公式HP」（IDではなくURLを保存）を持つ。
   個人SNSと同じ並びのアイコンが縦にそろうよう、共通の4つを先に並べる。 */
var GROUP_SNS_KEYS = SNS_KEYS.concat(["web"]);
/* 個人も同じ並び（Instagram・X・TikTok・YouTube・公式HP）にする */
var PERSON_SNS_KEYS = GROUP_SNS_KEYS;
/* 公式HPのURLを http(s) のみに正規化する。スキーム省略時は https:// を補う。
   javascript: など http(s) 以外は空文字にしてリンクにしない。 */
function safeWebUrl(v){
  v = (v||"").trim();
  if(!v) return "";
  if(!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = "https://"+v.replace(/^\/+/, "");
  try{
    var u = new URL(v);
    if(u.protocol!=="http:" && u.protocol!=="https:") return "";
    if(!u.hostname || u.hostname.indexOf(".")<0) return "";
    return u.href;
  }catch(e){ return ""; }
}
/* SNS fields store a bare ID (e.g. "hakane_kono"), not a full URL. A value
   already starting with http(s):// is treated as a legacy full URL (saved
   before this change) and used as-is, so old data keeps working. */
function snsIsLegacyUrl(v){ return /^https?:\/\//i.test(v||""); }
function snsHref(key, storedVal){
  if(!storedVal) return "";
  if(SNS_META[key].isUrl) return safeWebUrl(storedVal);
  if(snsIsLegacyUrl(storedVal)) return storedVal;
  return SNS_META[key].url(storedVal);
}
/* For editing: show a bare ID in the input even if the stored value is a
   legacy full URL, by extracting the last path segment. */
function snsIdForEdit(storedVal){
  if(!storedVal) return "";
  if(!snsIsLegacyUrl(storedVal)) return storedVal;
  try{
    var parts = storedVal.split("?")[0].split("#")[0].split("/").filter(Boolean);
    return (parts[parts.length-1] || "").replace(/^@+/, "");
  }catch(e){ return storedVal; }
}
/* The person's own SNS lives directly on the oshi ("sns_person_<key>"),
   falling back to the pre-groups flat "sns_<key>" fields for old data. */
function getSnsValue(oshi, scope, key){
  var scoped = oshi["sns_"+scope+"_"+key];
  if(scoped) return scoped;
  if(scope==="person" && oshi["sns_"+key]) return oshi["sns_"+key];
  return "";
}
/* Renders one platform's icon: a clickable, full-color link when the value
   is registered, or a faded, non-clickable placeholder when it isn't — so
   every platform is always visible and registration status reads at a glance. */
function snsIconHtml(k, val){
  var meta = SNS_META[k];
  if(val && snsHref(k, val)){
    return '<a href="'+escapeHtml(snsHref(k, val))+'" target="_blank" rel="noopener noreferrer" title="'+meta.label+'" aria-label="'+meta.label+'">'
      + '<svg viewBox="0 0 24 24">'+meta.icon+'</svg></a>';
  }
  return '<span class="unregistered" title="'+meta.label+'（未登録）" aria-label="'+meta.label+'（未登録）">'
    + '<svg viewBox="0 0 24 24">'+meta.icon+'</svg></span>';
}
function snsIconsHtml(oshi, scope){
  var hasAny = PERSON_SNS_KEYS.some(function(k){ return getSnsValue(oshi, scope, k); });
  if(!hasAny) return "";
  return PERSON_SNS_KEYS.map(function(k){ return snsIconHtml(k, getSnsValue(oshi, scope, k)); }).join("");
}
/* Same as snsIconsHtml, but for one group object's own sns_<key> fields
   (a group isn't "scoped" off the oshi the way person/legacy data is —
   each group in oshi.groups carries its fields directly). */
function groupSnsIconsHtml(group){
  var hasAny = GROUP_SNS_KEYS.some(function(k){ return group["sns_"+k]; });
  if(!hasAny) return "";
  return GROUP_SNS_KEYS.map(function(k){ return snsIconHtml(k, group["sns_"+k]); }).join("");
}
/* Renders the person's SNS row, then one row per group the oshi belongs to
   (掛け持ち-friendly), each labeled with that group's own real name rather
   than a generic "グループ" caption. Rows with nothing registered are
   omitted entirely. */
/* 個人とグループは同じ5つ（Instagram・X・TikTok・YouTube・公式HP）を同じ順で並べ、
   列をそろえる。名前の欄は残りの幅を使い、入りきらないときだけ省略する。 */
function snsLinksHtml(oshi, variant){
  var onAccent = variant==="hero";
  var linksCls = 'sns-links'+(onAccent?' on-accent':'');
  function caption(color, text){
    return '<span class="sns-caption">'
      + (color? '<span class="group-color-dot" style="background:'+color+'"></span>' : '')
      + '<span class="sns-caption-text">'+escapeHtml(text)+'</span>'
      + '</span>';
  }
  var groupRows = "";
  oshiGroupsList(oshi).forEach(function(g){
    var icons = groupSnsIconsHtml(g);
    if(!icons) return;
    groupRows += '<div class="sns-scope-row">'+caption(g.color, g.name||"グループ")+'<div class="'+linksCls+'">'+icons+'</div></div>';
  });
  var rows = "";
  var personIcons = snsIconsHtml(oshi, "person");
  if(personIcons){
    var mainColor = (oshiGroupsList(oshi)[0] && oshiGroupsList(oshi)[0].color) || "";
    rows += '<div class="sns-scope-row">'+caption(mainColor, "個人")+'<div class="'+linksCls+'">'+personIcons+'</div></div>';
  }
  rows += groupRows;
  if(!rows) return "";
  return '<div class="sns-block'+(onAccent?' on-accent':'')+'">'+rows+'</div>';
}
function activeOshi(){ return getOshi(state.activeOshiId); }
/* 非表示にした推し（oshi.hidden）は、推しの切り替え・絞り込み・記録の推し選択に出さない。
   記録や集計には残る。 */
function visibleOshis(){ return state.oshis.filter(function(o){ return !o.hidden; }); }
/* LIVEの配信URL。複数は streamUrls 配列、以前の記録は streamUrl 1件 */
/* LIVEの観戦方法：viewing が "venue"（現地）/ "stream"（配信）/ "tbd"（未定。アイコンはグレー）。
   参戦回数・遠征マップに数えるのは「現地」だけ。
   未設定の以前の記録は、配信URLがあって会場が空なら配信、それ以外は現地とみなす */
var VIEWING_ICON = {
  venue:'<svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0113 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  stream:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M10.5 8.8v5.4l4.3-2.7z"/></svg>',
  tbd:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 014.8.9c0 1.7-2.4 2.1-2.4 3.6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>'
};
var VIEWING_LABEL = {venue:"現地", stream:"配信", tbd:"未定"};
function recViewing(r){
  if(r.viewing==="venue" || r.viewing==="stream" || r.viewing==="tbd") return r.viewing;
  return (recStreamUrls(r).length && !(r.venue||"").trim()) ? "stream" : "venue";
}
/* LIVE記録から Google カレンダーの予定作成URLを作る（APIキー不要）。
   開始＝開始時刻→開場時刻、終了＝終了時刻→開始の2時間後。時刻が無ければ終日の予定。 */
function googleCalendarUrl(r){
  var d = (r.date||"").replace(/-/g,"");
  function hm(t){ return /^\d{2}:\d{2}$/.test(t||"") ? t.replace(":","")+"00" : ""; }
  function addDays(ymd, n){
    var dt = new Date(Number(ymd.slice(0,4)), Number(ymd.slice(4,6))-1, Number(ymd.slice(6,8))+n);
    return dt.getFullYear()+String(dt.getMonth()+1).padStart(2,"0")+String(dt.getDate()).padStart(2,"0");
  }
  var startT = hm(r.startTime) || hm(r.openTime);
  var dates;
  if(d.length===8 && startT){
    var endT = hm(r.endTime), endD = d;
    if(!endT){
      var h2 = Number(startT.slice(0,2))+2;
      if(h2>=24){ h2 -= 24; endD = addDays(d,1); }
      endT = String(h2).padStart(2,"0")+startT.slice(2);
    } else if(endT<=startT){
      endD = addDays(d,1);   // 日付をまたぐ公演
    }
    dates = d+"T"+startT+"/"+endD+"T"+endT;
  } else if(d.length===8){
    dates = d+"/"+addDays(d,1);
  }
  var detailsText = calendarDescFor(r);
  var place = r.venuePlace && r.venuePlace.name ? r.venuePlace.name+(r.venuePlace.address ? " "+r.venuePlace.address : "") : (r.venue||"");
  var q = "action=TEMPLATE&text="+encodeURIComponent(calendarTitleFor(r))
    + (dates ? "&dates="+dates : "")
    + "&ctz=Asia%2FTokyo"
    + (detailsText ? "&details="+encodeURIComponent(detailsText) : "")
    + (place ? "&location="+encodeURIComponent(place) : "");
  return "https://calendar.google.com/calendar/render?"+q;
}
/* 予定タイトルの差し込み項目。マイページで {公演名}{グループ}{会場}{観戦方法} を組み合わせて指定する */
function recGroupLabels(r){
  var groups = [];
  recOshiEntries(r).forEach(function(e){
    var o = getOshi(e.oshiId); if(!o) return;
    var gs = oshiGroupsList(o);
    var g = gs.find(function(x){ return x.id===e.groupId; }) || gs[0];
    var label = g && g.name ? g.name : o.name;
    if(groups.indexOf(label)<0) groups.push(label);
  });
  return groups;
}
function calendarTitleFor(r, template){
  var tpl = (template!=null ? template : state.calendarTitle||"").trim() || "{公演名}";
  // 差し込み項目は説明と共通（タイトルでは改行の代わりに空白でつなぐ）
  var values = calendarTokenValues(r);
  var out = tpl.replace(CAL_TOKEN_RE, function(_, k){ return values[k].replace(/\n/g," "); })
    .replace(/\s{2,}/g, " ").trim();
  return out || r.title || "LIVE";
}
/* 予定の説明。マイページの形（差し込み項目つき）で作り、空なら標準の説明にする。
   差し込み項目がすべて空になった行は省く（時刻を入れていない記録の「開場 {開場}」など） */
var CAL_DESC_TOKENS = ["公演名","グループ","会場","観戦方法","開場","開始","終了","チケットURL","配信URL"];
var CAL_TOKEN_RE = /\{(公演名|グループ|会場|観戦方法|開場|開始|終了|チケットURL|配信URL)\}/g;
function calendarTokenValues(r){
  return {
    "公演名": r.title||"",
    "グループ": recGroupLabels(r).join(" / "),
    "会場": r.venue||"",
    "観戦方法": VIEWING_LABEL[recViewing(r)],
    "開場": r.openTime||"",
    "開始": r.startTime||"",
    "終了": r.endTime||"",
    "チケットURL": safeWebUrl(r.ticketUrl)||"",
    "配信URL": recStreamUrls(r).join("\n")
  };
}
var CAL_DESC_DEFAULT = "開場 {開場}\n開始 {開始}\n終了 {終了}\n出演：{グループ}\nチケット：{チケットURL}\n配信：{配信URL}";
function calendarDescFor(r, template){
  var tpl = (template!=null ? template : state.calendarDesc||"");
  var sUrls = recStreamUrls(r);
  if(!tpl.trim()){
    tpl = CAL_DESC_DEFAULT;
    // 標準の説明では、配信URLが複数あるとき「配信1」「配信2」…と番号を付ける
    if(sUrls.length>1) tpl = tpl.replace("配信：{配信URL}", sUrls.map(function(u, i){ return "配信"+(i+1)+"："+u; }).join("\n"));
  }
  var values = calendarTokenValues(r);
  var re = CAL_TOKEN_RE;
  return tpl.split("\n").map(function(line){
    var tokens = line.match(re);
    if(tokens && tokens.every(function(t){ return !values[t.slice(1,-1)]; })) return null;
    return line.replace(re, function(_, k){ return values[k]; });
  }).filter(function(line){ return line!==null; }).join("\n").trim();
}
// 日付が明日以降の記録（これからの予定）。参戦回数や遠征マップには数えない
function isFutureRec(r){ return !!(r && r.date && r.date > todayYmdStr()); }
function recStreamUrls(r){
  var list = Array.isArray(r.streamUrls) ? r.streamUrls : (r.streamUrl ? [r.streamUrl] : []);
  return list.map(safeWebUrl).filter(Boolean);
}
// 金額は千円単位（K）で表す（例：¥7,000 → ¥7K、¥12,500 → ¥12.5K）。アプリ課金の料金には使わない
function fmtK(n){
  n = Number(n)||0;
  if(!n) return "0";
  return (n/1000).toLocaleString("ja-JP", {maximumFractionDigits:1})+"K";
}
function fmtYen(n){ return "&#165;"+fmtK(n); }
function fmtYenPlain(n){ return "\u00A5"+fmtK(n); }
function fmtDate(d){
  if(!d) return "-";
  var parts = d.split("-");
  if(parts.length!==3) return d;
  return parts[1]+"/"+parts[2];
}
function fmtYm(d){
  if(!d) return "";
  var parts = d.split("-");
  if(parts.length!==3) return "";
  return parts[0]+"."+parts[1];
}
function escapeHtml(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
/* チェキの写真（複数可）。以前の1枚だけの記録は photo のみを持つ */
function recPhotos(r){
  if(r && Array.isArray(r.photos) && r.photos.length) return r.photos.filter(Boolean);
  return r && r.photo ? [r.photo] : [];
}
/* チェキ1件の枚数（枚数の欄と写真の数の多いほう） */
function chekiUnits(r){
  return Math.max(Number(r.count)||1, recPhotos(r).length, 1);
}
/* チェキ1枚ごとのお気に入り（favs が無い以前の記録は、記録全体の favorite） */
function chekiUnitFav(r, i){
  return Array.isArray(r.favs) ? !!r.favs[i] : !!r.favorite;
}
function recAmount(type,r){
  if(type==="live") return Number(r.price)||0;
  if(type==="cheki") return Number(r.price)||0;
  if(type==="goods") return (Number(r.price)||0)*(Number(r.qty)||1);
  return 0;
}
/* 記録に紐づく推し。先頭が oshiId/groupId、対バンなどで追加した推しは
   extraOshis: [{oshiId, groupId}] に入る（LIVEのみ）。 */
function recOshiEntries(r){
  var out = [], seen = {};
  function add(oshiId, groupId){
    if(!oshiId || seen[oshiId]) return;
    seen[oshiId] = true;
    out.push({oshiId:oshiId, groupId:groupId||""});
  }
  add(r.oshiId, r.groupId);
  (r.extraOshis||[]).forEach(function(e){ if(e) add(e.oshiId, e.groupId); });
  return out;
}
function recHasOshi(r, oshiId){
  if(r.oshiId===oshiId) return true;
  return (r.extraOshis||[]).some(function(e){ return e && e.oshiId===oshiId; });
}
/* 推しごとの金額。複数の推しに紐づく記録（対バン）は人数で均等に割る */
function recAmountForOshi(type, r, oshiId){
  if(!recHasOshi(r, oshiId)) return 0;
  return recAmount(type, r) / recOshiEntries(r).length;
}
function allRecordsForOshi(oshiId){
  var out=[];
  state.live.forEach(function(r){ if(oshiId==="all"||recHasOshi(r,oshiId)) out.push({type:"live",r:r}); });
  state.cheki.forEach(function(r){ if(oshiId==="all"||recHasOshi(r,oshiId)) out.push({type:"cheki",r:r}); });
  state.goods.forEach(function(r){ if(oshiId==="all"||recHasOshi(r,oshiId)) out.push({type:"goods",r:r}); });
  out.sort(function(a,b){ return (b.r.date||"").localeCompare(a.r.date||""); });
  return out;
}
function allRecordsFlat(){
  return allRecordsForOshi("all").filter(function(item){ return !item.r.hidden; });
}
function aggregateByOshi(){
  return state.oshis.map(function(o){
    var recs = allRecordsFlat().filter(function(item){ return recHasOshi(item.r, o.id); });
    // 参戦＝現地観戦のみ（配信で観たLIVEと、これからのLIVEは数えない）
    var liveN = recs.filter(function(i){return i.type==="live" && recViewing(i.r)==="venue" && !isFutureRec(i.r);}).length;
    var chekiN = recs.filter(function(i){return i.type==="cheki";}).reduce(function(s,i){return s+chekiUnits(i.r);},0);
    var goodsN = recs.filter(function(i){return i.type==="goods";}).reduce(function(s,i){return s+(Number(i.r.qty)||1);},0);
    var total = Math.round(recs.reduce(function(s,i){ return s+recAmountForOshi(i.type,i.r,o.id); },0));
    return {oshi:o, liveN:liveN, chekiN:chekiN, goodsN:goodsN, total:total, itemCount:recs.length};
  }).sort(function(a,b){ return b.total-a.total; });
}
function aggregateByEvent(){
  var map = {};
  allRecordsFlat().forEach(function(item){
    var name = (item.r.title || "").trim();
    if(!name) return;
    if(!map[name]) map[name] = {name:name, count:0, total:0};
    map[name].count += (item.type==="cheki") ? chekiUnits(item.r) : (item.type==="goods" ? (Number(item.r.qty)||1) : 1);
    map[name].total += recAmount(item.type,item.r);
  });
  return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return b.count-a.count; });
}
function aggregateByMonth(monthsBack){
  var now = new Date();
  var months = [];
  for(var i=monthsBack-1;i>=0;i--){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"), label:(d.getMonth()+1)+"月", total:0, count:0});
  }
  var byKey = {};
  months.forEach(function(m){ byKey[m.key]=m; });
  allRecordsFlat().forEach(function(item){
    var key = (item.r.date||"").slice(0,7);
    if(byKey[key]){
      byKey[key].total += recAmount(item.type,item.r);
      byKey[key].count += 1;
    }
  });
  return months;
}
function recordsForDate(dateStr){
  return allRecordsFlat().filter(function(item){ return item.r.date===dateStr; });
}
function calendarDatesWithRecords(monthKey){
  var set = {};
  allRecordsFlat().forEach(function(item){
    if((item.r.date||"").slice(0,7)===monthKey) set[item.r.date] = (set[item.r.date]||0)+1;
  });
  return set;
}
function shiftMonth(monthKey, delta){
  var parts = monthKey.split("-");
  var d = new Date(Number(parts[0]), Number(parts[1])-1+delta, 1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}

      + '<svg viewBox="0 0 24 24"><path d="M12 3l2.6 6 6.4.6-4.9 4.2 1.5 6.2L12 16.9 6.4 20l1.5-6.2-4.9-4.2 6.4-.6z"/></svg></button>';
    if(visibleOshis().length>1){
      html += '<button class="oshi-pill '+(state.filterOshiId==="all"?"on":"")+'" data-action="filter-oshi" data-id="all">すべて</button>';
      visibleOshis().forEach(function(o){
        html += '<button class="oshi-pill '+(state.filterOshiId===o.id?"on":"")+'" data-action="filter-oshi" data-id="'+o.id+'">'
          + '<span class="d" style="'+oshiSwatchStyle(o)+'"></span>'+escapeHtml(o.name)+'</button>';
      });
    }
    html += '</div>';
  } else if(visibleOshis().length>1){
    html += '<div class="oshi-pills">';
    html += '<button class="oshi-pill '+(state.filterOshiId==="all"?"on":"")+'" data-action="filter-oshi" data-id="all">すべて</button>';
    visibleOshis().forEach(function(o){
      html += '<button class="oshi-pill '+(state.filterOshiId===o.id?"on":"")+'" data-action="filter-oshi" data-id="'+o.id+'">'
        + '<span class="d" style="'+oshiSwatchStyle(o)+'"></span>'+escapeHtml(o.name)+'</button>';
    });
    html += '</div>';
  }

  var fullList = state[type].filter(function(r){
    return state.filterOshiId==="all" || recHasOshi(r, state.filterOshiId);
  });
  var hiddenCount = fullList.filter(function(r){ return r.hidden; }).length;
  if(hiddenCount>0){
    html += '<button class="btn ghost" data-action="toggle-hidden" style="margin-bottom:12px;font-size:12px;padding:8px 12px;">'
      + (state.showHidden ? "非表示のアイテムを隠す" : "非表示のアイテムを表示（"+hiddenCount+"件）")
      + '</button>';
  }

  var list = fullList.filter(function(r){ return state.showHidden || !r.hidden; })
    .slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });

  // チェキは、マイページで選んだ表示方法で並べる
  if(type==="cheki"){
    html += chekiPageHtml(list);
    document.getElementById("main").innerHTML = html;
    bindChekiSwipe();
    return;
  }

  // LIVEは、チケットの上にカレンダーを出す。日を押すとその日のLIVEだけを下に並べる
  var dayNote = "";
  if(type==="live"){
    html += liveCalendarHtml(list);
    var ld = state.liveCalDate;
    if(ld && list.some(function(r){ return r.date===ld; })){
      list = list.filter(function(r){ return r.date===ld; });
      var ldp = ld.split("-");
      dayNote = '<span class="live-cal-day-note">'+Number(ldp[1])+'月'+Number(ldp[2])+'日のLIVE'
        + '<button type="button" data-action="live-cal-clear">すべて表示</button></span>';
    }
  }

  var total = list.reduce(function(s,r){ return s+recAmount(type,r); },0);
  if(list.length>0){
    // LIVEタブでは金額（合計）を出さず、件数だけにする
    html += '<div class="filter-note">'+dayNote+list.length+'件'+(type==="live" ? '' : '・合計 <b>'+fmtYen(total)+'</b>')+'</div>';
  }

  if(list.length===0){
    html += '<div class="empty-state">'
      + '<svg viewBox="0 0 24 24">'+kindIconRaw(type)+'</svg>'
      + '<p>まだ'+info.title.replace("記録","")+'の記録がありません。右下の＋ボタンから追加できます。</p>'
      + '</div>';
  } else {
    list.forEach(function(r){ html += ticketHtml(type,r,true); });
  }

  document.getElementById("main").innerHTML = html;
}
/* ============ rendering: チェキ記録（表示方法はマイページで選ぶ） ============
   gallery（ギャラリー）・album（月別アルバム）・binder（バインダー）・calendar（カレンダー）・swipe（スワイプ）。
   どの表示でも、写真を押すと拡大、鉛筆ボタンで編集する。 */
var CHEKI_VIEWS = [
  {id:"gallery",  label:"ギャラリー", icon:'<rect x="3" y="3" width="8" height="10" rx="1"/><rect x="13" y="3" width="8" height="10" rx="1"/><rect x="3" y="15" width="8" height="6" rx="1"/><rect x="13" y="15" width="8" height="6" rx="1"/>'},
  {id:"album",    label:"アルバム",   icon:'<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h3M7 16.5h3"/>'},
  {id:"binder",   label:"バインダー", icon:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9.3 3v18M14.7 3v18M4 9h16M4 15h16"/>'},
  {id:"calendar", label:"カレンダー", icon:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><rect x="7" y="12.5" width="4" height="4" rx=".6"/>'},
  {id:"swipe",    label:"スワイプ",   icon:'<rect x="7" y="4" width="10" height="15" rx="1.2"/><path d="M4 7v9M20 7v9M9 22h6"/>'}
];
function chekiView(){
  var v = state.chekiView;
  return CHEKI_VIEWS.some(function(x){ return x.id===v; }) ? v : "gallery";
}
function chekiLabel(r){
  var o = getOshi(r.oshiId);
  if(!o) return "";
  var gs = oshiGroupsList(o);
  var g = gs.find(function(x){ return x.id===r.groupId; }) || gs[0];
  return (g && g.name ? g.name+" ・ " : "") + o.name;
}
function chekiDate(r, withYear){
  var p = (r.date||"").split("-");
  if(p.length!==3) return "";
  return (withYear ? p[0].slice(2)+"." : "")+p[1]+"."+p[2];
}
function chekiTapeStyle(r){
  var o = getOshi(r.oshiId);
  return 'background:'+((o && o.color) || "var(--accent)")+';';
}
var CHEKI_CAMERA = '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.4"/><path d="M8 6l1-2h6l1 2"/></svg>';
var CHEKI_PENCIL = '<svg viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 000-3L18 6a2.1 2.1 0 00-3 0L4.5 16.5z"/></svg>';
var CHEKI_STAR = '<svg viewBox="0 0 24 24"><path d="M12 3l2.6 6 6.4.6-4.9 4.2 1.5 6.2L12 16.9 6.4 20l1.5-6.2-4.9-4.2 6.4-.6z"/></svg>';
// 写真（あれば押すと拡大、なければ押すと編集）
function chekiPhotoHtml(r){
  if(r.photo){
    return '<div class="ck-ph" data-action="view-photo" data-type="cheki" data-id="'+r.id+'" data-idx="'+(r.unitIdx||0)+'" role="button" tabindex="0" aria-label="写真を拡大">'
      + '<img '+DrivePhotos.imgAttrs(r.photo)+' alt="" loading="lazy"></div>';
  }
  return '<div class="ck-ph empty" data-action="edit-record" data-type="cheki" data-id="'+r.id+'" role="button" tabindex="0" aria-label="写真を追加">'+CHEKI_CAMERA+'</div>';
}
function chekiEditBtn(r){
  return '<button type="button" class="ck-edit" data-action="edit-record" data-type="cheki" data-id="'+r.id+'" title="編集" aria-label="編集">'+CHEKI_PENCIL+'</button>';
}
/* どの記録から来たチェキか（live / goods / ""）。LIVE・物販のチェキボタンで作ったものは source を持つ。
   それ以前のものは、同じ日付・同じ名前・同じ推しのLIVE（なければ物販）があればそれとみなす。 */
function chekiSource(r){
  if(r.source==="live" || r.source==="goods") return r.source;
  var t = (r.title||"").trim();
  if(!r.date || !t) return "";
  var hitLive = state.live.some(function(l){ return l.date===r.date && (l.title||"").trim()===t && recHasOshi(l, r.oshiId); });
  if(hitLive) return "live";
  var hitGoods = state.goods.some(function(g){
    return g.date===r.date && ((g.title||"").trim()===t || (g.item||"").trim()===t) && recHasOshi(g, r.oshiId);
  });
  return hitGoods ? "goods" : "";
}
/* チェキに出す名前。物販から来たチェキは商品名にする（以前の、イベント名・購入先で
   作られたものは、同じ日付・同じ名前・同じ推しの物販が1つに決まればその商品名を出す） */
function chekiTitle(r){
  var t = (r.title||"").trim();
  if(chekiSource(r)==="goods" && r.date){
    var items = [];
    state.goods.forEach(function(x){
      var it = (x.item||"").trim();
      if(it && x.date===r.date && (it===t || (x.title||"").trim()===t) && recHasOshi(x, r.oshiId) && items.indexOf(it)<0) items.push(it);
    });
    // 同じ日に同じ購入先で複数の商品があるときは、どれか決められないので名前のまま
    if(items.length===1) return items[0];
  }
  return t;
}
// 左上：LIVE・物販のアイコンと枚数
function chekiTopLeft(r){
  var src = chekiSource(r);
  // チェキは1枚ずつ登録するので、枚数（×2 など）は出さない
  // LIVE・物販の一覧と同じスタンプ（アイコン＋LIVE／物販）
  return src ? '<div class="ck-tl"><span class="stamp" title="'+KIND_LABEL[src]+'のチェキ">'+kindIcon(src)+KIND_LABEL[src]+'</span></div>' : '';
}
// 右上：お気に入り（押すたびに ON/OFF）
function chekiFavBtn(r){
  return '<button type="button" class="ck-favbtn'+(r.favorite?' on':'')+'" data-action="toggle-cheki-fav" data-id="'+r.id+'" data-idx="'+(r.unitIdx||0)+'"'
    + ' aria-pressed="'+(r.favorite?'true':'false')+'" title="お気に入り" aria-label="お気に入り">'+CHEKI_STAR+'</button>';
}
// 白い縁のチェキ（ギャラリー・アルバムで使う）
function chekiPolaroidHtml(r, withYear){
  return '<div class="ck-pol'+(r.hidden?' is-hidden':'')+'">'
    + '<span class="ck-tape" style="'+chekiTapeStyle(r)+'"></span>'
    + '<div class="ck-ph-wrap">'+chekiPhotoHtml(r)+'</div>'
    + '<div class="ck-cap">'
    +   '<div class="t">'+escapeHtml(chekiTitle(r)||"(無題)")+'</div>'
    +   '<div class="m"><span>'+chekiDate(r, withYear)+'</span></div>'
    + '</div>'
    + chekiTopLeft(r) + chekiFavBtn(r) + chekiEditBtn(r)
    + '</div>';
}
// 詳しいカード（カレンダーの選んだ日・スワイプで使う）
function chekiDetailHtml(r, big){
  var label = chekiLabel(r);
  return '<div class="ck-detail'+(big?' big':'')+(r.hidden?' is-hidden':'')+'">'
    + '<div class="ck-ph-wrap">'+chekiPhotoHtml(r)+'</div>'
    + '<div class="ck-detail-body">'
    +   '<div class="t'+(big?' mincho':'')+'">'+escapeHtml(chekiTitle(r)||"(無題)")+'</div>'
    +   (label ? '<div class="g">'+escapeHtml(label)+'</div>' : '')
    +   '<div class="m"><span>'+chekiDate(r, true)+'</span></div>'
    +   (r.content ? '<div class="talk">'+escapeHtml(r.content)+'</div>' : '')
    +   (r.memo ? '<div class="memo">'+escapeHtml(r.memo)+'</div>' : '')
    + '</div>'
    + chekiTopLeft(r) + chekiFavBtn(r) + chekiEditBtn(r)
    + '</div>';
}

/* 記録（枚数・写真が複数のこともある）を、1枚ずつのチェキに分ける。
   1枚ごとの写真・お気に入りを上書きし、ほかの項目は元の記録をそのまま読む */
function chekiUnitList(list){
  var units = [];
  list.forEach(function(r){
    var ph = recPhotos(r);
    for(var i=0; i<chekiUnits(r); i++){
      var u = Object.create(r);
      u.photo = ph[i] || null;
      u.favorite = chekiUnitFav(r, i);
      u.unitIdx = i;
      units.push(u);
    }
  });
  return units;
}
function chekiPageHtml(list){
  var html = "";
  list = chekiUnitList(list);   // ここから先は1枚ずつ
  // 集計（絞り込み前の一覧で数える）
  var thisMonth = (function(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); })();
  var totalN = 0, monthN = 0;
  list.forEach(function(r){
    totalN += 1;
    if((r.date||"").slice(0,7)===thisMonth) monthN += 1;
  });
  html += '<div class="ck-sum">'
    + '<div><b>'+totalN+'</b><span>総枚数</span></div>'
    + '<div><b>'+monthN+'</b><span>今月</span></div>'
    + '</div>';
  var items = state.chekiFav ? list.filter(function(r){ return !!r.favorite; }) : list;
  // 上にカレンダー、下にスワイプ。カレンダーの日を押すと、その日のチェキだけをスワイプに並べる（もう一度押すと元に戻る）
  html += chekiCalendarHtml(items);
  var cd = state.chekiCalDate;
  if(cd && items.some(function(r){ return r.date===cd; })){
    items = items.filter(function(r){ return r.date===cd; });
    var cdp = cd.split("-");
    html += '<div class="filter-note"><span class="live-cal-day-note">'+Number(cdp[1])+'月'+Number(cdp[2])+'日のチェキ'
      + '<button type="button" data-action="cheki-cal-clear">すべて表示</button></span>'+items.length+'枚</div>';
  }
  if(!items.length){
    html += '<div class="empty-state"><svg viewBox="0 0 24 24">'+kindIconRaw("cheki")+'</svg>'
      + '<p>'+(list.length ? '該当するチェキがありません。' : 'まだチェキの記録がありません。右下の＋ボタンから追加できます。')+'</p></div>';
    return html;
  }
  html += chekiSwipeHtml(items);
  return html;
}
function chekiGalleryHtml(items){
  return '<div class="ck-gallery">'+items.map(function(r){ return chekiPolaroidHtml(r, true); }).join("")+'</div>';
}
function chekiAlbumHtml(items){
  var months = [], byMonth = {};
  items.forEach(function(r){
    var k = (r.date||"").slice(0,7) || "----";
    if(!byMonth[k]){ byMonth[k] = []; months.push(k); }
    byMonth[k].push(r);
  });
  return months.map(function(k){
    var rs = byMonth[k];
    return '<div class="ck-month">'
      + '<div class="ck-month-head"><b class="mincho">'+(k==="----" ? "日付なし" : k.replace("-", ". "))+'</b><span>'+rs.length+'枚</span></div>'
      + '<div class="ck-month-row">'+rs.map(function(r){ return chekiPolaroidHtml(r, false); }).join("")+'</div>'
      + '</div>';
  }).join("");
}
var CHEKI_BINDER_SIZE = 9;
function chekiBinderHtml(items){
  var pages = Math.max(1, Math.ceil(items.length/CHEKI_BINDER_SIZE));
  var p = clamp(state.chekiBinderPage||0, 0, pages-1);
  state.chekiBinderPage = p;
  var slice = items.slice(p*CHEKI_BINDER_SIZE, (p+1)*CHEKI_BINDER_SIZE);
  var html = '<div class="ck-binder">'
    + '<div class="ck-binder-head">'
    +   '<button type="button" class="ck-nav" data-action="cheki-page" data-d="-1"'+(p===0?' disabled':'')+' aria-label="前のページ">‹</button>'
    +   '<span>PAGE '+(p+1)+' / '+pages+'</span>'
    +   '<button type="button" class="ck-nav" data-action="cheki-page" data-d="1"'+(p>=pages-1?' disabled':'')+' aria-label="次のページ">›</button>'
    + '</div>'
    + '<div class="ck-pockets">';
  slice.forEach(function(r){
    html += '<div class="ck-pocket'+(r.hidden?' is-hidden':'')+'">'
      + '<div class="ck-ph-wrap">'+chekiPhotoHtml(r)+'</div>'
      + '<div class="cap">'+chekiDate(r, false)+' '+escapeHtml(chekiTitle(r))+'</div>'
      + chekiTopLeft(r) + chekiFavBtn(r) + chekiEditBtn(r)
      + '</div>';
  });
  // 最後のページの空きポケットは「＋」で追加
  for(var i=slice.length; i<CHEKI_BINDER_SIZE; i++){
    html += '<button type="button" class="ck-pocket empty" data-action="add-cheki" aria-label="チェキを追加">＋</button>';
  }
  return html + '</div></div>';
}
/* LIVE・チェキのカレンダーで共通に使う部品 */
function todayYmdStr(){
  var n = new Date();
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
}
function calHeadHtml(action, y, m, countLabel){
  return '<div class="ck-cal-head">'
    +   '<button type="button" class="ck-nav" data-action="'+action+'" data-d="-1" aria-label="前の月">‹</button>'
    +   '<div class="live-cal-title"><b class="mincho">'+y+'. '+String(m).padStart(2,"0")+'</b><span>'+countLabel+'</span></div>'
    +   '<button type="button" class="ck-nav" data-action="'+action+'" data-d="1" aria-label="次の月">›</button>'
    + '</div>'
    + '<div class="ck-cal-week">'+weekDayLabels().map(function(w){ return '<span>'+w+'</span>'; }).join("")+'</div>';
}
// 記録のある日のマス。背景は記録の写真 → 推しの写真 → 種類のアイコンの順に使う
function calDayCellHtml(opts){
  var bgRef = null;
  opts.recs.some(function(r){ if(r.photo){ bgRef = r.photo; return true; } return false; });
  if(!bgRef){
    opts.recs.some(function(r){
      return recOshiEntries(r).some(function(e){ var o = getOshi(e.oshiId); if(o && o.photo){ bgRef = o.photo; return true; } return false; });
    });
  }
  var n = opts.recs.length;
  return '<button type="button" class="ck-day has'+(opts.today?' today':'')+(opts.on?' on':'')+'" data-action="'+opts.action+'" data-date="'+opts.date+'" aria-label="'+opts.label+'">'
    + (bgRef ? '<img '+DrivePhotos.imgAttrs(bgRef)+' alt="" loading="lazy">' : '<span class="ck-day-icon">'+kindIcon(opts.kind)+'</span>')
    + '<i>'+opts.day+'</i>'
    + (n>1 ? '<em>'+n+'</em>' : '')
    + '</button>';
}
function chekiCalendarHtml(items){
  var byDate = {};
  items.forEach(function(r){ if(r.date){ (byDate[r.date] = byDate[r.date] || []).push(r); } });
  var month = state.chekiCalMonth;
  if(!month){
    var latest = items.map(function(r){ return r.date||""; }).sort().pop();
    month = latest ? latest.slice(0,7) : (function(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); })();
    state.chekiCalMonth = month;
  }
  var y = Number(month.slice(0,4)), m = Number(month.slice(5,7));
  var startWeekday = leadingBlankDays(y, m);
  var daysInMonth = new Date(y, m, 0).getDate();
  var today = todayYmdStr();
  var count = items.filter(function(r){ return (r.date||"").slice(0,7)===month; }).length;
  var html = '<div class="ck-cal">'
    + calHeadHtml("cheki-cal-month", y, m, count+'枚')
    + '<div class="ck-cal-grid">';
  for(var i=0;i<startWeekday;i++) html += '<span></span>';
  var sel = state.chekiCalDate && byDate[state.chekiCalDate] ? state.chekiCalDate : null;
  for(var d=1; d<=daysInMonth; d++){
    var ds = month+"-"+String(d).padStart(2,"0");
    var rs = byDate[ds];
    if(!rs){ html += '<span class="ck-day'+(ds===today?' today':'')+'"><i>'+d+'</i></span>'; continue; }
    html += calDayCellHtml({recs:rs, kind:"cheki", action:"cheki-cal-day", date:ds, day:d, today:ds===today, on:ds===sel, label:m+'月'+d+'日のチェキ（'+rs.length+'枚）'});
  }
  return html + '</div></div>';
}
/* LIVE記録のカレンダー：月ごとにLIVEのある日を示す（マスの背景はLIVEの写真、なければ推しの写真、どちらもなければLIVEのアイコン）。
   はじめは今月を出す。日を押すと、その日のLIVEだけを下のチケットに並べる（もう一度押すと元に戻る）。 */
function liveCalendarHtml(items){
  var byDate = {};
  items.forEach(function(r){ if(r.date){ (byDate[r.date] = byDate[r.date] || []).push(r); } });
  var today = todayYmdStr();
  var month = state.liveCalMonth || today.slice(0,7);
  state.liveCalMonth = month;
  var y = Number(month.slice(0,4)), m = Number(month.slice(5,7));
  var startWeekday = leadingBlankDays(y, m);
  var daysInMonth = new Date(y, m, 0).getDate();
  var count = items.filter(function(r){ return (r.date||"").slice(0,7)===month; }).length;
  var html = '<div class="ck-cal live-cal">'
    + calHeadHtml("live-cal-month", y, m, count+'件')
    + '<div class="ck-cal-grid">';
  for(var i=0;i<startWeekday;i++) html += '<span></span>';
  for(var d=1; d<=daysInMonth; d++){
    var ds = month+"-"+String(d).padStart(2,"0");
    var rs = byDate[ds];
    if(!rs){ html += '<span class="ck-day'+(ds===today?' today':'')+'"><i>'+d+'</i></span>'; continue; }
    html += calDayCellHtml({recs:rs, kind:"live", action:"live-cal-day", date:ds, day:d, today:ds===today, on:ds===state.liveCalDate, label:m+'月'+d+'日のLIVE（'+rs.length+'件）'});
  }
  return html + '</div></div>';
}
function chekiSwipeHtml(items){
  return '<div class="ck-swipe" id="ckSwipe">'
    + items.map(function(r){ return '<div class="ck-slide">'+chekiDetailHtml(r, true)+'</div>'; }).join("")
    + '</div>'
    + '<div class="ck-swipe-no"><span id="ckSwipeNo">1</span> / '+items.length+'</div>';
}
// スワイプ表示：いま何枚目かを下に出す
function bindChekiSwipe(){
  var el = document.getElementById("ckSwipe");
  var no = document.getElementById("ckSwipeNo");
  if(!el || !no) return;
  el.addEventListener("scroll", function(){
    var slides = el.children;
    if(!slides.length) return;
    var w = slides[0].getBoundingClientRect().width + 14;
    no.textContent = String(clamp(Math.round(el.scrollLeft / w), 0, slides.length-1) + 1);
  }, {passive:true});
}

function ticketHtml(type,r,withOshiTag){
  var oshi = getOshi(r.oshiId);
  var amt = recAmount(type,r);
  var day = (r.date||"").split("-")[2]||"--";
  var titleText = r.title || (type==="goods"?r.item:"") || "(無題)";
  var metaBits = [];
  if(type==="live"){
    // LIVEの詳細行は会場だけ（チケット種別・座席は一覧に出さない）。右端にGoogleカレンダー追加ボタン
    if(r.venue) metaBits.push('<a class="venue-link" href="'+escapeHtml(mapsUrlFor(r.venue, r.venuePlace))+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(r.venue)+'</a>');
  } else if(type==="cheki"){
    if(chekiUnits(r)>1) metaBits.push(chekiUnits(r)+"枚");
    if(r.content) metaBits.push(escapeHtml(r.content));
  } else {
    if(r.item) metaBits.push(escapeHtml(r.item));
    metaBits.push((Number(r.qty)||1)+"点");
  }
  // 推しは1行目、会場などの詳細は次の行に分けて表示する
  var oshiLineHtml = "";
  if(withOshiTag && oshi){
    // 推しで絞り込み中は、その推しの「グループ名・人物名」だけを出す
    var tagEntries = recOshiEntries(r).filter(function(e){
      return state.filterOshiId==="all" || e.oshiId===state.filterOshiId;
    });
    var tags;
    if(type==="live"){
      // LIVEはグループ名だけを出す（同じグループは1回。グループのない推しは人物名）
      var seenGroup = {};
      tags = tagEntries.map(function(e){
        var o = getOshi(e.oshiId);
        if(!o) return "";
        var gs = oshiGroupsList(o);
        var g = gs.find(function(x){ return x.id===e.groupId; }) || gs[0];
        var label = g && g.name ? g.name : o.name;
        if(seenGroup[label]) return "";
        seenGroup[label] = true;
        return '<span style="color:'+readableColor((g && g.color) || o.color)+';font-weight:700;">'+escapeHtml(label)+'</span>';
      }).filter(Boolean);
    } else {
      tags = tagEntries.map(function(e){
        var o = getOshi(e.oshiId);
        return o ? '<span style="color:'+readableColor(o.color)+';font-weight:700;">'+escapeHtml(oshiFullLabel(o))+'</span>' : '';
      }).filter(Boolean);
    }
    if(tags.length) oshiLineHtml = '<div class="meta meta-oshi">'+tags.join(" ／ ")+'</div>';
  }
  // 配信URL（LIVE）・ONLINE物販のURL（物販）は http(s) のときだけリンクにする
  var streamLinkHtml = "";
  var moreBtnHtml = "";
  if(type==="live"){
    // チケット・配信・Googleカレンダーへの追加は、右上の「…」から開くメニューにまとめる
    moreBtnHtml = '<button type="button" class="live-more" data-action="live-menu" data-id="'+r.id+'" title="チケット・配信・カレンダー" aria-label="チケット・配信・カレンダーのメニュー">'
      + '<svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg></button>';
  } else if(type==="goods" && safeWebUrl(r.shopUrl)){
    streamLinkHtml = '<a href="'+escapeHtml(safeWebUrl(r.shopUrl))+'" target="_blank" rel="noopener noreferrer" class="stream-link">購入ページを見る</a>';
  }
  var stubHasPhoto = (type==="live" || type==="goods") && !!r.photo;
  // LIVEタブでは、チケット代などの金額を出さない
  var hideAmt = type==="live" && state.view==="live";
  // LIVE・物販のカードは高さを固定し、はみ出す文字は1行で省略する
  var html = '<div class="ticket'+(type!=="cheki"?' fixed':'')+(r.hidden?' is-hidden':'')+'">'
    + '<div class="tape"></div>'
    + (r.favorite ? '<div class="fav-badge"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 6 6.4.6-4.9 4.2 1.5 6.2L12 16.9 6.4 20l1.5-6.2-4.9-4.2 6.4-.6z"/></svg></div>' : '')
    // チェキは写真（左のチェキ）を押すと拡大する
    + (type==="cheki" ? (function(cp){ return '<div class="photo'+(cp?' zoomable':'')+'"'+(cp?' data-action="view-photo" data-type="cheki" data-id="'+r.id+'" role="button" tabindex="0" title="写真を拡大" aria-label="写真を拡大"':'')+'>'+(cp? '<img '+DrivePhotos.imgAttrs(cp)+' alt="">' : '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.4"/><path d="M8 6l1-2h6l1 2"/></svg>')+'</div>'; })(recPhotos(r)[0]||null) : '')
    + '<div class="main">'
    +   '<div class="kind"><span class="stamp">'+kindIcon(type)+KIND_LABEL[type]+'</span>'
    +     (type==="live" ? (function(v){ return '<span class="view-chip '+v+'">'+VIEWING_ICON[v]+VIEWING_LABEL[v]+'</span>'; })(recViewing(r)) : '')
    +     (r.tag?'<span class="tag-chip">'+escapeHtml(r.tag)+'</span>':'')+(streamLinkHtml? '<span class="stream-link-wrap">'+streamLinkHtml+'</span>' : '')+moreBtnHtml+'</div>'
    +   '<div class="title">'+escapeHtml(titleText)+'</div>'
    +   oshiLineHtml
    +   (type==="live"
          ? (metaBits.length ? '<div class="meta meta-venue"><span class="meta-venue-text">'+metaBits.join(" ・ ")+'</span></div>' : '')
          : (metaBits.length? '<div class="meta">'+metaBits.join(" ・ ")+'</div>' : ''))
    +   (r.memo? '<div class="memo">'+escapeHtml(r.memo)+'</div>' : '')
    + '</div>'
    + '<div class="stub'+(stubHasPhoto?' has-photo':'')+'"'+(stubHasPhoto?' style="'+DrivePhotos.bgStyle(r.photo, 'linear-gradient(175deg, rgba(20,17,13,.1), rgba(20,17,13,.62))')+'"':'')+'>'
    +   '<div class="day">'+day+'</div>'
    +   '<div class="ym">'+fmtYm(r.date)+'</div>'
    +   ((amt && !hideAmt)? '<div class="amt">'+fmtYen(amt)+'</div>' : '')
    + '</div>'
    + ((r.photo && type!=="cheki") ? '<button class="zoombtn" data-action="view-photo" data-type="'+type+'" data-id="'+r.id+'" title="写真を拡大" aria-label="写真を拡大">'
        + '<svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M10 20H4v-6"/><path d="M20 4l-6.5 6.5"/><path d="M4 20l6.5-6.5"/></svg>'
        + '</button>' : '')
    + '<button class="editbtn" data-action="edit-record" data-type="'+type+'" data-id="'+r.id+'">'
    +   '<svg viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 000-3L18 6a2.1 2.1 0 00-3 0L4.5 16.5z"/></svg>'
    + '</button>'
    + '</div>';
  return html;
}

/* ============ rendering: STATS page ============ */
function renderStatsPage(){
  var html = '<div class="page-head"><h1 class="mincho">集計</h1><p>推し・イベント・期間別に記録をまとめて振り返ります。</p></div>';

  if(state.oshis.length===0){
    html += '<div class="hero empty">'
      + '<div class="name mincho">まだ集計できる記録がありません</div>'
      + '<p>推しを登録して記録をつけると、ここに集計が表示されます。</p>'
      + '<button class="btn primary block" data-action="add-oshi">推しを登録する</button>'
      + '</div>';
    document.getElementById("main").innerHTML = html;
    return;
  }

  var tabs = [["oshi","推し別"],["event","イベント別"],["period","期間別"],["calendar","カレンダー"]];
  html += '<div class="oshi-pills">';
  tabs.forEach(function(t){
    html += '<button class="oshi-pill '+(state.statsSubView===t[0]?"on":"")+'" data-action="stats-tab" data-tab="'+t[0]+'">'+t[1]+'</button>';
  });
  html += '</div>';

  if(state.statsSubView==="oshi") html += renderStatsByOshi();
  else if(state.statsSubView==="event") html += renderStatsByEvent();
  else if(state.statsSubView==="period") html += renderStatsByPeriod();
  else html += renderStatsCalendar();

  html += '<button class="btn ghost block" data-action="share-summary" style="margin-top:18px;">'
    + '<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;margin-right:6px;vertical-align:-3px;"><path d="M12 5v10M8 9l4-4 4 4"/><path d="M5 15v3a2 2 0 002 2h10a2 2 0 002-2v-3"/></svg>'
    + '集計結果を画像で保存</button>';

  document.getElementById("main").innerHTML = html;

  if(state.statsSubView==="calendar"){ bindCalendarEvents(); }
}

function renderStatsByOshi(){
  var rows = aggregateByOshi();
  if(rows.every(function(r){return r.itemCount===0;})){
    return emptyStatsBlock();
  }
  var html = "";
  rows.forEach(function(row){
    if(row.itemCount===0) return;
    html += '<div class="stat-row">'
      + '<div class="sw" style="'+oshiSwatchStyle(row.oshi)+'"></div>'
      + '<div class="info"><b>'+escapeHtml(row.oshi.name)+'</b>'
      +   '<span>参戦 '+row.liveN+' ・ チェキ '+row.chekiN+' ・ 物販 '+row.goodsN+'</span></div>'
      + '<div class="stat-amt">'+fmtYen(row.total)+'</div>'
      + '</div>';
  });
  return html;
}
function renderStatsByEvent(){
  var rows = aggregateByEvent();
  if(rows.length===0) return emptyStatsBlock();
  var html = "";
  rows.slice(0,30).forEach(function(row){
    html += '<div class="stat-row">'
      + '<div class="info"><b>'+escapeHtml(row.name)+'</b><span>'+row.count+'件</span></div>'
      + '<div class="stat-amt">'+fmtYen(row.total)+'</div>'
      + '</div>';
  });
  return html;
}
function renderStatsByPeriod(){
  var months = aggregateByMonth(12);
  var total = months.reduce(function(s,m){return s+m.total;},0);
  if(total===0 && months.every(function(m){return m.count===0;})) return emptyStatsBlock();
  var maxV = Math.max.apply(null, months.map(function(m){return m.total;}).concat([1]));
  var html = '<div class="chart-card" style="margin-top:2px;">'
    + '<h3>月別 推し活費用</h3><span class="unit">直近12ヶ月・合計 '+fmtYen(total)+'</span>'
    + '<div class="bars" style="overflow-x:auto;">';
  months.forEach(function(m){
    var h = Math.round((m.total/maxV)*72)+4;
    html += '<div class="col" style="min-width:24px;"><div class="fill" style="height:'+h+'px" title="'+fmtYen(m.total)+'"></div><div class="mo">'+m.label+'</div></div>';
  });
  html += '</div></div>';
  html += '<div class="section-label">内訳</div>';
  months.slice().reverse().forEach(function(m){
    if(m.count===0) return;
    html += '<div class="stat-row">'
      + '<div class="info"><b>'+m.label+'</b><span>'+m.count+'件</span></div>'
      + '<div class="stat-amt">'+fmtYen(m.total)+'</div>'
      + '</div>';
  });
  return html;
}
function renderStatsCalendar(){
  var parts = state.calendarMonth.split("-");
  var y = Number(parts[0]), m = Number(parts[1]);
  var first = new Date(y, m-1, 1);
  var startWeekday = leadingBlankDays(y, m);
  var daysInMonth = new Date(y, m, 0).getDate();
  var dateMap = calendarDatesWithRecords(state.calendarMonth);

  var html = '<div class="cal-head">'
    + '<button type="button" class="cal-nav" data-action="cal-prev" aria-label="前月"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>'
    + '<span class="mincho">'+y+'年 '+m+'月</span>'
    + '<button type="button" class="cal-nav" data-action="cal-next" aria-label="翌月"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>'
    + '</div>';
  html += '<div class="cal-grid cal-dow">';
  weekDayLabels().forEach(function(d){ html += '<div>'+d+'</div>'; });
  html += '</div>';
  html += '<div class="cal-grid">';
  for(var i=0;i<startWeekday;i++){ html += '<div class="cal-cell empty"></div>'; }
  for(var day=1; day<=daysInMonth; day++){
    var dateStr = state.calendarMonth+"-"+String(day).padStart(2,"0");
    var n = dateMap[dateStr]||0;
    var isSelected = state.calendarSelectedDate===dateStr;
    html += '<button type="button" class="cal-cell '+(n>0?"has-rec":"")+' '+(isSelected?"selected":"")+'" data-action="cal-day" data-date="'+dateStr+'">'
      + '<span class="cal-daynum">'+day+'</span>'
      + (n>0? '<span class="cal-dot"></span>' : '')
      + '</button>';
  }
  html += '</div>';

  if(state.calendarSelectedDate){
    var items = recordsForDate(state.calendarSelectedDate);
    html += '<div class="section-label">'+state.calendarSelectedDate+' の記録</div>';
    if(items.length===0){
      html += '<div class="empty-state"><p>この日の記録はありません。</p></div>';
    } else {
      items.forEach(function(item){ html += ticketHtml(item.type, item.r, true); });
    }
  }
  return html;
}
function emptyStatsBlock(){
  return '<div class="empty-state">'
    + iconCluster()
    + '<p>まだ集計できる記録がありません。LIVE・チェキ・物販タブから記録を追加してみましょう。</p>'
    + '</div>';
}
function bindCalendarEvents(){
  var main = document.getElementById("main");
  main.querySelectorAll("[data-action=cal-prev]").forEach(function(b){
    b.addEventListener("click", function(){
      state.calendarMonth = shiftMonth(state.calendarMonth,-1);
      state.calendarSelectedDate = null;
      renderStatsPage();
    });
  });
  main.querySelectorAll("[data-action=cal-next]").forEach(function(b){
    b.addEventListener("click", function(){
      state.calendarMonth = shiftMonth(state.calendarMonth,1);
      state.calendarSelectedDate = null;
      renderStatsPage();
    });
  });
  main.querySelectorAll("[data-action=cal-day]").forEach(function(b){
    b.addEventListener("click", function(){
      var d = b.getAttribute("data-date");
      state.calendarSelectedDate = (state.calendarSelectedDate===d) ? null : d;
      renderStatsPage();
    });
  });
}

function shareSummaryImage(){
  var rows = aggregateByOshi().filter(function(r){ return r.itemCount>0; }).slice(0,6);
  if(rows.length===0){ toast("まだ集計できる記録がありません"); return; }
  var totalAll = rows.reduce(function(s,r){return s+r.total;},0);
  var itemsAll = rows.reduce(function(s,r){return s+r.itemCount;},0);
  var accentColor = readableColor(rows[0].oshi.color);
  var now = new Date();

  var W = 900, H = 340 + rows.length*110 + 90;
  var canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext("2d");

  ctx.fillStyle = "#FBF8F3";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "rgba(33,28,23,0.06)";
  for(var yy=20; yy<H; yy+=26){
    for(var xx=20; xx<W; xx+=26){ ctx.beginPath(); ctx.arc(xx,yy,1.3,0,Math.PI*2); ctx.fill(); }
  }

  ctx.fillStyle = accentColor;
  ctx.fillRect(0,0,W,180);
  ctx.fillStyle = "#FBF8F3";
  ctx.font = "700 46px sans-serif";
  ctx.fillText("推し活記録", 50, 90);
  ctx.font = "400 22px sans-serif";
  ctx.fillText(now.getFullYear()+"年"+(now.getMonth()+1)+"月時点", 50, 135);

  ctx.fillStyle = "#211C17";
  ctx.font = "700 30px sans-serif";
  ctx.fillText("合計 "+itemsAll+"件 ・ "+fmtYenPlain(totalAll), 50, 250);

  var rowY = 320;
  rows.forEach(function(row){
    ctx.fillStyle = row.oshi.color || "#C9457A";
    ctx.beginPath(); ctx.arc(72, rowY, 24, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#211C17";
    ctx.font = "700 28px sans-serif";
    ctx.fillText(row.oshi.name, 116, rowY+8);
    ctx.font = "400 20px sans-serif";
    ctx.fillStyle = "#6B6259";
    ctx.fillText("参戦 "+row.liveN+" ・ チェキ "+row.chekiN+" ・ 物販 "+row.goodsN, 116, rowY+40);
    ctx.textAlign = "right";
    ctx.fillStyle = accentColor;
    ctx.font = "700 26px sans-serif";
    ctx.fillText(fmtYenPlain(row.total), W-50, rowY+8);
    ctx.textAlign = "left";
    rowY += 110;
  });

  ctx.fillStyle = "#ABA398";
  ctx.font = "400 20px sans-serif";
  ctx.fillText("#\u63a8\u3057\u6d3b\u624b\u5e33", 50, H-38);

  var dataUrl;
  try{ dataUrl = canvas.toDataURL("image/png"); }
  catch(e){ toast("画像の生成に失敗しました"); return; }

  var a = document.createElement("a");
  a.href = dataUrl;
  a.download = "oshikatsu_"+now.getFullYear()+String(now.getMonth()+1).padStart(2,"0")+".png";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast("画像を保存しました");
}

      html += '<button type="button" class="hidden-oshi-toggle" data-action="toggle-hidden-oshis">'
        + '<svg viewBox="0 0 24 24" class="'+(state.showHiddenOshis?'open':'')+'"><path d="M9 6l6 6-6 6"/></svg>'
        + '非表示の推し（'+hiddenList.length+'人）'
        + '</button>';
      if(state.showHiddenOshis){
        html += '<div class="hidden-oshi-list">';
        hiddenList.forEach(function(o, idx){ html += oshiRowHtml(o, idx, hiddenList.length); });
        html += '</div>';
      }
    }
  }
  document.getElementById("main").innerHTML = html;
  bindDragReorder(document.getElementById("main"), ".oshi-card", function(items){
    applyOshiOrder(items.map(function(el){ return el.getAttribute("data-oshi-row"); }));
  });
}
/* 並べ替えた推し（表示中、または非表示の推しの中だけ）の順番を、全体の並びに反映する。
   並べ替えた推しがいた位置に、新しい順で入れ直す */
function applyOshiOrder(ids){
  var inList = {}, byId = {};
  ids.forEach(function(id){ inList[id] = true; });
  state.oshis.forEach(function(o){ byId[o.id] = o; });
  var queue = ids.slice();
  var next = state.oshis.map(function(o){ return inList[o.id] ? byId[queue.shift()] : o; });
  var changed = next.some(function(o, i){ return o!==state.oshis[i]; });
  if(!changed) return;
  state.oshis = next;
  saveLocal();
  renderTopChipMenu();
}
/* マイページ：アカウント・ログアウト（推しの一覧は「推しの管理」ページへ） */
/* ============ NEWS（お知らせ） ============
   マイページの一番上に新しい順で出す（はじめは3件。「すべて見る」で全部）。題名を押すと本文を開く。
   お知らせは Supabase の oshikatsu_news（だれでも読める。追加・編集・削除はマスターだけ）。
   7日以内のものに NEW、まだ見ていないお知らせがあるときはマイページのタブに印を付ける。 */
var NEWS_CACHE = "oshikatsu_news_v1";
var NEWS_SEEN_KEY = "oshikatsu_news_seen_v1:";
var news = {items:readStored(NEWS_CACHE) || [], all:false, open:{}};
async function loadNews(){
  if(!sb || !cloud.user) return;
  try{
    var r = await sb.from("oshikatsu_news").select("id,title,body,published_at").order("published_at", {ascending:false}).limit(50);
    if(r.error) throw r.error;
    var before = JSON.stringify(news.items);
    news.items = r.data || [];
    try{ localStorage.setItem(NEWS_CACHE, JSON.stringify(news.items)); }catch(e){}
    if(JSON.stringify(news.items)!==before) render(); else updateNewsDot();
  }catch(e){ console.warn("news load failed", e); }
}
function newsSeenAt(){ try{ return localStorage.getItem(NEWS_SEEN_KEY+(cloud.user?cloud.user.id:"")) || ""; }catch(e){ return ""; } }
function markNewsSeen(){
  if(!news.items.length) return;
  try{ localStorage.setItem(NEWS_SEEN_KEY+(cloud.user?cloud.user.id:""), news.items[0].published_at); }catch(e){}
  updateNewsDot();
}
function updateNewsDot(){
  var b = document.querySelector('nav.tabs button[data-view="oshi"]');
  if(!b) return;
  var seen = newsSeenAt();
  b.classList.toggle("has-news", !!(cloud.user && news.items.length && news.items[0].published_at > seen));
}
function newsDate(iso){ var d = new Date(iso); return isNaN(d) ? "" : d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0"); }
function newsSectionHtml(){
  var can = isMaster() && realMaster();
  var items = news.items;
  if(!items.length && !can) return '';
  var shown = news.all ? items : items.slice(0, 3);
  var weekAgo = new Date(Date.now()-7*24*3600*1000).toISOString();
  var html = '<div class="section-label">NEWS</div><div class="news-list">';
  if(!items.length) html += '<p class="news-empty">お知らせはまだありません。</p>';
  shown.forEach(function(n){
    var open = !!news.open[n.id];
    html += '<div class="news-item'+(open?' open':'')+'">'
      + '<button type="button" class="news-head" data-action="news-toggle" data-id="'+escapeHtml(n.id)+'" aria-expanded="'+(open?'true':'false')+'">'
      +   '<span class="news-date">'+newsDate(n.published_at)+'</span>'
      +   (n.published_at > weekAgo ? '<span class="news-new">NEW</span>' : '')
      +   '<span class="news-title">'+escapeHtml(n.title)+'</span>'
      + '</button>'
      + (open ? '<div class="news-body">'+escapeHtml(n.body||"").replace(/\n/g,"<br>")
        + (can ? '<div class="news-admin"><button type="button" class="gd-link" data-action="news-edit" data-id="'+escapeHtml(n.id)+'">編集</button><button type="button" class="gd-link danger-text" data-action="news-delete" data-id="'+escapeHtml(n.id)+'">削除</button></div>' : '')
        + '</div>' : '')
      + '</div>';
  });
  html += '</div>';
  var foot = [];
  if(items.length > 3) foot.push('<button type="button" class="gd-link" data-action="news-all">'+(news.all ? '閉じる' : 'すべて見る（'+items.length+'件）')+'</button>');
  if(can) foot.push('<button type="button" class="gd-link" data-action="news-edit">＋ お知らせを追加</button>');
  if(foot.length) html += '<div class="gd-more">'+foot.join("")+'</div>';
  return html;
}
function openNewsEditor(item){
  var d = item ? new Date(item.published_at) : new Date();
  var dv = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  openSheet('<h2 class="mincho">'+(item ? 'お知らせを編集' : 'お知らせを追加')+'</h2>'
    + '<form id="newsForm">'
    + '<div class="field"><label>日付</label><input type="date" name="date" value="'+dv+'" required></div>'
    + '<div class="field"><label>題名</label><input type="text" name="title" value="'+escapeHtml(item ? item.title : "")+'" required></div>'
    + '<div class="field"><label>本文</label><textarea name="body" rows="6">'+escapeHtml(item ? item.body||"" : "")+'</textarea></div>'
    + '<div class="sheet-actions"><button type="button" class="btn ghost" data-close-sheet>キャンセル</button><button type="submit" class="btn primary">'+(item ? '更新する' : '公開する')+'</button></div>'
    + '</form>');
  var form = document.getElementById("newsForm");
  var cancel = form.querySelector("[data-close-sheet]");
  if(cancel) cancel.addEventListener("click", closeSheet);
  form.addEventListener("submit", async function(e){
    e.preventDefault();
    if(!realMaster()) return;
    var fd = new FormData(form);
    var title = String(fd.get("title")||"").trim();
    if(!title){ toast("題名を入力してください"); return; }
    var now = new Date();
    var day = String(fd.get("date")||"");
    // 日付を選んだ日の今の時刻で公開日にする（同じ日の中でも新しい順に並ぶように）
    var pub = day ? new Date(day+"T"+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+":"+String(now.getSeconds()).padStart(2,"0")).toISOString() : now.toISOString();
    var row = {title:title, body:String(fd.get("body")||""), published_at:pub, updated_at:now.toISOString()};
    if(item) row.id = item.id; else row.created_by = cloud.user.id;
    try{
      var r = await sb.from("oshikatsu_news").upsert(row);
      if(r.error) throw r.error;
      closeSheet();
      toast(item ? "お知らせを更新しました" : "お知らせを公開しました");
      await loadNews();
      render();
    }catch(err){ console.warn("news save failed", err); toast("保存できませんでした"); }
  });
}
async function deleteNews(id){
  if(!realMaster() || !confirm("このお知らせを削除しますか？")) return;
  try{
    var r = await sb.from("oshikatsu_news").delete().eq("id", id);
    if(r.error) throw r.error;
    news.items = news.items.filter(function(n){ return n.id!==id; });
    try{ localStorage.setItem(NEWS_CACHE, JSON.stringify(news.items)); }catch(e){}
    toast("お知らせを削除しました");
    render();
  }catch(e){ console.warn("news delete failed", e); toast("削除できませんでした"); }
}

/* ============ アーティスト・曲の登録一覧（マイページから） ============
   アーティストごとに曲を見て、検索・登録できる。登録した曲はセットリストの入力候補と「曲を探す」に出る。
   一覧には、登録したものに加えて、推しのグループ（グループのない推しは人物名）とセットリストで使ったものも出す。 */
var catalogView = {artist:null, sort:"sung"};
function catalogArtistList(){
  var map = {};
  function key(n){ return (n||"").trim().toLowerCase(); }
  function add(name, reg){
    name = (name||"").trim();
    if(!name) return;
    var k = key(name);
    if(!map[k]) map[k] = {name:name, id:null, songs:0, sung:0};
    if(reg) map[k].id = reg.id;
  }
  (state.artists||[]).forEach(function(a){ add(a.name, a); });
  state.oshis.forEach(function(o){ var gs = oshiGroupsList(o); if(gs.length) gs.forEach(function(g){ add(g.name); }); else add(o.name); });
  state.live.forEach(function(r){ recSetlists(r).forEach(function(b){ add(b.artist); }); });
  setlistSongCatalog().forEach(function(x){
    add(x.artist);
    var m = map[key(x.artist)];
    if(m){ m.songs++; m.sung += x.n; }
  });
  return Object.keys(map).map(function(k){ return map[k]; })
    .sort(function(a, b){ return b.songs - a.songs || a.name.localeCompare(b.name, "ja"); });
}
function catalogSongsOf(artist){
  var k = (artist||"").trim().toLowerCase();
  return setlistSongCatalog().filter(function(x){ return x.artist.toLowerCase()===k; });
}
function catalogEntryHtml(){
  if(!cloud.user || !canUse("setlist")) return '';
  var nA = catalogArtistList().length, nS = setlistSongCatalog().length;
  return '<div class="section-label">アーティスト・曲</div>'
    + '<button type="button" class="catalog-entry" data-action="catalog-open">'
    +   '<span class="catalog-entry-ic"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></span>'
    +   '<span class="catalog-entry-t"><b>アーティスト・曲の登録一覧</b><small>アーティスト '+nA+' ・ 曲 '+nS+'</small></span>'
    +   '<svg class="catalog-entry-go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'
    + '</button>';
}

      + '</div>'

  } else {

      // 上部：アルバムジャケット風の見出し
      + '<div class="cat-hero'+(heroImg ? ' has-img' : '')+'"'+(heroImg ? ' style="background-position:'+catalogArtistImagePos(a)+';'+DrivePhotos.bgStyle(heroImg, CAT_HERO_GRAD)+'"' : '')+'>'
      +   '<label class="cat-hero-img" title="背景画像を設定" aria-label="背景画像を設定"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.4"/><path d="M8 6l1-2h6l1 2"/></svg><input type="file" id="catalogHeroInput" accept="image/*" hidden></label>'
      +   '<small>ARTIST</small>'
      +   '<h1 class="mincho">'+escapeHtml(a)+'</h1>'

      +   '<button type="button" class="cat-hero-edit" data-action="catalog-edit-artist">'+pen+'編集</button>'
      + '</div>'
      + '<div class="cat-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg><input type="search" id="catalogQ" placeholder="曲を検索・登録" autocomplete="off"></div>'
      + '<button type="button" class="btn ghost block catalog-add" id="catalogAddSong" hidden></button>'
      // 下部：ランキング
      + '<div class="cat-seg" role="group" aria-label="並べ方">'

          }).join("")
      + '</div>'
      + '<div class="cat-rank" id="catalogList">'
      + (shown.length ? shown.map(function(x, i){
          var medal = sort==="sung" && x.n && i<3 ? ' g'+(i+1) : '';
          return '<div class="catalog-row cat-r'+medal+'" data-t="'+escapeHtml(x.title)+'" data-q="'+escapeHtml(x.title.toLowerCase())+'">'
            + '<button type="button" class="cat-r-main" data-action="catalog-edit-song" data-t="'+escapeHtml(x.title)+'">'
            +   '<span class="cat-r-n">'+(i+1)+'</span>'
            +   '<span class="cat-r-b"><b>'+escapeHtml(x.title)+'</b><span class="cat-bar"><i style="width:'+Math.round(x.n/max*100)+'%"></i></span></span>'
            +   '<span class="cat-r-c'+(x.n ? '' : ' z')+'">'+(x.n ? x.n : '未使用')+'</span>'
            + '</button>'
            + listenBtnHtml(x.title, a)
            + '</div>';
        }).join("") : '<p class="catalog-empty">'+(sort==="unused" && songs.length ? 'まだ歌っていない曲はありません。' : 'まだ曲がありません。上の欄に曲名を入れて登録できます。')+'</p>')
      + '</div>';
  }
  html += '<button type="button" class="btn ghost block" data-action="goto-mypage" style="margin-top:18px;">マイページへ戻る</button>';
  main.innerHTML = html;
  bindCatalogHero(a);
  // 検索：打つたびに一覧を絞り込み、同じ名前が無ければ「登録」ボタンを出す
  var q = document.getElementById("catalogQ"), addBtn = document.getElementById(a ? "catalogAddSong" : "catalogAddArtist");
  function filter(){
    var v = q.value.trim(), k = v.toLowerCase();
    var exact = false;
    Array.prototype.forEach.call(document.querySelectorAll("#catalogList [data-q]"), function(r){
      var name = r.getAttribute("data-q") || "";
      r.hidden = !!k && name.indexOf(k)<0;
      if(name===k) exact = true;
    });
    addBtn.hidden = !v || exact;
    addBtn.textContent = a ? "＋ 「"+v+"」を"+a+"の曲として登録" : "＋ 「"+v+"」をアーティストとして登録";
  }
  q.addEventListener("input", filter);
  q.addEventListener("keydown", function(e){ if(e.key==="Enter" && !addBtn.hidden){ e.preventDefault(); addBtn.click(); } });
