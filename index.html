  .plan-switch.on{background:var(--accent);border-color:var(--accent);}
  .plan-switch.on i{left:20px;}
  .admin-email{font-size:13px;}
  .admin-plan{flex:none;border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;background:var(--paper);font-family:inherit;font-size:13px;color:var(--text);}
  .ck-photos-hint{font-size:11px;color:var(--ink-soft);margin:6px 0 0;}
  .ck-thumb.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-style:dashed;color:var(--accent);font-size:11px;font-weight:700;font-family:inherit;}
  .ck-thumb.add svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;}
  /* 左上：LIVE・物販のアイコン */
  .ck-tl{position:absolute;display:flex;align-items:center;gap:4px;z-index:2;pointer-events:none;}
  .ck-tl .stamp{background:var(--paper);box-shadow:0 2px 6px -2px rgba(33,28,23,.35);}
  /* 右上：お気に入り */
  .ck-favbtn{position:absolute;width:28px;height:28px;border-radius:50%;border:1px solid var(--line-strong);background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:2;box-shadow:0 2px 6px -2px rgba(33,28,23,.35);}
  .ck-favbtn svg{width:15px;height:15px;fill:none;stroke:var(--ink-soft);stroke-width:1.6;}
  .ck-favbtn.on svg{fill:#E8B04A;stroke:#E8B04A;}
  .ck-edit{
    position:absolute;width:28px;height:28px;border-radius:50%;border:1px solid var(--line-strong);background:var(--paper);
    color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:2;
    box-shadow:0 2px 6px -2px rgba(33,28,23,.35);
  }
  .ck-edit svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .is-hidden{opacity:.5;}
  /* 白い縁のチェキ */
  .ck-pol{position:relative;background:#FFFFFF;padding:8px 8px 10px;border-radius:3px;box-shadow:0 8px 16px -8px rgba(33,28,23,.42);min-width:0;}
  .ck-tape{position:absolute;top:-8px;left:50%;width:46px;height:14px;margin-left:-23px;opacity:.55;transform:rotate(-4deg);z-index:1;}
  .ck-cap{margin-top:7px;color:#211C17;}
  .ck-cap .t{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ck-cap .m{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:#6B6259;margin-top:2px;}
  .ck-pol .ck-tl{top:14px;left:14px;}
  .ck-pol .ck-favbtn{top:13px;right:13px;}
  .ck-pol .ck-edit{bottom:9px;right:8px;width:26px;height:26px;}
  .ck-pol .ck-cap{padding-right:30px;}
  .ck-pol .ck-edit svg{width:11px;height:11px;}
  /* ギャラリー */
  .ck-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;padding:6px 2px 8px;}
  .ck-gallery .ck-pol:nth-child(4n+1){transform:rotate(-1.6deg);}
  .ck-gallery .ck-pol:nth-child(4n+2){transform:rotate(1.3deg);}
  .ck-gallery .ck-pol:nth-child(4n+3){transform:rotate(1deg);}
  .ck-gallery .ck-pol:nth-child(4n){transform:rotate(-1.2deg);}
  /* 月別アルバム */
  .ck-month{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 0 14px;margin-bottom:14px;}
  .ck-month-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 14px 10px;}
  .ck-month-head b{font-size:19px;color:var(--heading);}
  .ck-month-head span{font-size:11px;color:var(--ink-soft);}
  .ck-month-row{display:flex;gap:12px;overflow-x:auto;padding:10px 14px 6px;scroll-snap-type:x proximity;scrollbar-width:none;}
  .ck-month-row::-webkit-scrollbar{display:none;}
  .ck-month-row .ck-pol{flex:none;width:128px;scroll-snap-align:start;padding:6px 6px 8px;}
  .ck-month-row .ck-cap .t{font-size:11.5px;}
  /* バインダー */
  .ck-binder{background:#2F3A2F;border-radius:14px;padding:12px 10px 14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);}
  .ck-binder-head{display:flex;align-items:center;justify-content:space-between;color:#E6EEE2;font-size:12px;letter-spacing:.06em;margin:0 2px 10px;}
  .ck-binder .ck-nav{color:#E6EEE2;border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.08);}
  .ck-pockets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .ck-pocket{position:relative;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:5px;min-width:0;}
  .ck-pocket .cap{color:#E6EEE2;font-size:9.5px;margin-top:4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ck-pocket .ck-tl{top:9px;left:9px;}
  .ck-pocket .ck-tl .stamp{font-size:8.5px;padding:1px 6px 1px 4px;gap:3px;}
  .ck-pocket .ck-tl .stamp svg{width:9px;height:9px;}
  .ck-pocket .ck-favbtn{top:-6px;right:-6px;width:24px;height:24px;}
  .ck-pocket .ck-favbtn svg{width:13px;height:13px;}
  .ck-pocket .ck-edit{bottom:-6px;right:-6px;width:22px;height:22px;}
  .ck-pocket .ck-edit svg{width:10px;height:10px;}
  .ck-pocket.empty{display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.35);font-size:22px;min-height:120px;cursor:pointer;font-family:inherit;}
  /* 前後ボタン */
  .ck-nav{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-strong);background:var(--paper);color:var(--heading);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 0 2px;}
  .ck-nav:disabled{opacity:.3;cursor:default;}
  /* カレンダー */
  .ck-cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;margin-bottom:14px;box-shadow:0 10px 24px -18px rgba(33,28,23,.45);}
  .ck-cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .ck-cal-head b{font-size:19px;color:var(--heading);}
  .ck-cal-week,.ck-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
  .ck-cal-week{font-size:10px;color:var(--ink-soft);text-align:center;margin-bottom:4px;}
  .ck-day{position:relative;aspect-ratio:1/1;border-radius:6px;background:rgba(33,28,23,.05);border:none;padding:0;overflow:hidden;font-family:inherit;}
  .ck-day i{position:absolute;left:4px;top:2px;font-style:normal;font-size:10px;color:var(--ink-soft);z-index:1;}
  .ck-day.has{cursor:pointer;background:var(--accent-soft);}
  .ck-day.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .ck-day.has img + i{color:#FFFFFF;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6);}
  .ck-day-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .ck-day-icon svg{width:46%;stroke:currentColor;fill:none;stroke-width:1.5;}
  .ck-day.on{box-shadow:0 0 0 2px var(--accent);}
  .ck-cal-sel{display:flex;flex-direction:column;gap:10px;}
  /* LIVE記録のカレンダー（チェキのカレンダーと同じ見た目） */
  /* LIVE・チェキのカレンダーは共通の見た目。ホームのカード（遠征マップなど）と同じく、推しの色になじむカードの色にする */
  .ck-cal .ck-nav{background:var(--card);}
  .live-cal-title{display:flex;align-items:baseline;gap:8px;}
  .live-cal-title span{font-size:11px;color:var(--ink-soft);}
  .ck-day.today{box-shadow:inset 0 0 0 1.5px var(--line-strong);}
  .ck-day.today i{color:var(--heading);font-weight:700;}
  .ck-day.has.on{box-shadow:0 0 0 2px var(--accent);}
  .ck-day em{position:absolute;right:3px;bottom:3px;z-index:1;min-width:15px;height:15px;border-radius:99px;background:var(--accent);color:#FFFFFF;font-style:normal;font-size:9px;font-weight:700;line-height:15px;text-align:center;padding:0 3px;}
  .live-cal-day-note{display:inline-flex;align-items:center;gap:6px;margin-right:8px;font-weight:700;color:var(--heading);}
  .live-cal-day-note button{border:1px solid var(--accent);color:var(--accent);background:var(--paper);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
  /* 詳しいカード（カレンダー・スワイプ） */
  .ck-detail{position:relative;display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
  .ck-detail > .ck-ph-wrap{flex:none;width:78px;background:#FFFFFF;padding:4px 4px 12px;box-shadow:0 4px 10px -5px rgba(33,28,23,.4);transform:rotate(-2deg);align-self:flex-start;}
  .ck-detail-body{flex:1;min-width:0;padding-right:26px;}
  .ck-detail .t{font-size:14px;font-weight:700;color:var(--heading);}
  .ck-detail .g{font-size:12px;font-weight:700;color:var(--accent);margin-top:2px;}
  .ck-detail .m{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .ck-detail .talk{margin-top:8px;background:#FFFFFF;border:1px solid var(--line);border-radius:10px 10px 10px 2px;padding:7px 9px;font-size:12px;line-height:1.55;color:#211C17;white-space:pre-wrap;}
  .ck-detail .memo{margin-top:6px;font-size:11.5px;color:var(--ink-soft);line-height:1.55;white-space:pre-wrap;}
  .ck-detail > .ck-tl{top:10px;left:10px;}
  .ck-detail > .ck-tl .stamp{font-size:9px;padding:1px 6px 1px 4px;}
  .ck-detail > .ck-tl .stamp svg{width:10px;height:10px;}
  .ck-detail > .ck-favbtn{top:8px;right:8px;}
  .ck-detail > .ck-edit{bottom:8px;right:8px;}
  /* スワイプ */
  .ck-swipe{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 9% 14px;margin:0 -18px;scrollbar-width:none;}
  .ck-swipe::-webkit-scrollbar{display:none;}
  .ck-slide{flex:none;width:82%;scroll-snap-align:center;}
  .ck-detail.big{flex-direction:column;background:#FFFFFF;border:none;border-radius:4px;padding:12px 12px 16px;box-shadow:0 18px 30px -16px rgba(33,28,23,.5);}
  .ck-detail.big > .ck-ph-wrap{width:100%;padding:0;box-shadow:none;transform:none;}
  .ck-detail.big .ck-ph{aspect-ratio:auto;height:min(42vh,340px);}
  .ck-detail.big .ck-detail-body{padding-right:0;color:#211C17;}
  .ck-detail.big .t{font-size:18px;font-weight:800;color:#211C17;margin-top:10px;}
  .ck-detail.big .m{font-size:12px;color:#6B6259;}
  .ck-detail.big .talk{background:transparent;border:none;border-top:1px dashed rgba(33,28,23,.2);border-radius:0;padding:8px 0 0;}
  .ck-detail.big > .ck-tl{top:20px;left:20px;}

  .ck-detail.big > .ck-favbtn{top:20px;right:20px;}
  .ck-detail.big > .ck-edit{bottom:12px;right:12px;}
  .ck-detail.big .ck-detail-body{padding-bottom:26px;}
  .ck-swipe-no{text-align:center;font-size:12px;color:var(--ink-soft);letter-spacing:.06em;}
  /* マイページ：チェキの表示 */
  .ck-view-opts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;}
  .ck-view-opt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:10.5px;cursor:pointer;font-family:inherit;min-width:0;}
  .ck-view-opt svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;}
  .ck-view-opt span{white-space:nowrap;}
  .ck-view-opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;}
  /* ---------- 遠征マップ ---------- */
  .trip-map-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px 14px;
    box-shadow:0 10px 24px -18px rgba(33,28,23,.45);margin-top:12px;
  }
  .trip-map-card + .chart-card{margin-top:16px;}
  /* ホームの並べ替えできるカード（ギャラリー・遠征マップ・月別費用） */
  .home-sec{position:relative;margin-top:16px;touch-action:auto;}
  .home-sec > .trip-map-card,.home-sec > .chart-card{margin-top:0;}
  .home-sec.dragging{z-index:30;opacity:.92;}
  .home-sec.dragging > *{box-shadow:0 18px 36px -14px rgba(33,28,23,.55);}
  .home-grip{
    position:absolute;top:0;left:50%;transform:translate(-50%,-50%);z-index:3;width:40px;height:20px;padding:0;
    border-radius:99px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;
  }
  .home-grip:active{cursor:grabbing;}
  .home-grip svg{width:18px;height:18px;fill:currentColor;stroke:none;}
  /* ホームのギャラリー */
  .gal-actions{display:flex;align-items:center;gap:10px;}
  .gal-no{font-size:11px;color:var(--ink-soft);letter-spacing:.04em;}
  .gal-no b{font-family:"Shippori Mincho",serif;font-size:15px;color:var(--heading);}
  .gal-add{border:1px solid var(--accent);color:var(--accent);background:var(--paper);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .gal-swipe{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:2px 14px 6px;scrollbar-width:none;}
  .gal-swipe::-webkit-scrollbar{display:none;}
  /* 写真の枚数に関係なく、1枚の大きさは固定 */
  .gal-slide{position:relative;flex:none;width:240px;height:300px;scroll-snap-align:center;}
  .gal-ph{width:100%;height:100%;border-radius:12px;overflow:hidden;background:var(--paper-alt);cursor:zoom-in;box-shadow:0 10px 22px -14px rgba(33,28,23,.55);}
  .gal-ph{position:relative;}
  .gal-ph img{position:relative;width:100%;height:100%;object-fit:contain;display:block;}
  .gal-pending .gal-ph{cursor:default;}
  .gal-pending .gal-ph img:not(.gal-bg){opacity:.7;}
  .gal-saving{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(20,17,13,.6);color:#FFFFFF;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;}
  .gal-ph img.gal-bg{position:absolute;inset:0;object-fit:cover;filter:blur(18px) saturate(1.1);transform:scale(1.15);opacity:.75;}
  .gal-del{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(20,17,13,.5);color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .gal-del svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;}
  .gal-empty{width:100%;height:300px;border:1.5px dashed var(--line-strong);border-radius:12px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .gal-empty svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.5;}
  .trip-map-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 2px 12px;}
  .trip-map-eyebrow{display:block;font-size:9.5px;letter-spacing:.22em;color:var(--accent);font-weight:700;}
  .trip-map-title h3{margin:2px 0 0;font-size:19px;color:var(--heading);letter-spacing:.04em;}
  .trip-map-stats{display:flex;gap:14px;}
  .trip-stat{text-align:right;line-height:1.1;}
  .trip-stat b{display:block;font-family:"Shippori Mincho",serif;font-size:24px;font-weight:800;color:var(--heading);}
  .trip-stat span{font-size:9.5px;color:var(--ink-soft);letter-spacing:.08em;}
  .trip-map-frame{border-radius:12px;padding:4px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);}
  .trip-map{height:300px;border-radius:9px;overflow:hidden;position:relative;z-index:0;isolation:isolate;background:#F1EDE6;}
  .trip-map .leaflet-tile-pane{filter:sepia(.18) saturate(.9) brightness(1.02);}
  .trip-map .leaflet-control-zoom{border:none;box-shadow:0 4px 12px -4px rgba(33,28,23,.35);border-radius:10px;overflow:hidden;}
  .trip-map .leaflet-control-zoom a{
    width:30px;height:30px;line-height:28px;background:var(--paper);color:var(--heading);border-bottom:1px solid var(--line);font-weight:400;
  }
  .trip-map .leaflet-control-zoom a:last-child{border-bottom:none;}
  .trip-map .leaflet-control-attribution{background:rgba(251,248,243,.78);font-size:8.5px;border-radius:6px 0 0 0;color:var(--ink-soft);}
  .trip-map .leaflet-control-attribution a{color:var(--ink-soft);}
  /* しずく型のピン（中に回数） */
  .trip-pin{background:none;border:none;}
  .trip-pin .pin{
    position:relative;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    background:var(--accent);border:2.5px solid #FFFFFF;box-shadow:0 6px 12px -4px rgba(33,28,23,.55);
    display:flex;align-items:center;justify-content:center;
  }
  .trip-pin .pin b{transform:rotate(45deg);color:#FFFFFF;font-size:12px;font-weight:800;font-family:"Zen Kaku Gothic New",sans-serif;}
  .trip-pin.big .pin{width:36px;height:36px;}
  .trip-pin.big .pin b{font-size:13.5px;}
  /* 吹き出し */
  .trip-map .leaflet-popup-content-wrapper{border-radius:12px;padding:0;overflow:hidden;box-shadow:0 12px 28px -12px rgba(33,28,23,.55);}
  .trip-map .leaflet-popup-content{margin:0;width:220px !important;}
  .trip-map .leaflet-popup-tip{box-shadow:none;}
  .trip-pop-head{background:var(--accent);color:#FFFFFF;padding:10px 32px 9px 12px;}
  .trip-pop-head b{display:block;font-size:13.5px;line-height:1.35;}
  .trip-pop-head span{font-size:10.5px;opacity:.85;letter-spacing:.06em;}
  .trip-pop-list{list-style:none;margin:0;padding:6px 12px 10px;max-height:150px;overflow-y:auto;}
  .trip-pop-list li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed rgba(33,28,23,.14);font-size:11.5px;line-height:1.45;color:#211C17;}
  .trip-pop-list li:last-child{border-bottom:none;}
  .trip-pop-list .d{flex:none;font-family:"Shippori Mincho",serif;font-weight:700;color:var(--accent);}
  .trip-map .leaflet-popup-close-button{color:#FFFFFF !important;top:6px !important;right:6px !important;}
  /* 会場チップ */
  .trip-venues{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none;}
  .trip-venues::-webkit-scrollbar{display:none;}
  .trip-venue{
    flex:none;display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:99px;
    background:var(--paper);border:1px solid var(--line);font-size:12px;color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  .trip-venue .n{
    min-width:22px;height:22px;border-radius:50%;background:var(--accent);color:#FFFFFF;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:0 4px;
  }
  .trip-venue.missing{opacity:.55;}
  .trip-venue.missing .n{background:var(--ink-soft);}
  .trip-map-note{font-size:10.5px;color:var(--ink-soft);margin:8px 4px 0;line-height:1.6;white-space:pre-line;}
  .trip-map-note:empty{display:none;}
  /* 半径で絞る */
  .trip-radius{display:flex;gap:6px;margin:0 2px 10px;}
  .trip-radius:empty{display:none;}
  .trip-radius-chip{
    flex:1;padding:6px 0;border-radius:99px;border:1px solid var(--line);background:var(--paper);
    color:var(--text);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .trip-radius-chip.on{background:var(--accent);border-color:var(--accent);color:#FFFFFF;}
  .trip-venue .km{font-size:10.5px;color:var(--ink-soft);margin-left:-2px;}
  /* 地図の操作ボタン */
