function bindOshiForm(existingOshi){
  var form = document.getElementById("oshiForm");
  var preset = PALETTE[state.oshis.length % PALETTE.length];
  var chosenPhoto = existingOshi ? (existingOshi.photo || null) : null;
  // 位置を後から調整し直せるよう、切り抜く前の画像（縮小済み）も持っておく
  var chosenPhotoOriginal = existingOshi ? (existingOshi.photoOriginal || null) : null;
  var draftGroups = existingOshi ? oshiGroupsList(existingOshi) : [];

  var elName = form.querySelector('[name="name"]');
  var elAgency = form.querySelector('[name="agency"]');
  var elBirthMonth = form.querySelector('[name="birthMonth"]');
  var elBirthDay = form.querySelector('[name="birthDay"]');
  var elBirthYear = form.querySelector('[name="birthYear"]');
  var elPhotoInput = form.querySelector('[name="photo"]');
  var elPhotoImg = form.querySelector('#photoImg');
  var elPhotoPlaceholder = form.querySelector('#photoPlaceholder');
  var elClearPhotoBtn = form.querySelector('#clearPhotoBtn');
  var elPhotoPreviewBtn = form.querySelector('#photoPreviewBtn');
  var elPhotoMenu = form.querySelector('#photoMenu');
  var elAddGroupBtn = form.querySelector('#addGroupBtn');

  /* The app's one theme color always follows the top (main) group's own
     color picker; with no groups yet, it falls back to whatever color this
     oshi already had, or a fresh palette default for a brand-new oshi. */
  function effectiveColor(groupsArr){
    if(groupsArr && groupsArr[0] && groupsArr[0].color) return groupsArr[0].color;
    return (existingOshi && existingOshi.color) || preset.hex;
  }

  var snsCombos = [];
  PERSON_SNS_KEYS.forEach(function(k){ snsCombos.push("person_"+k); });
  draftGroups.forEach(function(g,i){ GROUP_SNS_KEYS.forEach(function(k){ snsCombos.push("grp"+i+"_"+k); }); });
  var chosenSns = {};
  PERSON_SNS_KEYS.forEach(function(k){
    chosenSns["person_"+k] = existingOshi ? getSnsValue(existingOshi, "person", k) : "";
  });
  draftGroups.forEach(function(g,i){
    GROUP_SNS_KEYS.forEach(function(k){ chosenSns["grp"+i+"_"+k] = g["sns_"+k] || ""; });
  });

  /* Accepts a bare ID ("hakane_kono"), an "@handle", or (in case someone
     pastes one out of habit) a full profile URL — percent-encoded or not —
     and returns just the plain ID, so the URL builder can safely encode it
     once when constructing the href (encoding an already-encoded string
     would otherwise turn "%" into "%25..." and break the link). */
  function normalizeId(v){
    v = (v||"").trim();
    if(!v) return "";
    if(snsIsLegacyUrl(v)){
      try{
        var parts = v.split("?")[0].split("#")[0].split("/").filter(Boolean);
        v = parts[parts.length-1] || v;
      }catch(e){}
    }
    v = v.replace(/^@+/, "");
    if(/%[0-9A-Fa-f]{2}/.test(v)){
      try{ v = decodeURIComponent(v); }catch(e){}
    }
    return v;
  }
  /* Snapshots every field currently typed into the form (including any
     unsaved person/group SNS entries) into a plain object shaped like an
     oshi, so adding or removing a group can re-render the whole sheet
     without losing anything the person already filled in. */
  function collectDraft(){
    var groups = Array.prototype.map.call(form.querySelectorAll(".group-name-input"), function(inp){
      var idx = inp.getAttribute("data-group-idx");
      var colorInput = form.querySelector('.group-color-input[data-group-color-idx="'+idx+'"]');
      var g = {
        id: (draftGroups[idx] && draftGroups[idx].id) || uuid(),
        name: inp.value,
        color: colorInput ? colorInput.value : ""
      };
      GROUP_SNS_KEYS.forEach(function(k){ g["sns_"+k] = chosenSns["grp"+idx+"_"+k] || ""; });
      return g;
    });
    var draft = {
      id: existingOshi ? existingOshi.id : undefined,
      agency: elAgency.value,
      name: elName.value,
      photo: chosenPhoto,
      photoOriginal: chosenPhotoOriginal,
      color: effectiveColor(groups),
      birthMonth: elBirthMonth.value,
      birthDay: elBirthDay.value,
      birthYear: elBirthYear.value,
      mode: "pale",
      order: existingOshi ? existingOshi.order : state.oshis.length,
      createdAt: existingOshi ? existingOshi.createdAt : Date.now(),
      groups: groups
    };
    PERSON_SNS_KEYS.forEach(function(k){ draft["sns_person_"+k] = chosenSns["person_"+k] || ""; });
    return draft;
  }

  function refreshPhotoPreview(){
    if(chosenPhoto){
      elPhotoImg.src = chosenPhoto;
      elPhotoImg.style.display = "block";
      elPhotoPlaceholder.style.display = "none";
      elClearPhotoBtn.style.display = "block";
      elAdjustPhotoBtn.style.display = "block";
    } else {
      elPhotoImg.style.display = "none";
      elPhotoImg.src = "";
      elPhotoPlaceholder.style.display = "block";
      elClearPhotoBtn.style.display = "none";
      elAdjustPhotoBtn.style.display = "none";
    }
  }
  var elAdjustPhotoBtn = form.querySelector("#adjustPhotoBtn");
  refreshPhotoPreview();
  elAdjustPhotoBtn.addEventListener("click", function(){
    AvatarCropper.open(chosenPhotoOriginal || chosenPhoto, function(cropped){
      if(!cropped) return;
      if(!chosenPhotoOriginal) chosenPhotoOriginal = chosenPhoto;
      chosenPhoto = cropped;
      refreshPhotoPreview();
    });
  });

  function closeAllPickers(){
    form.querySelectorAll(".photo-menu").forEach(function(m){ m.style.display = "none"; });
  }
  function togglePicker(anchorEl, el){
    var wasOpen = el.style.display === "block";
    closeAllPickers();
    if(!wasOpen){ openPopoverNear(anchorEl, el); }
  }
  form.querySelectorAll(".group-card-row").forEach(function(row){
    row.addEventListener("scroll", closeAllPickers);
  });

  elPhotoPreviewBtn.addEventListener("click", function(e){
    e.stopPropagation();
    togglePicker(elPhotoPreviewBtn, elPhotoMenu);
  });
  form.addEventListener("click", function(e){
    if(!e.target.closest(".photo-picker")){ closeAllPickers(); }
  });
  elPhotoMenu.querySelectorAll(".photo-menu-item").forEach(function(item){
    item.addEventListener("click", function(){ closeAllPickers(); });
  });

  if(elAddGroupBtn){
    elAddGroupBtn.addEventListener("click", function(e){
      e.stopPropagation();
      var draft = collectDraft();
      draft.groups.push({id:uuid(), name:"", color:"", sns_web:"", sns_instagram:"", sns_x:"", sns_tiktok:"", sns_youtube:""});
      openOshiSheet(draft);
    });
  }
  form.querySelectorAll(".group-remove-btn").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var idx = Number(btn.getAttribute("data-group-remove"));
      var draft = collectDraft();
      draft.groups.splice(idx, 1);
      openOshiSheet(draft);
    });
  });
  /* Group order determines main/sub (the top card is always "main"), so
     reordering is the only control needed: arrow buttons for a reliable
     single-step move on any device, plus native drag-and-drop on the
     handle for picking a card up and dropping it further away in one go. */
  function moveGroup(from, to){
    var draft = collectDraft();
    if(to<0 || to>=draft.groups.length || from===to) return;
    var moved = draft.groups.splice(from,1)[0];
    draft.groups.splice(to,0,moved);
    openOshiSheet(draft);
  }
  form.querySelectorAll(".group-order-btn").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      if(btn.disabled) return;
      var idx = Number(btn.getAttribute("data-group-move"));
      var dir = btn.getAttribute("data-dir");
      moveGroup(idx, dir==="up" ? idx-1 : idx+1);
    });
  });
  form.querySelectorAll(".group-color-btn").forEach(function(colorBtn){
    var idx = colorBtn.getAttribute("data-group-color-btn");
    var pop = form.querySelector('[data-group-color-pop="'+idx+'"]');
    var hiddenInput = form.querySelector('.group-color-input[data-group-color-idx="'+idx+'"]');
    colorBtn.addEventListener("click", function(e){
      e.stopPropagation();
      togglePicker(colorBtn, pop);
    });
    pop.querySelectorAll(".gcs-swatch").forEach(function(sw){
      sw.addEventListener("click", function(e){
        e.stopPropagation();
        var hex = sw.getAttribute("data-hex");
        hiddenInput.value = hex;
        colorBtn.style.background = hex;
        closeAllPickers();
      });
    });
    var customBtn = pop.querySelector(".gcs-custom-btn");
    customBtn.addEventListener("click", function(e){
      e.stopPropagation();
      closeAllPickers();
      hiddenInput.click();
    });
    hiddenInput.addEventListener("input", function(){
      colorBtn.style.background = hiddenInput.value;
    });
  });
  var dragFromIdx = null;
  form.querySelectorAll(".group-card").forEach(function(card){
    card.addEventListener("dragstart", function(e){
      dragFromIdx = Number(card.getAttribute("data-group-card"));
      card.classList.add("dragging");
      try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(dragFromIdx)); }catch(err){}
    });
    card.addEventListener("dragend", function(){
      card.classList.remove("dragging");
      form.querySelectorAll(".group-card.drag-over").forEach(function(c){ c.classList.remove("drag-over"); });
    });
    card.addEventListener("dragover", function(e){
      e.preventDefault();
      if(dragFromIdx===null) return;
      var targetIdx = Number(card.getAttribute("data-group-card"));
      if(targetIdx===dragFromIdx) return;
      card.classList.add("drag-over");
    });
    card.addEventListener("dragleave", function(){ card.classList.remove("drag-over"); });
    card.addEventListener("drop", function(e){
      e.preventDefault();
      var targetIdx = Number(card.getAttribute("data-group-card"));
      if(dragFromIdx!==null && targetIdx!==dragFromIdx){ moveGroup(dragFromIdx, targetIdx); }
      dragFromIdx = null;
    });
  });

  /* グループ名が、ほかの推しのグループ名と完全に一致したら、そのグループの
     SNS（公式HP含む）を空欄にだけ自動で入れる（同じグループの別メンバー登録用） */
  function findSameGroupSns(name){
    var found = {};
    state.oshis.forEach(function(o){
      if(existingOshi && o.id===existingOshi.id) return;
      oshiGroupsList(o).forEach(function(g){
        if((g.name||"").trim()!==name) return;
        GROUP_SNS_KEYS.forEach(function(k){
          if(!found[k] && g["sns_"+k]) found[k] = g["sns_"+k];
        });
      });
    });
    return found;
  }
  function setSnsValue(combo, value){
    chosenSns[combo] = value;
    var k = combo.slice(combo.lastIndexOf("_")+1);
    var input = form.querySelector('[data-sns-input="'+combo+'"]');
    if(input) input.value = SNS_META[k].isUrl ? value : snsIdForEdit(value);
    var btn = form.querySelector('[data-sns-btn="'+combo+'"]');
    if(btn) btn.classList.toggle("filled", !!value);
    var clearBtn = form.querySelector('[data-sns-clear="'+combo+'"]');
    if(clearBtn) clearBtn.style.display = value ? "block" : "none";
  }
  function onGroupNameCommitted(e){
    var inp = e.target.closest(".group-name-input");
    if(!inp) return;
    // 候補から選んだとき（insertReplacementText、または inputType なし）もその場で反映する
    if(e.type==="input" && e.inputType && e.inputType!=="insertReplacementText") return;
    var name = inp.value.trim();
    if(!name) return;
    var idx = inp.getAttribute("data-group-idx");
    var found = findSameGroupSns(name);
    var filled = 0;
    GROUP_SNS_KEYS.forEach(function(k){
      var combo = "grp"+idx+"_"+k;
      if(found[k] && !chosenSns[combo]){ setSnsValue(combo, found[k]); filled++; }
    });
    if(filled) toast("「"+name+"」のSNS情報を反映しました");
  }
  form.addEventListener("change", onGroupNameCommitted);
  form.addEventListener("input", onGroupNameCommitted);

  snsCombos.forEach(function(combo){
    var btn = form.querySelector('[data-sns-btn="'+combo+'"]');
    var pop = form.querySelector('[data-sns-pop="'+combo+'"]');
    var input = form.querySelector('[data-sns-input="'+combo+'"]');
    var saveBtn = form.querySelector('[data-sns-save="'+combo+'"]');
    var clearBtn = form.querySelector('[data-sns-clear="'+combo+'"]');

    function refreshIcon(){
      btn.classList.toggle("filled", !!chosenSns[combo]);
      clearBtn.style.display = chosenSns[combo] ? "block" : "none";
    }
    refreshIcon();

    btn.addEventListener("click", function(e){
      e.stopPropagation();
      togglePicker(btn, pop);
      if(pop.style.display === "block"){ input.focus(); }
    });
    var isUrlCombo = !!SNS_META[combo.slice(combo.lastIndexOf("_")+1)].isUrl;
    saveBtn.addEventListener("click", function(){
      if(isUrlCombo){
        var url = safeWebUrl(input.value);
        if(input.value.trim() && !url){ toast("URLを正しく入力してください"); input.focus(); return; }
        chosenSns[combo] = url;
        input.value = url;
        refreshIcon();
        closeAllPickers();
        return;
      }
      chosenSns[combo] = normalizeId(input.value);
      input.value = chosenSns[combo];
      refreshIcon();
      closeAllPickers();
    });
    clearBtn.addEventListener("click", function(){
      chosenSns[combo] = "";
      input.value = "";
      refreshIcon();
      closeAllPickers();
    });
  });

  elPhotoInput.addEventListener("change", function(){
    var file = elPhotoInput.files && elPhotoInput.files[0];
    if(!file) return;
    if(file.type.indexOf("image/")!==0){ toast("画像ファイルを選択してください"); return; }
    resizeImageFile(file, 1000, 0.85).then(function(original){
      elPhotoInput.value = "";
      AvatarCropper.open(original, function(cropped){
        if(!cropped) return;
        chosenPhotoOriginal = original;
        chosenPhoto = cropped;
        refreshPhotoPreview();
      });
    }).catch(function(){
      toast("画像の読み込みに失敗しました");
    });
  });
  elClearPhotoBtn.addEventListener("click", function(){
    chosenPhoto = null;
    chosenPhotoOriginal = null;
    elPhotoInput.value = "";
    refreshPhotoPreview();
  });

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var name = elName.value.trim();
    if(!name){ elName.focus(); toast("人物名を入力してください"); return; }
    var isEditingReal = !!(existingOshi && existingOshi.id);
    var groups = Array.prototype.map.call(form.querySelectorAll(".group-name-input"), function(inp){
      var idx = inp.getAttribute("data-group-idx");
      var colorInput = form.querySelector('.group-color-input[data-group-color-idx="'+idx+'"]');
      var g = {
        id: (draftGroups[idx] && draftGroups[idx].id) || uuid(),
        name: inp.value.trim(),
        color: colorInput ? colorInput.value : ""
      };
      GROUP_SNS_KEYS.forEach(function(k){ g["sns_"+k] = chosenSns["grp"+idx+"_"+k] || ""; });
      return g;
    }).filter(function(g){
      return g.name || g.sns_web || g.sns_instagram || g.sns_x || g.sns_tiktok || g.sns_youtube;
    });
    var oshi = {
      id: isEditingReal ? existingOshi.id : uuid(),
      agency: elAgency.value.trim(),
      groups: groups,
      name: name,
      photo: chosenPhoto,
      photoOriginal: chosenPhoto ? chosenPhotoOriginal : null,
      color: effectiveColor(groups),
      birthMonth: elBirthMonth.value ? Number(elBirthMonth.value) : null,
      birthDay: elBirthDay.value ? Number(elBirthDay.value) : null,
      birthYear: elBirthYear.value ? Number(elBirthYear.value) : null,
      mode: "pale",
      order: isEditingReal ? existingOshi.order : state.oshis.length,
      hidden: isEditingReal ? !!existingOshi.hidden : false,
      createdAt: isEditingReal ? existingOshi.createdAt : Date.now()
    };
    PERSON_SNS_KEYS.forEach(function(k){ oshi["sns_person_"+k] = chosenSns["person_"+k] || ""; });
    await persistOshi(oshi);
    if(!state.activeOshiId){ await setActiveOshi(oshi.id); }
    closeSheet();
    toast(isEditingReal ? "推しを更新しました" : "推しを登録しました");
    render();
  });

  var delBtn = form.querySelector("[data-action=delete-oshi]");
  if(delBtn){
    delBtn.addEventListener("click", async function(){
      if(!confirm("この推しと担当カラーの設定を削除しますか？記録は残ります。")) return;
      var id = delBtn.getAttribute("data-id");
      await removeOshi(id);
      if(state.activeOshiId===id){
        var next = state.oshis.find(function(o){return o.id!==id;});
        await setActiveOshi(next?next.id:null);
      }
      closeSheet();
      toast("推しを削除しました");
      render();
    });
  }
}

function bindRecordForm(type,existingRec){
  var form = document.getElementById("recordForm");
  var chosenPhoto = existingRec ? (existingRec.photo || null) : null;
  var favOn = existingRec ? !!existingRec.favorite : false;
  var hideOn = existingRec ? !!existingRec.hidden : false;
  var elFavToggle = form.querySelector("#favToggle");
  var elHideToggle = form.querySelector("#hideToggle");
  function refreshToggles(){
    elFavToggle.classList.toggle("on", favOn);
    elHideToggle.classList.toggle("on", hideOn);
  }
  refreshToggles();
  elFavToggle.addEventListener("click", function(){ favOn = !favOn; refreshToggles(); });
  elHideToggle.addEventListener("click", function(){ hideOn = !hideOn; refreshToggles(); });

  /* 推しとグループを横並びの1行で選ぶ。LIVEは「推しを追加」で対バンの
     推しを複数行にできる（1行目が oshiId/groupId、2行目以降が extraOshis）。
     グループの選択肢は推しを変えるたびに作り直し、既定はメイングループ。 */
  var elOshiRows = form.querySelector("#recOshiRows");
  var elAddOshiBtn = form.querySelector("#addRecOshiBtn");
  var oshiRows = existingRec ? recOshiEntries(existingRec) : [];
  if(type!=="live") oshiRows = oshiRows.slice(0,1);
  oshiRows = oshiRows.filter(function(e){ return getOshi(e.oshiId); });
  if(!oshiRows.length){
    var firstOshi = getOshi(state.activeOshiId) || visibleOshis()[0] || state.oshis[0];
    oshiRows = [{oshiId:firstOshi.id, groupId:""}];
  }
  function defaultGroupId(oshiId){
    var o = getOshi(oshiId);
    var gs = o ? oshiGroupsList(o) : [];
    return gs.length ? gs[0].id : "";
  }
  oshiRows.forEach(function(row){
    var o = getOshi(row.oshiId);
    var gs = o ? oshiGroupsList(o) : [];
    if(!gs.some(function(g){ return g.id===row.groupId; })) row.groupId = defaultGroupId(row.oshiId);
  });
  function renderOshiRows(){
    elOshiRows.innerHTML = oshiRows.map(function(row, i){
      var o = getOshi(row.oshiId);
      var gs = o ? oshiGroupsList(o) : [];
      var oshiOpts = state.oshis.map(function(x){
        var usedElsewhere = oshiRows.some(function(r2, j){ return j!==i && r2.oshiId===x.id; });
        if(usedElsewhere) return "";
        if(x.hidden && x.id!==row.oshiId) return "";   // 非表示の推しは、すでに選ばれている行以外では出さない
        return '<option value="'+x.id+'" '+(x.id===row.oshiId?"selected":"")+'>'+escapeHtml(x.name)+'</option>';
      }).join("");
      var groupSel = gs.length
        ? '<select class="rec-group-sel" data-row="'+i+'" aria-label="グループ">'+gs.map(function(g){
            return '<option value="'+g.id+'" '+(g.id===row.groupId?"selected":"")+'>'+escapeHtml(g.name||"（名称未設定）")+'</option>';
          }).join("")+'</select>'
        : '<span class="rec-cell-empty"></span>';
      // LIVEは「人物名・グループ名・チェキ・✕」の4列。1行目は✕の位置を空けて列をそろえる
      var chekiBtn = type==="live"
        ? '<button type="button" class="rec-oshi-icon rec-oshi-cheki" data-cheki-row="'+i+'" title="この推しのチェキを追加" aria-label="この推しのチェキを追加">'+kindIcon("cheki")+'</button>'
        : '';
      var removeBtn = i>0
        ? '<button type="button" class="rec-oshi-icon rec-oshi-remove" data-remove-row="'+i+'" title="この推しを外す" aria-label="この推しを外す"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>'
        : (type==="live" ? '<span class="rec-oshi-icon rec-cell-empty"></span>' : '');
      return '<div class="rec-oshi-row'+(type==="live"?' with-actions':'')+'">'
        + '<select class="rec-oshi-sel" data-row="'+i+'" aria-label="推し">'+oshiOpts+'</select>'
        + groupSel
        + chekiBtn
        + removeBtn
        + '</div>';
    }).join("");
    if(elAddOshiBtn){
      var canAdd = visibleOshis().some(function(o){ return !oshiRows.some(function(r){ return r.oshiId===o.id; }); });
      elAddOshiBtn.style.display = canAdd ? "" : "none";
    }
  }
  elOshiRows.addEventListener("change", function(e){
    var t = e.target;
    var i = Number(t.getAttribute("data-row"));
    if(t.classList.contains("rec-oshi-sel")){
      oshiRows[i].oshiId = t.value;
      oshiRows[i].groupId = defaultGroupId(t.value);
      renderOshiRows();
    } else if(t.classList.contains("rec-group-sel")){
      oshiRows[i].groupId = t.value;
    }
  });
  elOshiRows.addEventListener("click", function(e){
    var chekiBtn = e.target.closest("[data-cheki-row]");
    if(chekiBtn){ addChekiFromLive(oshiRows[Number(chekiBtn.getAttribute("data-cheki-row"))]); return; }
    var btn = e.target.closest("[data-remove-row]");
    if(!btn) return;
    oshiRows.splice(Number(btn.getAttribute("data-remove-row")), 1);
    renderOshiRows();
  });
  /* チェキボタン：この行の推し・グループと、LIVEの日付・公演名でチェキの記録を追加する */
  async function addChekiFromLive(row){
    if(!row) return;
    var title = (form.querySelector('[name="title"]').value||"").trim();
    var date = form.querySelector('[name="date"]').value;
    if(!title){ toast("先に公演・ツアー名を入力してください"); form.querySelector('[name="title"]').focus(); return; }
    if(!date){ toast("先に日付を入力してください"); return; }
    var o = getOshi(row.oshiId);
    await persistRecord("cheki", {
      id: uuid(), oshiId: row.oshiId, groupId: row.groupId||"", date: date, title: title,
      count: 1, price: 0, content: "", memo: "", tag: "", photo: null,
      favorite: false, hidden: false, createdAt: Date.now()
    });
    toast("チェキを追加しました"+(o ? "（"+o.name+"）" : ""));
  }
  if(elAddOshiBtn){
    elAddOshiBtn.addEventListener("click", function(){
      var next = visibleOshis().find(function(o){ return !oshiRows.some(function(r){ return r.oshiId===o.id; }); });
      if(!next){ toast("追加できる推しがいません"); return; }
      oshiRows.push({oshiId:next.id, groupId:defaultGroupId(next.id)});
      renderOshiRows();
    });
  }
  renderOshiRows();

  var venueAc = type==="live" ? bindVenueAutocomplete(form, existingRec) : null;

  form.querySelectorAll("[data-viewing]").forEach(function(b){
    b.addEventListener("click", function(){
      form.querySelector('[name="viewing"]').value = b.getAttribute("data-viewing");
      form.querySelectorAll("[data-viewing]").forEach(function(x){ x.classList.toggle("on", x===b); });
    });
  });

  /* 配信URL：1行ずつ入力し、「＋ 配信URLを追加」で行を増やす（2行目以降は✕で外せる） */
  var elStreamRows = form.querySelector("#streamUrlRows");
  function streamRowHtml(v, i){
    return '<div class="stream-url-row">'
      + '<input type="text" class="stream-url-input" inputmode="url" autocomplete="off" aria-label="配信URL'+(i+1)+'" value="'+escapeHtml(v||"")+'">'
      + (i>0 ? '<button type="button" class="rec-oshi-icon rec-oshi-remove" data-remove-stream="'+i+'" title="このURLを外す" aria-label="このURLを外す"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>'
             : '<span class="rec-oshi-icon rec-cell-empty"></span>')   // 1行目も✕の位置を空けて幅をそろえる
      + '</div>';
  }
  function currentStreamValues(){
    return Array.prototype.map.call(elStreamRows.querySelectorAll(".stream-url-input"), function(inp){ return inp.value; });
  }
  function renderStreamRows(values){
    if(!values.length) values = [""];
    elStreamRows.innerHTML = values.map(streamRowHtml).join("");
  }
  if(elStreamRows){
    renderStreamRows(existingRec ? (Array.isArray(existingRec.streamUrls) ? existingRec.streamUrls.slice() : (existingRec.streamUrl ? [existingRec.streamUrl] : [])) : []);
    form.querySelector("#addStreamUrlBtn").addEventListener("click", function(){
      var vals = currentStreamValues();
      vals.push("");
      renderStreamRows(vals);
      var inputs = elStreamRows.querySelectorAll(".stream-url-input");
      inputs[inputs.length-1].focus();
    });
    elStreamRows.addEventListener("click", function(e){
      var b = e.target.closest("[data-remove-stream]");
      if(!b) return;
      var vals = currentStreamValues();
      vals.splice(Number(b.getAttribute("data-remove-stream")), 1);
      renderStreamRows(vals);
    });
  }

  var hasPhotoField = (type==="cheki" || type==="live" || type==="goods");
  if(hasPhotoField){
    var elBtn = form.querySelector("#recPhotoPreviewBtn");
    var elMenu = form.querySelector("#recPhotoMenu");
    var elImg = form.querySelector("#recPhotoImg");
    var elPlaceholder = form.querySelector("#recPhotoPlaceholder");
    var elClearBtn = form.querySelector("#clearRecPhotoBtn");
    var elInput = form.querySelector("#recPhotoInput");

    var elViewBtn = form.querySelector("#viewRecPhotoBtn");
    function refreshRecPhoto(){
      if(chosenPhoto){
        elImg.src = chosenPhoto;
        elImg.style.display = "block";
        elPlaceholder.style.display = "none";
        elClearBtn.style.display = "block";
        elViewBtn.style.display = "block";
      } else {
        elImg.style.display = "none";
        elImg.src = "";
        elPlaceholder.style.display = "block";
        elClearBtn.style.display = "none";
        elViewBtn.style.display = "none";
      }
    }
    elViewBtn.addEventListener("click", function(){ openPhotoViewer(chosenPhoto); });
    refreshRecPhoto();

    elBtn.addEventListener("click", function(e){
      e.stopPropagation();
      var wasOpen = elMenu.style.display === "block";
      elMenu.style.display = "none";
      if(!wasOpen){ openPopoverNear(elBtn, elMenu); }
    });
    form.addEventListener("click", function(e){
      if(!e.target.closest(".photo-picker")){ elMenu.style.display = "none"; }
    });
    elMenu.querySelectorAll(".photo-menu-item").forEach(function(item){
      item.addEventListener("click", function(){ elMenu.style.display = "none"; });
    });
    elInput.addEventListener("change", function(){
      var file = elInput.files && elInput.files[0];
      if(!file) return;
      if(file.type.indexOf("image/")!==0){ toast("画像ファイルを選択してください"); return; }
      if(type==="cheki"){
        PhotoEditor.open(file, function(dataUrl){
          elInput.value = "";
          if(dataUrl){
            chosenPhoto = dataUrl;
            refreshRecPhoto();
          }
        });
      } else {
        resizeImageFile(file, 640, 0.85).then(function(dataUrl){
          elInput.value = "";
          chosenPhoto = dataUrl;
          refreshRecPhoto();
        }).catch(function(){
          toast("画像の読み込みに失敗しました");
        });
      }
    });
    elClearBtn.addEventListener("click", function(){
      chosenPhoto = null;
      elInput.value = "";
      refreshRecPhoto();
    });
  }

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var fd = new FormData(form);
    var rec = { id: existingRec ? existingRec.id : uuid() };
    fd.forEach(function(v,k){ rec[k]=v; });
    if(rec.ticketUrl!==undefined){
      // オンラインチケットのURLも https:// 省略可、http(s) 以外は受け付けない
      var ticketUrlRaw = String(rec.ticketUrl).trim();
      rec.ticketUrl = safeWebUrl(ticketUrlRaw);
      if(ticketUrlRaw && !rec.ticketUrl){
        toast("オンラインチケットURLを正しく入力してください");
        form.querySelector('[name="ticketUrl"]').focus();
        return;
      }
    }
    if(rec.shopUrl!==undefined){
      // https:// を省略しても保存できるようにし、http(s) 以外は受け付けない
      var shopUrlRaw = String(rec.shopUrl).trim();
      rec.shopUrl = safeWebUrl(shopUrlRaw);
      if(shopUrlRaw && !rec.shopUrl){
        toast("ONLINE物販URLを正しく入力してください");
        form.querySelector('[name="shopUrl"]').focus();
        return;
      }
    }
    if(rec.price!==undefined) rec.price = rec.price===""?0:Number(rec.price);
    if(rec.count!==undefined) rec.count = rec.count===""?1:Number(rec.count);
    if(rec.qty!==undefined) rec.qty = rec.qty===""?1:Number(rec.qty);
    rec.oshiId = oshiRows[0].oshiId;
    rec.groupId = oshiRows[0].groupId || "";
    if(type==="live"){
      // 配信URLは http(s) のみ（https:// は省略可）。空欄は無視し、1件目は streamUrl にも入れて旧形式と互換にする
      var urls = [];
      var badUrl = currentStreamValues().some(function(v){
        v = (v||"").trim();
        if(!v) return false;
        var u = safeWebUrl(v);
        if(!u) return true;
        urls.push(u);
        return false;
      });
      if(badUrl){ toast("配信URLを正しく入力してください"); return; }
      rec.streamUrls = urls;
      rec.streamUrl = urls[0] || "";
      rec.extraOshis = oshiRows.slice(1).map(function(r){ return {oshiId:r.oshiId, groupId:r.groupId||""}; });
      rec.venuePlace = venueAc ? venueAc.getPlace() : null;
    }
    if(hasPhotoField){ rec.photo = chosenPhoto; }
    rec.favorite = favOn;
    rec.hidden = hideOn;
    rec.createdAt = existingRec ? existingRec.createdAt : Date.now();
    await persistRecord(type,rec);
    closeSheet();
    toast(existingRec ? "記録を更新しました" : "記録を追加しました");
    render();
  });
  var delBtn = form.querySelector("[data-action=delete-record]");
  if(delBtn){
    delBtn.addEventListener("click", async function(){
      if(!confirm("この記録を削除しますか？")) return;
      await removeRecord(type, delBtn.getAttribute("data-id"));
      closeSheet();
      toast("記録を削除しました");
      render();
    });
  }
}

/* ============ avatar cropper ============
   プロフィール写真を丸枠に合わせて切り抜く。open(元画像dataURL, 完了時コールバック) で開き、
   ドラッグで位置、スライダー（PCはホイールも）で拡大率を変える。
   適用すると 480x480 の正方形JPEGを返す（キャンセル時は null）。 */
var AvatarCropper = (function(){
  var bg, stage, imgEl, zoomEl, img = null, onDone = null;
  var S = 0, base = 1, zoom = 1, ox = 0, oy = 0, drag = null;

  function scale(){ return base*zoom; }
  function clamp(){
    var dw = img.naturalWidth*scale(), dh = img.naturalHeight*scale();
    ox = Math.min(0, Math.max(S-dw, ox));
    oy = Math.min(0, Math.max(S-dh, oy));
  }
  function draw(){
    clamp();
    imgEl.style.transform = "translate("+ox+"px,"+oy+"px) scale("+scale()+")";
  }
  // 画面上の中心を保ったまま拡大率を変える
  function setZoom(z){
    z = Math.max(1, Math.min(4, z));
    var cx = (S/2 - ox)/scale(), cy = (S/2 - oy)/scale();
    zoom = z;
    ox = S/2 - cx*scale(); oy = S/2 - cy*scale();
    zoomEl.value = Math.round(zoom*100);
    draw();
  }
  function layout(){
    S = stage.clientWidth;
    base = S / Math.min(img.naturalWidth, img.naturalHeight);
  }
  function close(result){
    bg.classList.remove("show");
    var cb = onDone; onDone = null; img = null; imgEl.src = "";
    if(cb) cb(result);
  }
  function apply(){
    var out = 480, sc = scale();
    var c = document.createElement("canvas");
    c.width = out; c.height = out;
    c.getContext("2d").drawImage(img, -ox/sc, -oy/sc, S/sc, S/sc, 0, 0, out, out);
    var url = null;
    try{ url = c.toDataURL("image/jpeg", 0.88); }catch(e){ toast("画像の書き出しに失敗しました"); }
    close(url);
  }
  function init(){
    bg = document.getElementById("avatarCropBg");
    stage = document.getElementById("avatarCropStage");
    imgEl = document.getElementById("avatarCropImg");
    zoomEl = document.getElementById("avatarCropZoom");
    zoomEl.addEventListener("input", function(){ if(img) setZoom(Number(zoomEl.value)/100); });
    stage.addEventListener("pointerdown", function(e){
      if(!img) return;
      drag = {id:e.pointerId, x:e.clientX, y:e.clientY, ox:ox, oy:oy};
      stage.setPointerCapture(e.pointerId);
      stage.classList.add("dragging");
    });
    stage.addEventListener("pointermove", function(e){
      if(!drag || e.pointerId!==drag.id) return;
      ox = drag.ox + (e.clientX-drag.x);
      oy = drag.oy + (e.clientY-drag.y);
      draw();
    });
    function endDrag(e){ if(drag && e.pointerId===drag.id){ drag = null; stage.classList.remove("dragging"); } }
    stage.addEventListener("pointerup", endDrag);
    stage.addEventListener("pointercancel", endDrag);
    stage.addEventListener("wheel", function(e){
      if(!img) return;
      e.preventDefault();
      setZoom(zoom * (e.deltaY<0 ? 1.08 : 1/1.08));
    }, {passive:false});
    document.getElementById("avatarCropApply").addEventListener("click", apply);
    document.getElementById("avatarCropCancel").addEventListener("click", function(){ close(null); });
    document.getElementById("avatarCropClose").addEventListener("click", function(){ close(null); });
  }
  function open(src, cb){
    onDone = cb;
    var im = new Image();
    im.onload = function(){
      img = im;
      imgEl.src = src;
      bg.classList.add("show");
      layout();
      zoom = 1;
      zoomEl.value = 100;
      ox = (S - img.naturalWidth*scale())/2;
      oy = (S - img.naturalHeight*scale())/2;
      draw();
    };
    im.onerror = function(){ toast("画像の読み込みに失敗しました"); close(null); };
    im.src = src;
  }
  return { init:init, open:open };
})();

/* ============ trip map (遠征マップ) ============
   ホームに、お気に入りの推しの「現地」LIVEの会場をピンで表示する。地図は Leaflet + 国土地理院の淡色地図。
   位置は会場を候補から選んだときの venuePlace.lat/lng を使い、無いときは会場名から
   OpenStreetMap（Nominatim）で調べて端末に保存する（1秒に1件まで・見つからなければ7日間は再検索しない）。
   現在地はこの画面の中だけで使い、保存も送信もしない。 */
var TripMap = (function(){
  var GEO_KEY = "oshikatsu_geo_v1";
  var RADII = [0, 3, 10, 30];   // km（0 = すべて）
  var map = null, layer = null, meLayer = null, queue = [], busy = false, currentOshiId = null, markers = {}, popupTimer = null;
  var userPos = null, radiusKm = 0, locating = null, viewTouched = false, expanded = false, lastShown = [], resizeObs = null;
  function geoCache(){ return readStored(GEO_KEY) || {}; }
  function saveGeo(c){ try{ localStorage.setItem(GEO_KEY, JSON.stringify(c)); }catch(e){} }
  function venueKey(name){ return (name||"").trim().toLowerCase(); }

  // 2点間の距離（km）
  function distanceKm(a, b){
    var R = 6371, rad = Math.PI/180;
    var dLat = (b.lat-a.lat)*rad, dLng = (b.lng-a.lng)*rad;
    var h = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return 2*R*Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function fmtKm(km){ return km<10 ? km.toFixed(1)+"km" : Math.round(km)+"km"; }

  // 会場ごとにまとめる：{key, name, lat, lng, visits:[record]}
  function collect(oshi){
    var groups = {};
    // 会場を候補から選んだ記録の位置は、ほかの推しの記録にも使う（同じ会場名なら同じ場所）
    var known = {};
    state.live.forEach(function(r){
      var vp = r.venuePlace;
      if(!vp || typeof vp.lat!=="number" || typeof vp.lng!=="number") return;
      [vp.name, r.venue].forEach(function(n){
        var k = venueKey(n);
        if(k && !known[k]) known[k] = {lat:vp.lat, lng:vp.lng};
      });
    });
    state.live.forEach(function(r){
      if(r.hidden || !oshi || !recHasOshi(r, oshi.id)) return;
      if(recViewing(r)==="stream") return;
      var name = (r.venuePlace && r.venuePlace.name) || (r.venue||"").trim();
      if(!name) return;
      var key = venueKey(name);
      var g = groups[key] || (groups[key] = {key:key, name:name, lat:null, lng:null, visits:[]});
      g.visits.push(r);
      if(g.lat==null && r.venuePlace && typeof r.venuePlace.lat==="number" && typeof r.venuePlace.lng==="number"){
        g.lat = r.venuePlace.lat; g.lng = r.venuePlace.lng;
      }
    });
    var cache = geoCache();
    return Object.keys(groups).map(function(k){
      var g = groups[k];
      if(g.lat==null && known[k]){ g.lat = known[k].lat; g.lng = known[k].lng; }
      if(g.lat==null && cache[k] && cache[k].lat!=null){ g.lat = cache[k].lat; g.lng = cache[k].lng; }
      g.visits.sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
      return g;
    }).sort(function(a,b){ return b.visits.length-a.visits.length || a.name.localeCompare(b.name,"ja"); });
  }
  // 半径で絞る（現在地が分かっているときだけ）
  function applyRadius(groups){
    groups.forEach(function(g){ g.dist = (userPos && g.lat!=null) ? distanceKm(userPos, g) : null; });
    if(!radiusKm || !userPos) return groups;
    return groups.filter(function(g){ return g.dist!=null && g.dist<=radiusKm; })
      .sort(function(a,b){ return a.dist-b.dist; });
  }
  function popupHtml(g){
    return '<div class="trip-pop-head"><b>'+escapeHtml(g.name)+'</b><span>'+g.visits.length+' VISIT'+(g.visits.length>1?'S':'')
      + (g.dist!=null ? '・現在地から '+fmtKm(g.dist) : '')+'</span></div>'
      + '<ul class="trip-pop-list">'+g.visits.map(function(r){
          var d = (r.date||"").split("-");
          return '<li><span class="d">'+(d.length===3 ? d[0].slice(2)+"."+d[1]+"."+d[2] : "")+'</span><span>'+escapeHtml(r.title||"")+'</span></li>';
        }).join("")+'</ul>';
  }
  function pinIcon(g){
    var big = g.visits.length>=3;
    return L.divIcon({
      className:"trip-pin"+(big?" big":""),
      html:'<div class="pin"><b>'+g.visits.length+'</b></div>',
      iconSize: big ? [36,36] : [30,30],
      iconAnchor: big ? [18,38] : [15,32],
      popupAnchor:[0, big ? -36 : -30]
    });
  }
  function focusVenue(key){
    var m = markers[key];
    if(!m || !map) return;
    viewTouched = true;
    var target = map;
    map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 13), {duration:.6});
    clearTimeout(popupTimer);
    popupTimer = setTimeout(function(){ if(map===target) m.openPopup(); }, 650);
  }

  // 表示範囲をピン（と半径の円）に合わせる。アニメーションなし（途中で作り直してもエラーにならないように）
  function fitView(){
    if(!map) return;
    var pts = lastShown.filter(function(g){ return g.lat!=null; }).map(function(g){ return [g.lat, g.lng]; });
    if(radiusKm && userPos){
      var b = L.latLng(userPos.lat, userPos.lng).toBounds(radiusKm*2000);
      pts.forEach(function(p){ b.extend(p); });
      map.fitBounds(b, {padding:[20,20], maxZoom:15, animate:false});
    } else if(pts.length===1) map.setView(pts[0], 13, {animate:false});
    else if(pts.length>1) map.fitBounds(pts, {padding:[36,36], maxZoom:13, animate:false});
    else if(userPos) map.setView([userPos.lat, userPos.lng], 12, {animate:false});
    else map.setView([36.2, 138.25], 4.6, {animate:false});   // 日本全体
  }
  // 現在地の青い点と、半径の円
  function drawMe(){
    if(!map || !meLayer) return;
    meLayer.clearLayers();
    if(!userPos) return;
    if(radiusKm){
      L.circle([userPos.lat, userPos.lng], {radius:radiusKm*1000, className:"trip-radius-circle", interactive:false}).addTo(meLayer);
    }
    L.marker([userPos.lat, userPos.lng], {
      icon:L.divIcon({className:"trip-me", html:'<span></span>', iconSize:[18,18], iconAnchor:[9,9]}),
      interactive:false, keyboard:false, zIndexOffset:-100
    }).addTo(meLayer);
  }
  function renderRadius(){
    var el = document.getElementById("tripRadius");
    if(!el) return;
    el.innerHTML = RADII.map(function(km){
      return '<button type="button" class="trip-radius-chip'+(km===radiusKm?' on':'')+'" data-trip-radius="'+km+'">'
        + (km ? km+'km' : 'すべて')+'</button>';
    }).join("");
    el.querySelectorAll("[data-trip-radius]").forEach(function(b){
      b.addEventListener("click", function(){ setRadius(Number(b.getAttribute("data-trip-radius"))); });
    });
  }
  function setRadius(km){
    if(km && !userPos){
      locate().then(function(){ radiusKm = km; viewTouched = false; renderRadius(); refresh(); }, function(){});
      return;
    }
    radiusKm = km;
    viewTouched = false;
    renderRadius();
    refresh();
  }
  // 現在地を取得する（端末の中だけで使い、保存しない）
  function locate(){
    if(locating) return locating;
    if(!navigator.geolocation){
      toast("この端末では位置情報を使えません");
      return Promise.reject(new Error("no geolocation"));
    }
    setLocating(true);
    locating = new Promise(function(resolve, reject){
      navigator.geolocation.getCurrentPosition(function(pos){
        userPos = {lat:pos.coords.latitude, lng:pos.coords.longitude};
        resolve(userPos);
      }, function(err){
        toast(err && err.code===1 ? "位置情報の利用が許可されていません" : "現在地を取得できませんでした");
        reject(err);
      }, {enableHighAccuracy:false, timeout:10000, maximumAge:0});
    });
    locating.then(done, done);
    function done(){ locating = null; setLocating(false); }
    return locating;
  }
  function setLocating(on){
    var b = map && map.getContainer().querySelector('[data-trip-ctl="locate"]');
    if(b) b.classList.toggle("busy", !!on);
  }
  function goToMe(){
    locate().then(function(){
      if(!map) return;
      viewTouched = true;
      drawMe();
      refresh();
      if(radiusKm) fitView();
      else map.setView([userPos.lat, userPos.lng], Math.max(map.getZoom(), 13), {animate:false});
    }, function(){});
  }
  function setExpanded(on){
    expanded = !!on;
    var card = document.querySelector(".trip-map-card");
    if(card) card.classList.toggle("expanded", expanded);
    document.body.classList.toggle("trip-map-open", expanded);
    var b = map && map.getContainer().querySelector('[data-trip-ctl="expand"]');
    if(b){
      b.innerHTML = expanded ? ICONS.shrink : ICONS.expand;
      b.title = expanded ? "元に戻す" : "広げる";
      b.setAttribute("aria-label", b.title);
    }
    if(map){
      var target = map;
      setTimeout(function(){ if(map===target){ map.invalidateSize({animate:false}); if(!viewTouched) fitView(); } }, 60);
    }
  }
  function onKey(e){ if(e.key==="Escape" && expanded) setExpanded(false); }
  document.addEventListener("keydown", onKey);

  var ICONS = {
    expand:'<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    shrink:'<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
    center:'<svg viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-10a6 6 0 0112 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>',
    locate:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22"/></svg>'
  };
  // 地図の右上の操作ボタン（広げる・ピンを中央に・現在地）
  function addControls(){
    var Ctl = L.Control.extend({
      options:{position:"topright"},
      onAdd:function(){
        var box = L.DomUtil.create("div", "trip-ctl");
        box.innerHTML =
            '<button type="button" data-trip-ctl="expand" title="広げる" aria-label="広げる">'+ICONS.expand+'</button>'
          + '<button type="button" data-trip-ctl="center" title="ピンを中央に" aria-label="ピンを中央に">'+ICONS.center+'</button>'
          + '<button type="button" data-trip-ctl="locate" title="現在地" aria-label="現在地">'+ICONS.locate+'</button>';
        L.DomEvent.disableClickPropagation(box);
        L.DomEvent.disableScrollPropagation(box);
        box.addEventListener("click", function(e){
          var b = e.target.closest("[data-trip-ctl]");
          if(!b) return;
          var act = b.getAttribute("data-trip-ctl");
          if(act==="expand") setExpanded(!expanded);
          else if(act==="center"){ viewTouched = false; map.closePopup(); fitView(); }
          else if(act==="locate") goToMe();
        });
        return box;
      }
    });
    new Ctl().addTo(map);
  }

  function draw(groups){
    if(!map) return;
    var shown = applyRadius(groups);
    lastShown = shown;
    layer.clearLayers();
    markers = {};
    shown.forEach(function(g){
      if(g.lat==null) return;
      var m = L.marker([g.lat, g.lng], {icon:pinIcon(g), riseOnHover:true, title:g.name})
        .bindPopup(popupHtml(g), {closeButton:true, maxWidth:240, minWidth:220, autoPanPadding:[24,24]})
        .addTo(layer);
      markers[g.key] = m;
    });
    drawMe();
    if(!viewTouched) fitView();

    var visits = shown.reduce(function(s,g){ return s+g.visits.length; }, 0);
    var stats = document.getElementById("tripMapStats");
    if(stats){
      stats.innerHTML = '<div class="trip-stat"><b>'+shown.length+'</b><span>VENUES</span></div>'
        + '<div class="trip-stat"><b>'+visits+'</b><span>現地参戦</span></div>';
    }
    var venuesEl = document.getElementById("tripVenues");
    if(venuesEl){
      var cache = geoCache();
      venuesEl.innerHTML = shown.map(function(g){
        var missing = g.lat==null && cache[g.key] && cache[g.key].v===2;
        return '<button type="button" class="trip-venue'+(missing?' missing':'')+'" data-trip-venue="'+escapeHtml(g.key)+'"'
          + (missing?' title="位置が分かりませんでした"':'')+'>'
          + '<span class="n">'+g.visits.length+'</span>'+escapeHtml(g.name)
          + (g.dist!=null ? '<span class="km">'+fmtKm(g.dist)+'</span>' : '')+'</button>';
      }).join("");
      venuesEl.querySelectorAll("[data-trip-venue]").forEach(function(b){
        b.addEventListener("click", function(){ focusVenue(b.getAttribute("data-trip-venue")); });
      });
    }
    setNote(groups, shown);
  }
  function setNote(groups, shown){
    var note = document.getElementById("tripMapNote");
    if(!note) return;
    var cache = geoCache();
    var pending = groups.filter(function(g){ return g.lat==null && !(cache[g.key] && cache[g.key].v===2); });
    var lines = [];
    if(radiusKm && userPos && groups.length && !shown.length) lines.push("半径"+radiusKm+"km以内の会場はありません");
    var unknown = groups.filter(function(g){ return g.lat==null && cache[g.key] && cache[g.key].v===2; }).length;
    if(radiusKm && userPos && unknown) lines.push("位置が分からない会場が"+unknown+"件あります（「すべて」で確認できます）");
    if(pending.length){
      lines.push(UsageLimit.canUse("geocode")
        ? "会場の位置を調べています…（"+pending.length+"件）"
        : UsageLimit.message("geocode"));
    }
    note.textContent = lines.join("\n");
  }
  // 会場名から位置を調べる（Nominatim は1秒に1件まで・1日の上限あり）
  // 見つからないときは「(TOKYO)」のような括弧書きを外した名前でもう一度調べる
  function geoQueries(name){
    var list = [name];
    var plain = name.replace(/[（(［\[][^）)］\]]*[）)］\]]/g, " ").replace(/\s+/g, " ").trim();
    if(plain && plain!==name) list.push(plain);
    return list;
  }
  function nominatim(q){
    var url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp&accept-language=ja&q="+encodeURIComponent(q);
    return fetch(url, {headers:{"Accept":"application/json"}})
      .then(function(res){ return res.ok ? res.json() : []; })
      .catch(function(){ return null; });
  }
  function geocodeNext(){
    if(busy || !queue.length) return;
    if(!UsageLimit.take("geocode")){
      queue = [];
      if(currentOshiId && map){ var groups = collect(getOshi(currentOshiId)); setNote(groups, applyRadius(groups)); }
      return;
    }
    busy = true;
    var g = queue.shift();
    var qs = geoQueries(g.name);
    function tryAt(i){
      nominatim(qs[i]).then(function(list){
        if(list===null){ busy = false; return; }   // 通信できないときは次回に回す
        var hit = list && list[0];
        if(!hit && i+1<qs.length){ setTimeout(function(){ tryAt(i+1); }, 1100); return; }
        var c = geoCache();
        c[g.key] = hit ? {lat:Number(hit.lat), lng:Number(hit.lon), at:Date.now()} : {lat:null, lng:null, at:Date.now(), v:2};
        saveGeo(c);
        setTimeout(function(){
          busy = false;
          if(currentOshiId && map) refresh();
          geocodeNext();
        }, 1100);
      });
    }
    tryAt(0);
  }
  function refresh(){
    var groups = collect(getOshi(currentOshiId));
    draw(groups);
    var cache = geoCache(), week = 7*24*3600*1000;
    groups.forEach(function(g){
      if(g.lat!=null) return;
      var c = cache[g.key];
      // 見つからなかった会場は7日間は調べ直さない（括弧を外す再検索を入れる前の結果は、すぐ調べ直す）
      if(c && (c.lat!=null || (c.v===2 && Date.now()-c.at < week))) return;
      if(!queue.some(function(q){ return q.key===g.key; })) queue.push(g);
    });
    geocodeNext();
  }
  function render(oshi){
    var el = document.getElementById("tripMap");
    clearTimeout(popupTimer);
    // 移動アニメーション中に作り直すとエラーになるため、止めてから破棄する
    if(resizeObs){ resizeObs.disconnect(); resizeObs = null; }
    if(map){ map.stop(); map.off(); map.remove(); map = null; }
    expanded = false;
    document.body.classList.remove("trip-map-open");
    viewTouched = false;
    if(!el || !window.L){ return; }
    currentOshiId = oshi ? oshi.id : null;
    // 1日の地図の読み込み上限に達したら、地図を作らずに案内だけ出す
    if(!UsageLimit.take("mapLoad")){
      el.classList.add("off");
      el.innerHTML = '<div class="trip-map-off">'+escapeHtml(UsageLimit.message("mapLoad"))+'</div>';
      var radiusEl = document.getElementById("tripRadius");
      if(radiusEl) radiusEl.innerHTML = "";
      return;
    }
    map = L.map(el, {zoomControl:true, attributionControl:true, scrollWheelZoom:false});
    map.attributionControl.setPrefix(false);
    // ズームアニメーションの終了処理が、地図を破棄した後に走っても落ちないようにする
    var endZoom = map._onZoomTransitionEnd;
    map._onZoomTransitionEnd = function(){ if(this._mapPane && this._container) return endZoom.apply(this, arguments); };
    // 落ち着いた色合いの地図（国土地理院 淡色地図。APIキー不要）
    var tiles = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
      minZoom:2, maxZoom:18, keepBuffer:4,
      attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>'
    }).addTo(map);
    // 地図の画像が読み込めなかったマスは、少し待って2回まで取り直す（通信が不安定なときに一部が欠けないように）
    tiles.on("tileerror", function(e){
      var t = e.tile, n = t._retry || 0;
      if(n>=2 || !t._src0 && !t.src) return;
      t._src0 = t._src0 || t.src;
      t._retry = n+1;
      setTimeout(function(){
        if(!t.parentNode) return;
        t.src = t._src0 + (t._src0.indexOf("?")<0 ? "?" : "&") + "r=" + (n+1);
      }, 1200*(n+1));
    });
    // 画面の向きや文字の読み込みで枠の大きさが変わったら、地図の大きさを合わせ直す
    if(window.ResizeObserver){
      var target = map;
      resizeObs = new ResizeObserver(function(){ if(map===target) map.invalidateSize({animate:false}); });
      resizeObs.observe(el);
    }
    meLayer = L.layerGroup().addTo(map);
    layer = L.layerGroup().addTo(map);
    addControls();
    // 利用者が動かした後は、会場の位置が分かっても表示範囲を勝手に戻さない
    map.on("dragstart", function(){ viewTouched = true; });
    renderRadius();
    refresh();
  }
  return { render:render };
})();

/* ============ photo viewer ============ */
function openPhotoViewer(src){
  if(!src) return;
  var v = document.getElementById("photoViewer");
  document.getElementById("photoViewerImg").src = src;
  v.hidden = false;
}
function closePhotoViewer(){
  var v = document.getElementById("photoViewer");
  v.hidden = true;
  document.getElementById("photoViewerImg").src = "";
}

/* ============ events ============ */
function onAppClick(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");

  if(action==="add-oshi"){ openOshiSheet(null); return; }
  if(action==="change-password"){ openNewPasswordSheet(userHasPassword() ? "change" : "set"); return; }
  if(action==="link-google"){ linkGoogle(); return; }
  if(action==="unlink-google"){ unlinkGoogle(); return; }
  if(action==="logout"){ logout(); return; }
  if(action==="edit-oshi"){ openOshiSheet(getOshi(el.getAttribute("data-id"))); return; }
  if(action==="set-active"){ setActiveOshi(el.getAttribute("data-id")).then(render); return; }
  if(action==="move-oshi"){ moveOshiStep(el.getAttribute("data-id"), el.getAttribute("data-dir")); return; }
  if(action==="toggle-oshi-hidden"){ toggleOshiHidden(el.getAttribute("data-id")); return; }
  if(action==="toggle-hidden-oshis"){ state.showHiddenOshis = !state.showHiddenOshis; renderOshiPage(); return; }
  if(action==="filter-oshi"){ state.filterOshiId = el.getAttribute("data-id"); render(); return; }
  if(action==="toggle-hidden"){ state.showHidden = !state.showHidden; render(); return; }
  if(action==="stats-tab"){
    state.statsSubView = el.getAttribute("data-tab");
    state.calendarSelectedDate = null;
    renderStatsPage();
    return;
  }
  if(action==="share-summary"){ shareSummaryImage(); return; }
  if(action==="stream-menu"){
    var sr = state.live.find(function(r){ return r.id===el.getAttribute("data-id"); });
    var menu = document.getElementById("streamMenu");
    var wasOpen = menu.style.display==="block" && menu.getAttribute("data-for")===el.getAttribute("data-id");
    menu.style.display = "none";
    if(!sr || wasOpen) return;
    menu.innerHTML = recStreamUrls(sr).map(function(u, i){
      var host = u; try{ host = new URL(u).hostname.replace(/^www\./, ""); }catch(err){}
      return '<a class="photo-menu-item" href="'+escapeHtml(u)+'" target="_blank" rel="noopener noreferrer">配信'+(i+1)+'<span class="host">'+escapeHtml(host)+'</span></a>';
    }).join("");
    menu.setAttribute("data-for", el.getAttribute("data-id"));
    openPopoverNear(el, menu);
    return;
  }
  if(action==="view-photo"){
    var pr = (state[el.getAttribute("data-type")]||[]).find(function(r){ return r.id===el.getAttribute("data-id"); });
    if(pr) openPhotoViewer(pr.photo);
    return;
  }
  if(action==="edit-record"){
    var type = el.getAttribute("data-type"), id = el.getAttribute("data-id");
    var rec = state[type].find(function(r){return r.id===id;});
    openRecordSheet(type,rec);
    return;
  }
}

document.addEventListener("DOMContentLoaded", function(){
  sheetBg = document.getElementById("sheetBg");
  sheetEl = document.getElementById("sheet");
  sheetEl.addEventListener("scroll", closePopoversOnSheetScroll);

  document.getElementById("app").addEventListener("click", onAppClick);

  var headerLogoBtn = document.getElementById("headerLogoBtn");
  var headerLogoMenu = document.getElementById("headerLogoMenu");
  var headerLogoInput = document.getElementById("headerLogoInput");
  var clearHeaderLogoBtn = document.getElementById("clearHeaderLogoBtn");
  headerLogoBtn.addEventListener("click", function(e){
    e.stopPropagation();
    var wasOpen = headerLogoMenu.style.display === "block";
    headerLogoMenu.style.display = "none";
    if(!wasOpen){ openPopoverNear(headerLogoBtn, headerLogoMenu); }
  });
  headerLogoInput.addEventListener("change", function(){
    var file = headerLogoInput.files && headerLogoInput.files[0];
    headerLogoMenu.style.display = "none";
    if(!file) return;
    if(file.type.indexOf("image/")!==0){ toast("画像ファイルを選択してください"); return; }
    /* No fixed output size: keep the image reasonably light for storage
       without forcing a crop, so any logo's natural aspect ratio survives.
       PNG output (not JPEG) so a transparent background stays transparent. */
    resizeImageFilePreserveAlpha(file, 480).then(function(dataUrl){
      headerLogoInput.value = "";
      state.headerLogo = dataUrl;
      saveLocal();
      refreshHeaderLogo();
    }).catch(function(){
      toast("画像の読み込みに失敗しました");
    });
  });
  clearHeaderLogoBtn.addEventListener("click", function(){
    state.headerLogo = null;
    saveLocal();
    refreshHeaderLogo();
    headerLogoMenu.style.display = "none";
  });
  document.addEventListener("click", function(e){
    if(!e.target.closest("#headerLogoBtn") && !e.target.closest("#headerLogoMenu")){
      headerLogoMenu.style.display = "none";
    }
  });

  var topChip = document.getElementById("topChip");
  var topChipMenu = document.getElementById("topChipMenu");
  topChip.addEventListener("click", function(e){
    e.stopPropagation();
    var wasOpen = topChipMenu.style.display === "block";
    topChipMenu.style.display = "none";
    if(!wasOpen && topChipMenu.innerHTML){ openPopoverNear(topChip, topChipMenu); }
  });
  topChipMenu.addEventListener("click", function(e){
    var item = e.target.closest("[data-set-active-oshi]");
    if(item){
      topChipMenu.style.display = "none";
      setActiveOshi(item.getAttribute("data-set-active-oshi")).then(render);
      return;
    }
    if(e.target.closest('[data-action="goto-oshi-page"]')){
      topChipMenu.style.display = "none";
      state.view = "oshi";
      render();
      return;
    }
    if(e.target.closest('[data-action="add-oshi"]')){
      topChipMenu.style.display = "none";
    }
  });
  document.addEventListener("click", function(e){
    if(!e.target.closest("#topChip") && !e.target.closest("#topChipMenu")){
      topChipMenu.style.display = "none";
    }
  });

  document.querySelectorAll("nav.tabs button").forEach(function(b){
    b.addEventListener("click", function(){
      state.view = b.getAttribute("data-view");
      state.filterOshiId = "all";
      render();
    });
  });

  document.getElementById("fabBtn").addEventListener("click", function(){
    var v = state.view;
    var type = (v==="live"||v==="cheki"||v==="goods") ? v : "live";
    openRecordSheet(type,null);
  });

  sheetBg.addEventListener("click", function(e){ if(e.target===sheetBg) closeSheet(); });

  var streamMenu = document.getElementById("streamMenu");
  document.addEventListener("click", function(e){
    if(!e.target.closest("#streamMenu") && !e.target.closest('[data-action="stream-menu"]')) streamMenu.style.display = "none";
    else if(e.target.closest("#streamMenu a")) streamMenu.style.display = "none";
  });
  window.addEventListener("scroll", function(){ streamMenu.style.display = "none"; }, {passive:true});

  var photoViewer = document.getElementById("photoViewer");
  photoViewer.addEventListener("click", function(e){
    if(e.target===photoViewer || e.target.closest("#photoViewerClose")) closePhotoViewer();
  });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape" && !photoViewer.hidden) closePhotoViewer();
  });

  PhotoEditor.init();
  AvatarCropper.init();

  // アプリとしてインストールできるよう Service Worker を登録する（https と開発用の localhost のみ）
  if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("/sw.js").catch(function(e){ console.warn("SW registration failed", e); });
    });
  }
  initStorage();
});
})();
</script>
</body>
</html>
